[[signature]]
id = "executable/macho-fat"
name = "Mach-O universal (fat) binary"
category = "Executable"
priority = 65
# nfat_arch (big endian at 4) is small, which also separates this from Java class files.
magic = [{ matches = [{ offset = 0, bytes = "cafebabe" }, { offset = 4, bytes = "000000" }, { offset = 7, bytes = "00", mask = "e0" }] }]

[[signature]]
id = "bytecode/java-class"
name = "Java class file"
category = "Executable"
extensions = ["class"]
priority = 65
references = ["https://docs.oracle.com/javase/specs/jvms/se21/html/jvms-4.html"]
# Major version 45..95 lives in byte 7 (byte 6 is 0); fat binaries keep byte 7 below 32.
magic = [
  { matches = [{ offset = 0, bytes = "cafebabe" }, { offset = 6, bytes = "00" }, { offset = 7, bytes = "20", mask = "e0" }] },
  { matches = [{ offset = 0, bytes = "cafebabe" }, { offset = 6, bytes = "00" }, { offset = 7, bytes = "40", mask = "e0" }] },
]

