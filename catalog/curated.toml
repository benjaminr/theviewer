# Hand-curated signatures: formats Tika does not cover well, plus extents so
# a hit becomes a block rather than a marker. Compression streams (gzip, zlib,
# bzip2, xz, zstd, LZ4) are deliberately absent: compress.rs verifies those.
#
# Semantics: `magic` lists alternatives (any one matches). An alternative is a
# single match table or `{ matches = [...] }` where every match must hold. A
# match's `children` must have at least one holding. Offsets are relative to
# the start of the file; `"a..b"` lets the value start anywhere in the range.

# ---------------------------------------------------------------------------
# Executables and bytecode
# ---------------------------------------------------------------------------

[[signature]]
id = "executable/elf32"
name = "ELF 32-bit executable"
category = "Executable"
priority = 65
references = ["https://refspecs.linuxfoundation.org/elf/elf.pdf"]
magic = [{ matches = [{ offset = 0, bytes = "7f454c46" }, { offset = 4, bytes = "01" }] }]

[[signature]]
id = "executable/elf64"
name = "ELF 64-bit executable"
category = "Executable"
priority = 65
references = ["https://refspecs.linuxfoundation.org/elf/elf.pdf"]
magic = [{ matches = [{ offset = 0, bytes = "7f454c46" }, { offset = 4, bytes = "02" }] }]

[[signature]]
id = "executable/pe"
name = "Windows PE executable"
category = "Executable"
extensions = ["exe", "dll", "sys", "efi"]
priority = 70
references = ["https://learn.microsoft.com/windows/win32/debug/pe-format"]
magic = [{ matches = [{ offset = 0, bytes = "4d5a" }, { offset = 0, pointer = { offset = 60, size = 4, endian = "little" }, bytes = "50450000" }] }]

