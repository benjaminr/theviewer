meaning = "Class whose main method java -jar runs."

[[format.fields]]
name = "signature file"
aliases = [".SF"]
meaning = "Digests of the manifest and its entries for one signer."

[[format.fields]]
name = "signature block"
aliases = [".RSA", ".DSA", ".EC"]
meaning = "PKCS #7 signature over the .SF file with the signer's certificates."

[[format]]
id = "apk"
name = "Android application package (APK)"
keys = ["APK", "Android package", "Android application package"]
summary = "An Android app: a ZIP archive with binary XML manifest, DEX bytecode, compiled resources and native libraries, signed with the APK Signature Scheme in a block before the central directory."
organisation = """
The archive holds 'AndroidManifest.xml' in Android's binary XML format (package name, version, permissions, components), 'classes.dex' and further 'classesN.dex' files, 'resources.arsc' (the compiled resource table), 'res/' (compiled layouts and images), 'assets/' (raw files), 'lib/ABI/' native libraries (arm64-v8a, armeabi-v7a, x86_64), and for v1 signing a JAR-style 'META-INF' with MANIFEST.MF, .SF and .RSA files. Uncompressed entries are aligned (4 bytes, or the page size for native libraries) by zipalign.

The APK Signing Block sits between the last entry's data and the central directory: a 64-bit size, a sequence of ID-value pairs each prefixed by a 64-bit length, the size again and the magic 'APK Sig Block 42'. Pair id 0x7109871a is the v2 signature, 0xf05368c0 the v3 signature (with key rotation), and other ids hold padding and tool metadata. These signatures cover the whole file except the block itself, so modifying any entry invalidates them.

App bundles delivered from stores are split into a base APK and split APKs (per ABI, language or density), often packaged together as .apks or .xapk files, which are themselves ZIP archives.
"""
carries = ["zip", "deflate", "dex", "elf", "png", "cms"]
group = "Packages"

