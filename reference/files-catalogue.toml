[[format]]
id = "matroska"
name = "Matroska and WebM"
keys = ["Matroska", "MKV", "WebM", "EBML", "Matroska / WebM", "Matroska / WebM signature", "media/matroska", "media/webm", "application/x-matroska", "video/x-matroska"]
summary = "An open audio/video container built on EBML, a binary XML-like encoding of nested elements with variable-length ids and sizes; WebM is its restricted web profile."
organisation = """
EBML elements are an id, a data size and data. Both id and size are variable-length integers whose leading zero bits give their length: a first byte of 1xxxxxxx is one byte long, 01xxxxxx two bytes, and so on. Ids keep their length-marker bit, so they are written as 1A 45 DF A3 and the like; a size whose value bits are all ones means 'unknown', used when streaming. Values are big-endian integers, IEEE floats, strings, dates (nanoseconds since 2001) or nested elements.

A file starts with the EBML header element (1A 45 DF A3) giving the EBML version, maximum id and size lengths, and the DocType ('matroska' or 'webm') with its version. Then comes a Segment (18 53 80 67) holding SeekHead (11 4D 9B 74, positions of the other top-level elements), Info (15 49 A9 66: TimestampScale, Duration, DateUTC, Title, MuxingApp, WritingApp), Tracks (16 54 AE 6B), Clusters (1F 43 B6 75), Cues (1C 53 BB 6B, the seek index), Chapters, Tags and Attachments (often fonts for subtitles).

Each TrackEntry gives the track number, a UID, type (1 video, 2 audio, 17 subtitle), CodecID ('V_MPEG4/ISO/AVC', 'V_VP9', 'V_AV1', 'A_OPUS', 'A_AAC', 'S_TEXT/UTF8') and CodecPrivate. A Cluster has a Timestamp and SimpleBlocks (A3) or BlockGroups (A0); a block starts with the track number (as a variable-length integer), a 16-bit signed timestamp relative to the cluster, and flags (key frame, lacing). Void elements (EC) reserve space and CRC-32 elements (BF) can protect a parent.
"""
carries = ["h264", "h265", "opus", "vorbis", "flac", "aac-adts"]
group = "Video and containers"

[[format.specs]]
document = "RFC 9559"
