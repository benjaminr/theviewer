aliases = ["granule position"]
meaning = "Codec-defined position at the end of the last packet completed on this page; -1 when no packet ends here."
section = "6"

[[format.fields]]
name = "bitstream_serial_number"
aliases = ["serial number"]
meaning = "Identifies the logical stream the page belongs to."
section = "6"

[[format.fields]]
name = "page_sequence_number"
aliases = ["page sequence number"]
meaning = "Page counter within the logical stream, to detect lost pages."
section = "6"

[[format.fields]]
