[[format]]
id = "vmdk"
name = "VMware virtual disk (VMDK)"
keys = ["VMDK", "VMware virtual disk", "fs/vmdk"]
summary = "VMware's virtual disk format: a text descriptor naming one or more extents, which are flat raw files or sparse extents with grain directories and tables."
organisation = """
A sparse extent starts with a 512-byte little-endian header: the magic 'KDMV', the version (1 to 3), flags, the capacity in sectors, the grain size in sectors (128, so 64 KiB), the sector offset and size of an embedded descriptor, the number of entries per grain table (512), the offsets of the redundant and primary grain directories, the overhead in sectors, an unclean-shutdown flag, four characters used to detect newline mangling (LF, space, CR, LF), and the compression algorithm (deflate for stream-optimised disks).

The descriptor is text: a version, a content id (CID) and parent CID, the create type (monolithicSparse, monolithicFlat, twoGbMaxExtentSparse, streamOptimized, vmfs and more), extent lines ('RW 41943040 SPARSE "disk-s001.vmdk"') and ddb entries describing geometry, adapter type and tools version. It may live in its own small .vmdk file or inside the sparse extent.

To read a sector, divide by the grain size; the grain directory entry gives a grain table, whose entry gives the sector of the grain (zero means unallocated, read from the parent or as zeros). Stream-optimised disks, used in OVA files, store compressed grains each with a small marker header.
"""
carries = ["deflate", "zlib"]
group = "Disks and filesystems"

[[format.specs]]
document = "libvmdk VMDK format documentation"
title = "VMware Virtual Disk Format (VMDK) (libvmdk documentation)"
url = "https://github.com/libyal/libvmdk/blob/main/documentation/VMWare%20Virtual%20Disk%20Format%20(VMDK).asciidoc"

[[format.fields]]
name = "magicNumber"
aliases = ["magic"]
meaning = "'KDMV' (0x564D444B little-endian)."

[[format.fields]]
name = "version"
meaning = "Sparse extent version: 1, 2 (adds encryption) or 3 (larger grain tables for ESXi)."

[[format.fields]]
name = "capacity"
meaning = "Disk capacity in 512-byte sectors."

[[format.fields]]
name = "grainSize"
meaning = "Sectors per grain, the allocation unit; usually 128."

[[format.fields]]
name = "descriptorOffset"
aliases = ["descriptorSize"]
meaning = "Sector offset and size of the embedded text descriptor; zero when it is in a separate file."

[[format.fields]]
name = "numGTEsPerGT"
meaning = "Entries per grain table, normally 512."

[[format.fields]]
name = "gdOffset"
aliases = ["rgdOffset"]
meaning = "Sector offsets of the primary and redundant grain directories."

[[format.fields]]
name = "compressAlgorithm"
meaning = "0 none, 1 deflate (stream-optimised extents)."

[[format]]
id = "vhd"
name = "Virtual Hard Disk (VHD)"
keys = ["VHD", "Virtual Hard Disk", "fs/vhd", "application/x-vhd"]
summary = "Microsoft's original virtual disk format from Virtual PC and early Hyper-V: a raw or block-allocated disk described by a 512-byte footer at the end of the file."
organisation = """
The footer is the last 512 bytes of the file and is big-endian: the cookie 'conectix', feature flags, the format version (1.0), the offset of the dynamic disk header (all ones for fixed disks), a timestamp (seconds since 1 January 2000 UTC), the creator application ('vpc ', 'win ', 'qemu') and version, the creator host OS ('Wi2k' or 'Mac '), the original and current size in bytes, cylinder/head/sector geometry, the disk type (2 fixed, 3 dynamic, 4 differencing), a checksum (one's complement of the byte sum), a UUID and a saved-state flag.

A fixed disk is the raw disk image followed by the footer. Dynamic and differencing disks put a copy of the footer at offset 0, then a 1024-byte dynamic header ('cxsparse') with the offset of the block allocation table (BAT), the maximum number of entries, the block size (2 MiB by default), and for differencing disks the parent's UUID, timestamp, name and locators.

Each BAT entry gives the sector of a block or FFFFFFFF if unallocated. An allocated block starts with a sector bitmap showing which sectors are present, then the block data. Since the scheme is anchored at the end of the file, a footer found in the middle of a dump marks where a VHD ended.
"""
carries = ["mbr", "gpt", "ntfs", "fat"]
group = "Disks and filesystems"

[[format.specs]]
document = "Microsoft VHD specification"
title = "Virtual Hard Disk Image Format Specification (Microsoft)"
url = "https://www.microsoft.com/en-us/download/details.aspx?id=23850"

[[format.fields]]
name = "cookie"
meaning = "'conectix', identifying the footer."

[[format.fields]]
name = "data offset"
meaning = "Absolute offset of the dynamic disk header; all ones for fixed disks."

[[format.fields]]
name = "time stamp"
meaning = "Creation time in seconds since 1 January 2000 UTC."

[[format.fields]]
name = "creator application"
aliases = ["creator host OS"]
meaning = "Four-character codes for the program and host that created the image."

[[format.fields]]
name = "current size"
aliases = ["original size"]
meaning = "Current and original size of the virtual disk in bytes."

[[format.fields]]
name = "disk type"
meaning = "2 fixed, 3 dynamic, 4 differencing."

[[format.fields]]
name = "checksum"
meaning = "One's complement of the sum of the footer bytes, excluding this field."

[[format.fields]]
name = "unique id"
meaning = "UUID of the disk, used to match differencing disks with their parents."

[[format]]
id = "vhdx"
name = "Virtual Hard Disk v2 (VHDX)"
keys = ["VHDX", "fs/vhdx"]
summary = "The Hyper-V virtual disk format that replaced VHD: 1 MiB-aligned regions, duplicated headers, a metadata log for crash safety and disks up to 64 TiB."
organisation = """
The file starts with a 64 KiB header section: the file type identifier 'vhdxfile' and a UTF-16 creator string, two headers at 64 KiB and 128 KiB, and two region tables at 192 KiB and 256 KiB. All values are little-endian and every structure is protected by a CRC-32C.

Each header ('head') has a checksum, a sequence number (the higher valid one is current), file-write, data-write and log GUIDs, the log version and format version (1), and the log's length and offset. Each region table ('regi') lists regions by GUID with file offset and length; the two required ones are the block allocation table (BAT) and the metadata region.

The metadata region ('metadata') holds items by GUID: file parameters (block size, whether the disk has a parent), virtual disk size, logical and physical sector sizes, a page 83 identifier, and for differencing disks the parent locator. BAT entries give each payload block's state and file offset in MiB, interleaved with sector bitmap entries. The log ('loge' entries) records metadata changes to replay after a crash.
"""
carries = ["mbr", "gpt", "ntfs"]
group = "Disks and filesystems"

[[format.specs]]
document = "[MS-VHDX]"
title = "[MS-VHDX]: Virtual Hard Disk v2 (VHDX) File Format"
url = "https://learn.microsoft.com/en-us/openspecs/windows_protocols/ms-vhdx/"

[[format.fields]]
name = "signature"
meaning = "'vhdxfile' at offset 0 for the file type identifier; 'head', 'regi', 'loge' and 'metadata' for the other structures."

[[format.fields]]
name = "creator"
meaning = "UTF-16 name of the program that created the file."

[[format.fields]]
name = "SequenceNumber"
meaning = "Header sequence number; of the two headers, the valid one with the higher number is current."

[[format.fields]]
name = "FileWriteGuid"
aliases = ["DataWriteGuid", "LogGuid"]
meaning = "GUIDs changed on the first write to the file, on the first write to the virtual disk's data, and naming the active log."

[[format.fields]]
name = "BlockSize"
meaning = "Payload block size, from 1 MiB to 256 MiB (32 MiB by default)."

[[format.fields]]
name = "VirtualDiskSize"
meaning = "Size of the virtual disk in bytes."

