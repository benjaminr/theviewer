aliases = ["data.tar.gz", "data.tar.xz", "data.tar.zst", "data.tar.bz2"]
meaning = "The files to install."

[[format]]
id = "jar"
name = "Java archive (JAR)"
keys = ["JAR", "Java archive", "JAR file", "WAR", "EAR"]
summary = "A ZIP archive of Java classes and resources with a META-INF directory holding the manifest and, when signed, signature files."
organisation = """
A JAR is an ordinary ZIP archive, sometimes with a 'CAFE' extra field (FE CA 00 00) on the first entry to mark it executable on some systems. 'META-INF/MANIFEST.MF' is a text file of 'Name: value' lines: Manifest-Version, Created-By, Main-Class (the entry point for java -jar), Class-Path, Multi-Release, Automatic-Module-Name, and per-entry sections with digests in signed JARs.

A signed JAR has, for each signer, a signature file 'META-INF/NAME.SF' with digests of the manifest and its sections, and a signature block 'META-INF/NAME.RSA', '.DSA' or '.EC' holding a PKCS #7 SignedData over the .SF file with the signer's certificate chain. Entries not listed in the manifest are not covered by the signature.

Other META-INF content: 'services/' (service provider registrations), 'versions/N/' (classes for Java release N in multi-release JARs), 'maven/' (the build's pom.xml and properties, which name the library and version) and 'INDEX.LIST'. WAR and EAR files are JARs with web and enterprise application layouts.
"""
carries = ["zip", "deflate", "java-class", "cms"]
group = "Packages"

