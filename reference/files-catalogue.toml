[[format]]
id = "id3v2"
name = "ID3v2 tag"
keys = ["ID3", "ID3v2", "ID3v2 tag", "media/id3v2"]
summary = "The metadata tag at the start of most MP3 files (and some AIFF, WAV and AAC files): a header and a series of frames for title, artist, album art, comments and more."
organisation = """
The 10-byte header is 'ID3', the major version (2, 3 or 4) and revision bytes, a flags byte (0x80 unsynchronisation, 0x40 extended header, 0x20 experimental, 0x10 footer present in v2.4) and the tag size as a 28-bit 'syncsafe' integer: four bytes with the top bit of each clear, so the size never looks like an MPEG sync. The size excludes the header (and footer), so the audio starts at 10 + size.

Frames follow: in v2.3 and v2.4 a four-character id, a 32-bit size (syncsafe in v2.4, plain big-endian in v2.3) and two flag bytes; v2.2 uses three-character ids and 24-bit sizes. Text frames (TIT2 title, TPE1 artist, TALB album, TRCK track, TYER or TDRC date, TCON genre, TXXX user text) start with an encoding byte: 0 ISO-8859-1, 1 UTF-16 with BOM, 2 UTF-16BE, 3 UTF-8. Padding of zero bytes may follow the last frame.

Other frames worth knowing: APIC (attached picture with MIME type, picture type and image data), COMM (comments), USLT (lyrics), PRIV (private owner data), GEOB (encapsulated object), WXXX (URL) and UFID. An older 128-byte ID3v1 tag ('TAG', fixed fields) may sit at the end of the file as well.
"""
carries = ["mpeg-audio", "jpeg", "png"]
group = "Audio"

[[format.specs]]
document = "ID3v2.4.0 structure"
title = "ID3 tag version 2.4.0 - Main Structure"
url = "https://id3.org/id3v2.4.0-structure"

[[format.fields]]
name = "version"
meaning = "Major version and revision: 03 00 for ID3v2.3, 04 00 for ID3v2.4."

[[format.fields]]
name = "flags"
meaning = "0x80 unsynchronisation, 0x40 extended header, 0x20 experimental, 0x10 footer present."

[[format.fields]]
name = "size"
aliases = ["tag size"]
meaning = "Tag size excluding the 10-byte header, as four 7-bit bytes (syncsafe integer)."

[[format.fields]]
name = "frame id"
meaning = "Four-character frame identifier such as TIT2, TPE1, APIC or COMM."

[[format.fields]]
name = "APIC"
meaning = "Attached picture: encoding, MIME type, picture type (3 is front cover), description and image data."

[[format.fields]]
name = "TXXX"
aliases = ["COMM", "PRIV"]
meaning = "User-defined text, comments and private data; places where encoders and tools leave identifying strings."

