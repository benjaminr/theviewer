meaning = "'7z' BC AF 27 1C."

[[format.fields]]
name = "version"
meaning = "Major version 0 and minor version (2 to 4)."

[[format.fields]]
name = "StartHeaderCRC"
meaning = "CRC-32 of the following 20 bytes (next header offset, size and CRC)."

[[format.fields]]
name = "NextHeaderOffset"
meaning = "Offset of the header from the end of the 32-byte signature header."

[[format.fields]]
name = "NextHeaderSize"
meaning = "Size of the header in bytes."

[[format.fields]]
name = "NextHeaderCRC"
meaning = "CRC-32 of the header."

[[format]]
id = "rar"
name = "RAR archive"
keys = ["RAR", "RAR archive", "RAR4", "RAR5", "application/x-rar-compressed", "application/x-rar-compressed;version=4", "application/x-rar-compressed;version=5"]
summary = "RARLAB's proprietary archive format, in the older RAR 1.5-4.x layout and the RAR 5.0 layout introduced with WinRAR 5: a signature followed by typed blocks for the archive, files and services."
organisation = """
RAR 5.0 archives start with 52 61 72 21 1A 07 01 00 ('Rar!' 1A 07 01 00). Each block has a CRC-32 of the header, the header size, the header type (1 main archive, 2 file, 3 service such as comments or quick-open data, 4 archive encryption, 5 end of archive), header flags (extra area present, data area present, and others), then the extra area size and data size when flagged. Sizes and flags use a variable-length integer of 7-bit groups, least significant first, with the top bit meaning 'more'.

A file header adds file flags, unpacked size, attributes, modification time, CRC-32, compression information (version, solid flag, method 0-5, dictionary size), host OS and the UTF-8 name; its extra area may hold encryption parameters (AES-256 with PBKDF2), a BLAKE2sp hash, high-precision times, symbolic link targets and NTFS alternate data streams. Encryption of the archive header hides even file names.

Older archives start 52 61 72 21 1A 07 00. Their blocks have a 16-bit header CRC, a type byte (0x72 marker, 0x73 archive header, 0x74 file, 0x75 old comment, 0x7A subblock or service, 0x7B end of archive), 16-bit flags, a 16-bit header size and, when flag 0x8000 is set, a 32-bit data size. Self-extracting archives put the signature after a PE stub, and multi-volume sets split files across .rar/.r00 or .partN.rar volumes.
"""
group = "Archives"

[[format.specs]]
document = "RAR 5.0 archive format"
title = "RAR 5.0 archive format (RARLAB technical note)"
url = "https://www.rarlab.com/technote.htm"

[[format.fields]]
name = "signature"
meaning = "'Rar!' 1A 07 01 00 for RAR 5.0; 'Rar!' 1A 07 00 for RAR 1.5-4.x."

[[format.fields]]
name = "header CRC32"
aliases = ["HEAD_CRC"]
meaning = "CRC-32 of the block header (low 16 bits only in RAR 4)."

[[format.fields]]
name = "header type"
aliases = ["HEAD_TYPE"]
meaning = "RAR 5: 1 main, 2 file, 3 service, 4 encryption, 5 end. RAR 4: 0x73 archive, 0x74 file, 0x7A service, 0x7B end."

[[format.fields]]
name = "header flags"
aliases = ["HEAD_FLAGS"]
meaning = "Which optional fields follow and block properties such as 'data area present' or 'continued from previous volume'."

[[format.fields]]
name = "data size"
aliases = ["ADD_SIZE", "packed size"]
meaning = "Size of the packed data after the header."

[[format.fields]]
name = "compression information"
meaning = "RAR 5 file header field: algorithm version, solid flag, method (0 store to 5 best) and dictionary size."

[[format]]
id = "cab"
name = "Microsoft Cabinet (CAB)"
keys = ["CAB", "Cabinet", "Microsoft Cabinet", "win/cab", "application/vnd.ms-cab-compressed"]
summary = "Microsoft's archive format for installers, Windows updates and drivers: folders of data blocks compressed with MSZIP, Quantum or LZX, and file entries that point into them."
organisation = """
The CFHEADER is little-endian: 'MSCF', a reserved zero, the cabinet size, another reserved field, the offset of the first CFFILE entry, a reserved field, the format version (minor 3, major 1), the number of folders and files, flags (previous cabinet, next cabinet, reserve fields present), a set id and the cabinet's index in the set. When flagged, reserve sizes and the names of the previous and next cabinets and disks follow.

CFFOLDER entries follow: the offset of the folder's first data block, the number of data blocks and the compression type (0 none, 1 MSZIP, 2 Quantum, 3 LZX with the window size in the high byte). CFFILE entries give the uncompressed size, the offset within the folder's uncompressed stream, the folder index (with special values for files continued between cabinets), DOS date and time, attributes and the name.

Each CFDATA block has a checksum, the compressed and uncompressed sizes (at most 32 KiB uncompressed) and the data. In MSZIP each block starts with 'CK' followed by a deflate block, and the deflate history carries over between blocks of a folder. Windows update packages (.msu), MSI installers and Office use cabinets; signed cabinets reserve space in the header for an Authenticode signature.
"""
carries = ["deflate", "cms"]
group = "Archives"

[[format.specs]]
document = "Microsoft Cabinet Format"
title = "Microsoft Cabinet Format (Microsoft Learn)"
url = "https://learn.microsoft.com/en-us/previous-versions/bb417343(v=msdn.10)"

[[format.fields]]
name = "signature"
meaning = "'MSCF'."

[[format.fields]]
name = "cbCabinet"
meaning = "Size of the cabinet file in bytes."

[[format.fields]]
name = "coffFiles"
meaning = "Offset of the first CFFILE entry."

[[format.fields]]
name = "versionMinor"
aliases = ["versionMajor"]
meaning = "Format version, 1.3."

[[format.fields]]
name = "cFolders"
aliases = ["cFiles"]
meaning = "Number of folders and files in this cabinet."

[[format.fields]]
name = "flags"
meaning = "0x0001 has a previous cabinet, 0x0002 has a next cabinet, 0x0004 reserve fields present."

[[format.fields]]
name = "typeCompress"
meaning = "Folder compression: 0 none, 1 MSZIP, 2 Quantum, 3 LZX."

[[format]]
id = "rpm"
name = "RPM package"
keys = ["RPM", "RPM package", "application/x-rpm"]
summary = "The package format of Red Hat, Fedora, SUSE and others: a lead, a signature header, a main header of tagged metadata, and a compressed cpio payload."
organisation = """
A package starts with a 96-byte lead: the magic ED AB EE DB, the format version (3.0), the type (0 binary, 1 source), an architecture number, a 66-byte package name, an OS number and the signature type (5). The lead is obsolete; tools read the headers.

Two header structures follow. Each starts with 8E AD E8, version 1, four reserved bytes, the number of index entries and the size of the data store, all big-endian. Index entries are 16 bytes: a tag, a data type (null, char, int8, int16, int32, int64, string, binary, string array, i18n string), an offset into the store and a count. The signature header (padded to 8 bytes) holds digests and signatures over the main header and payload: SHA-256, MD5, payload size and RSA or EdDSA OpenPGP signatures.

The main header holds the metadata: name (1000), version (1001), release (1002), summary, description, build time and host, licence, vendor, packager, URL, file lists with sizes, modes, owners and digests, dependencies, and the scriptlets run at install and removal (pre-install 1023, post-install 1024 and so on, the usual place to look for unexpected commands). Tag 1124 names the payload format (cpio) and 1125 its compressor (gzip, bzip2, xz, zstd); the compressed archive follows directly.
"""
carries = ["cpio", "gzip", "xz", "zstd", "bzip2", "openpgp"]
group = "Packages"

[[format.specs]]
document = "RPM v4 package format"
title = "RPM V4 Package format (RPM documentation)"
