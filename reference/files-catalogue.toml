# Reference notes on formats the signature catalogue recognises but no parser
# reads: firmware and disk images, bytecode, documents, media, fonts,
# archives, keys and Windows artefacts. See src/reference.rs for the schema.
#
# Notes are written for this project in its own words; specifications are
# cited, not copied. Keys are the catalogue ids from catalog/curated.toml and
# catalog/tika.toml (matched with or without `signature:`), so a signature
# finding leads straight to its notes.

# ---------------------------------------------------------------------------
# Firmware
# ---------------------------------------------------------------------------

[[format]]
id = "fdt"
name = "Flattened device tree (DTB and FIT image)"
keys = ["Flattened device tree", "Device tree blob", "DTB", "FIT image", "Flattened Image Tree", "firmware/fit-image"]
summary = "The binary form of a devicetree, which describes hardware to an operating system; U-Boot's FIT images reuse it as a container for kernels, ramdisks and device trees."
organisation = """
A blob starts with a 40-byte big-endian header: the magic D0 0D FE ED, the total size, the offsets of the structure block, the strings block and the memory reservation map, the format version (17 today) and the oldest version it stays compatible with (16), the boot CPU, and the sizes of the strings and structure blocks. Every offset counts from the start of the blob.

The memory reservation map is a list of 64-bit address and size pairs ending with a pair of zeros. The structure block is a stream of 32-bit tokens, each padded to four bytes: BEGIN_NODE (1) followed by the zero-terminated node name, PROP (3) followed by the value length, an offset into the strings block naming the property, and the value, END_NODE (2), NOP (4) and END (9). Property names live once each in the strings block, so many nodes can share them.

A FIT image is a device tree whose /images node holds one subnode per component (kernel, fdt, ramdisk, firmware, script) with properties such as data, type, arch, os, compression, load and entry, plus hash and signature subnodes; /configurations names which components boot together. With external data, a component's bytes sit after the tree and data-offset (or data-position) and data-size point to them.
"""
carries = ["gzip", "lzma", "lz4", "zstd", "elf", "cpio"]
group = "Firmware"

[[format.specs]]
document = "Devicetree Specification, flattened format"
title = "Devicetree Specification: Flattened Devicetree (DTB) Format"
url = "https://devicetree-specification.readthedocs.io/en/stable/flattened-format.html"

[[format.specs]]
document = "U-Boot FIT documentation"
title = "Flattened Image Tree (FIT) Format (U-Boot documentation)"
url = "https://docs.u-boot.org/en/latest/usage/fit/source_file_format.html"

[[format.fields]]
name = "magic"
meaning = "D0 0D FE ED, big-endian, at offset 0."

[[format.fields]]
name = "totalsize"
aliases = ["total size"]
meaning = "Size of the whole blob in bytes, including any free space between and after the blocks (but not FIT external data)."

[[format.fields]]
name = "off_dt_struct"
aliases = ["structure offset"]
meaning = "Offset of the structure block, the token stream of nodes and properties."

[[format.fields]]
name = "off_dt_strings"
aliases = ["strings offset"]
meaning = "Offset of the strings block, which holds every property name once, zero-terminated."

[[format.fields]]
name = "off_mem_rsvmap"
aliases = ["memory reservation map offset"]
meaning = "Offset of the list of physical memory ranges the operating system must not use."

[[format.fields]]
name = "version"
meaning = "Format version of the blob, 17 for current tools; last_comp_version (16) is the oldest version a reader of this layout must support."

[[format.fields]]
name = "boot_cpuid_phys"
aliases = ["boot CPU"]
meaning = "Physical id of the CPU that boots, matching the reg property of its CPU node."

[[format]]
id = "uefi-firmware-volume"
name = "UEFI firmware volume"
keys = ["UEFI firmware volume", "EFI firmware volume", "firmware/uefi-volume"]
summary = "The storage unit of UEFI firmware in flash: a header with a block map, then firmware files made of typed sections holding PE drivers, compressed data and nested volumes."
organisation = """
The volume header is little-endian. It opens with 16 zero bytes (room for a reset vector), the GUID of the file system format inside, the volume length (64-bit), the signature '_FVH' at offset 40, attribute flags, the header length, a 16-bit checksum that makes the header sum to zero, the offset of an optional extended header, a reserved byte, the revision (2), and a block map of (number of blocks, block length) pairs ending with a zero pair.

Files follow the header, each aligned to 8 bytes, with a 24-byte header: a GUID name, an integrity check, a type (raw, freeform, SEC core, PEI core, DXE core, PEIM, driver, application, firmware volume image, pad), attributes, a 24-bit size and a state byte. Erased flash reads as FF, so state bits are cleared to record progress and the end of the files is a run of FF.

Most files contain sections, each with a 24-bit size and a type: compression (EFI or Tiano compression, often LZMA via a GUID-defined section), GUID-defined (signed or compressed wrappers), PE32, TE, position-independent code, dependency expressions, version, user interface name (UTF-16), firmware volume image (a nested volume) and raw. An analyst usually walks volume, file, section and decompresses until PE images appear.
"""
carries = ["pe", "lzma"]
group = "Firmware"

[[format.specs]]
document = "UEFI PI Specification Vol. 3"
title = "UEFI Platform Initialization Specification, Volume 3: Shared Architectural Elements (Firmware Storage Code Definitions)"
url = "https://uefi.org/specs/PI/1.8/V3_Firmware_Storage_Code_Definitions.html"

[[format.fields]]
name = "ZeroVector"
meaning = "First 16 bytes of the volume, zero (or a reset vector on some platforms)."

[[format.fields]]
name = "FileSystemGuid"
meaning = "GUID of the file system inside the volume, such as FFS2 (8C8CE578-8A3D-4F1C-9935-896185C32DD3) or FFS3 for files over 16 MiB."

[[format.fields]]
name = "FvLength"
meaning = "Length of the whole volume in bytes, header included."

[[format.fields]]
name = "Signature"
meaning = "'_FVH' at offset 40; the catalogue matches on it."

[[format.fields]]
name = "HeaderLength"
meaning = "Length of the volume header including the block map; files start here (or after the extended header)."

[[format.fields]]
name = "Checksum"
meaning = "16-bit value chosen so the 16-bit words of the header sum to zero."

[[format.fields]]
name = "BlockMap"
meaning = "Pairs of block count and block length describing the flash layout, ended by a pair of zeros."

[[format]]
id = "android-boot-image"
name = "Android boot image"
keys = ["Android boot image", "boot.img", "firmware/android-boot"]
summary = "The image an Android boot loader loads: a header followed by the kernel, ramdisk and, by version, a second-stage loader, recovery DTBO and device tree, each padded to a page."
organisation = """
The header starts with the eight characters 'ANDROID!' and is little-endian. Versions 0 to 2 give the kernel size and load address, ramdisk size and address, second-stage size and address, the tags address, the page size, the header version (offset 40), an OS version and patch level, a 16-byte product name, a 512-byte command line, a 32-byte id (a hash over the components) and 1024 more bytes of command line. Version 1 adds the recovery DTBO size and offset and the header size; version 2 adds the DTB size and address.

Versions 3 and 4 move board-specific parts to a separate vendor_boot image ('VNDRBOOT') and shrink the header: kernel size, ramdisk size, OS version, header size, four reserved words, the header version still at offset 40, and a 1536-byte command line; version 4 adds a boot signature size. These versions fix the page size at 4096 bytes.

After the header, each component starts on a page boundary in a fixed order (kernel, ramdisk, second stage, recovery DTBO, DTB, signature), so offsets follow from the sizes. The kernel is often a compressed Image or zImage and the ramdisk a gzip- or LZ4-compressed cpio archive.
"""
carries = ["arm64-image", "arm-zimage", "gzip", "lz4", "cpio", "fdt"]
group = "Firmware"

[[format.specs]]
document = "Android boot image header"
title = "Boot image header (Android Open Source Project)"
url = "https://source.android.com/docs/core/architecture/bootloader/boot-image-header"

[[format.fields]]
name = "magic"
meaning = "The eight ASCII characters 'ANDROID!'."

[[format.fields]]
name = "kernel_size"
meaning = "Size of the kernel in bytes; the kernel starts one page after the header start."

[[format.fields]]
name = "ramdisk_size"
meaning = "Size of the ramdisk (usually a compressed cpio archive), which starts at the next page boundary after the kernel."

[[format.fields]]
name = "page_size"
meaning = "Alignment of every component (versions 0 to 2); fixed at 4096 in versions 3 and 4."

[[format.fields]]
name = "header_version"
meaning = "Layout version 0 to 4, at offset 40 in every version so a reader can choose the layout."

[[format.fields]]
name = "os_version"
meaning = "Android version and security patch level packed into bit fields (major, minor, patch; year, month)."

[[format.fields]]
name = "cmdline"
aliases = ["extra_cmdline"]
meaning = "Kernel command line, zero-terminated."

[[format.fields]]
name = "id"
meaning = "32 bytes identifying the image, normally a SHA-1 or SHA-256 over the components and their sizes (versions 0 to 2)."

[[format]]
id = "arm-zimage"
name = "Linux ARM zImage"
keys = ["ARM zImage", "zImage", "firmware/arm-zimage"]
summary = "A self-decompressing 32-bit ARM Linux kernel: a small position-independent loader with the compressed kernel appended."
organisation = """
The image starts with executable code (traditionally eight NOPs or a branch, then a jump past the header). At offset 0x24 is the little-endian magic 0x016F2818 (bytes 18 28 6F 01), followed by the start and end addresses of the image relative to its load address; offset 0x30 holds 0x04030201 in the image's own byte order, so a loader can tell big-endian builds apart.

The boot loader places the image in memory and jumps to its start with r0 = 0, r1 = the machine type number and r2 = the address of an ATAGS list or a flattened device tree. The decompressor then unpacks the real kernel (gzip, LZMA, xz, LZO, LZ4 or zstd, chosen at build time) and jumps to it.

The compressed payload can be found by searching after the header for a compression signature; decompressing it gives the kernel image, whose version string identifies the build. A device tree is sometimes appended after the end address.
"""
carries = ["gzip", "lzma", "xz", "lz4", "zstd", "fdt"]
group = "Firmware"

[[format.specs]]
document = "Linux ARM booting documentation"
title = "Booting ARM Linux (Linux kernel documentation)"
url = "https://www.kernel.org/doc/html/latest/arch/arm/booting.html"

[[format.fields]]
name = "magic"
meaning = "0x016F2818 at offset 0x24, little-endian, marking an ARM zImage."

[[format.fields]]
name = "start address"
meaning = "Absolute load and run address of the zImage (offset 0x28); zero for position-independent images."

[[format.fields]]
name = "end address"
meaning = "Address of the end of the image (offset 0x2C); its difference from the start gives the image size."

[[format.fields]]
name = "endianness"
meaning = "0x04030201 at offset 0x30, stored in the image's byte order."

[[format]]
id = "arm64-image"
name = "Linux arm64 kernel Image"
keys = ["arm64 Image", "AArch64 kernel Image", "firmware/arm64-image"]
summary = "The uncompressed 64-bit Arm Linux kernel with a 64-byte header that tells a boot loader where to place it; it can double as an EFI application."
organisation = """
The 64-byte header is little-endian: two 32-bit code words (a branch to the kernel entry, or an 'MZ' instruction for EFI-stub kernels), the 64-bit text offset at which to place the image relative to a 2 MiB aligned base, the 64-bit effective image size, 64-bit flags, three reserved 64-bit words, the magic 'ARM' 0x64 (bytes 41 52 4D 64) at offset 56, and a 32-bit field that points to the PE header in EFI-stub builds.

The flags give the kernel's endianness (bit 0), its page size (bits 1-2: unspecified, 4K, 16K, 64K) and whether it may be placed anywhere in memory (bit 3). The boot loader passes the physical address of a device tree in x0 and jumps to the start of the image with the MMU off.

Because EFI-stub kernels start with 'MZ' and carry a PE header, the same file is often detected as both an arm64 Image and a PE executable. Boot images and FIT images commonly wrap it, often gzip- or LZ4-compressed as Image.gz.
"""
carries = ["pe"]
group = "Firmware"

[[format.specs]]
document = "Linux arm64 booting documentation"
title = "Booting AArch64 Linux (Linux kernel documentation)"
url = "https://www.kernel.org/doc/html/latest/arch/arm64/booting.html"

[[format.fields]]
name = "code0"
aliases = ["code1"]
meaning = "Executable instructions at the start of the image: a branch to the kernel, or in EFI-stub builds an instruction whose bytes spell 'MZ'."

[[format.fields]]
name = "text_offset"
meaning = "Offset from a 2 MiB aligned base at which the image must be loaded (0 in modern kernels)."

[[format.fields]]
name = "image_size"
meaning = "Effective size of the kernel in memory, including space it needs beyond the file (such as BSS)."

[[format.fields]]
name = "flags"
meaning = "Bit 0 endianness (1 = big-endian), bits 1-2 page size, bit 3 physical placement freedom."

[[format.fields]]
name = "magic"
meaning = "'ARM' followed by 0x64 at offset 56."

[[format.fields]]
name = "res5"
aliases = ["PE header offset"]
meaning = "Offset of the PE header for EFI-stub kernels; reserved otherwise."

[[format]]
id = "trx"
name = "Broadcom TRX firmware image"
keys = ["TRX firmware", "TRX image", "firmware/trx"]
summary = "The firmware container used by many Broadcom-based routers: a short header with a CRC and offsets to up to three or four partitions (loader, kernel, root filesystem)."
organisation = """
The 28-byte header is little-endian: the magic 'HDR0', the total length of the image, a CRC-32 over the image from the flags field to the end, 16-bit flags, a 16-bit version (1 or 2), and three 32-bit partition offsets measured from the start of the header (version 2 adds a fourth).

The offsets are used in order. When the third offset is set, the first partition is usually an LZMA loader, then the kernel and the root filesystem; otherwise the first is the kernel and the second the root filesystem. Each partition ends where the next begins, and the last runs to the image length. The root filesystem is commonly SquashFS, JFFS2 or a UBI volume.

Vendors often prepend their own header (with model codes and another checksum) before the TRX header, so the magic may not be at offset 0.
"""
carries = ["lzma", "gzip", "squashfs", "jffs2", "ubi"]
group = "Firmware"

[[format.specs]]
document = "Linux drivers/mtd/parsers/parser_trx.c"
title = "Linux kernel TRX partition parser (struct trx_header)"
url = "https://github.com/torvalds/linux/blob/master/drivers/mtd/parsers/parser_trx.c"

[[format.fields]]
name = "magic"
meaning = "'HDR0' (0x30524448 little-endian)."

[[format.fields]]
name = "length"
meaning = "Total length of the TRX image in bytes, header included."

[[format.fields]]
name = "crc32"
meaning = "CRC-32 over the image from the flags field to the end of the image, as counted by the length field."

[[format.fields]]
name = "flags"
meaning = "Option flags such as 'loader is uncompressed'."

[[format.fields]]
name = "version"
meaning = "1 (three partition offsets) or 2 (four)."

[[format.fields]]
name = "offset*"
aliases = ["partition offset*"]
meaning = "Start of a partition, counted from the start of the TRX header; zero when unused."

[[format]]
id = "intel-hex"
name = "Intel HEX"
keys = ["Intel HEX", "Intel hex file", "firmware/intel-hex"]
summary = "A text encoding of binary data for programming microcontrollers and EPROMs: one record per line, each with its own address, type and checksum."
organisation = """
Every record is a line starting with a colon, then pairs of hexadecimal digits: a byte count, a 16-bit address (big-endian), a record type, the data bytes and a checksum. The checksum is the two's complement of the low byte of the sum of every other byte in the record, so all the bytes of a valid record sum to zero.

Record types: 00 data, 01 end of file (normally ':00000001FF'), 02 extended segment address (a paragraph number, shifted left four bits and added to later addresses), 03 start segment address (CS:IP for 8086 code), 04 extended linear address (the upper 16 bits of later 32-bit addresses) and 05 start linear address (the 32-bit entry point).

Records need not be in address order and can leave gaps, so converting to a flat binary means placing each data record at its full address and filling the gaps (usually with FF).
"""
group = "Firmware"

[[format.specs]]
document = "SRecord srec_intel(5)"
title = "srec_intel: Intel hexadecimal (MCS-86) file format (SRecord manual)"
url = "https://srecord.sourceforge.net/man/man5/srec_intel.5.html"

[[format.fields]]
name = "byte count"
meaning = "Number of data bytes in the record, typically 16 or 32."

[[format.fields]]
name = "address"
meaning = "16-bit load offset of the first data byte, added to the current extended segment or linear base."

[[format.fields]]
name = "record type"
meaning = "00 data, 01 end of file, 02 extended segment address, 03 start segment address, 04 extended linear address, 05 start linear address."

[[format.fields]]
name = "checksum"
meaning = "Two's complement of the low byte of the sum of the count, address, type and data bytes."

[[format]]
id = "srec"
name = "Motorola S-record"
keys = ["Motorola S-record", "S-record", "SREC", "firmware/srec"]
summary = "A line-oriented hexadecimal encoding of binary data used to program microcontrollers, with 16-, 24- or 32-bit addresses."
organisation = """
Each line is a record: the letter 'S', a type digit, a byte count, an address, data and a checksum, all as hexadecimal digit pairs. The byte count covers the address, data and checksum bytes. The checksum is the one's complement of the low byte of the sum of the count, address and data bytes.

S0 is a header whose data is usually a module name or file name. S1, S2 and S3 carry data with 16-, 24- and 32-bit addresses. S5 and S6 hold a count of the data records so far (16- or 24-bit). S9, S8 and S7 end the file, giving a 16-, 24- or 32-bit start address to pair with S1, S2 or S3 data.

As with Intel HEX, data records may arrive out of order or leave gaps; rebuilding the binary means placing each record at its address.
"""
group = "Firmware"

[[format.specs]]
document = "SRecord srec_motorola(5)"
title = "srec_motorola: Motorola S-Record file format (SRecord manual)"
url = "https://srecord.sourceforge.net/man/man5/srec_motorola.5.html"

[[format.fields]]
name = "record type"
meaning = "S0 header, S1/S2/S3 data with 16/24/32-bit address, S5/S6 record count, S7/S8/S9 start address and end of file."

[[format.fields]]
name = "byte count"
meaning = "Number of bytes that follow in the record: address, data and checksum."

[[format.fields]]
name = "address"
meaning = "Load address of the first data byte (2, 3 or 4 bytes by record type), or the entry point in S7/S8/S9."

[[format.fields]]
name = "checksum"
meaning = "One's complement of the low byte of the sum of the count, address and data bytes."

# ---------------------------------------------------------------------------
# Disks and filesystems
# ---------------------------------------------------------------------------

[[format]]
id = "exfat"
name = "exFAT"
keys = ["exFAT", "exFAT boot sector", "fs/exfat"]
summary = "Microsoft's extended FAT filesystem for flash media and SDXC cards: a FAT-style cluster chain with an allocation bitmap and 32-byte directory entry sets."
organisation = """
The main boot region is 12 sectors: the boot sector, eight extended boot sectors, OEM parameters, a reserved sector and a boot checksum sector whose every 32-bit word repeats a checksum over the first 11 sectors. A backup copy of the region follows immediately. All values are little-endian.

The boot sector starts with the jump EB 76 90 and 'EXFAT   ', then 53 zero bytes where FAT's BIOS parameter block would be (so older drivers reject the volume). The real fields follow: partition offset, volume length, FAT offset and length, cluster heap offset, cluster count, first cluster of the root directory, volume serial number, revision, volume flags, the sector and cluster sizes as powers of two, the number of FATs, drive select and percent in use. It ends with 55 AA.

The cluster heap starts at cluster 2. The FAT records chains only for fragmented files; a stream extension flag marks files stored contiguously. The root directory holds the allocation bitmap (entry type 0x81), the upcase table (0x82) and the volume label (0x83). Each file is an entry set: a file entry (0x85) with attributes and timestamps, a stream extension (0xC0) with name hash, length and first cluster, and file name entries (0xC1) of 15 UTF-16 characters each. Deleted entries have the high bit of their type cleared.
"""
group = "Disks and filesystems"

[[format.specs]]
document = "exFAT file system specification"
title = "exFAT file system specification (Microsoft)"
url = "https://learn.microsoft.com/en-us/windows/win32/fileio/exfat-specification"

[[format.fields]]
name = "FileSystemName"
meaning = "'EXFAT' padded with three spaces, at offset 3."

[[format.fields]]
name = "PartitionOffset"
meaning = "Sector offset of the volume from the start of the media; zero means ignore."

[[format.fields]]
name = "VolumeLength"
meaning = "Size of the volume in sectors."

[[format.fields]]
name = "FatOffset"
aliases = ["FatLength"]
meaning = "Sector offset and length of the first FAT."

[[format.fields]]
name = "ClusterHeapOffset"
meaning = "Sector offset of the cluster heap, where cluster 2 begins."

[[format.fields]]
name = "ClusterCount"
meaning = "Number of clusters in the heap."

[[format.fields]]
name = "FirstClusterOfRootDirectory"
meaning = "Cluster where the root directory starts."

[[format.fields]]
name = "VolumeSerialNumber"
meaning = "32-bit serial number, normally derived from the format date and time."

[[format.fields]]
name = "BytesPerSectorShift"
aliases = ["SectorsPerClusterShift"]
meaning = "Sector size and sectors per cluster as powers of two (9 means 512 bytes)."

[[format]]
id = "cramfs"
name = "cramfs"
keys = ["cramfs", "Compressed ROM filesystem", "fs/cramfs", "fs/cramfs-be"]
summary = "A small, read-only, zlib-compressed Linux filesystem once common in embedded firmware, now largely replaced by SquashFS."
organisation = """
The superblock starts with the magic 0x28CD3D45 in the host's byte order (bytes 45 3D CD 28 on little-endian systems, 28 CD 3D 45 on big-endian), then the filesystem size, feature flags, a reserved word and the 16-byte signature 'Compressed ROMFS'. A filesystem-info block follows (CRC-32 of the image, edition, block count, file count), then a 16-byte volume name and the root inode. Some images have 512 bytes of padding before the superblock for a boot sector.

Inodes are 12 bytes of bit fields: mode and uid (16 bits each), size (24) and gid (8), and name length in 4-byte units (6) with an offset in 4-byte units (26). A directory's offset points to its first child's inode; children follow one after another, each followed by its padded name. A file's offset points to its data.

File data begins with an array of 32-bit end pointers, one per 4 KiB block, each giving where that block's zlib stream ends; the first block starts right after the array. There are no timestamps, and uid and gid are truncated, which is a clue that a firmware tree was rebuilt.
"""
carries = ["zlib"]
group = "Disks and filesystems"

[[format.specs]]
document = "Linux include/uapi/linux/cramfs_fs.h"
title = "Linux kernel cramfs on-disk structures (cramfs_fs.h)"
url = "https://github.com/torvalds/linux/blob/master/include/uapi/linux/cramfs_fs.h"

[[format.specs]]
document = "Linux cramfs documentation"
title = "Cramfs - cram a filesystem onto a small ROM (Linux kernel documentation)"
url = "https://www.kernel.org/doc/html/latest/filesystems/cramfs.html"

[[format.fields]]
name = "magic"
meaning = "0x28CD3D45 in the creating host's byte order; its byte order tells you how to read the rest."

[[format.fields]]
name = "size"
meaning = "Length of the filesystem image in bytes."

[[format.fields]]
name = "flags"
meaning = "Feature flags: version 2 layout, sorted directories, holes, shifted root offset, extended block pointers."

[[format.fields]]
name = "signature"
meaning = "The 16 ASCII characters 'Compressed ROMFS'."

[[format.fields]]
name = "fsid"
meaning = "CRC-32 over the image (computed with this field zeroed), edition, block count and file count."

[[format.fields]]
name = "name"
meaning = "16-byte volume name chosen when the image was built."

[[format]]
id = "jffs2"
name = "JFFS2"
keys = ["JFFS2", "Journalling Flash File System 2", "fs/jffs2"]
summary = "A log-structured Linux filesystem for raw NOR and NAND flash: the image is a sequence of self-describing nodes, and the newest version of each piece of a file wins."
organisation = """
There is no superblock. Every node starts with a 12-byte header: the magic 0x1985, a 16-bit node type, the total node length (32-bit) and a CRC-32 of the header. Byte order follows the target CPU, so the magic reads 85 19 on little-endian images and 19 85 on big-endian ones. Nodes are aligned to four bytes and never cross an erase block; FF bytes fill unused space.

The node types that matter are directory entries (0xE001: parent inode, version, child inode, name), inodes (0xE002: inode number, version, mode, ownership, size, timestamps, the offset and length of the data range they cover, compression type and the compressed data) and clean markers (0x2003) written to freshly erased blocks. Padding (0x2004), summary (0x2006) and extended attribute nodes (0xE008, 0xE009) also appear.

To rebuild a file, collect all of its inode nodes and apply them in version order; obsolete nodes stay on flash until garbage collection, which makes JFFS2 images a good source of earlier file contents. Data is compressed per node with zlib, LZO, LZMA or the rtime and rubin schemes.
"""
carries = ["zlib", "lzma"]
group = "Disks and filesystems"

[[format.specs]]
document = "Linux include/uapi/linux/jffs2.h"
title = "Linux kernel JFFS2 on-flash structures (jffs2.h)"
url = "https://github.com/torvalds/linux/blob/master/include/uapi/linux/jffs2.h"

[[format.fields]]
name = "magic"
meaning = "0x1985 (0x1984 in very old images), in the target's byte order."

[[format.fields]]
name = "nodetype"
aliases = ["node type"]
meaning = "Kind of node: 0xE001 directory entry, 0xE002 inode, 0x2003 clean marker, 0x2004 padding, 0x2006 summary, 0xE008/0xE009 extended attributes. The top bits say how an older driver should treat an unknown type."

[[format.fields]]
name = "totlen"
aliases = ["total length"]
meaning = "Length of the whole node, header and data, before padding to four bytes."

[[format.fields]]
name = "hdr_crc"
meaning = "CRC-32 over the first eight header bytes."

[[format.fields]]
name = "version"
meaning = "Per-inode sequence number; the node with the highest version for a range of a file is current."

[[format.fields]]
name = "compr"
meaning = "Compression of an inode node's data: 0 none, 1 zero-filled, 2 rtime, 3 rubinmips, 4 copy, 5 dynrubin, 6 zlib, 7 LZO, 8 LZMA."

[[format]]
id = "ubi"
name = "UBI (Unsorted Block Images)"
keys = ["UBI", "UBI image", "fs/ubi"]
summary = "The Linux volume layer for raw NAND flash: each physical erase block carries headers that map it to a logical block of a volume, so wear levelling and bad blocks are handled below the filesystem."
organisation = """
Every physical erase block starts with a 64-byte big-endian erase counter header: the magic 'UBI#', the UBI version (1), the 64-bit erase count, the offsets of the volume identifier header and of the data within the block, an image sequence number shared by every block of one image, and a CRC-32 of the header.

The volume identifier header (magic 'UBI!', usually at the next NAND page) says which volume and logical block this physical block holds: volume type (dynamic or static), a copy flag set during wear-levelling moves, compatibility flags, volume id, logical block number, and for static volumes the data size, the number of used blocks, padding and a data CRC. A 64-bit sequence number decides which copy wins when two blocks claim the same logical block.

The volume table is kept in an internal layout volume (id 0x7FFFEFFF), two copies of up to 128 records naming each volume with its size, alignment and type. To extract a volume, sort its blocks by logical number and concatenate their data areas. Volumes usually hold UBIFS, sometimes SquashFS.
"""
carries = ["ubifs", "squashfs"]
group = "Disks and filesystems"

[[format.specs]]
document = "Linux drivers/mtd/ubi/ubi-media.h"
title = "Linux kernel UBI on-flash structures (ubi-media.h)"
url = "https://github.com/torvalds/linux/blob/master/drivers/mtd/ubi/ubi-media.h"

[[format.fields]]
name = "magic"
meaning = "'UBI#' for the erase counter header; 'UBI!' for the volume identifier header."

[[format.fields]]
name = "ec"
aliases = ["erase count"]
meaning = "How many times this physical block has been erased."

[[format.fields]]
name = "vid_hdr_offset"
meaning = "Where the volume identifier header sits within the erase block."

[[format.fields]]
name = "data_offset"
meaning = "Where volume data starts within the erase block."

[[format.fields]]
name = "image_seq"
meaning = "Random number shared by every block written as one image, to detect mixed images."

[[format.fields]]
name = "vol_id"
meaning = "Volume this block belongs to; 0x7FFFEFFF is the internal layout volume holding the volume table."

[[format.fields]]
name = "lnum"
meaning = "Logical block number within the volume."

[[format.fields]]
name = "sqnum"
meaning = "Global 64-bit sequence number; the higher one wins when two blocks map to the same logical block."

[[format.fields]]
name = "hdr_crc"
meaning = "CRC-32 of the header, excluding this field."

[[format]]
id = "ubifs"
name = "UBIFS"
keys = ["UBIFS", "UBI file system", "fs/ubifs"]
summary = "The Linux flash filesystem that runs on UBI volumes: a journaled, compressed filesystem whose index is a B+ tree of nodes written out of place."
organisation = """
Every node starts with a 24-byte little-endian common header: the magic 0x06101831 (bytes 31 18 10 06), a CRC-32 of the node, a 64-bit sequence number, the node length, the node type and a group type. Nodes are aligned to 8 bytes.

Logical block 0 holds the superblock node (type 6) with the minimum I/O unit, logical block size, block counts, the key hash and default compressor, and the filesystem UUID. Blocks 1 and 2 hold master nodes (type 7), whose highest sequence number points to the current index root, the log and the lprops tree. The log points into journal blocks, and the index (type 9) is a wandering B+ tree keyed by inode number, key type and name hash or block number.

File content lives in inode nodes (0), data nodes (1, 4 KiB of file data each, compressed with LZO, zlib or zstd), directory entries (2), extended attribute entries (3), truncation nodes (4), padding (5), and more. Like JFFS2, stale nodes remain until reused, so older data may be recoverable.
"""
carries = ["zlib", "zstd"]
group = "Disks and filesystems"

[[format.specs]]
document = "Linux fs/ubifs/ubifs-media.h"
title = "Linux kernel UBIFS on-flash structures (ubifs-media.h)"
url = "https://github.com/torvalds/linux/blob/master/fs/ubifs/ubifs-media.h"

[[format.specs]]
document = "Linux UBIFS documentation"
title = "UBI File System (Linux kernel documentation)"
url = "https://www.kernel.org/doc/html/latest/filesystems/ubifs.html"

[[format.fields]]
name = "magic"
meaning = "0x06101831, little-endian, at the start of every node."

[[format.fields]]
name = "crc"
meaning = "CRC-32 over the node from the sequence number onwards."

[[format.fields]]
name = "sqnum"
meaning = "64-bit sequence number; later writes have higher numbers."

[[format.fields]]
name = "len"
meaning = "Full node length in bytes, header included."

[[format.fields]]
name = "node_type"
meaning = "0 inode, 1 data, 2 directory entry, 3 extended attribute entry, 4 truncation, 5 padding, 6 superblock, 7 master, 8 LEB reference, 9 index, 10 commit start, 11 orphan, 12 authentication, 13 signature."

[[format.fields]]
name = "group_type"
meaning = "Whether the node is part of a group written atomically (0 none, 1 in a group, 2 last of a group)."

[[format]]
id = "iso9660"
name = "ISO 9660 filesystem"
keys = ["ISO 9660", "ISO image", "CD-ROM filesystem", "fs/iso9660", "application/x-iso9660-image"]
summary = "The filesystem of CD-ROMs and most .iso images: volume descriptors at 32 KiB describe a tree of directory records stored in 2048-byte logical sectors."
organisation = """
The first 16 sectors (32 KiB) are a system area the standard leaves free; hybrid images put an MBR, GPT or El Torito boot loader there. Volume descriptors start at sector 16 (offset 0x8000), one per 2048-byte sector: a type byte, the identifier 'CD001' and version 1. Type 0 is a boot record (El Torito points to its boot catalogue), 1 the primary volume descriptor, 2 a supplementary descriptor (Joliet uses one with UCS-2 names), 3 a partition descriptor and 255 the set terminator. UDF images add 'BEA01', 'NSR02'/'NSR03' and 'TEA01' descriptors after these.

Numbers are usually recorded twice, little-endian then big-endian ('both-byte orders'). The primary descriptor gives the system and volume identifiers, the volume size in blocks, the logical block size (2048), the location of the path tables, a 34-byte root directory record, and creator strings and dates.

A directory is a run of variable-length directory records: record length, extended attribute length, extent location and data length (both both-endian), a 7-byte recording date, flags (hidden, directory, associated, multi-extent), interleave fields, volume sequence number, name length and name (with ';1' version suffix). Rock Ridge adds POSIX names and permissions in each record's system use area.
"""
carries = ["mbr", "gpt", "fat"]
group = "Disks and filesystems"

[[format.specs]]
document = "ECMA-119"
title = "ECMA-119: Volume and File Structure of CDROM for Information Interchange"
url = "https://ecma-international.org/publications-and-standards/standards/ecma-119/"

[[format.fields]]
name = "volume descriptor type"
aliases = ["type"]
meaning = "0 boot record, 1 primary, 2 supplementary or enhanced (Joliet), 3 volume partition, 255 terminator."

[[format.fields]]
name = "standard identifier"
meaning = "'CD001' at bytes 1-5 of each volume descriptor."

[[format.fields]]
name = "volume identifier"
meaning = "32-character volume name, often the disc label."

[[format.fields]]
name = "volume space size"
meaning = "Number of logical blocks in the volume, recorded in both byte orders."

[[format.fields]]
name = "logical block size"
meaning = "Block size in bytes, 2048 on practically every disc."

[[format.fields]]
name = "root directory record"
meaning = "34-byte directory record for the root directory, giving its extent and length."

[[format.fields]]
name = "volume creation date"
meaning = "17-character date and time with a time zone offset in 15-minute units."

[[format]]
id = "hfsplus"
name = "HFS Plus"
keys = ["HFS+", "HFS Plus", "HFSX", "fs/hfsplus", "fs/hfsx"]
summary = "Apple's Mac OS Extended filesystem, used before APFS: a volume header at 1024 bytes and B-tree special files for the catalogue, extents and attributes."
organisation = """
The volume header sits 1024 bytes into the volume (a copy is 1024 bytes before the end) and is big-endian. It starts with the signature 'H+' and version 4 (or 'HX' and version 5 for case-sensitive HFSX), then attributes, the last-mounted-by signature (such as '10.0' or 'HFSJ' for a journaled mount), the journal info block, create, modify, backup and check dates (seconds since 1904), file and folder counts, the allocation block size, total and free block counts, and Finder info, which records the blessed system folder.

The header ends with five fork data records describing the special files: the allocation bitmap, the extents overflow file, the catalogue file, the attributes file and the startup file. Each fork record gives the logical size, clump size, total blocks and the first eight extents (start block and block count).

The catalogue file is a B-tree of 4 KiB-ish nodes keyed by parent folder id and Unicode name; leaf records are folders, files and thread records. Files have a data fork and a resource fork, and extents beyond the first eight live in the extents overflow B-tree.
"""
group = "Disks and filesystems"

[[format.specs]]
document = "Apple TN1150"
title = "Technical Note TN1150: HFS Plus Volume Format"
url = "https://developer.apple.com/library/archive/technotes/tn/tn1150.html"

[[format.fields]]
name = "signature"
meaning = "'H+' for HFS Plus or 'HX' for HFSX, at offset 1024."

[[format.fields]]
name = "version"
meaning = "4 for HFS Plus, 5 for HFSX."

[[format.fields]]
name = "lastMountedVersion"
meaning = "Who last mounted the volume for writing: '10.0' for macOS, 'HFSJ' when journaled, 'fsck' after a repair."

[[format.fields]]
name = "createDate"
aliases = ["modifyDate", "backupDate", "checkedDate"]
meaning = "Timestamps in seconds since 1 January 1904 (the creation date in local time, the others in UTC)."

[[format.fields]]
name = "blockSize"
meaning = "Allocation block size in bytes, normally 4096."

[[format.fields]]
name = "totalBlocks"
aliases = ["freeBlocks"]
meaning = "Number of allocation blocks in the volume and how many are free."

[[format.fields]]
name = "catalogFile"
aliases = ["extentsFile", "attributesFile", "allocationFile", "startupFile"]
meaning = "Fork data for a special file: its size and first eight extents."

[[format]]
id = "apfs"
name = "Apple File System (APFS)"
keys = ["APFS", "Apple File System", "fs/apfs"]
summary = "Apple's copy-on-write filesystem for macOS and iOS: a container of volumes sharing space, with every structure an object located through object maps and checkpoints."
organisation = """
Everything is an object of one block (normally 4096 bytes) starting with a 32-byte little-endian header: a Fletcher-64 checksum, the object id, the transaction id that wrote it, and its type and subtype. The container superblock lives in block 0 with the magic 'NXSB' at offset 32, followed by the block size, block count, feature flags, the container UUID, the next object and transaction ids, the checkpoint descriptor and data areas, the space manager, the object map and the list of volume ids.

Block 0 may be stale; a reader scans the checkpoint descriptor area for the superblock with the highest valid transaction id. Physical objects are addressed by block number; virtual objects (such as volumes and B-tree nodes) are looked up through an object map, which is itself a B-tree from object id and transaction id to block address.

Each volume has a superblock ('APSB') with its name, role, encryption state and the root of its file-system tree, a B-tree of records for inodes, directory entries, extents, extended attributes and snapshots. Encrypted volumes need keys from the keybag; snapshots and copy-on-write mean older versions of data often survive.
"""
group = "Disks and filesystems"

[[format.specs]]
document = "Apple File System Reference"
title = "Apple File System Reference"
url = "https://developer.apple.com/support/downloads/Apple-File-System-Reference.pdf"

[[format.fields]]
name = "o_cksum"
aliases = ["checksum"]
meaning = "Fletcher-64 checksum of the rest of the object."

[[format.fields]]
name = "o_oid"
aliases = ["object id"]
meaning = "Identifier of the object: a block number for physical objects, a virtual id otherwise."

[[format.fields]]
name = "o_xid"
aliases = ["transaction id"]
meaning = "Transaction that last wrote the object; the highest valid one is current."

[[format.fields]]
name = "nx_magic"
meaning = "'NXSB' at offset 32 of the container superblock."

[[format.fields]]
name = "nx_block_size"
aliases = ["block size"]
meaning = "Block size of the container, normally 4096."

[[format.fields]]
name = "nx_block_count"
meaning = "Number of blocks in the container."

[[format.fields]]
name = "nx_uuid"
meaning = "UUID of the container."

[[format.fields]]
name = "nx_omap_oid"
meaning = "Physical address of the container's object map."

[[format.fields]]
name = "nx_fs_oid"
meaning = "Virtual object ids of the volume superblocks in the container."

[[format]]
id = "btrfs"
name = "Btrfs"
keys = ["Btrfs", "Btrfs superblock", "fs/btrfs"]
summary = "A copy-on-write Linux filesystem built from B-trees, with snapshots, checksums and multiple devices; its superblock sits at 64 KiB."
organisation = """
The primary superblock is at 64 KiB (0x10000), with mirrors at 64 MiB and 256 GiB when the device is large enough; the magic '_BHRfS_M' is at offset 0x40 within it, so 0x10040 into the device. It is little-endian and starts with a checksum (CRC-32C by default; xxhash, SHA-256 and BLAKE2 are options) over the rest of the block.

The superblock gives the filesystem UUID, its own byte number, flags, the generation, the logical addresses of the root tree, chunk tree and log tree roots, total and used bytes, the number of devices, sector size, node size and stripe size, the checksum type, the device item for this device and the label. A system chunk array inside it maps enough logical addresses to physical ones to read the chunk tree.

Everything else is a tree node (header with checksum, fsid, logical address, generation, owner tree and level) holding keys of object id, type and offset. Trees include the root tree, extent tree, chunk and device trees, checksum tree and one filesystem tree per subvolume or snapshot. Logical addresses must be translated through the chunk tree before they can be read from disk.
"""
carries = ["zlib", "zstd"]
group = "Disks and filesystems"

[[format.specs]]
document = "Btrfs on-disk format"
title = "On-disk Format (Btrfs documentation)"
url = "https://btrfs.readthedocs.io/en/latest/dev/On-disk-format.html"

[[format.fields]]
name = "csum"
meaning = "Checksum of the superblock after this field, by the algorithm in csum_type."

[[format.fields]]
name = "fsid"
meaning = "Filesystem UUID, shared by every device of the filesystem."

[[format.fields]]
name = "magic"
meaning = "'_BHRfS_M' at offset 0x40 of the superblock."

[[format.fields]]
name = "generation"
meaning = "Transaction id of the last commit; the mirror with the highest generation is current."

[[format.fields]]
name = "root"
aliases = ["chunk_root", "log_root"]
meaning = "Logical addresses of the root tree, chunk tree and log tree roots."

[[format.fields]]
name = "total_bytes"
aliases = ["bytes_used"]
meaning = "Size of the filesystem and bytes in use."

[[format.fields]]
name = "sectorsize"
aliases = ["nodesize"]
meaning = "Data block size and tree node size in bytes (commonly 4096 and 16384)."

[[format.fields]]
name = "label"
meaning = "Filesystem label, up to 256 bytes."

[[format]]
id = "xfs"
name = "XFS"
keys = ["XFS", "XFS superblock", "fs/xfs"]
summary = "A high-performance journaling Linux filesystem divided into allocation groups, each starting with a copy of the superblock."
organisation = """
The superblock is in the first sector of the filesystem, with secondary copies at the start of every allocation group. It is big-endian and starts with 'XFSB', then the block size, the number of data blocks, real-time blocks and extents, the UUID, the log start block, the root inode number, the allocation group size and count, the log size, a version number with feature bits, the sector size, inode size, inodes per block, a 12-character filesystem name, and the size logarithms used to split block and inode numbers.

Each allocation group (AG) manages its own space: after the superblock come the AG free space header ('XAGF'), the inode header ('XAGI') and the free list, followed by B+ trees indexing free space by block and by size, and inode chunks. Inode numbers encode the AG, block and slot, so they can be decoded into disk positions.

Version 5 filesystems ('crc' feature) add CRC-32C checksums, the filesystem UUID and the owner to every metadata block, whose magic numbers then have a '3' variant (such as 'IAB3', 'XDB3'). Inodes start with 'IN' and hold data inline, in an extent list or in a B+ tree.
"""
group = "Disks and filesystems"

[[format.specs]]
document = "XFS Algorithms & Data Structures"
title = "XFS Algorithms & Data Structures, 3rd edition"
url = "https://mirrors.edge.kernel.org/pub/linux/utils/fs/xfs/docs/xfs_filesystem_structure.pdf"

[[format.fields]]
