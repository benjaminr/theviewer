[[format]]
id = "java-class"
name = "Java class file"
keys = ["Java class", "Java class file", "bytecode/java-class", "application/java-vm"]
summary = "A compiled Java (or Kotlin, Scala, Groovy) class: a constant pool, the class's fields and methods, and JVM bytecode in Code attributes."
organisation = """
The file is big-endian and starts with CA FE BA BE, a minor version and a major version: 52 is Java 8, 55 Java 11, 61 Java 17, 65 Java 21 (major minus 44 for modern releases). The same four magic bytes begin Mach-O universal binaries, which tell themselves apart by having a small architecture count where a class file has its version.

Next comes the constant pool: a count, then count − 1 entries, each starting with a tag (1 UTF-8, 3 integer, 4 float, 5 long, 6 double, 7 class, 8 string, 9 field reference, 10 method reference, 11 interface method reference, 12 name and type, 15 method handle, 16 method type, 17 dynamic, 18 invokedynamic, 19 module, 20 package). Longs and doubles take two slots. Everything later refers to the pool by index, so class names, method names and string literals can all be read from it.

Then follow the access flags, this class and superclass (pool indexes), the implemented interfaces, the fields, the methods and the class attributes. Each field and method has flags, a name, a descriptor and attributes; a method's Code attribute holds the maximum stack depth, the number of locals, the bytecode, an exception table and nested attributes such as line number tables. Class files usually arrive inside JAR, WAR or APK archives.
"""
group = "Executables and bytecode"

[[format.specs]]
document = "JVMS chapter 4"
title = "The Java Virtual Machine Specification, Java SE 21 Edition: Chapter 4, The class File Format"
url = "https://docs.oracle.com/javase/specs/jvms/se21/html/jvms-4.html"
section = "4.1"

[[format.fields]]
name = "magic"
meaning = "CA FE BA BE."
section = "4.1"

[[format.fields]]
name = "minor_version"
aliases = ["major_version"]
meaning = "Class file version; the major version gives the Java release the class was compiled for (52 = Java 8, 65 = Java 21). A minor version of 65535 marks preview features."
section = "4.1"

[[format.fields]]
name = "constant_pool_count"
meaning = "One more than the number of constant pool slots."
section = "4.1"

[[format.fields]]
name = "constant_pool"
meaning = "Tagged entries holding names, descriptors, literals and references used by the rest of the class."
section = "4.4"

[[format.fields]]
name = "access_flags"
meaning = "Class modifiers: public, final, super, interface, abstract, synthetic, annotation, enum, module."
section = "4.1"

[[format.fields]]
name = "this_class"
aliases = ["super_class"]
meaning = "Constant pool indexes of the class and its superclass."
section = "4.1"

[[format.fields]]
name = "methods"
meaning = "Method definitions, each with flags, name, descriptor and attributes such as Code."
section = "4.6"

[[format]]
id = "dex"
name = "Dalvik executable (DEX)"
keys = ["DEX", "Dalvik executable", "bytecode/dalvik-dex", "application/x-dex"]
summary = "The bytecode format of Android apps: all of an app's classes merged into one file with shared, de-duplicated string, type and method tables."
organisation = """
The 112-byte header is little-endian. It starts with 'dex' LF, a three-digit version (035 to 041) and a zero byte, then an Adler-32 checksum of everything after it, a SHA-1 signature of everything after that, the file size, the header size (0x70) and the endian tag 0x12345678. The rest of the header is pairs of size and offset for the link section, the map list, and the string id, type id, prototype id, field id, method id and class definition tables, and the data section.

The id tables are sorted indexes: string ids point to MUTF-8 strings in the data section (each prefixed by a ULEB128 length), type ids index string ids, and prototype, field and method ids are built from type and string indexes. Class definitions name the class, access flags, superclass, interfaces, source file, annotations, static values and a class data item.

Class data (ULEB128-encoded) lists fields and methods; each method's code item gives register counts, the instructions as 16-bit units, try blocks and debug information. The map list at map_off describes every section and is a reliable way to walk the file. APKs hold classes.dex, classes2.dex and so on; optimised forms (vdex, odex, oat) wrap or replace it on devices.
"""
group = "Executables and bytecode"

[[format.specs]]
document = "Dalvik executable format"
title = "Dalvik executable format (Android Open Source Project)"
url = "https://source.android.com/docs/core/runtime/dex-format"

[[format.fields]]
name = "magic"
meaning = "'dex' LF, the format version as three digits, and a zero byte."

[[format.fields]]
name = "checksum"
meaning = "Adler-32 of the file after this field."

[[format.fields]]
name = "signature"
meaning = "SHA-1 of the file after this field, identifying the file."

[[format.fields]]
name = "file_size"
meaning = "Size of the whole file in bytes."

[[format.fields]]
name = "header_size"
meaning = "0x70."

[[format.fields]]
name = "endian_tag"
meaning = "0x12345678 for normal little-endian files."

[[format.fields]]
name = "map_off"
meaning = "Offset of the map list describing every item section in the file."

[[format.fields]]
name = "string_ids_size"
aliases = ["string_ids_off", "type_ids_size", "method_ids_size", "class_defs_size"]
meaning = "Counts and offsets of the id tables and class definitions."

[[format]]
id = "wasm"
name = "WebAssembly binary module"
keys = ["WebAssembly", "WebAssembly module", "WebAssembly module signature", "Wasm", "bytecode/wasm", "application/wasm"]
summary = "The compiled form of a WebAssembly module: typed functions, imports, exports, memory and tables, in a compact section-based binary encoding."
organisation = """
A module starts with the four bytes 00 61 73 6D ('asm' after a zero) and the version 1 as a 32-bit little-endian number. A sequence of sections follows, each a one-byte id, a size as an unsigned LEB128 number, and that many bytes of content, so a reader can skip sections it does not need.

Section ids: 0 custom, 1 type, 2 import, 3 function, 4 table, 5 memory, 6 global, 7 export, 8 start, 9 element, 10 code, 11 data, 12 data count, and 13 tag in modules using exception handling. Apart from custom sections, which may appear anywhere, they occur at most once and in a fixed order.

The function section lists a type index per function and the code section gives the bodies (local declarations, then instructions, each body prefixed by its size). Imports and exports name what the module exchanges with its host; custom sections carry names ('name'), producer information and DWARF debug data. Strings and vectors are length-prefixed with LEB128 counts.
"""
group = "Executables and bytecode"

[[format.specs]]
document = "WebAssembly Core Specification, binary format"
title = "WebAssembly Core Specification: Binary Format, Modules"
url = "https://webassembly.github.io/spec/core/binary/modules.html"

[[format.fields]]
name = "magic"
meaning = "00 61 73 6D."

[[format.fields]]
name = "version"
meaning = "Binary format version, 1, as a 32-bit little-endian number."

[[format.fields]]
name = "section id"
meaning = "0 custom, 1 type, 2 import, 3 function, 4 table, 5 memory, 6 global, 7 export, 8 start, 9 element, 10 code, 11 data, 12 data count, 13 tag."

[[format.fields]]
name = "section size"
meaning = "Size of the section's content in bytes, as unsigned LEB128."

[[format]]
id = "pyc"
name = "Python compiled bytecode (.pyc)"
keys = ["Python bytecode", ".pyc", "bytecode/pyc-3.8", "bytecode/pyc-3.9", "bytecode/pyc-3.10", "bytecode/pyc-3.11", "bytecode/pyc-3.12", "bytecode/pyc-3.13"]
summary = "A cached, compiled Python module: a 16-byte header identifying the interpreter version and the source it came from, then a marshalled code object."
organisation = """
The header (Python 3.7 and later) is four little-endian 32-bit words. The first is the magic number: a 16-bit value that changes with each bytecode revision, followed by CR LF, so the first two bytes reveal the Python version (for example 0x0D55 for 3.8, 0x0D6F for 3.10, 0x0DA7 for 3.11, 0x0DCB for 3.12, 0x0DF3 for 3.13). The second word is a flags field.

With flags 0 the file is timestamp-based: the third word is the source file's modification time and the fourth its size. With bit 0 set the file is hash-based: the third and fourth words are a 64-bit SipHash of the source, and bit 1 says whether the interpreter should check it against the source.

The rest is a code object in the marshal format: type codes such as 'c' (code), 's' (bytes), 'z'/'Z' (short ASCII strings), 'u' (UTF-8 strings), ')' (small tuples) and 'r' (references to earlier objects), with the high bit of a type code meaning 'remember this object'. Bytecode itself is not stable between versions, so decompiling needs the exact interpreter version the magic number names.
"""
group = "Executables and bytecode"

[[format.specs]]
document = "PEP 552"
title = "PEP 552 - Deterministic pycs"
url = "https://peps.python.org/pep-0552/"

[[format.specs]]
document = "Python marshal module"
title = "marshal - Internal Python object serialization"
url = "https://docs.python.org/3/library/marshal.html"

[[format.fields]]
name = "magic"
meaning = "Version-specific 16-bit number followed by CR LF; it identifies the Python release that wrote the file."

[[format.fields]]
name = "flags"
meaning = "0 for timestamp-based files; bit 0 hash-based, bit 1 check the hash against the source."

[[format.fields]]
name = "source mtime"
aliases = ["mtime"]
meaning = "Modification time of the source file, seconds since 1970, in timestamp-based files."

[[format.fields]]
name = "source size"
meaning = "Size of the source file modulo 2^32, in timestamp-based files."

[[format.fields]]
name = "source hash"
meaning = "64-bit SipHash of the source file, in hash-based files."

[[format]]
id = "lua-bytecode"
name = "Lua precompiled chunk"
keys = ["Lua bytecode", "Lua precompiled chunk", "luac", "bytecode/lua"]
summary = "Lua source compiled by luac: a header describing the virtual machine's number formats, then a serialised function prototype with its constants, upvalues and nested functions."
organisation = """
A chunk starts with ESC 'Lua' (1B 4C 75 61) and a version byte with the major version in the high nibble and minor in the low (0x51 for 5.1, 0x53 for 5.3, 0x54 for 5.4), then a format byte (0 for the official format). From 5.3 on, the six bytes 19 93 0D 0A 1A 0A follow to catch text-mode conversion.

Lua 5.4 then gives the sizes of an instruction, an integer and a float, and the test values 0x5678 as an integer and 370.5 as a float, so the loader can detect byte order and number formats. Lua 5.1 used a different header with an endianness flag and sizes of int and size_t.

The main function follows: in 5.4 a byte with its upvalue count, then the source name, line range, parameter count, vararg flag, stack size, the instruction array, constants, upvalue descriptors, nested prototypes and debug information. Stripped chunks (luac -s) drop names and line numbers. Bytecode is specific to the Lua version and build, and modified virtual machines (common in games and some firmware) reorder opcodes.
"""
group = "Executables and bytecode"

[[format.specs]]
document = "Lua 5.4 lundump.c"
title = "Lua 5.4 source: lundump.c (loading precompiled chunks)"
url = "https://www.lua.org/source/5.4/lundump.c.html"

[[format.specs]]
document = "Lua 5.4 lundump.h"
title = "Lua 5.4 source: lundump.h"
url = "https://www.lua.org/source/5.4/lundump.h.html"

[[format.fields]]
name = "signature"
meaning = "1B 4C 75 61: ESC then 'Lua'."

[[format.fields]]
name = "version"
meaning = "Major version in the high nibble, minor in the low: 0x54 for Lua 5.4."

[[format.fields]]
name = "format"
meaning = "0 for the official format; other values mark modified virtual machines."

[[format.fields]]
name = "LUAC_DATA"
meaning = "19 93 0D 0A 1A 0A, to detect transfers that alter line endings or stop at a 1A byte."

[[format.fields]]
name = "LUAC_INT"
aliases = ["LUAC_NUM"]
meaning = "Test values 0x5678 and 370.5, stored in the chunk's own integer and float formats."

[[format]]
id = "llvm-bitcode"
name = "LLVM bitcode"
keys = ["LLVM bitcode", "LLVM IR bitcode", "bytecode/llvm-bitcode"]
summary = "The binary form of LLVM intermediate representation, found in .bc files, link-time optimisation objects and Apple's embedded bitcode sections."
organisation = """
A bitcode file starts with 'BC' C0 DE. It may instead begin with a wrapper header (magic 0x0B17C0DE, then version, offset and size of the bitcode, and a CPU type), used by Apple tools. The content is an LLVM bitstream: a stream of bits read least significant first, organised into nested blocks and records rather than byte-aligned structures.

Every item starts with an abbreviation id of the current width: 0 END_BLOCK, 1 ENTER_SUBBLOCK (block id, new abbreviation width, and a 32-bit word count so the block can be skipped), 2 DEFINE_ABBREV and 3 UNABBREV_RECORD; higher ids use abbreviations defined earlier, which say how each operand is encoded (fixed width, variable-width VBR chunks, arrays, 6-bit characters or blobs). Blocks are 32-bit aligned.

The top-level blocks are IDENTIFICATION (producer string and epoch), MODULE (with type tables, constants, functions, metadata, value symbol tables and string tables nested inside) and the STRTAB and SYMTAB blocks. llvm-bcanalyzer and llvm-dis turn the file back into readable form.
"""
group = "Executables and bytecode"

[[format.specs]]
document = "LLVM Bitcode File Format"
title = "LLVM Bitcode File Format (LLVM documentation)"
url = "https://llvm.org/docs/BitCodeFormat.html"

[[format.fields]]
name = "magic"
meaning = "'BC' followed by C0 DE; or 0x0B17C0DE for the wrapper header."

[[format.fields]]
name = "abbreviation id"
meaning = "Code introducing each item: 0 end block, 1 enter sub-block, 2 define abbreviation, 3 unabbreviated record, 4 and above defined abbreviations."

[[format.fields]]
name = "block id"
meaning = "Kind of block: 0 BLOCKINFO, 8 MODULE, 13 IDENTIFICATION, 23 STRTAB, 25 SYMTAB, among others."

[[format]]
id = "java-serialisation"
name = "Java object serialisation stream"
keys = ["Java serialization", "Java serialisation", "Java serialized object", "serial/java-serialized"]
summary = "The binary stream Java's ObjectOutputStream writes: class descriptors and object field values, with back-references; deserialising untrusted streams is a well-known route to code execution."
organisation = """
A stream starts with the magic AC ED and version 5, both 16-bit big-endian. The rest is a sequence of type codes, each followed by its content: 0x70 null, 0x71 back-reference to an earlier object by handle, 0x72 class descriptor, 0x73 new object, 0x74 string, 0x75 array, 0x76 class, 0x77 and 0x7A block data (short and long), 0x78 end of block data, 0x79 reset, 0x7B exception, 0x7C long string, 0x7D proxy class descriptor and 0x7E enum.

A class descriptor gives the class name, the 64-bit serialVersionUID, flags (serializable, externalizable, has writeObject data, block data mode, enum) and the field descriptions (a type code letter and name, plus a class name for object fields), then annotations and the superclass descriptor. A new object is its descriptor followed by field values for each class from the top of the hierarchy down, with any custom writeObject data in block-data form.

Every new object, class and string is given a handle starting at 0x7E0000, which later 0x71 references use. Seeing AC ED 00 05 (or its base64 form 'rO0AB') in a file, cookie or network message means Java will deserialise it, and the class names in the stream show which library gadgets are being used.
"""
group = "Executables and bytecode"

[[format.specs]]
document = "Java Object Serialization Specification ch. 6"
title = "Java Object Serialization Specification: Object Serialization Stream Protocol"
url = "https://docs.oracle.com/en/java/javase/21/docs/specs/serialization/protocol.html"

[[format.fields]]
name = "STREAM_MAGIC"
aliases = ["magic"]
meaning = "AC ED."

[[format.fields]]
name = "STREAM_VERSION"
aliases = ["version"]
meaning = "5."

[[format.fields]]
name = "TC_CLASSDESC"
meaning = "0x72: a class descriptor with name, serialVersionUID, flags and field list."

[[format.fields]]
name = "TC_OBJECT"
meaning = "0x73: a new object, followed by its class descriptor and field values."

[[format.fields]]
name = "TC_REFERENCE"
meaning = "0x71: a reference to an earlier object by its 32-bit handle (from 0x7E0000)."

[[format.fields]]
name = "serialVersionUID"
meaning = "64-bit version stamp of a class, which must match the receiving class."

# ---------------------------------------------------------------------------
# Databases and data files
# ---------------------------------------------------------------------------

[[format]]
id = "sqlite"
name = "SQLite database"
keys = ["SQLite", "SQLite database", "SQLite database signature", "SQLite 3 database", "db/sqlite", "application/x-sqlite3", "application/x-geopackage", "application/x-mbtiles"]
summary = "The single-file SQL database used by browsers, phones and countless applications: a 100-byte header followed by fixed-size pages of B-trees."
organisation = """
The file is divided into pages of a power-of-two size from 512 to 65536 bytes. Page 1 begins with the 100-byte header: 'SQLite format 3' and a zero byte, then big-endian fields including the page size, read and write format versions (2 for WAL mode), bytes reserved per page, the file change counter, the database size in pages, the first freelist trunk page and freelist page count, the schema cookie and format, the text encoding, the user version, the application id (which identifies formats built on SQLite, such as GeoPackage and MBTiles) and the SQLite version that last wrote the file.

Every table and index is a B-tree. Each B-tree page starts with a type byte (2 interior index, 5 interior table, 10 leaf index, 13 leaf table), the first freeblock, the cell count, the start of the cell content area and fragmented byte count, plus a right-child pointer on interior pages; then an array of 2-byte cell offsets. Table leaf cells hold the payload size, the rowid (both as varints) and a record: a header of serial types giving each column's type and length, then the values. Payloads too big for the page continue on overflow pages.

The schema is the table on page 1 (sqlite_schema) listing each table and index with its root page and SQL. For forensics, deleted rows often survive in freeblocks, unallocated space and freelist pages, and recent changes may live only in the -wal file beside the database.
"""
group = "Databases"

[[format.specs]]
document = "SQLite file format"
title = "Database File Format (SQLite documentation)"
url = "https://www.sqlite.org/fileformat.html"

[[format.fields]]
name = "header string"
aliases = ["magic"]
meaning = "'SQLite format 3' followed by a zero byte."

[[format.fields]]
name = "page size"
meaning = "Page size in bytes, at offset 16; the value 1 means 65536."

[[format.fields]]
name = "file format write version"
aliases = ["file format read version"]
meaning = "1 for rollback journal mode, 2 for WAL mode (offsets 18 and 19)."

[[format.fields]]
name = "file change counter"
meaning = "Incremented on each transaction that changes the file (offset 24)."

[[format.fields]]
name = "database size"
aliases = ["in-header database size"]
meaning = "Size of the database in pages (offset 28), valid when the version-valid-for number matches the change counter."

[[format.fields]]
name = "first freelist trunk page"
aliases = ["freelist page count"]
meaning = "Start of the list of unused pages and how many there are (offsets 32 and 36); deleted data often lingers in them."

[[format.fields]]
name = "schema cookie"
meaning = "Incremented whenever the schema changes (offset 40)."

[[format.fields]]
name = "text encoding"
meaning = "1 UTF-8, 2 UTF-16 little-endian, 3 UTF-16 big-endian (offset 56)."

[[format.fields]]
name = "user version"
meaning = "Free for applications to use as a schema version (offset 60, PRAGMA user_version)."

[[format.fields]]
name = "application id"
meaning = "Identifies the application file format built on SQLite, such as 0x47504B47 'GPKG' for GeoPackage (offset 68)."

[[format.fields]]
name = "SQLite version number"
meaning = "Version of the SQLite library that last modified the file (offset 96)."

[[format]]
id = "git-pack"
name = "Git pack file"
keys = ["Git packfile", "Git pack file", "db/git-packfile"]
summary = "How Git stores and transfers objects in bulk: a header, a series of zlib-compressed objects (many stored as deltas against others) and a checksum."
organisation = """
A pack starts with 'PACK', a 32-bit big-endian version (2 or 3) and the object count. Each object begins with a variable-length header: the first byte holds a continuation bit, a 3-bit type (1 commit, 2 tree, 3 blob, 4 tag, 6 offset delta, 7 reference delta) and the low four bits of the uncompressed size; further bytes add seven size bits each, least significant group first.

Plain objects are followed by their zlib-compressed content. An offset delta then gives the distance back to its base object (a big-endian variable-length number) and a reference delta gives the base's 20-byte object id; then comes a zlib-compressed delta of copy and insert instructions against the base.

The pack ends with a SHA-1 (or SHA-256 in SHA-256 repositories) of everything before it. A companion .idx file ('FF tOc' and version 2) holds a 256-entry fan-out table, the sorted object names, CRC-32s and offsets into the pack, so objects can be found without scanning.
"""
carries = ["zlib"]
group = "Databases"

[[format.specs]]
document = "gitformat-pack(5)"
title = "gitformat-pack - Git pack format"
url = "https://git-scm.com/docs/gitformat-pack"

[[format.fields]]
name = "signature"
meaning = "'PACK'."

[[format.fields]]
name = "version"
meaning = "Pack version, 2 (or 3)."

[[format.fields]]
name = "number of objects"
meaning = "Count of objects that follow."

[[format.fields]]
name = "object type"
meaning = "1 commit, 2 tree, 3 blob, 4 tag, 6 OFS_DELTA (base by offset), 7 REF_DELTA (base by object name)."

[[format.fields]]
name = "trailer"
aliases = ["checksum"]
meaning = "Hash of all preceding pack contents."

[[format]]
id = "git-index"
name = "Git index (staging area)"
keys = ["Git index", "Git staging area", "db/git-index"]
summary = "The .git/index file recording what will go into the next commit: one entry per tracked path with its stat data and object id, plus optional extensions."
organisation = """
The header is 'DIRC', a 32-bit big-endian version (2, 3 or 4) and the number of entries. Each entry gives ctime and mtime (seconds and nanoseconds), device, inode, mode, uid, gid and file size as 32-bit values, the object id of the blob, a 16-bit flags field (assume-valid, extended, stage for merge conflicts and the name length) and the path. In versions 2 and 3 the path is zero-terminated and the entry padded to a multiple of eight bytes; version 4 prefix-compresses each path against the previous one.

Extensions follow the entries, each a four-character signature and a 32-bit size: 'TREE' (cached tree objects), 'REUC' (resolve-undo), 'link' (split index), 'UNTR' (untracked cache), 'FSMN' (filesystem monitor), 'EOIE' and 'IEOT' (offsets for parallel loading). A signature starting with an upper-case letter is optional to understand.

The file ends with a hash of everything before it. Its timestamps and paths show what was in a working tree, even for files never committed.
"""
group = "Databases"

[[format.specs]]
document = "gitformat-index(5)"
title = "gitformat-index - Git index format"
url = "https://git-scm.com/docs/gitformat-index"

[[format.fields]]
name = "signature"
meaning = "'DIRC' (directory cache)."

[[format.fields]]
name = "version"
meaning = "Index format version: 2, 3 or 4."

[[format.fields]]
name = "number of entries"
meaning = "Count of index entries."

[[format.fields]]
name = "flags"
meaning = "Assume-valid bit, extended bit, two-bit merge stage and 12-bit name length."

[[format.fields]]
name = "extension signature"
meaning = "Four-character name of an extension such as TREE, REUC or UNTR."

[[format]]
id = "parquet"
name = "Apache Parquet"
keys = ["Parquet", "Apache Parquet", "data/parquet", "application/x-parquet"]
summary = "A columnar data file for analytics: row groups of compressed column chunks, described by a Thrift-encoded footer."
organisation = """
The file starts and ends with 'PAR1'. Just before the final magic is a 4-byte little-endian length of the footer, which precedes it; so a reader goes to the end, reads the length, and decodes the footer first. Encrypted-footer files end with 'PARE' instead.

The footer is FileMetaData in Thrift's compact protocol: the format version, the schema as a flattened tree of elements, the row count, key-value metadata (often the writer's own schema, such as Arrow's), the writer name ('created_by') and the row groups. Each row group lists its column chunks with their file offsets, sizes, codec, encodings and min/max statistics.

A column chunk is a series of pages, each with a Thrift page header: dictionary pages, data pages (v1 or v2, with repetition and definition levels for nested and optional values) and index pages. Page data is compressed per page with Snappy, gzip, LZ4, zstd or Brotli, or stored uncompressed.
"""
carries = ["gzip", "zstd", "lz4"]
group = "Databases"

[[format.specs]]
document = "Apache Parquet file format"
title = "File Format (Apache Parquet documentation)"
url = "https://parquet.apache.org/docs/file-format/"

[[format.fields]]
name = "magic"
meaning = "'PAR1' at the start and end of the file ('PARE' at the end when the footer is encrypted)."

[[format.fields]]
name = "footer length"
meaning = "4-byte little-endian length of the FileMetaData just before the final magic."

[[format.fields]]
name = "created_by"
meaning = "Writer application and version, such as 'parquet-cpp-arrow version 15.0.0'."

[[format.fields]]
name = "num_rows"
meaning = "Total number of rows in the file."

[[format.fields]]
name = "row_groups"
meaning = "List of row groups, each with its column chunk locations and statistics."

[[format]]
id = "python-pickle"
name = "Python pickle"
keys = ["Python pickle", "pickle", "data/python-pickle"]
summary = "Python's object serialisation format: a program for a small stack machine that rebuilds objects; loading one can run arbitrary code."
organisation = """
A pickle is a sequence of one-byte opcodes, each followed by its arguments, ending with STOP ('.'). From protocol 2 the stream opens with PROTO (0x80) and the protocol number; protocols 4 and 5 then use FRAME (0x95) with an 8-byte little-endian length to group opcodes, which is why modern pickles start 80 04 95 or 80 05 95. Protocols 0 and 1 have no header and protocol 0 is printable text.

Opcodes push values (integers, floats, bytes, strings with 1-, 4- or 8-byte lengths, tuples, lists, dicts), manipulate a memo table for shared references (PUT, GET, MEMOIZE), and build objects. GLOBAL ('c', with a module and name as text lines) and STACK_GLOBAL (0x93) look up any importable callable; REDUCE ('R') calls it with a tuple of arguments; BUILD ('b'), INST and OBJ set up instances.

Because a pickle can name and call any function, such as os.system, loading untrusted pickles is code execution. Machine learning model files (.pkl, PyTorch's zip-based .pt and .bin files) are a common carrier, and 'pickletools.dis' disassembles a pickle without running it.
"""
group = "Databases"

[[format.specs]]
document = "Python pickle module"
title = "pickle - Python object serialization"
url = "https://docs.python.org/3/library/pickle.html"

[[format.specs]]
document = "PEP 3154"
title = "PEP 3154 - Pickle protocol version 4"
url = "https://peps.python.org/pep-3154/"

[[format.fields]]
name = "PROTO"
meaning = "0x80 followed by the protocol number (2 to 5)."

[[format.fields]]
name = "FRAME"
meaning = "0x95 followed by the 8-byte length of the frame that follows (protocol 4 and later)."

[[format.fields]]
name = "GLOBAL"
aliases = ["STACK_GLOBAL"]
meaning = "Push a module attribute (class or function) by name; the names show what the pickle will import."

[[format.fields]]
name = "REDUCE"
meaning = "Call a callable from the stack with a tuple of arguments; the opcode that makes pickles dangerous."

[[format.fields]]
name = "STOP"
meaning = "'.', ending the pickle; the top of the stack is the result."

[[format]]
id = "bplist"
name = "Apple binary property list"
keys = ["Binary property list", "bplist", "serial/bplist", "application/x-bplist"]
summary = "The compact binary form of Apple property lists, used for preferences, app metadata and NSKeyedArchiver archives on macOS and iOS."
organisation = """
A file starts with 'bplist00' and ends with a 32-byte big-endian trailer: five unused bytes, a sort version, the size in bytes of each offset table entry, the size of an object reference, the number of objects (64-bit), the index of the top object (64-bit) and the offset of the offset table (64-bit). Readers start from the trailer.

The offset table lists the file offset of every object. Each object starts with a marker byte whose high nibble is its type: 0x0 null, booleans (08 false, 09 true) and fill, 0x1 integer (2^n bytes), 0x2 real, 0x3 date (8-byte float, seconds since 2001-01-01), 0x4 data, 0x5 ASCII string, 0x6 UTF-16 string, 0x8 UID, 0xA array, 0xC set and 0xD dictionary. For data, strings and collections the low nibble is the count, or 0xF with an integer object giving the count.

Arrays and dictionaries hold object references (indexes into the offset table); a dictionary has all its key references first, then all its value references. NSKeyedArchiver files are bplists whose $objects array is linked by UID references, with $top giving the root.
"""
group = "Databases"

[[format.specs]]
document = "CoreFoundation CFBinaryPList.c"
title = "CFBinaryPList.c (Apple CoreFoundation source)"
url = "https://github.com/apple-oss-distributions/CF/blob/main/CFBinaryPList.c"

[[format.fields]]
name = "magic"
meaning = "'bplist' followed by the version '00'."

[[format.fields]]
name = "offsetIntSize"
meaning = "Bytes per offset table entry (1, 2, 4 or 8)."

[[format.fields]]
name = "objectRefSize"
meaning = "Bytes per object reference inside arrays, sets and dictionaries."

[[format.fields]]
name = "numObjects"
meaning = "Number of objects, and entries in the offset table."

[[format.fields]]
name = "topObject"
meaning = "Index of the root object."

[[format.fields]]
name = "offsetTableOffset"
meaning = "File offset of the offset table."

