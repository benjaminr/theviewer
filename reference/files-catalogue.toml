[[format]]
id = "tiff"
name = "Tagged Image File Format (TIFF)"
keys = ["TIFF", "TIFF image", "TIFF image (LE) signature", "TIFF image (BE) signature", "image/tiff"]
summary = "A flexible raster image container built from image file directories (IFDs) of tagged fields; also the structure underneath Exif metadata, DNG and most camera raw formats."
organisation = """
The 8-byte header gives the byte order ('II' for little-endian, 'MM' for big-endian), the number 42 in that order, and the offset of the first IFD. BigTIFF uses 43 instead, then an offset size of 8 and 64-bit offsets throughout.

An IFD is a 2-byte entry count, 12-byte entries and a 4-byte offset of the next IFD (zero at the end), so a file can hold several images (pages, thumbnails, reduced resolutions). Each entry is a tag number, a field type (1 BYTE, 2 ASCII, 3 SHORT, 4 LONG, 5 RATIONAL, 6 SBYTE, 7 UNDEFINED, 8 SSHORT, 9 SLONG, 10 SRATIONAL, 11 FLOAT, 12 DOUBLE), a count, and the value itself if it fits in four bytes, otherwise an offset to it.

Image data is stored in strips or tiles whose offsets and byte counts are tags; Compression says how each is encoded (1 none, 2 CCITT, 5 LZW, 6 and 7 JPEG, 8 Deflate, 32773 PackBits). Private sub-IFDs hang off tags: Exif (34665), GPS (34853) and Interoperability, while XMP (700), IPTC (33723), Photoshop resources (34377) and ICC profiles (34675) are stored as tag values. Offsets are absolute from the start of the TIFF header, which matters when TIFF is embedded in JPEG APP1 segments.
"""
carries = ["jpeg", "zlib", "xml"]
group = "Images"

[[format.specs]]
document = "TIFF 6.0"
title = "TIFF Revision 6.0 (Adobe)"
url = "https://www.itu.int/itudoc/itu-t/com16/tiff-fx/docs/tiff6.pdf"

[[format.fields]]
name = "byte order"
meaning = "'II' (little-endian) or 'MM' (big-endian)."

[[format.fields]]
name = "magic"
aliases = ["version"]
meaning = "42 for TIFF, 43 for BigTIFF."

[[format.fields]]
name = "IFD offset"
aliases = ["first IFD offset", "next IFD offset"]
meaning = "Offset of an image file directory from the start of the header; zero ends the chain."

[[format.fields]]
name = "ImageWidth"
aliases = ["ImageLength"]
meaning = "Tags 256 and 257: width and height in pixels."

[[format.fields]]
name = "BitsPerSample"
meaning = "Tag 258: bits per component."

[[format.fields]]
name = "Compression"
meaning = "Tag 259: 1 none, 2 CCITT Group 3 1-D, 5 LZW, 6 old JPEG, 7 JPEG, 8 Deflate, 32773 PackBits."

[[format.fields]]
name = "PhotometricInterpretation"
meaning = "Tag 262: 0 white is zero, 1 black is zero, 2 RGB, 3 palette, 4 mask, 5 CMYK, 6 YCbCr, 8 CIELab."

[[format.fields]]
name = "StripOffsets"
aliases = ["StripByteCounts", "TileOffsets", "TileByteCounts"]
