[[format]]
id = "registry-hive"
name = "Windows registry hive"
keys = ["Registry hive", "Windows registry hive", "regf", "win/registry-hive"]
summary = "The file behind a branch of the Windows registry (SYSTEM, SOFTWARE, SAM, NTUSER.DAT, UsrClass.dat, Amcache.hve): a base block and bins of cells holding keys, values and security descriptors."
organisation = """
The 4096-byte base block is little-endian: 'regf', primary and secondary sequence numbers (unequal when a write was interrupted, meaning the transaction logs hold newer data), the last written time (FILETIME), the format version (1.3 to 1.6), the file type (0 primary), the file format (1), the offset of the root key cell, the size of the hive bins data, a clustering factor, the hive's original path (UTF-16, partial), and at offset 508 an XOR checksum of the first 508 bytes.

Hive bins follow, each starting with 'hbin', its offset from the end of the base block and its size (a multiple of 4096). Bins hold cells: a 32-bit signed size (negative when the cell is allocated) and the cell data. All cell offsets are relative to the start of the first bin (file offset 4096).

Cell types are named by two-letter signatures: 'nk' key node (flags, last written time, parent, subkey and value counts, subkey list, value list, security cell, class name, name), 'vk' value (name, data size, data offset or inline data when the high bit of the size is set, data type), 'sk' security descriptor (shared and reference-counted), subkey lists 'lf', 'lh' (with name hashes), 'li' and 'ri', and 'db' for values over 16 KiB. Free cells often still hold deleted keys and values.
"""
group = "Windows artefacts"

[[format.specs]]
document = "Windows registry file format specification (M. Suhanov)"
title = "Windows registry file format specification"
url = "https://github.com/msuhanov/regf/blob/master/Windows%20registry%20file%20format%20specification.md"

[[format.fields]]
name = "signature"
meaning = "'regf' for the base block; 'hbin' for each hive bin."

[[format.fields]]
name = "primary sequence number"
aliases = ["secondary sequence number"]
meaning = "Incremented before and after a write; when they differ the hive is dirty and the .LOG1/.LOG2 files should be replayed."

[[format.fields]]
name = "last written timestamp"
meaning = "FILETIME of the last write to the hive."

[[format.fields]]
name = "major version"
aliases = ["minor version"]
meaning = "Format version 1.3 (Windows XP) to 1.6 (Windows 10)."

[[format.fields]]
name = "root cell offset"
meaning = "Offset of the root key node, relative to the first hive bin."

[[format.fields]]
name = "hive bins data size"
meaning = "Total size of the hive bins after the base block."

[[format.fields]]
name = "file name"
meaning = "Last part of the hive's path when it was loaded, in UTF-16."

[[format.fields]]
name = "checksum"
meaning = "XOR of the first 127 32-bit words of the base block."

[[format]]
id = "evtx"
name = "Windows XML event log (EVTX)"
keys = ["EVTX", "Windows event log", "Windows XML event log", "win/evtx-file", "win/evtx-chunk"]
summary = "The Windows event log file format since Vista: a file header and 64 KiB chunks of event records whose content is Binary XML built from shared templates."
organisation = """
The file header occupies the first 4096 bytes (128 used) and is little-endian: 'ElfFile' and a zero byte, the first and last chunk numbers, the next record identifier, the header size (128), minor and major version (1 or 2, and 3), the header block size (4096), the number of chunks, flags (0x1 dirty, 0x2 full) and a CRC-32 of the first 120 bytes.

Chunks of 65536 bytes follow. Each starts with 'ElfChnk' and a zero byte, the first and last event record numbers and identifiers, the header size (128), the offsets of the last record and of free space, a CRC-32 of the records and of the header, then tables of 64 string offsets and 32 template offsets covering the rest of the 512-byte chunk header. Records start at offset 512 within the chunk.

Each record starts with 2A 2A 00 00, its size, the record identifier and the write time (FILETIME), then a Binary XML fragment and a copy of the size. Binary XML is a token stream (fragment header, open element, attribute, value, template instance, substitution) in which a template defines the XML structure of an event once per chunk and each event supplies only its substitution values. Records survive in unused chunk space and in chunks the log has wrapped over, so carving for 2A 2A 00 00 recovers events from slack and memory.
"""
carries = ["xml"]
group = "Windows artefacts"

[[format.specs]]
document = "libevtx EVTX format documentation"
title = "Windows XML Event Log (EVTX) format (libevtx documentation)"
url = "https://github.com/libyal/libevtx/blob/main/documentation/Windows%20XML%20Event%20Log%20(EVTX).asciidoc"

