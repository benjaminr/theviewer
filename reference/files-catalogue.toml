[[format]]
id = "lnk"
name = "Windows shortcut (LNK)"
keys = ["LNK", "Windows shortcut", "Shell link", "win/lnk"]
summary = "A Windows shell link (.lnk): a fixed header with the target's timestamps and size, then optional structures giving its shell item path, volume, network share, arguments and tracking data."
organisation = """
The 76-byte ShellLinkHeader is little-endian: the header size (0x4C), the class id 00021401-0000-0000-C000-000000000046, link flags saying which optional structures follow, the target's file attributes, its creation, access and write times (FILETIME), its size, an icon index, the show command, and a hot key.

The optional structures follow in order. LinkTargetIDList is a size and a list of shell items (each a size and data, ending with a zero size) describing the target through the shell namespace. LinkInfo gives the volume (drive type, serial number, label), the local base path, and for network targets the share name and device. StringData holds counted strings for the name (description), relative path, working directory, command-line arguments and icon location, in UTF-16 when the IsUnicode flag is set.

ExtraData blocks follow, each a size and signature, ending with a block smaller than four bytes: environment variable paths (0xA0000001), console properties, the tracker block (0xA0000003, with the NetBIOS name of the machine and object ids whose node part is often a MAC address), special and known folder locations, a property store (0xA0000009) and shim data. Shortcuts are valuable evidence of files and volumes a user opened, and malicious ones hide long PowerShell command lines in the arguments.
"""
group = "Windows artefacts"

