aliases = ["magic"]
meaning = "ED AB EE DB at the start of the file."

[[format.fields]]
name = "type"
meaning = "0 binary package, 1 source package."

[[format.fields]]
name = "header magic"
meaning = "8E AD E8 01 at the start of the signature and main headers."

[[format.fields]]
name = "index entry"
aliases = ["tag"]
meaning = "Tag number, data type, offset into the data store and count."

[[format.fields]]
name = "RPMTAG_NAME"
aliases = ["RPMTAG_VERSION", "RPMTAG_RELEASE"]
meaning = "Tags 1000-1002: package name, version and release."

[[format.fields]]
name = "RPMTAG_PREIN"
aliases = ["RPMTAG_POSTIN", "RPMTAG_PREUN", "RPMTAG_POSTUN"]
meaning = "Tags 1023-1026: scripts run before and after installation and removal."

[[format.fields]]
