[[format]]
id = "7z"
name = "7z archive"
keys = ["7z", "7-Zip archive", "7-Zip archive signature", "7z archive", "application/x-7z-compressed"]
summary = "7-Zip's archive format: packed streams near the start and a header at the end describing the coders (LZMA, LZMA2, BCJ filters, AES) and the files."
organisation = """
The 32-byte signature header is little-endian: '7z' BC AF 27 1C, a format version (major 0, minor 2 to 4), a CRC-32 of the next 20 bytes, then the offset of the next header (counted from the end of the signature header), its size, and its CRC-32. The packed streams start right after the signature header, and the next header sits at the end of the archive.

The header is a tree of property ids, with numbers in a 7z variable-length encoding (the leading one bits of the first byte say how many bytes follow). Usually the header itself is compressed: kEncodedHeader (0x17) describes a packed stream that, when decoded, gives the real header (kHeader, 0x01). That holds MainStreamsInfo (pack info: positions and sizes of packed streams; unpack info: folders, each a chain of coders with their properties and bindings; substreams info: how each folder's output splits into files and their CRCs) and FilesInfo (names in UTF-16, empty-stream and empty-file flags, timestamps and attributes).

Coder ids include 00 copy, 03 01 01 LZMA, 21 LZMA2, 03 03 01 03 BCJ (x86), 03 03 01 1B BCJ2, 04 01 08 deflate, 04 02 02 bzip2, 03 04 01 PPMd and 06 F1 07 01 AES-256 with SHA-256 key derivation. If the header is encrypted (a header-encryption option), even the file names need the password.
"""
carries = ["lzma", "deflate", "bzip2"]
group = "Archives"

