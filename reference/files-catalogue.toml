[[format]]
id = "ogg"
name = "Ogg container"
keys = ["Ogg", "Ogg page", "Ogg bitstream", "Ogg container", "Ogg container signature", "media/ogg-page", "application/ogg", "audio/x-oggflac", "audio/x-oggpcm", "audio/speex", "video/daala", "video/x-dirac", "video/x-ogm", "video/x-ogguvs", "video/x-oggyuv", "video/x-oggrgb", "video/theora", "media/ogg-theora"]
summary = "Xiph.Org's streaming container: pages carrying packets of one or more logical streams (Vorbis, Opus, FLAC, Theora), each page independently checksummed."
organisation = """
An Ogg stream is a sequence of pages. Each page starts with 'OggS', a version byte (0), a header type byte (0x01 continued packet, 0x02 first page of a logical stream, 0x04 last page), a 64-bit granule position (a codec-defined time, such as the sample count, for the last packet completed on the page), the 32-bit serial number of the logical stream, a page sequence number, a CRC-32 and the number of segments, all little-endian.

The segment table follows: one lacing value per segment, each 0 to 255. A packet is the sum of consecutive lacing values up to and including the first value below 255, so a packet of exactly 510 bytes is 255, 255, 0, and a page ending in 255 continues its packet on the next page. Pages hold at most 255 segments, a little under 64 KiB.

The CRC uses the polynomial 0x04C11DB7 without bit reflection, computed over the whole page with the CRC field set to zero. Several logical streams can be interleaved page by page (multiplexing, as in video with audio), and streams can be chained one after another; the first packet of each logical stream (on its 'beginning of stream' page) identifies the codec.
"""
carries = ["opus", "vorbis", "flac"]
group = "Audio"

