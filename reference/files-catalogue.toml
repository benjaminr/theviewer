meaning = "'LUKS' BA BE for the primary header; 'SKUL' BA BE for the LUKS2 secondary header."

[[format.fields]]
name = "version"
meaning = "1 or 2, big-endian."

[[format.fields]]
name = "cipher-name"
aliases = ["cipher-mode"]
meaning = "LUKS1 cipher and mode strings, such as 'aes' and 'xts-plain64'."

[[format.fields]]
name = "hash-spec"
meaning = "LUKS1 hash used by PBKDF2 and the anti-forensic splitter, such as 'sha256'."

[[format.fields]]
name = "payload-offset"
