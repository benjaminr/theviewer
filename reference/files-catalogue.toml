[[format]]
id = "riff"
name = "RIFF container"
keys = ["RIFF", "RIFF container", "RIFF container (WAV, AVI, WebP) signature", "Resource Interchange File Format", "media/riff"]
summary = "Microsoft and IBM's generic chunked container: a tree of four-character-coded chunks, the basis of WAV, AVI, WebP, animated cursors and more."
organisation = """
A RIFF file is one chunk: 'RIFF', a 32-bit little-endian size (everything after the size field, so the file length minus 8), and a four-character form type such as 'WAVE', 'AVI ', 'WEBP', 'ACON' (animated cursor), 'RMID' (MIDI) or 'CDXA' (Video CD). The rest of the file is a sequence of chunks.

Every chunk is a four-character id, a 32-bit size counting only the data, and the data, followed by a pad byte if the size is odd so the next chunk starts on an even offset. A 'LIST' chunk holds a four-character list type and then subchunks, which builds the tree; 'LIST' 'INFO' carries text metadata such as INAM (title), IART (artist), ICMT (comment), ICRD (date) and ISFT (software).

The 32-bit sizes limit files to 4 GiB. RF64 and BW64 replace 'RIFF' with their own id, set the size to FFFFFFFF and put 64-bit sizes in a 'ds64' chunk; AVI instead chains extra 'RIFF' 'AVIX' chunks. 'RIFX' marks the rare big-endian variant.
"""
carries = ["wav", "avi", "webp"]
group = "Audio"

