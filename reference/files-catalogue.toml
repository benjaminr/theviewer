meaning = "Volume label in UTF-16."

[[format]]
id = "romfs"
name = "romfs"
keys = ["romfs", "ROM filesystem", "fs/romfs"]
summary = "A minimal read-only Linux filesystem for boot media and embedded systems: a linked list of 16-byte-aligned file headers with no compression."
organisation = """
The image starts with '-rom1fs-', the full size of the filesystem (32-bit big-endian), a checksum making the first 512 bytes sum to zero as 32-bit words, and the zero-terminated volume name padded to 16 bytes.

File headers follow, each aligned to 16 bytes: a word holding the offset of the next header with the file type and executable bit in its low four bits, a type-specific word (the first entry of a directory, the target of a hard link, or device numbers), the size, a checksum of the header and name, then the zero-terminated name padded to 16 bytes, and the file data.

Types are hard link, directory, regular file, symbolic link, block and character device, socket and FIFO. Everything is stored uncompressed and big-endian, so strings and file contents can be read directly.
"""
group = "Disks and filesystems"

[[format.specs]]
document = "Linux romfs documentation"
title = "ROMFS - ROM File System (Linux kernel documentation)"
url = "https://www.kernel.org/doc/html/latest/filesystems/romfs.html"

[[format.fields]]
name = "full size"
meaning = "Size of the filesystem in bytes."

[[format.fields]]
name = "checksum"
meaning = "Makes the first 512 bytes (or the header and name of a file) sum to zero as big-endian 32-bit words."

[[format.fields]]
name = "volume name"
meaning = "Zero-terminated name padded to a 16-byte boundary."

[[format.fields]]
name = "next header"
meaning = "Offset of the next file header in the same directory; the low four bits hold the type and executable flag."

[[format]]
id = "luks"
name = "LUKS encrypted volume"
keys = ["LUKS", "LUKS1", "LUKS2", "fs/luks"]
summary = "The Linux Unified Key Setup header for dm-crypt disk encryption: key slots that each wrap the volume key under a passphrase, followed by the encrypted data."
organisation = """
Both versions start with 'LUKS' BA BE and a 16-bit big-endian version. A LUKS1 header (592 bytes) then gives the cipher name and mode (such as 'aes' and 'xts-plain64'), the hash for PBKDF2, the payload offset in 512-byte sectors, the volume key length, a digest of the volume key with its salt and iteration count, the UUID as text, and eight key slots. Each slot is active (0x00AC71F3) or disabled (0x0000DEAD) and gives a PBKDF2 iteration count, a salt, the sector of its key material and the anti-forensic stripe count (4000).

LUKS2 has a 4096-byte binary header with a header size, sequence number, label, checksum algorithm, salt, UUID, subsystem label, its own offset and a SHA-256 checksum, followed by a JSON area describing keyslots (with Argon2 or PBKDF2 parameters), segments, digests, tokens and configuration. A second copy of the binary header and JSON follows at the header size, with the magic 'SKUL' BA BE.

Key material is stored split across many stripes with an anti-forensic splitter, so destroying a small part destroys the slot. The encrypted data starts at the payload or segment offset and looks random; the header itself reveals the cipher, KDF settings and UUID but not the key.
"""
group = "Disks and filesystems"

[[format.specs]]
document = "LUKS2 on-disk format"
title = "LUKS2 On-Disk Format Specification"
url = "https://gitlab.com/cryptsetup/LUKS2-docs"

[[format.specs]]
document = "LUKS1 on-disk format"
title = "LUKS1 On-Disk Format Specification"
url = "https://gitlab.com/cryptsetup/cryptsetup/-/wikis/LUKS-standard/on-disk-format.pdf"

[[format.fields]]
