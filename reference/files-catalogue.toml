[[format]]
id = "opus"
name = "Opus audio in Ogg"
keys = ["Opus", "Ogg Opus", "media/ogg-opus", "audio/opus"]
summary = "The Opus speech and music codec carried in Ogg: an identification header, a comment header, then audio packets timed at 48 kHz."
organisation = """
The first packet of the logical stream, alone on its page, is the identification header: 'OpusHead', a version byte (1), the output channel count, a 16-bit pre-skip (samples to discard at the start, at 48 kHz), the original input sample rate (informational only), a 16-bit output gain in Q7.8 dB, and the channel mapping family, followed for families other than 0 by the stream count, coupled stream count and a channel mapping table. All multi-byte values are little-endian.

The second packet is the comment header: 'OpusTags', a length-prefixed vendor string and a list of length-prefixed UTF-8 'NAME=value' comments (TITLE, ARTIST, R128_TRACK_GAIN, METADATA_BLOCK_PICTURE for cover art).

Audio packets follow, each an Opus packet whose first byte (the TOC) gives the mode (SILK, CELT or hybrid), bandwidth, frame duration and frame count. Granule positions count 48 kHz samples including the pre-skip, whatever the input rate was.
"""
carries = ["ogg"]
group = "Audio"

