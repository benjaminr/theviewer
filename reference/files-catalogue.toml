[[format]]
id = "flac"
name = "Free Lossless Audio Codec (FLAC)"
keys = ["FLAC", "FLAC audio", "FLAC audio signature", "media/flac", "audio/x-flac"]
summary = "Lossless compressed audio: 'fLaC', metadata blocks (stream information, seek table, tags, pictures), then frames of linear-predicted, Rice-coded samples."
organisation = """
A native FLAC file starts with 'fLaC' and a series of metadata blocks. Each block has a 4-byte header: a last-block flag in the top bit, a 7-bit type (0 STREAMINFO, 1 PADDING, 2 APPLICATION, 3 SEEKTABLE, 4 VORBIS_COMMENT, 5 CUESHEET, 6 PICTURE) and a 24-bit big-endian length. STREAMINFO must come first.

STREAMINFO is 34 bytes of bit fields: minimum and maximum block size (16 bits each), minimum and maximum frame size (24 bits each), sample rate (20 bits), channels minus one (3), bits per sample minus one (5), total samples (36) and the MD5 of the decoded audio (128). Tags use the Vorbis comment layout (little-endian lengths, unlike the rest of FLAC), and PICTURE blocks carry embedded cover art with a MIME type, description and dimensions.

Audio frames follow, each starting with a 14-bit sync code (FF F8 for fixed block size, FF F9 for variable), then fields for block size, sample rate, channel assignment (including left/side, right/side and mid/side), sample size, the frame or sample number in a UTF-8-like code, and a CRC-8. Each channel's subframe is constant, verbatim, fixed-predictor or LPC with Rice-coded residuals, and the frame ends with a CRC-16. FLAC also appears in Ogg, Matroska and MP4.
"""
carries = ["png", "jpeg"]
group = "Audio"

