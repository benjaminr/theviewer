[[format]]
id = "sfnt"
name = "TrueType and OpenType font"
keys = ["OpenType", "TrueType", "OpenType font", "TrueType font", "TrueType collection", "TTF", "OTF", "TTC", "font/ttf", "font/otf", "font/ttc", "application/x-font-ttf", "application/x-font-otf"]
summary = "The 'sfnt' font format of TrueType and OpenType: a table directory pointing to tagged tables for glyph outlines, character maps, metrics and names."
organisation = """
A font starts with a 12-byte offset table: the sfnt version (00 01 00 00 for TrueType outlines, 'OTTO' for CFF outlines, 'true' for older Apple fonts), the number of tables, and search range, entry selector and range shift values for binary search. Then come 16-byte table records sorted by tag: the tag, a checksum, the offset from the start of the file and the length. Tables are 4-byte aligned and big-endian.

Required tables are 'cmap' (character to glyph mapping), 'head' (units per em, dates, bounding box, the magic 0x5F0F3CF5 and a checksum adjustment that makes the whole font sum to 0xB1B0AFBA), 'hhea' and 'hmtx' (horizontal metrics), 'maxp', 'name', 'OS/2' and 'post'. TrueType outlines are in 'glyf' with 'loca' offsets; CFF outlines in 'CFF ' or 'CFF2'. Layout tables (GSUB, GPOS, GDEF), hinting programs (fpgm, prep, cvt) and colour tables (COLR, CPAL, sbix, CBDT, SVG) may follow, along with 'DSIG' signatures.

A collection (.ttc) starts with 'ttcf', a version, the number of fonts and an offset to each font's offset table; fonts share tables by pointing at the same offsets. The 'name' table records family, style, version, copyright, the manufacturer and the unique font name, useful for attributing embedded fonts.
"""
group = "Fonts"

[[format.specs]]
document = "OpenType specification: font file"
title = "OpenType Specification: The OpenType Font File (Microsoft Typography)"
url = "https://learn.microsoft.com/en-us/typography/opentype/spec/otff"

[[format.fields]]
name = "sfntVersion"
meaning = "00 01 00 00 for TrueType outlines, 'OTTO' for CFF outlines, 'true' for Apple TrueType."

[[format.fields]]
name = "numTables"
meaning = "Number of table records."

[[format.fields]]
name = "searchRange"
aliases = ["entrySelector", "rangeShift"]
meaning = "Values derived from the table count to speed binary search."

[[format.fields]]
name = "table record"
aliases = ["tableTag", "checksum", "offset", "length"]
meaning = "Tag, checksum, file offset and length of one table."

[[format.fields]]
name = "head"
meaning = "Font header: revision, checksum adjustment, magic 0x5F0F3CF5, units per em, created and modified dates (seconds since 1904), bounding box."

[[format.fields]]
name = "name"
meaning = "Naming table: family, subfamily, unique id, full name, version, PostScript name, copyright, manufacturer and more."

[[format.fields]]
name = "ttcTag"
meaning = "'ttcf' at the start of a font collection."

[[format]]
id = "woff"
name = "Web Open Font Format 1.0 (WOFF)"
keys = ["WOFF", "WOFF font", "font/woff"]
summary = "A web font wrapper around an sfnt font: the same tables, each compressed with zlib, plus optional XML metadata and private data."
organisation = """
The 44-byte header is big-endian: 'wOFF', the flavour (the sfnt version of the wrapped font, 00 01 00 00 or 'OTTO'), the WOFF file length, the number of tables, a reserved zero, the total size of the reconstructed sfnt, a major and minor version for the font, and the offset, compressed length and original length of the metadata block and the offset and length of the private data block.

A table directory follows with 20-byte entries: tag, offset in the WOFF file, compressed length, original length and the original checksum. When the compressed length is smaller than the original, the table is a zlib stream; when equal, it is stored as is. Tables are 4-byte aligned.

The optional metadata is zlib-compressed XML describing the vendor, licence, credits and description. Decompressing the tables and writing a new offset table rebuilds the original TrueType or OpenType font.
"""
carries = ["zlib", "sfnt", "xml"]
group = "Fonts"

[[format.specs]]
document = "W3C WOFF 1.0"
title = "WOFF File Format 1.0 (W3C Recommendation)"
url = "https://www.w3.org/TR/WOFF/"

[[format.fields]]
name = "signature"
meaning = "'wOFF'."

[[format.fields]]
name = "flavor"
meaning = "sfnt version of the font inside: 00 01 00 00 (TrueType) or 'OTTO' (CFF)."

[[format.fields]]
name = "length"
meaning = "Size of the WOFF file."

[[format.fields]]
name = "numTables"
meaning = "Number of font tables."

[[format.fields]]
name = "totalSfntSize"
meaning = "Size of the uncompressed font the file decodes to."

[[format.fields]]
name = "metaOffset"
aliases = ["metaLength", "metaOrigLength", "privOffset", "privLength"]
meaning = "Location and sizes of the compressed XML metadata and the private data block."

[[format]]
id = "woff2"
name = "Web Open Font Format 2.0 (WOFF2)"
keys = ["WOFF2", "WOFF2 font", "font/woff2"]
summary = "The second web font wrapper: all sfnt tables compressed together with Brotli, with glyf and loca tables transformed to shrink further."
organisation = """
The 48-byte header is big-endian: 'wOF2', the flavour (sfnt version, or 'ttcf' for a collection), the file length, the number of tables, a reserved zero, the total sfnt size, the total compressed size, the font's major and minor version, and the metadata and private block offsets and lengths.

The table directory is compact: each entry is a flags byte whose low six bits index a list of 63 well-known tags (63 means a four-byte tag follows) and whose top two bits select a transform, then the original length and, for transformed tables, the transformed length, both in the variable-length UIntBase128 encoding. No offsets are stored; tables follow each other in the decompressed stream.

All table data is one Brotli stream. The 'glyf' and 'loca' tables are normally transformed into separate streams of contours, points, flags and bounding boxes, and 'hmtx' may be transformed too, so decoding requires rebuilding them. Collections add a directory listing each font's table indexes.
"""
carries = ["sfnt", "xml"]
group = "Fonts"

[[format.specs]]
document = "W3C WOFF2"
title = "WOFF File Format 2.0 (W3C Recommendation)"
url = "https://www.w3.org/TR/WOFF2/"

[[format.fields]]
name = "signature"
meaning = "'wOF2'."

[[format.fields]]
name = "flavor"
meaning = "sfnt version of the font inside, or 'ttcf' for a collection."

[[format.fields]]
name = "numTables"
meaning = "Number of entries in the table directory."

[[format.fields]]
name = "totalSfntSize"
meaning = "Size of the reconstructed font."

[[format.fields]]
name = "totalCompressedSize"
meaning = "Length of the Brotli stream holding all table data."

[[format.fields]]
name = "flags"
meaning = "Per-table byte: known tag index (0-62, or 63 for an explicit tag) and transform version."

