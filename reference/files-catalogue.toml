A WebP file is a RIFF file: 'RIFF', a 32-bit little-endian size (file size minus 8) and the form type 'WEBP', then chunks of a four-character code, a 32-bit size and the data, padded to an even length.

The simple lossy form has one 'VP8 ' chunk holding a VP8 key frame; the simple lossless form has one 'VP8L' chunk, which starts with the signature byte 0x2F and packs width − 1 and height − 1 into 14 bits each. The extended form starts with 'VP8X', whose flags announce an ICC profile, alpha, Exif, XMP and animation, followed by the canvas width and height minus one as 24-bit values.

Extended files then carry 'ICCP', 'ANIM' (background colour and loop count) with 'ANMF' frames (offset, size, duration, blending and disposal, then the frame's own image chunks), 'ALPH' (alpha plane, possibly compressed with the lossless coder), the image chunk, and 'EXIF' and 'XMP ' metadata at the end.
"""
