meaning = "First, stored (uncompressed) entry holding the document's MIME type."

[[format.fields]]
name = "META-INF/manifest.xml"
meaning = "List of the package's files with their media types and encryption details."

[[format.fields]]
name = "content.xml"
meaning = "The document content."

[[format.fields]]
name = "meta.xml"
meaning = "Metadata: generator application, initial creator, creator, creation and modification dates, editing time and statistics."

[[format]]
id = "epub"
name = "EPUB electronic publication"
keys = ["EPUB", "EPUB e-book", "application/epub+zip"]
summary = "The standard e-book format: a ZIP container of XHTML, CSS, images and fonts, described by a package document."
organisation = """
The container (OCF) is a ZIP whose first entry is an uncompressed 'mimetype' file containing 'application/epub+zip', so those bytes appear at offset 38 after the name at offset 30. 'META-INF/container.xml' gives the path of the package document (an .opf file).

The package document lists metadata (title, identifier, language, creator, modification date), the manifest of every resource with its media type, the spine giving the reading order, and the navigation document. Content documents are XHTML (or SVG) with CSS, images, audio, video and fonts.

Optional files in META-INF include 'encryption.xml' (used for font obfuscation and DRM), 'signatures.xml', 'rights.xml' and 'metadata.xml'. Content can contain scripts in reading systems that allow them.
"""
