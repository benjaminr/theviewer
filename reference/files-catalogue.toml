[[format]]
id = "f2fs"
name = "F2FS"
keys = ["F2FS", "Flash-Friendly File System", "fs/f2fs"]
summary = "Samsung's log-structured Linux filesystem for flash storage, common on Android data partitions."
organisation = """
Two copies of the superblock sit at offset 1024 of the first two 4 KiB blocks. It is little-endian, starts with the magic 0xF2F52010 (bytes 10 20 F5 F2), and gives the version, the sector, block and segment sizes as logarithms, segments per section and sections per zone, a checksum offset, the block count and the counts and start addresses of the checkpoint, segment information table (SIT), node address table (NAT), segment summary area (SSA) and main area, the root inode, the UUID and a UTF-16 volume name.

The main area is divided into 2 MiB segments written sequentially as logs (hot, warm and cold, for node and data blocks separately). The NAT maps node ids to block addresses, so updating a file's data does not ripple up a tree; the SIT records valid block counts per segment for cleaning, and two alternating checkpoint packs record a consistent state.

Like other log-structured systems, invalid but unerased blocks may still hold older file contents. Android often enables file-based encryption on F2FS, so file names and contents may be encrypted.
"""
group = "Disks and filesystems"

[[format.specs]]
document = "Linux F2FS documentation"
title = "WHAT IS Flash-Friendly File System (F2FS)? (Linux kernel documentation)"
url = "https://www.kernel.org/doc/html/latest/filesystems/f2fs.html"

[[format.fields]]
