[[format]]
id = "avi"
name = "Audio Video Interleave (AVI)"
keys = ["AVI", "Audio Video Interleave", "media/avi", "video/x-msvideo"]
summary = "Microsoft's RIFF-based video container: stream headers in an 'hdrl' list, interleaved audio and video chunks in a 'movi' list and an index."
organisation = """
The file is a RIFF chunk of form type 'AVI '. The first list, 'LIST' 'hdrl', holds the main header 'avih' (microseconds per frame, maximum data rate, flags such as 'has index' and 'interleaved', total frames, stream count, suggested buffer size, width and height) and one 'LIST' 'strl' per stream.

Each 'strl' holds a stream header 'strh' (type 'vids', 'auds', 'txts' or 'mids', the codec FourCC such as 'H264', 'XVID' or 'MJPG', the time scale and rate, start and length), a stream format 'strf' (a BITMAPINFOHEADER for video or a WAVEFORMATEX for audio), and optionally 'strn' (stream name) and an OpenDML 'indx' super index.

The data is in 'LIST' 'movi' as chunks named by stream number and type: '00dc' (compressed video), '00db' (uncompressed video), '01wb' (audio), '##pc' (palette change), possibly grouped in 'rec ' lists. The legacy 'idx1' chunk after 'movi' lists every chunk with flags (key frame) and an offset relative to 'movi'. Files over 1 GB use OpenDML: extra 'RIFF' 'AVIX' chunks continue the movie, and 'ix##' standard indexes replace 'idx1'.
"""
carries = ["riff", "h264", "mpeg-audio", "pcm", "jpeg"]
group = "Video and containers"

[[format.specs]]
document = "AVI RIFF File Reference"
title = "AVI RIFF File Reference (Microsoft Learn)"
url = "https://learn.microsoft.com/en-us/windows/win32/directshow/avi-riff-file-reference"

[[format.fields]]
name = "avih"
aliases = ["main header"]
meaning = "Main AVI header: frame period in microseconds, flags, total frames, stream count, width and height."

[[format.fields]]
name = "strh"
aliases = ["stream header"]
meaning = "Stream type, codec FourCC, rate and scale (rate ÷ scale = frames or samples per second) and length."

[[format.fields]]
name = "strf"
aliases = ["stream format"]
meaning = "BITMAPINFOHEADER for video or WAVEFORMATEX for audio."

[[format.fields]]
name = "movi"
meaning = "List of the data chunks (00dc, 01wb and so on)."

[[format.fields]]
name = "idx1"
meaning = "Legacy index: chunk id, flags (0x10 key frame), offset from 'movi' and size for every chunk."

[[format]]
id = "isobmff"
name = "ISO base media file (MP4, MOV, 3GP)"
keys = ["MP4", "ISO base media file", "ISOBMFF", "QuickTime", "MOV", "M4A", "3GP", "media/mp4", "media/m4a", "media/quicktime", "video/mp4", "audio/mp4", "video/quicktime", "video/x-m4v", "video/3gpp", "video/3gpp2"]
summary = "The box-structured container of MP4, M4A, MOV, 3GP and many others: a tree of length-prefixed boxes ('atoms' in QuickTime) with movie metadata in 'moov' and media in 'mdat'."
organisation = """
Everything is a box: a 32-bit big-endian size, a four-character type and the content. A size of 1 means a 64-bit size follows the type, and 0 means the box runs to the end of the file; type 'uuid' adds a 16-byte extended type. Many boxes are 'full boxes' with a version byte and 24 bits of flags first, where version 1 usually widens times and durations to 64 bits. Times count seconds since 1 January 1904 UTC.

The file usually starts with 'ftyp': a major brand, a minor version and a list of compatible brands ('isom', 'mp41', 'mp42', 'avc1', 'M4A ', 'M4V ', 'qt  ', '3gp4' to '3gp6', 'dash'). QuickTime files may lack 'ftyp' and start with 'moov', 'mdat', 'wide' or 'free'. The 'moov' box holds 'mvhd' (time scale, duration, creation and modification times) and a 'trak' per track: 'tkhd' (track id, dimensions), 'mdia' with 'mdhd' (track time scale, language), 'hdlr' (handler 'vide', 'soun', 'text', 'meta') and 'minf' 'stbl', the sample table.

The sample table maps samples to bytes: 'stsd' (codec descriptions such as 'avc1' with 'avcC', 'hvc1' with 'hvcC', 'mp4a' with 'esds'), 'stts' (durations), 'stss' (sync samples), 'stsc' (samples per chunk), 'stsz' (sample sizes) and 'stco' or 'co64' (chunk offsets into 'mdat'). Fragmented MP4 (DASH, HLS, recordings) instead has an empty sample table and a series of 'moof' and 'mdat' pairs. Metadata lives in 'udta', iTunes-style 'meta' 'ilst', and camera-specific boxes; location ('©xyz') and creation dates are common evidence.
"""
carries = ["h264", "h265", "mpeg-audio", "jpeg"]
group = "Video and containers"

[[format.specs]]
document = "ISO/IEC 14496-12"
title = "ISO/IEC 14496-12:2026 Information technology - Coding of audio-visual objects - Part 12: ISO base media file format"
