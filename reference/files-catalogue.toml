[[format]]
id = "pem"
name = "PEM textual encoding"
keys = ["PEM", "PEM block", "crypto/pem", "application/x-x509-cert;format=pem", "application/x-x509-key;format=pem"]
summary = "Base64-encoded DER between '-----BEGIN label-----' and '-----END label-----' lines: the usual text form of certificates, keys and certificate requests."
organisation = """
A PEM block is an encapsulation boundary line '-----BEGIN ' + label + '-----', base64 text (normally 64 characters per line), and a matching '-----END ' line. Decoding the base64 gives a DER structure whose type the label names. Files often hold several blocks, such as a certificate chain, with text between them ignored.

Standard labels include CERTIFICATE (X.509), X509 CRL, CERTIFICATE REQUEST (PKCS #10), PKCS7 and CMS, PRIVATE KEY (PKCS #8, unencrypted), ENCRYPTED PRIVATE KEY (PKCS #8 with password-based encryption), ATTRIBUTE CERTIFICATE and PUBLIC KEY (SubjectPublicKeyInfo).

Widely used non-standard labels come from OpenSSL and others: RSA PRIVATE KEY (PKCS #1) and EC PRIVATE KEY (SEC 1), which may carry 'Proc-Type: 4,ENCRYPTED' and 'DEK-Info' header lines when password-protected; DSA PRIVATE KEY; OPENSSH PRIVATE KEY; and PGP armour, which looks similar but is a different format. A private key block in a file is usually the most important thing to report.
"""
carries = ["x509", "der", "openssh-private-key", "cms", "pkcs12"]
group = "Certificates and keys"

[[format.specs]]
document = "RFC 7468"
title = "Textual Encodings of PKIX, PKCS, and CMS Structures"
url = "https://www.rfc-editor.org/rfc/rfc7468"
rfc = 7468
section = "2"

[[format.fields]]
name = "label"
meaning = "Text after BEGIN naming the content: CERTIFICATE, PRIVATE KEY, ENCRYPTED PRIVATE KEY, PUBLIC KEY, CERTIFICATE REQUEST, X509 CRL, PKCS7, CMS, or non-standard labels such as RSA PRIVATE KEY."
section = "4"

[[format.fields]]
name = "CERTIFICATE"
meaning = "An X.509 certificate in DER."
section = "5"

[[format.fields]]
name = "PRIVATE KEY"
meaning = "A PKCS #8 OneAsymmetricKey (unencrypted private key with its algorithm)."
section = "10"

[[format.fields]]
name = "ENCRYPTED PRIVATE KEY"
meaning = "A PKCS #8 EncryptedPrivateKeyInfo: the key encrypted under a password-based scheme such as PBES2."
section = "11"

[[format.fields]]
name = "PUBLIC KEY"
meaning = "A SubjectPublicKeyInfo: algorithm identifier and public key."
section = "13"

[[format]]
id = "openssh-private-key"
name = "OpenSSH private key"
keys = ["OpenSSH private key", "OPENSSH PRIVATE KEY", "crypto/openssh-private-key"]
summary = "OpenSSH's own private key container, written by ssh-keygen since 2014: public keys in the clear, private keys optionally encrypted with a bcrypt-derived key."
organisation = """
The file on disk is PEM-style text with the label OPENSSH PRIVATE KEY; decoding the base64 gives the binary structure, which starts with 'openssh-key-v1' and a zero byte. All fields after that use SSH wire encoding: 32-bit big-endian lengths before strings, and 32-bit integers.

The fields are the cipher name ('none' or for example 'aes256-ctr'), the KDF name ('none' or 'bcrypt'), KDF options (for bcrypt, a salt and a round count), the number of keys (normally 1), each public key in SSH wire format, and a string holding the private section.

The private section, encrypted when the cipher is not 'none', starts with two copies of a random 32-bit check value (they match only if decryption worked), then each private key (key type and its parameters) followed by a comment, and padding bytes 1, 2, 3 and so on up to the cipher block size. The public key and its comment can be read without the passphrase.
"""
group = "Certificates and keys"

[[format.specs]]
document = "OpenSSH PROTOCOL.key"
title = "OpenSSH private key format (PROTOCOL.key)"
url = "https://github.com/openssh/openssh-portable/blob/master/PROTOCOL.key"

[[format.fields]]
name = "AUTH_MAGIC"
aliases = ["magic"]
meaning = "'openssh-key-v1' followed by a zero byte."

[[format.fields]]
name = "ciphername"
meaning = "Cipher protecting the private section; 'none' means unencrypted."

[[format.fields]]
name = "kdfname"
meaning = "Key derivation function: 'none' or 'bcrypt'."

[[format.fields]]
name = "kdfoptions"
meaning = "For bcrypt, the salt and number of rounds."

[[format.fields]]
name = "number of keys"
meaning = "Number of key pairs in the file, normally 1."

[[format.fields]]
name = "checkint"
meaning = "Two copies of a random value at the start of the private section; equal values confirm a correct passphrase."

[[format]]
id = "ssh-public-key"
name = "SSH public key"
keys = ["SSH public key", "OpenSSH public key", "authorized_keys entry", "crypto/ssh-public-key"]
summary = "The one-line public key format of OpenSSH (id_*.pub, authorized_keys, known_hosts): a key type, the key in base64 and a comment."
organisation = """
A line holds the algorithm name (ssh-rsa, ssh-ed25519, ecdsa-sha2-nistp256, sk-ssh-ed25519@openssh.com and so on), a space, the base64-encoded key blob and an optional comment such as user@host. In authorized_keys the line may be preceded by options (from=, command=, no-pty), and known_hosts lines start with host names or hashed names.

The decoded blob uses SSH wire encoding: a 32-bit length and the algorithm name again, then the key parameters. For RSA these are the public exponent e and modulus n as multiple-precision integers; for Ed25519 a single 32-byte string; for ECDSA the curve name and an encoded point. The SHA-256 of the blob, base64-encoded, is the fingerprint ssh-keygen -l shows.

A different, multi-line form ('---- BEGIN SSH2 PUBLIC KEY ----' with header lines) is used by some other SSH implementations; its body is the same blob.
"""
group = "Certificates and keys"

[[format.specs]]
document = "RFC 4253"
title = "The Secure Shell (SSH) Transport Layer Protocol"
url = "https://www.rfc-editor.org/rfc/rfc4253"
rfc = 4253
section = "6.6"

[[format.specs]]
document = "RFC 4716"
title = "The Secure Shell (SSH) Public Key File Format"
url = "https://www.rfc-editor.org/rfc/rfc4716"
rfc = 4716
section = "3"

[[format.fields]]
name = "key type"
meaning = "Algorithm name such as ssh-ed25519 or ssh-rsa; repeated as the first string inside the blob."
section = "6.6"

[[format.fields]]
name = "key blob"
meaning = "Base64 of the public key in SSH wire format."
section = "6.6"

[[format.fields]]
name = "comment"
meaning = "Free text, by default the user and host that generated the key."

[[format]]
id = "openpgp"
name = "OpenPGP message or key"
keys = ["OpenPGP", "PGP", "OpenPGP packet", "PGP public key", "crypto/pgp-public-key-packet", "application/pgp-encrypted"]
summary = "The packet format of PGP and GnuPG for keys, signatures and encrypted messages, in binary or base64 'armour'."
organisation = """
Everything is a sequence of packets. The first byte of each has its top bit set; bit 6 chooses between the current format (packet type in the low six bits, then a 1-, 2- or 5-byte length or partial lengths for streaming) and the legacy format (type in bits 5-2, and a length type in bits 1-0 for 1-, 2- or 4-byte lengths or 'indeterminate'). So 0x99 is a legacy public key packet with a 2-byte length and 0x85 a legacy public-key encrypted session key packet.

Packet types include 1 public-key encrypted session key, 2 signature, 3 symmetric-key encrypted session key, 4 one-pass signature, 5 secret key, 6 public key, 7 secret subkey, 8 compressed data, 9 symmetrically encrypted data, 10 marker, 11 literal data, 13 user id, 14 public subkey, 17 user attribute, 18 symmetrically encrypted and integrity protected data, and 21 padding. A transferable public key is a public key packet, signatures, user ids with certifications, and subkeys with binding signatures.

Key packets start with a version (4, or 6 in RFC 9580), a 4-byte creation time and an algorithm id (1 RSA, 17 DSA, 18 ECDH, 19 ECDSA, 22 EdDSA legacy, 25-28 X25519, X448, Ed25519, Ed448), then the key material; the version 4 fingerprint is a SHA-1 over 0x99, a 2-byte length and the key packet body. ASCII armour wraps packets in '-----BEGIN PGP PUBLIC KEY BLOCK-----' (or MESSAGE, SIGNATURE, PRIVATE KEY BLOCK) with optional headers and a CRC-24 line.
"""
carries = ["zlib", "deflate", "bzip2"]
group = "Certificates and keys"

[[format.specs]]
document = "RFC 9580"
title = "OpenPGP"
url = "https://www.rfc-editor.org/rfc/rfc9580"
rfc = 9580
section = "4.2"

[[format.fields]]
name = "packet tag"
aliases = ["packet header"]
meaning = "First byte of a packet: always-one top bit, a format bit, and the packet type (with the length type in legacy format)."
section = "4.2"

[[format.fields]]
name = "packet type"
meaning = "1 PKESK, 2 signature, 3 SKESK, 4 one-pass signature, 5 secret key, 6 public key, 7 secret subkey, 8 compressed data, 11 literal data, 13 user id, 14 public subkey, 18 SEIPD."
section = "5"

[[format.fields]]
name = "version"
meaning = "Key or signature packet version: 4 is most common, 6 is the newest, 3 is obsolete."
section = "5.5.2"

[[format.fields]]
name = "creation time"
meaning = "Seconds since 1970 UTC when the key was created; part of the fingerprint."
section = "5.5.2"

[[format.fields]]
name = "public-key algorithm"
meaning = "Algorithm id: 1 RSA, 17 DSA, 18 ECDH, 19 ECDSA, 22 EdDSALegacy, 25 X25519, 26 X448, 27 Ed25519, 28 Ed448."
section = "9.1"

[[format.fields]]
name = "fingerprint"
meaning = "Hash identifying a key: SHA-1 over the key packet for version 4, SHA-256 for version 6; the key id is its low 64 bits (v4)."
section = "5.5.4"

[[format]]
id = "pkcs12"
name = "PKCS #12 (PFX) key store"
keys = ["PKCS #12", "PKCS12", "PFX", ".p12", "application/x-pkcs12"]
summary = "The password-protected bundle of private keys and certificates used by Windows (.pfx), browsers and Java (.p12): nested ASN.1 'bags' with a MAC over the contents."
organisation = """
A PFX is a DER (sometimes BER) SEQUENCE of a version (3), authSafe and optional macData. authSafe is a PKCS #7 ContentInfo, usually of type data, whose octet string contents are an AuthenticatedSafe: a SEQUENCE of further ContentInfos, each either plain data or encryptedData encrypted under a password-based scheme.

Each of those contents is a SafeContents: a SEQUENCE of SafeBags, each with a bag type OID, a value and optional attributes (friendlyName, localKeyId linking a key to its certificate). Bag types are keyBag (plain PKCS #8 key), pkcs8ShroudedKeyBag (encrypted PKCS #8 key), certBag (usually an X.509 certificate), crlBag, secretBag and safeContentsBag (nesting).

macData holds an HMAC over the authSafe contents, its digest algorithm, a salt and an iteration count, keyed from the password (PBMAC1 is a newer option). Typical files have certificates encrypted with an older or a PBES2/AES scheme and keys in shrouded bags; with the password, every certificate and key can be extracted.
"""
carries = ["der", "x509", "cms"]
group = "Certificates and keys"

[[format.specs]]
document = "RFC 7292"
title = "PKCS #12: Personal Information Exchange Syntax v1.1"
url = "https://www.rfc-editor.org/rfc/rfc7292"
rfc = 7292
section = "4"

[[format.fields]]
name = "version"
meaning = "Always 3."
section = "4"

[[format.fields]]
name = "authSafe"
meaning = "ContentInfo holding the AuthenticatedSafe, the sequence of (possibly encrypted) SafeContents."
section = "4.1"

[[format.fields]]
name = "macData"
meaning = "MAC over the authSafe with its digest algorithm, salt and iteration count, for password integrity mode."
section = "4"

[[format.fields]]
name = "SafeBag"
aliases = ["bagId"]
meaning = "One item: a key, shrouded key, certificate, CRL, secret or nested SafeContents, with attributes."
section = "4.2"

[[format.fields]]
name = "friendlyName"
aliases = ["localKeyId"]
meaning = "Bag attributes: a display name, and an id that pairs a key with its certificate."
section = "4.2"

[[format]]
id = "cms"
name = "CMS / PKCS #7 signed or enveloped data"
keys = ["CMS", "PKCS #7", "PKCS7", "Cryptographic Message Syntax", "application/pkcs7-mime", "application/pkcs7-signature"]
summary = "The ASN.1 container for signed and encrypted messages used by S/MIME, Authenticode code signatures, .p7b certificate bundles and many firmware signing schemes."
organisation = """
Every CMS object is a ContentInfo: a SEQUENCE of a content type OID and the content in an explicit [0] tag. The OIDs under 1.2.840.113549.1.7 name the types: data (.1), signedData (.2), envelopedData (.3), digestedData (.5) and encryptedData (.6); authenticatedData and others live under 1.2.840.113549.1.9.16.1. Objects are DER or BER, and BER's indefinite lengths (30 80) are common in streamed S/MIME.

SignedData holds a version, the digest algorithms, the encapsulated content (type and optional content; detached signatures leave it out), an optional set of certificates [0] and CRLs [1], and SignerInfos. Each SignerInfo identifies the signer's certificate by issuer and serial number or subject key identifier, and gives the digest algorithm, signed attributes (content type, message digest, signing time), the signature algorithm, the signature value and unsigned attributes such as countersignatures and timestamps.

EnvelopedData encrypts content for recipients: RecipientInfos (key transport, key agreement, key-encryption key or password) carry the wrapped content-encryption key, and EncryptedContentInfo holds the algorithm and ciphertext. A .p7b file is a 'degenerate' SignedData with certificates but no signers.
"""
carries = ["der", "x509"]
group = "Certificates and keys"

[[format.specs]]
document = "RFC 5652"
title = "Cryptographic Message Syntax (CMS)"
url = "https://www.rfc-editor.org/rfc/rfc5652"
rfc = 5652
section = "3"

[[format.fields]]
name = "contentType"
meaning = "OID naming the content: data, signedData, envelopedData, digestedData, encryptedData or authenticatedData."
section = "3"

[[format.fields]]
name = "SignedData"
meaning = "Version, digest algorithms, encapsulated content, certificates, CRLs and signer infos."
section = "5.1"

[[format.fields]]
name = "encapContentInfo"
meaning = "The signed content's type and, unless the signature is detached, the content itself."
section = "5.2"

[[format.fields]]
name = "SignerInfo"
meaning = "One signature: signer identifier, digest algorithm, signed attributes, signature algorithm and value."
section = "5.3"

[[format.fields]]
name = "EnvelopedData"
meaning = "Encrypted content plus, for each recipient, the content-encryption key wrapped for them."
section = "6.1"

[[format]]
id = "age"
name = "age encrypted file"
keys = ["age", "age encrypted file", "crypto/age"]
summary = "A modern file encryption format: a short text header with one stanza per recipient wrapping a file key, then a ChaCha20-Poly1305 encrypted payload."
organisation = """
The header is text. Its first line is 'age-encryption.org/v1'. Each recipient stanza starts with '-> ', a type and arguments (X25519 with an ephemeral share, scrypt with a salt and work factor, ssh-rsa or ssh-ed25519 with a key tag, or plugin types), followed by lines of unpadded base64 holding the wrapped 16-byte file key, wrapped at 64 columns and ended by a shorter line. The header closes with '--- ' and a base64 HMAC-SHA-256 over the header, keyed from the file key.

The binary payload follows directly: a 16-byte nonce, used with the file key to derive the payload key through HKDF, then the plaintext encrypted in 64 KiB chunks with ChaCha20-Poly1305, each chunk tagged and the last one marked as final so truncation is detected.

Files may also be armoured as '-----BEGIN AGE ENCRYPTED FILE-----' PEM-style text. The stanza types reveal how the file was encrypted (a passphrase if scrypt, otherwise which kind of key), but nothing else.
"""
group = "Certificates and keys"

[[format.specs]]
document = "age v1 specification (C2SP)"
title = "The age file encryption format (C2SP age.md)"
url = "https://github.com/C2SP/C2SP/blob/main/age.md"

[[format.fields]]
name = "version line"
