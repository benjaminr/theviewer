[[format.fields]]
name = "uuid"
meaning = "Volume UUID as text, used by /etc/crypttab and udev."

[[format.fields]]
name = "key slot*"
aliases = ["keyslot*"]
meaning = "One of the key slots: whether it is active, its KDF parameters and salt, and where its split key material lies."

[[format.fields]]
name = "seqid"
meaning = "LUKS2 sequence number, incremented on every header update; the copy with the higher number wins."

[[format.fields]]
name = "hdr_size"
meaning = "LUKS2 size of binary header plus JSON area, which also places the secondary header."

[[format]]
id = "qcow2"
name = "QEMU copy-on-write disk image (qcow2)"
keys = ["QCOW", "QCOW2", "qcow2 image", "fs/qcow"]
summary = "QEMU's virtual disk format: guest clusters allocated on demand through a two-level table, with snapshots, backing files, compression and encryption."
organisation = """
The header is big-endian: the magic 'QFI' FB, the version (2 or 3; 1 for the older qcow), the offset and length of a backing file name, the cluster size as a power of two (16 for 64 KiB), the virtual disk size, the encryption method, the L1 table size and offset, the refcount table offset and length in clusters, and the snapshot count and offset. Version 3 adds feature bit masks, the refcount width, the header length, and a list of header extensions (backing file format, feature names, bitmaps, external data file).

A guest offset is split into an L1 index, an L2 index and an offset within the cluster. L1 entries point to L2 tables; L2 entries point to data clusters, mark a cluster as reading zeros, or (with a flag) point to a compressed cluster given by byte offset and sector count. Unallocated clusters fall through to the backing file, which makes a chain of overlays.

Reference counts track sharing between the active image and internal snapshots, each of which keeps its own L1 table. Compressed clusters use deflate (zlib without a header) or zstd.
"""
carries = ["deflate", "zstd"]
group = "Disks and filesystems"

