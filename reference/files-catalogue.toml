meaning = "When the record was written, as FILETIME."

[[format]]
id = "minidump"
name = "Windows minidump"
keys = ["Minidump", "Windows minidump", "MDMP", "win/minidump"]
summary = "The crash and process dump format of Windows (.dmp, .mdmp): a header and a directory of typed streams holding threads, modules, memory ranges, exception and system information."
organisation = """
The 32-byte MINIDUMP_HEADER is little-endian: 'MDMP', a version whose low word is 0xA793 (the high word is implementation-specific), the number of streams, the offset (RVA) of the stream directory, a checksum, the time the dump was written (seconds since 1970) and flags recording which MINIDUMP_TYPE options were used (with data segments, with full memory, with handle data, with thread info and so on).

The stream directory is an array of 12-byte entries: a stream type and a location (data size and offset). Common types are 3 thread list, 4 module list (base address, size, checksum, timestamp, name and CodeView record for each loaded module), 5 memory list, 6 exception, 7 system info (processor architecture and Windows version), 9 Memory64 list (full memory dumps, where the ranges are stored back to back from one base offset), 12 handle data, 15 misc info (process id and times) and 17 thread info list.

All offsets are from the start of the file. Strings are MINIDUMP_STRING: a 32-bit byte length and UTF-16 text. A full-memory dump of a process such as lsass.exe contains credentials, which is why such files are a strong indicator in incident response.
"""
group = "Windows artefacts"

[[format.specs]]
document = "MINIDUMP_HEADER"
title = "MINIDUMP_HEADER structure (Microsoft Learn)"
url = "https://learn.microsoft.com/en-us/windows/win32/api/minidumpapiset/ns-minidumpapiset-minidump_header"

[[format.specs]]
document = "minidumpapiset.h"
title = "minidumpapiset.h header (Microsoft Learn)"
url = "https://learn.microsoft.com/en-us/windows/win32/api/minidumpapiset/"

[[format.fields]]
name = "Signature"
meaning = "'MDMP'."

[[format.fields]]
name = "Version"
meaning = "Low word 0xA793 (MINIDUMP_VERSION); high word implementation-specific."

[[format.fields]]
name = "NumberOfStreams"
meaning = "Number of entries in the stream directory."

[[format.fields]]
name = "StreamDirectoryRva"
meaning = "File offset of the stream directory."

[[format.fields]]
name = "TimeDateStamp"
meaning = "When the dump was written, seconds since 1970 UTC."

[[format.fields]]
name = "Flags"
meaning = "MINIDUMP_TYPE options used, such as 0x2 MiniDumpWithFullMemory and 0x4 MiniDumpWithHandleData."

[[format.fields]]
name = "StreamType"
meaning = "Kind of stream: 3 threads, 4 modules, 5 memory, 6 exception, 7 system info, 9 Memory64, 12 handles, 15 misc info."

[[format]]
id = "pdb"
name = "Program database (PDB) / MSF"
keys = ["PDB", "Program database", "MSF", "win/pdb"]
summary = "Microsoft's debug symbol file: a multi-stream file (MSF) of fixed-size blocks holding streams for type information, symbols, modules and the build identity that links it to an executable."
organisation = """
The MSF superblock starts with the 32-byte magic 'Microsoft C/C++ MSF 7.00' CR LF 1A 'DS' and three zero bytes, followed by little-endian fields: the block size (512, 1024, 2048 or 4096), the free block map block (1 or 2), the number of blocks, the size of the stream directory in bytes, a reserved field and the block number of the block map, which lists the blocks holding the stream directory.

The stream directory gives the number of streams, each stream's size, and then for each stream the list of block numbers holding it; streams are not contiguous, so they must be gathered block by block. Older files from Visual C++ 6 and earlier use 'Microsoft C/C++ program database 2.00' with a different layout.

Fixed streams: 1 is the PDB info stream (version, signature timestamp, age and the GUID that must match the RSDS CodeView record in the executable's debug directory, plus a named stream map), 2 the TPI type stream, 3 the DBI stream (module list, section contributions, and indexes of other streams such as the public and global symbol streams), and 4 the IPI id stream. Module streams hold per-object-file symbols and line numbers, and source file paths in them reveal the build environment.
"""
group = "Windows artefacts"

[[format.specs]]
document = "LLVM: The MSF File Format"
title = "The MSF File Format (LLVM documentation)"
url = "https://llvm.org/docs/PDB/MsfFile.html"

[[format.fields]]
name = "FileMagic"
aliases = ["magic"]
meaning = "'Microsoft C/C++ MSF 7.00' followed by CR LF 1A 'DS' and three zero bytes."

[[format.fields]]
name = "BlockSize"
meaning = "Size of every block: 512, 1024, 2048 or 4096 bytes."

[[format.fields]]
name = "FreeBlockMapBlock"
meaning = "Which of blocks 1 and 2 holds the active free block map."

[[format.fields]]
name = "NumBlocks"
meaning = "Number of blocks in the file; times the block size gives the file size."

[[format.fields]]
name = "NumDirectoryBytes"
meaning = "Size of the stream directory."

[[format.fields]]
name = "BlockMapAddr"
meaning = "Block holding the list of blocks that make up the stream directory."
