[[format]]
id = "deb"
name = "Debian package (.deb)"
keys = ["deb", "Debian package", ".deb", "application/x-debian-package"]
summary = "The package format of Debian, Ubuntu and derivatives: an ar archive of a version member, a control tarball and a data tarball."
organisation = """
The file is an ar archive ('!<arch>' and a newline, then 60-byte member headers). The first member is 'debian-binary', containing the format version '2.0' and a newline. The second is the control archive, 'control.tar' compressed with gzip, xz or zstd (or uncompressed); the third is the data archive, 'data.tar' with the same choice of compression plus bzip2 and lzma in older packages. Members whose names start with an underscore, such as '_gpgorigin' for signatures, may come after debian-binary.

The control archive holds 'control' (package name, version, architecture, maintainer, dependencies and description), 'md5sums' for the installed files, 'conffiles', and the maintainer scripts preinst, postinst, prerm and postrm, which run as root and are where a malicious package would act.

The data archive holds the files to install, with paths relative to the root directory ('./usr/bin/...').
"""
carries = ["ar", "tar", "gzip", "xz", "zstd", "bzip2"]
group = "Packages"

