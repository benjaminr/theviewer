[[format]]
id = "heif"
name = "HEIF image (HEIC, AVIF)"
keys = ["HEIF", "HEIC", "AVIF", "High Efficiency Image File", "media/heif", "media/avif", "image/heif", "image/heic", "image/heif-sequence", "image/heic-sequence", "image/avif"]
summary = "Still images and image sequences in the ISO base media file format, coded with HEVC (HEIC, the iPhone default) or AV1 (AVIF), with items, properties and metadata in a 'meta' box."
organisation = """
The file is a sequence of ISO base media boxes, starting with 'ftyp' whose brands identify it: 'heic' and 'heix' for HEVC images, 'hevc' and 'hevx' for HEVC sequences, 'mif1' and 'msf1' for generic image files and sequences, and 'avif' and 'avis' for AV1. Still images use a 'meta' box rather than movie tracks.

Inside 'meta': 'hdlr' with handler 'pict', 'pitm' naming the primary item, 'iinf' with an 'infe' entry per item (types such as 'hvc1', 'av01', 'grid', 'Exif', 'mime' for XMP), 'iloc' giving each item's extents (offsets and lengths, usually into 'mdat'), 'iref' linking items (thumbnail 'thmb', derived image 'dimg', content description 'cdsc', auxiliary 'auxl' for alpha and depth), and 'iprp' with property boxes in 'ipco' ('hvcC' or 'av1C' decoder configuration, 'ispe' size, 'colr', 'pixi', 'irot', 'imir', 'clap') associated with items by 'ipma'.

Large photos are usually a 'grid' item assembled from many coded tiles, so the coded data in 'mdat' appears as many small independent images. Exif sits in its own item (with a 4-byte offset prefix before the TIFF header). Image sequences add a 'moov' box with tracks as in MP4.
"""
