[[format]]
id = "wav"
name = "WAVE audio (WAV)"
keys = ["WAV", "WAVE", "WAVE audio", "media/wav", "audio/vnd.wave"]
summary = "The standard Windows audio file: a RIFF 'WAVE' form with a format chunk describing the samples and a data chunk holding them, usually uncompressed PCM."
organisation = """
The file is a RIFF chunk of form type 'WAVE'. The 'fmt ' chunk holds a WAVEFORMATEX structure: the format tag (1 PCM, 3 IEEE float, 6 A-law, 7 mu-law, 0x11 IMA ADPCM, 0x55 MPEG Layer 3, 0xFFFE extensible), the channel count, sample rate, average bytes per second, block alignment (bytes per sample frame) and bits per sample, then for non-PCM formats a size and extra bytes. The extensible form adds the valid bits per sample, a channel mask and a sub-format GUID whose first two bytes are the real format tag.

The 'data' chunk holds the samples, interleaved by channel, little-endian; 8-bit PCM is unsigned and wider PCM signed. Compressed formats add a 'fact' chunk with the length in sample frames.

Other common chunks: 'LIST' 'INFO' metadata, 'bext' (Broadcast Wave: description, originator, date, time reference, UMID, coding history), 'iXML', 'cue ' and 'smpl' (loop points), 'id3 ' tags and 'JUNK' or 'PAD ' padding. Files over 4 GiB use RF64 or BW64.
"""
