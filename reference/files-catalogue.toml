aliases = ["version"]
meaning = "0."
section = "6"

[[format.fields]]
name = "header_type_flag"
aliases = ["header type"]
meaning = "0x01 continued packet, 0x02 beginning of stream, 0x04 end of stream."
section = "6"

[[format.fields]]
