meaning = "'ElfFile' and a zero byte for the file header, 'ElfChnk' and a zero byte for a chunk, 2A 2A 00 00 for a record."

[[format.fields]]
name = "first chunk number"
aliases = ["last chunk number"]
meaning = "Range of chunk numbers in use; the log is circular, so the oldest chunk can come after the newest."

[[format.fields]]
name = "next record identifier"
meaning = "Identifier the next event will get."

[[format.fields]]
name = "number of chunks"
meaning = "Number of 64 KiB chunks in the file."

[[format.fields]]
