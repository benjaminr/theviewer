[[format]]
id = "pdf"
name = "Portable Document Format (PDF)"
keys = ["PDF", "PDF document", "PDF document signature", "application/pdf"]
summary = "Adobe's page description format, now ISO 32000: numbered objects (dictionaries, arrays, streams) located through a cross-reference table, with pages, fonts, images, forms, scripts and attachments."
organisation = """
A file starts with '%PDF-' and a version (1.0 to 1.7, or 2.0), usually followed by a comment line of four or more bytes above 127 so that transfer tools treat the file as binary. Readers tolerate junk before the header, which is a common trick for polyglot files. The body is a series of indirect objects written as 'n g obj ... endobj': booleans, numbers, strings in parentheses or hex, names like /Type, arrays, dictionaries in << >> and streams.

A stream is a dictionary followed by 'stream', the raw bytes and 'endstream'; /Length gives the byte count and /Filter the encodings to undo, such as FlateDecode (zlib), DCTDecode (JPEG), JPXDecode (JPEG 2000), LZWDecode, ASCIIHexDecode, ASCII85Decode, RunLengthDecode, CCITTFaxDecode and JBIG2Decode, often chained. Since PDF 1.5, objects may also be packed inside compressed object streams (/Type /ObjStm), hiding them from a plain text search.

The cross-reference table ('xref') lists the byte offset of every object in 20-byte lines, followed by a 'trailer' dictionary (/Size, /Root for the document catalogue, /Info, /ID, /Encrypt, /Prev). From PDF 1.5 the table may instead be a compressed cross-reference stream. The file ends with 'startxref', the offset of the last cross-reference section, and '%%EOF'. Incremental updates append new objects, a new xref section and trailer with /Prev pointing back, so earlier revisions of the document remain in the file.

Things worth looking for: /JavaScript and /JS, /OpenAction and /AA (actions run on open or on events), /Launch, /URI, /SubmitForm, /EmbeddedFile and /RichMedia, /AcroForm and /XFA forms, and /Encrypt (RC4 or AES with the standard security handler).
"""
carries = ["zlib", "jpeg", "xml"]
group = "Documents"

[[format.specs]]
document = "ISO 32000-2:2020"
title = "Document management - Portable document format - Part 2: PDF 2.0 (free copy via the PDF Association)"
url = "https://pdfa.org/resource/iso-32000-2/"
section = "7.5"

[[format.specs]]
document = "ISO 32000-2 (ISO catalogue)"
title = "ISO 32000-2:2020 Document management - Portable document format - Part 2: PDF 2.0"
url = "https://www.iso.org/standard/75839.html"

[[format.fields]]
name = "header"
aliases = ["%PDF"]
meaning = "'%PDF-' and the version; the document catalogue's /Version can override it."
section = "7.5.2"

[[format.fields]]
name = "object"
aliases = ["indirect object", "obj"]
meaning = "A numbered object, 'n g obj ... endobj', referred to elsewhere as 'n g R'."
section = "7.3.10"

[[format.fields]]
name = "stream"
meaning = "Dictionary plus raw bytes between 'stream' and 'endstream'; /Length and /Filter say how long and how encoded they are."
section = "7.3.8"

[[format.fields]]
name = "xref"
aliases = ["cross-reference table"]
meaning = "Table of object offsets: subsection headers (first object number, count) and 20-byte entries of offset, generation and 'n' (in use) or 'f' (free)."
section = "7.5.4"

[[format.fields]]
name = "trailer"
meaning = "Dictionary after the cross-reference table naming the catalogue (/Root), document information (/Info), file ids, encryption and the previous xref section."
section = "7.5.5"

[[format.fields]]
name = "startxref"
meaning = "Byte offset of the last cross-reference section, read first by a viewer; followed by '%%EOF'."
section = "7.5.5"

[[format.fields]]
name = "/Filter"
aliases = ["Filter"]
meaning = "Encoding(s) of a stream, applied in order: FlateDecode, DCTDecode, LZWDecode, ASCII85Decode and others."
section = "7.4"

[[format.fields]]
name = "/Encrypt"
aliases = ["Encrypt"]
meaning = "Encryption dictionary: security handler, algorithm version, key length, permissions and password hashes."
section = "7.6"

[[format]]
id = "cfb"
name = "Compound File Binary (OLE2)"
keys = ["OLE2", "Compound File Binary", "Compound Document", "Structured Storage", "win/ole2", "application/x-tika-msoffice"]
summary = "Microsoft's 'file system in a file' behind legacy Office documents (.doc, .xls, .ppt), MSI installers, Outlook .msg files, thumbnail caches and many others: storages and streams allocated in sectors through a FAT."
organisation = """
The 512-byte header is little-endian: the signature D0 CF 11 E0 A1 B1 1A E1, a zero CLSID, minor version 0x3E, major version 3 (512-byte sectors) or 4 (4096-byte sectors), the byte order mark FE FF, the sector size and mini sector size as powers of two (9 or 12, and 6), the number of directory sectors (version 4 only), the number of FAT sectors, the first directory sector, a transaction signature, the mini stream cutoff (4096), the first mini FAT sector and count, the first DIFAT sector and count, and the first 109 DIFAT entries.

Sector n starts at (n + 1) × sector size, as the header occupies sector −1. The FAT is an array of next-sector numbers forming chains, with special values for end of chain (FFFFFFFE), free (FFFFFFFF), FAT sectors (FFFFFFFD) and DIFAT sectors (FFFFFFFC). The DIFAT lists where the FAT sectors are. Streams smaller than the cutoff live in the mini stream (the root entry's data) in 64-byte mini sectors chained through the mini FAT.

The directory is a chain of 128-byte entries: a UTF-16 name (up to 31 characters), its length, the object type (1 storage, 2 stream, 5 root), a red-black colour, left and right siblings and child (forming a tree per storage), a CLSID, state bits, creation and modification times, the starting sector and the stream size. Common streams are SummaryInformation and DocumentSummaryInformation, whose names start with the byte 0x05 (property sets with author, dates and application), VBA project storages ('Macros', '_VBA_PROJECT_CUR'), 'WordDocument', 'Workbook' and 'PowerPoint Document'.
"""
carries = ["msword", "ms-excel", "ms-powerpoint"]
group = "Documents"

[[format.specs]]
document = "[MS-CFB]"
title = "[MS-CFB]: Compound File Binary File Format"
url = "https://learn.microsoft.com/en-us/openspecs/windows_protocols/ms-cfb/"
section = "2.2"

[[format.specs]]
document = "[MS-OLEPS]"
title = "[MS-OLEPS]: Object Linking and Embedding (OLE) Property Set Data Structures"
url = "https://learn.microsoft.com/en-us/openspecs/windows_protocols/ms-oleps/"

[[format.fields]]
name = "Header Signature"
aliases = ["signature"]
meaning = "D0 CF 11 E0 A1 B1 1A E1."
section = "2.2"

[[format.fields]]
name = "Major Version"
meaning = "3 for 512-byte sectors, 4 for 4096-byte sectors."
section = "2.2"

[[format.fields]]
name = "Sector Shift"
aliases = ["Mini Sector Shift"]
meaning = "Sector size as a power of two (9 or 12) and mini sector size (6, so 64 bytes)."
section = "2.2"

[[format.fields]]
name = "Number of FAT Sectors"
meaning = "How many sectors the FAT occupies."
section = "2.2"

[[format.fields]]
name = "First Directory Sector Location"
meaning = "First sector of the directory chain."
section = "2.2"

[[format.fields]]
name = "Mini Stream Cutoff Size"
meaning = "Streams smaller than this (4096) are stored in the mini stream."
section = "2.2"

[[format.fields]]
name = "DIFAT"
meaning = "List of the sectors that hold the FAT: 109 entries in the header, the rest in DIFAT sectors."
section = "2.5"

[[format.fields]]
name = "directory entry"
meaning = "128-byte record naming a storage or stream, with tree links, CLSID, timestamps, start sector and size."
section = "2.6"

[[format]]
id = "msword"
name = "Microsoft Word binary document (.doc)"
keys = ["Word document", "Word 97-2003 document", ".doc", "application/msword"]
summary = "The Word 97-2003 document format: a compound file whose WordDocument stream starts with the File Information Block, with text, formatting tables, macros and embedded objects in other streams."
organisation = """
A .doc is a compound file (OLE2). Its 'WordDocument' stream begins with the File Information Block (FIB): the identifier A5 EC, the nFib version (0x00C1 for Word 97 and later, with larger values in extended parts), the language, a flags word, and then arrays of counts and offset/length pairs (FibRgLw97, FibRgFcLcb) locating every structure in the other streams. Older Word 6 and 95 files use earlier FIB versions and some are not compound files at all.

The flags say which table stream holds the formatting structures ('0Table' or '1Table'), whether the document is encrypted (with XOR obfuscation, RC4 or CryptoAPI RC4, described by an EncryptionHeader at the start of the table stream), whether it is a template and whether it has been saved incrementally. The text itself is in WordDocument, located through the piece table (CLX) in the table stream; pieces may be 8-bit or UTF-16.

Other parts of the file: 'Data' (pictures and embedded object data), 'ObjectPool' (embedded OLE objects, each a storage), 'Macros' (a VBA project with compressed source in its module streams) and the summary information property sets. Malicious documents usually rely on VBA macros, embedded objects or exploits in rarely used structures.
"""
carries = ["cfb"]
group = "Documents"

[[format.specs]]
document = "[MS-DOC]"
title = "[MS-DOC]: Word (.doc) Binary File Format"
url = "https://learn.microsoft.com/en-us/openspecs/office_file_formats/ms-doc/"

[[format.fields]]
name = "wIdent"
meaning = "A5 EC at the start of the WordDocument stream."

[[format.fields]]
name = "nFib"
meaning = "FIB version, which tells you the Word version that saved the file (0x00C1 for Word 97 and later)."

[[format.fields]]
name = "fWhichTblStm"
meaning = "Which table stream holds the formatting structures: 0 = '0Table', 1 = '1Table'."

[[format.fields]]
name = "fEncrypted"
aliases = ["fObfuscated"]
meaning = "Whether the document is encrypted, and whether by XOR obfuscation rather than RC4."

[[format.fields]]
name = "fDot"
meaning = "Set when the document is a template."

[[format]]
id = "ms-excel"
name = "Microsoft Excel binary workbook (.xls)"
keys = ["Excel workbook", "Excel 97-2003 workbook", ".xls", "BIFF8", "application/vnd.ms-excel"]
summary = "The Excel 97-2003 format: a compound file whose 'Workbook' stream is a sequence of BIFF records describing sheets, cells, formulas and macros."
organisation = """
A .xls is a compound file with a 'Workbook' stream ('Book' for Excel 5 and 95 files); Excel 2 to 4 wrote bare BIFF files without the compound container. The stream is a sequence of records, each a 16-bit record type, a 16-bit length and data, little-endian. Records larger than 8224 bytes continue in CONTINUE records.

The stream starts with the workbook globals substream, opened by a BOF record (type 0x0809) and ended by EOF (0x000A). Globals include FilePass (0x002F, present when the workbook is encrypted, with RC4 or XOR parameters), BoundSheet8 (0x0085, one per sheet giving its name, visibility, type and the stream offset of its own substream), the shared string table SST (0x00FC), fonts, formats and defined names.

Each sheet substream has its own BOF and EOF with cell records (number, RK, label-SST, formula, blank) and drawing data. BoundSheet8 records whose type is 'macro sheet' and hidden or 'very hidden' visibility are the classic sign of Excel 4.0 (XLM) macros, a common malware technique; VBA projects live in a separate '_VBA_PROJECT_CUR' storage.
"""
carries = ["cfb"]
group = "Documents"

[[format.specs]]
document = "[MS-XLS]"
title = "[MS-XLS]: Excel Binary File Format (.xls) Structure"
url = "https://learn.microsoft.com/en-us/openspecs/office_file_formats/ms-xls/"

[[format.fields]]
name = "record type"
meaning = "16-bit identifier of a BIFF record, such as 0x0809 BOF, 0x000A EOF, 0x0085 BoundSheet8, 0x00FC SST, 0x002F FilePass, 0x0006 Formula."

[[format.fields]]
name = "record size"
meaning = "Length of the record data, at most 8224 bytes."

[[format.fields]]
name = "BOF"
meaning = "Beginning of a substream: BIFF version, substream type (globals, worksheet, chart, macro sheet) and build information."

[[format.fields]]
name = "BoundSheet8"
meaning = "A sheet's name, visibility (visible, hidden, very hidden), type and the stream offset of its BOF."

[[format.fields]]
name = "FilePass"
meaning = "Present when the workbook is encrypted; gives the encryption type and its parameters."

[[format]]
id = "ms-powerpoint"
name = "Microsoft PowerPoint binary presentation (.ppt)"
keys = ["PowerPoint presentation", "PowerPoint 97-2003 presentation", ".ppt", "application/vnd.ms-powerpoint"]
summary = "The PowerPoint 97-2003 format: a compound file whose 'PowerPoint Document' stream is a tree of typed records, found through a persist directory."
organisation = """
A .ppt is a compound file with a 'PowerPoint Document' stream, a 'Current User' stream and often 'Pictures' and summary information streams. Every record in the main stream starts with an 8-byte header: a 16-bit field holding a 4-bit version (0xF for containers) and 12-bit instance, a 16-bit record type and a 32-bit length. Container records hold further records, atoms hold data.

The 'Current User' stream gives the offset of the latest UserEditAtom in the main stream. Each UserEditAtom points to a PersistDirectoryAtom, which maps persist object ids to stream offsets, and to the previous UserEditAtom; following the chain from newest to oldest yields the current offset of every object (fast-saved files keep older versions in the stream).

The DocumentContainer (type 0x03E8) holds document-wide settings and the slide list; slides (0x03EE), notes and masters are separate containers. Text is in TextCharsAtom (UTF-16) and TextBytesAtom records, pictures are in the Pictures stream as blip records, and embedded OLE objects and VBA projects are stored in ExOleObjStg records, usually zlib-compressed.
"""
carries = ["cfb", "zlib", "png", "jpeg"]
group = "Documents"

[[format.specs]]
document = "[MS-PPT]"
title = "[MS-PPT]: PowerPoint (.ppt) Binary File Format"
url = "https://learn.microsoft.com/en-us/openspecs/office_file_formats/ms-ppt/"

[[format.fields]]
name = "recVer"
aliases = ["recInstance"]
meaning = "Record version (0xF marks a container) and instance, packed into the first 16 bits of the header."

[[format.fields]]
name = "recType"
meaning = "Record type, such as 0x03E8 DocumentContainer, 0x03EE SlideContainer, 0x0FF5 UserEditAtom, 0x1772 PersistDirectoryAtom."

[[format.fields]]
name = "recLen"
meaning = "Length of the record data after the 8-byte header."

[[format.fields]]
name = "UserEditAtom"
meaning = "Record of one save: last slide viewed, offsets of the previous edit and of the persist directory."

[[format]]
id = "pst"
name = "Outlook personal folders file (PST/OST)"
keys = ["PST", "Outlook PST", "Personal Folders File", "application/vnd.ms-outlook-pst"]
summary = "Outlook's mailbox file: a node database (NDB) of B-trees and blocks, a heap and table layer on top, and the folders, messages and attachments built from it."
organisation = """
The header starts with '!BDN', a CRC, the client magic 'SM', and the format version: 14 or 15 for the old ANSI format (32-bit offsets, 2 GB limit), 23 for Unicode (64-bit offsets) and 36 for Unicode with 4 KiB pages. It also records the file size, the roots of the node and block B-trees, the allocation map state, and the encryption type: 0 none, 1 'compressible' (a byte substitution), 2 'high' (a cyclic cipher keyed by block id). Neither is real protection.

The node database layer stores data in blocks (with a trailer holding size, signature, CRC and block id) and pages of 512 bytes (4 KiB in version 36). The block B-tree maps block ids to file offsets and sizes; the node B-tree maps node ids to data blocks and subnode trees. Large data uses XBLOCK and XXBLOCK lists.

The lists, tables and properties layer builds a heap-on-node in each node's data, and on top of it property contexts (a message's or folder's properties, tagged by MAPI property id and type) and table contexts (rows such as a folder's contents). The messaging layer then defines the message store, folder hierarchy, messages, recipients and attachments. Deleted items often survive in unreferenced blocks.
"""
group = "Documents"

[[format.specs]]
document = "[MS-PST]"
title = "[MS-PST]: Outlook Personal Folders (.pst) File Format"
url = "https://learn.microsoft.com/en-us/openspecs/office_file_formats/ms-pst/"

[[format.fields]]
name = "dwMagic"
meaning = "'!BDN'."

[[format.fields]]
name = "wMagicClient"
meaning = "'SM' for PST files ('SO' for offline storage tables)."

[[format.fields]]
name = "wVer"
meaning = "14 or 15 ANSI, 23 Unicode, 36 Unicode with 4 KiB pages."

[[format.fields]]
name = "bCryptMethod"
meaning = "0 none, 1 compressible encryption (byte permutation), 2 high encryption (cyclic)."

[[format.fields]]
name = "BREFNBT"
aliases = ["BREFBBT"]
meaning = "References to the roots of the node and block B-trees."

[[format]]
id = "ooxml"
name = "Office Open XML document (.docx, .xlsx, .pptx)"
keys = ["Office Open XML", "OOXML", ".docx", ".xlsx", ".pptx", "application/x-tika-ooxml"]
summary = "The ZIP-based format of modern Microsoft Office documents: XML parts and media connected by relationships, following the Open Packaging Conventions."
organisation = """
The file is a ZIP archive (an 'OPC package'). '[Content_Types].xml' at the root maps part names and extensions to content types, and '_rels/.rels' holds the package relationships pointing to the main document part ('word/document.xml', 'xl/workbook.xml' or 'ppt/presentation.xml') and to 'docProps/core.xml' and 'docProps/app.xml' (author, last modified by, dates, application and version).

Each part can have its own relationships file in a sibling '_rels' folder ('word/_rels/document.xml.rels'). Relationships tie parts together by id: styles, numbering, headers, images under media/, embedded objects under embeddings/, and external targets (TargetMode="External"), which is how remote templates and linked content are pulled in.

Macro-enabled files (.docm, .xlsm, .pptm) contain 'vbaProject.bin', a compound file holding the VBA project. Embedded objects are often OLE2 compound files or other packages. A password-encrypted OOXML document is not a ZIP at all: it is a compound file with 'EncryptionInfo' and 'EncryptedPackage' streams.
"""
carries = ["zip", "deflate", "xml", "cfb", "png", "jpeg"]
group = "Documents"

[[format.specs]]
document = "ECMA-376"
title = "ECMA-376: Office Open XML File Formats"
url = "https://ecma-international.org/publications-and-standards/standards/ecma-376/"

[[format.fields]]
name = "[Content_Types].xml"
meaning = "Maps every part (by name or extension) to its content type."

[[format.fields]]
name = "_rels/.rels"
meaning = "Package relationships: the main document, core and app properties, thumbnail."

[[format.fields]]
name = "docProps/core.xml"
meaning = "Core properties: title, creator, lastModifiedBy, revision, created and modified dates."

[[format.fields]]
name = "vbaProject.bin"
meaning = "The VBA macro project, a compound file, in macro-enabled documents."

[[format]]
id = "odf"
name = "OpenDocument Format (ODF)"
keys = ["OpenDocument", "ODF", ".odt", ".ods", ".odp", "application/vnd.oasis.opendocument.text", "application/vnd.oasis.opendocument.text-template", "application/vnd.oasis.opendocument.text-master", "application/vnd.oasis.opendocument.text-web", "application/vnd.oasis.opendocument.spreadsheet", "application/vnd.oasis.opendocument.spreadsheet-template", "application/vnd.oasis.opendocument.presentation", "application/vnd.oasis.opendocument.presentation-template", "application/vnd.oasis.opendocument.graphics", "application/vnd.oasis.opendocument.graphics-template", "application/vnd.oasis.opendocument.chart", "application/vnd.oasis.opendocument.chart-template", "application/vnd.oasis.opendocument.formula", "application/vnd.oasis.opendocument.formula-template", "application/vnd.oasis.opendocument.image", "application/vnd.oasis.opendocument.image-template"]
summary = "The OASIS document format of LibreOffice and others: a ZIP package of XML files (content, styles, metadata, settings) with a manifest."
organisation = """
The package is a ZIP archive whose first entry must be an uncompressed file named 'mimetype' with no extra field, holding the document's MIME type as plain ASCII. This puts 'mimetypeapplication/vnd.oasis.opendocument.text' (or another type) at offset 30, which is how the type is recognised from the first bytes.

'META-INF/manifest.xml' lists every file in the package with its media type and, for encrypted documents, the encryption algorithm, key derivation (PBKDF2 or Argon2) and checksum of each encrypted entry. The main files are 'content.xml' (the document body), 'styles.xml', 'meta.xml' (generator, author, dates, statistics) and 'settings.xml'; pictures go under 'Pictures/', a preview image at 'Thumbnails/thumbnail.png', and Basic macros under 'Basic/'.

Embedded objects are subdocuments in their own folders, and the flat XML forms (.fodt and others) put everything into one XML file instead of a package.
"""
carries = ["zip", "deflate", "xml", "png"]
group = "Documents"

[[format.specs]]
document = "ODF 1.3 Part 2: Packages"
title = "Open Document Format for Office Applications (OpenDocument) Version 1.3, Part 2: Packages"
url = "https://docs.oasis-open.org/office/OpenDocument/v1.3/os/part2-packages/OpenDocument-v1.3-os-part2-packages.html"

[[format.specs]]
document = "ODF 1.3"
