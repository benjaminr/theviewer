[[format]]
id = "mpeg-ts"
name = "MPEG transport stream"
keys = ["MPEG-TS", "MPEG transport stream", "M2TS", "media/mpeg-ts"]
summary = "The broadcast and streaming container of DVB, ATSC, IPTV, HLS and Blu-ray: fixed 188-byte packets carrying multiplexed elementary streams and program tables."
organisation = """
The stream is a run of 188-byte packets, each starting with the sync byte 0x47 (Blu-ray M2TS files prefix every packet with a 4-byte timestamp, giving 192-byte units). The 4-byte header holds the transport error indicator, payload unit start indicator, priority, a 13-bit packet identifier (PID), 2 bits of scrambling control, 2 bits of adaptation field control and a 4-bit continuity counter. An adaptation field, when present, carries flags, the 42-bit program clock reference (PCR) and stuffing.

PID 0 carries the Program Association Table, listing each program number and the PID of its Program Map Table; PID 1 is the conditional access table and 0x1FFF null packets. A PMT lists the program's elementary streams by stream type (0x02 MPEG-2 video, 0x1B H.264, 0x24 H.265, 0x0F AAC in ADTS, 0x03/0x04 MPEG audio, 0x81 AC-3 in ATSC, 0x06 private data) and PID.

Elementary streams travel as PES packets: 00 00 01, a stream id, a 16-bit length, and a header with presentation and decoding timestamps (90 kHz), split across consecutive TS packets of one PID starting where the payload unit start indicator is set. Tables (PSI and DVB SI) are carried as sections with a pointer field and CRC-32.
"""
carries = ["h264", "h265", "aac-adts", "mpeg-audio"]
group = "Video and containers"

[[format.specs]]
document = "ITU-T H.222.0 | ISO/IEC 13818-1"
title = "ITU-T H.222.0: Information technology - Generic coding of moving pictures and associated audio information: Systems"
url = "https://www.itu.int/rec/T-REC-H.222.0"

[[format.fields]]
name = "sync_byte"
aliases = ["sync byte"]
meaning = "0x47 at the start of every packet."

[[format.fields]]
name = "payload_unit_start_indicator"
aliases = ["PUSI"]
meaning = "Set when a PES packet or a table section starts in this packet."

[[format.fields]]
name = "PID"
meaning = "13-bit packet identifier: 0 PAT, 1 CAT, 0x1FFF null, others as assigned by the PMT."

[[format.fields]]
name = "transport_scrambling_control"
meaning = "00 not scrambled; other values mean the payload is encrypted."

[[format.fields]]
name = "adaptation_field_control"
meaning = "01 payload only, 10 adaptation field only, 11 both."

[[format.fields]]
name = "continuity_counter"
meaning = "4-bit counter per PID, incremented with each payload-carrying packet; gaps reveal lost packets."

[[format.fields]]
name = "PCR"
aliases = ["program_clock_reference"]
meaning = "Program clock reference: 33 bits at 90 kHz plus a 9-bit 27 MHz extension."

[[format.fields]]
name = "stream_type"
meaning = "PMT code for an elementary stream's format: 0x1B H.264, 0x24 H.265, 0x0F AAC, 0x03 MPEG-1 audio."

[[format]]
id = "mpeg-ps"
name = "MPEG program stream"
keys = ["MPEG-PS", "MPEG program stream", "VOB", "media/mpeg-ps", "video/mpeg"]
summary = "The container of DVD video (.vob) and MPEG-1/MPEG-2 files (.mpg): packs of PES packets for storage on reliable media."
organisation = """
A program stream is a sequence of packs. Each pack starts with the pack start code 00 00 01 BA and a pack header: in MPEG-2 a '01' marker, the 42-bit system clock reference (33 bits at 90 kHz plus a 27 MHz extension) with marker bits, the 22-bit program mux rate and up to seven stuffing bytes; MPEG-1 packs start with '0010' and are shorter. The first pack usually also holds a system header (00 00 01 BB) with rate and buffer bounds for each stream.

PES packets follow, each 00 00 01, a stream id and a 16-bit length: 0xE0-0xEF video, 0xC0-0xDF MPEG audio, 0xBD private stream 1 (DVD AC-3, DTS, LPCM and subpictures, distinguished by a sub-stream id byte), 0xBF private stream 2 (DVD navigation packets), 0xBE padding and 0xBC the program stream map. The PES header carries presentation and decoding timestamps.

The stream ends with 00 00 01 B9. A file that starts 00 00 01 B3 instead is an elementary MPEG-1 or MPEG-2 video stream (a sequence header) with no container at all.
"""
carries = ["mpeg-audio"]
group = "Video and containers"

[[format.specs]]
document = "ITU-T H.222.0 | ISO/IEC 13818-1"
title = "ITU-T H.222.0: Information technology - Generic coding of moving pictures and associated audio information: Systems"
url = "https://www.itu.int/rec/T-REC-H.222.0"

[[format.fields]]
name = "pack_start_code"
meaning = "00 00 01 BA."

[[format.fields]]
name = "system_clock_reference"
aliases = ["SCR"]
meaning = "Time the pack should arrive at the decoder, 33 bits at 90 kHz plus a 27 MHz extension."

[[format.fields]]
name = "program_mux_rate"
meaning = "Stream rate in units of 50 bytes per second."

[[format.fields]]
name = "stream_id"
meaning = "PES stream: 0xE0-0xEF video, 0xC0-0xDF audio, 0xBD private stream 1, 0xBE padding, 0xBF private stream 2."

[[format.fields]]
name = "PTS"
aliases = ["DTS"]
meaning = "Presentation and decoding timestamps, 33 bits at 90 kHz."

