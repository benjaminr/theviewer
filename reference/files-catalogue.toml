[[format]]
id = "vorbis"
name = "Vorbis audio"
keys = ["Vorbis", "Ogg Vorbis", "media/ogg-vorbis", "audio/vorbis"]
summary = "Xiph.Org's lossy audio codec, usually in Ogg (.ogg, .oga): three header packets (identification, comment, setup) and then audio packets."
organisation = """
Each header packet starts with a type byte and the six characters 'vorbis': type 1 is identification, 3 comment and 5 setup. The identification header is little-endian: the Vorbis version (0), the channel count, the sample rate, maximum, nominal and minimum bit rates (often only the nominal is set), the two block sizes as powers of two in one byte, and a framing bit.

The comment header holds a length-prefixed vendor string and a count of length-prefixed 'NAME=value' UTF-8 comments (TITLE, ARTIST, ALBUM, DATE, TRACKNUMBER, and METADATA_BLOCK_PICTURE or COVERART for images), then a framing bit. The same comment structure is reused by Opus, FLAC and Theora.

The setup header holds the codebooks, floor and residue configurations, channel mappings and modes the decoder needs; audio packets cannot be decoded without it. In Ogg, the identification header is alone on the first page and the granule position counts PCM samples.
"""
