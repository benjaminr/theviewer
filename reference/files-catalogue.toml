The layer section lists each layer's bounds, channels, blend mode, opacity, flags and name, followed by tagged additional information blocks, then the channel image data. The final composite image is stored planar, channel by channel, with compression 0 (raw), 1 (PackBits RLE with per-row byte counts), 2 (ZIP) or 3 (ZIP with prediction).
