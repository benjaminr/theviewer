meaning = "Block size as a power of two (12 for 4 KiB)."

[[format.fields]]
name = "block_count"
meaning = "Total number of blocks."

[[format.fields]]
name = "cp_blkaddr"
aliases = ["sit_blkaddr", "nat_blkaddr", "ssa_blkaddr", "main_blkaddr"]
meaning = "Start block of the checkpoint, SIT, NAT, SSA and main areas."

[[format.fields]]
name = "root_ino"
meaning = "Inode number of the root directory."

[[format.fields]]
name = "uuid"
meaning = "Filesystem UUID."

[[format.fields]]
