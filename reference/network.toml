[[format.fields]]
name = "Type"
wireshark = "icmp.type"
meaning = "The kind of message: 0 echo reply, 3 destination unreachable, 5 redirect, 8 echo request, 11 time exceeded, among others."

[[format.fields]]
name = "Code"
wireshark = "icmp.code"
meaning = "Refines the type; for destination unreachable, 0 network, 1 host, 3 port unreachable, 4 fragmentation needed."

[[format.fields]]
name = "Checksum"
wireshark = "icmp.checksum"
meaning = "Ones' complement checksum over the ICMP message (header and data); unlike ICMPv6 it does not cover the IP addresses."

[[format.fields]]
name = "Identifier"
wireshark = "icmp.ident"
meaning = "Chosen by the sender of an echo request, often the process ID, so replies can be matched to the program that sent them."

[[format.fields]]
name = "Sequence number"
wireshark = "icmp.seq"
meaning = "Counts the echo requests in a series; the reply copies it so lost and reordered replies can be seen."

[[format.fields]]
name = "Rest of header"
meaning = "Four bytes whose meaning depends on the type: unused (zero), a gateway address for a redirect, or the next-hop MTU when fragmentation was needed."

[[format]]
id = "icmpv6"
name = "Internet Control Message Protocol for IPv6"
keys = ["Internet Control Message Protocol v6", "ICMPv6", "Internet Control Message Protocol for IPv6"]
wireshark = "icmpv6"
summary = "IPv6's control protocol: it reports errors and runs ping like ICMP, and also carries neighbour discovery, which replaces ARP, and router advertisements."
organisation = """
ICMPv6 follows the IPv6 header (or its extension headers) with next header 58. Like ICMP it starts with a type, a code and a checksum, but the checksum also covers an IPv6 pseudo-header of the addresses, length and next header, so it is never optional.

Types 0 to 127 are errors (1 destination unreachable, 2 packet too big, 3 time exceeded, 4 parameter problem), and they quote as much of the offending packet as fits in the minimum IPv6 MTU. Types 128 to 255 are informational: 128 and 129 are echo request and reply with an identifier and sequence number, and 133 to 137 are neighbour discovery messages (router solicitation and advertisement, neighbour solicitation and advertisement, redirect).
"""
carries = ["ipv6"]
group = "Internet layer"
ip_protocols = [58]

