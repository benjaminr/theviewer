[[format]]
id = "dns"
name = "Domain Name System message"
keys = ["DNS", "Domain Name System", "application/dns-message"]
wireshark = "dns"
summary = "The query and response format used to look up names: a client asks for records of a given type for a name, and a server answers with resource records."
organisation = """
A message starts with a 12-byte header: a transaction ID that pairs the response with the query, a 16-bit flags word (query or response, opcode, authoritative answer, truncated, recursion desired and available, response code), and four 16-bit counts for the sections that follow. All numbers are big-endian.

Four sections come next, in order: questions (a name, a type and a class), answers, authority records and additional records. Each resource record holds a name, type, class, 32-bit time to live, a 16-bit data length and that many bytes of data, so records must be walked one after another.

Names are a sequence of labels, each a length byte (1 to 63) followed by that many characters, ending with a zero byte. To save space a name can end instead with a two-byte pointer whose top two bits are set; the remaining 14 bits are an offset from the start of the message where the rest of the name is found.

DNS normally uses UDP port 53 (and multicast DNS uses port 5353 with the same format). Over TCP each message is preceded by a 2-byte length, shown here as the Length field.
"""
carries = []
group = "Naming and time"
ports = ["udp/53", "tcp/53", "udp/5353"]

