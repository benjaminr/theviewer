# Reference notes on network protocols and capture formats. See src/reference.rs
# for the schema. Notes are written for this project; specifications are cited.
#
# Keys are the names the app uses: packet layer names from the dissector
# (src/packets/dissect.rs, src/packets/application.rs), parser finding ids
# (src/parsers/protocol.rs), signature ids and MIME types from the catalogue.
# Field names are the exact names the dissector and parsers emit.

# ---------------------------------------------------------------------------
# Capture files
# ---------------------------------------------------------------------------

[[format]]
id = "pcap"
name = "pcap capture file"
keys = [
  "pcap",
  "pcap capture",
  "capture/pcap-le",
  "capture/pcap-be",
  "capture/pcap-le-ns",
  "capture/pcap-be-ns",
  "application/vnd.tcpdump.pcap",
]
wireshark = "file-pcap"
summary = "The original libpcap/tcpdump capture file: a short file header followed by one record per captured packet, all sharing a single link-layer type."
organisation = """
A 24-byte file header comes first: a 4-byte magic number, a 2-byte major and minor version (2.4), two reserved 4-byte words that writers set to zero (once the time-zone offset and timestamp accuracy), the snapshot length, and the link-layer type. The magic is written in the byte order of the machine that made the file, so reading it as 0xA1B2C3D4 or 0xD4C3B2A1 tells you whether every later field is big- or little-endian; 0xA1B23C4D marks nanosecond rather than microsecond timestamps.

Packet records follow back to back with no padding. Each starts with a 16-byte header (timestamp seconds, timestamp fraction, captured length, original length) and is followed by exactly the captured length of packet bytes, so the next record begins at record start + 16 + captured length. The captured length can be less than the original when the capture was truncated to the snapshot length.

The link type says what the first byte of every packet is: 1 is Ethernet, 101, 228 and 229 are raw IP (no link header), 113 and 276 are Linux cooked captures, 0 is BSD loopback. Its upper bits can also record whether frames end in a frame check sequence.
"""
carries = ["ethernet", "ipv4", "ipv6"]
group = "Capture files"

[[format.specs]]
document = "draft-ietf-opsawg-pcap-09"
title = "PCAP Capture File Format (IETF Internet-Draft)"
url = "https://datatracker.ietf.org/doc/html/draft-ietf-opsawg-pcap-09"
section = "4"

[[format.specs]]
document = "tcpdump.org link types"
title = "Link-layer header types"
url = "https://www.tcpdump.org/linktypes.html"

[[format.specs]]
document = "pcap-savefile(5)"
title = "libpcap savefile format manual page"
url = "https://www.tcpdump.org/manpages/pcap-savefile.5.html"

[[format.fields]]
name = "file header"
wireshark = "pcap.header"
meaning = "The 24 bytes before the first packet record: magic, version, reserved words, snapshot length and link type."
section = "4"

[[format.fields]]
name = "magic"
wireshark = "pcap.header.magic_number"
meaning = "0xA1B2C3D4 (microsecond timestamps) or 0xA1B23C4D (nanosecond timestamps), in the writer's byte order; byte-swapped values mean the file is big-endian when read on a little-endian machine, or the reverse."
section = "4.1"

[[format.fields]]
name = "version"
meaning = "Major then minor version of the file format, two 16-bit numbers in the file's byte order. Every current writer uses 2.4."
section = "4"

[[format.fields]]
name = "time zone"
wireshark = "pcap.header.this_zone"
meaning = "Once the offset of the timestamps from UTC, in seconds; now reserved and written as zero, since timestamps are always UTC."
section = "4"

[[format.fields]]
name = "timestamp accuracy"
wireshark = "pcap.header.sigfigs"
meaning = "Once the accuracy of the timestamps; now reserved and written as zero."
section = "4"

[[format.fields]]
name = "snaplen"
wireshark = "pcap.header.snapshot_length"
meaning = "The snapshot length: the most bytes of any packet that were kept. Longer packets are cut short, so their captured length is less than their original length."
section = "4"

[[format.fields]]
name = "link type"
wireshark = "pcap.header.link_type"
meaning = "The link-layer header type of every packet in the file (1 Ethernet, 101 raw IP, 113 Linux cooked and so on), from the tcpdump.org registry."
section = "4"

[[format.fields]]
name = "packets"
meaning = "The packet records, each a 16-byte header followed by the captured bytes."
section = "5"

[[format.fields]]
name = "packet *"
wireshark = "pcap.packet"
meaning = "One packet record: timestamp seconds and fraction, captured length, original length, then the captured bytes of the packet."
section = "5"

[[format]]
id = "pcapng"
name = "pcapng capture file"
keys = [
  "pcapng",
  "pcapng capture",
  "capture/pcapng",
  "capture/pcapng-be",
  "application/vnd.tcpdump.pcapng",
]
wireshark = "file-pcapng"
summary = "The extensible successor to pcap: a sequence of typed blocks that can describe several interfaces with different link types, carry comments and name tables, and append statistics."
organisation = """
Everything is a block. Each block starts with a 4-byte block type and a 4-byte total length, then a body, and ends with the total length repeated, so a reader can walk forwards or backwards. Bodies are padded to a multiple of four bytes, and most blocks end with options: type-length-value entries (2-byte code, 2-byte length, padded value) closed by an end-of-options code of zero.

A file is one or more sections, each opened by a Section Header Block of type 0x0A0D0D0A. Its byte-order magic 0x1A2B3C4D, read in either order, sets the byte order for the whole section; the block type was chosen to be the same in both orders and to contain CR and LF so that text-mode transfers that corrupt line endings are caught.

Interface Description Blocks (type 1) follow, one per capture interface, numbered from zero in order of appearance; each gives a link type, snapshot length and options such as the timestamp resolution. Enhanced Packet Blocks (type 6) then name their interface by that number and carry a 64-bit timestamp, captured and original lengths and the packet data. Simple Packet Blocks (type 3), Name Resolution Blocks (type 4), Interface Statistics Blocks (type 5) and Decryption Secrets Blocks (type 10) may also appear.
"""
carries = ["ethernet", "ipv4", "ipv6"]
group = "Capture files"

[[format.specs]]
document = "draft-ietf-opsawg-pcapng-06"
title = "PCAP Now Generic (pcapng) Capture File Format (IETF Internet-Draft)"
url = "https://datatracker.ietf.org/doc/html/draft-ietf-opsawg-pcapng-06"
section = "3.1"

[[format.specs]]
document = "tcpdump.org link types"
title = "Link-layer header types"
url = "https://www.tcpdump.org/linktypes.html"

[[format.fields]]
name = "section header"
meaning = "Section Header Block: starts a section and fixes its byte order with the magic 0x1A2B3C4D, then gives the format version (1.0) and the section length, or -1 when it is not known."
section = "4.1"

[[format.fields]]
name = "interface description"
meaning = "Interface Description Block: the link type and snapshot length of one capture interface. Packet blocks refer to interfaces by their order of appearance in the section, starting at zero."
section = "4.2"

[[format.fields]]
name = "packet *"
meaning = "An Enhanced Packet Block (interface number, 64-bit timestamp, captured and original lengths, data padded to four bytes, options) or a Simple Packet Block (original length and data only, always from the first interface)."
section = "4.3"

[[format.fields]]
name = "name resolution"
meaning = "Name Resolution Block: records mapping IP addresses to host names, as known when the capture was made."
section = "4.5"

[[format.fields]]
name = "interface statistics"
meaning = "Interface Statistics Block: counters for one interface, such as packets received and dropped, usually written at the end of a capture."
section = "4.6"

[[format.fields]]
name = "block"
wireshark = "pcapng.block"
meaning = "A block of another type, such as a Decryption Secrets Block or a custom block. Its total length still lets a reader step over it."
section = "3.1"

[[format]]
id = "snoop"
name = "snoop capture file"
keys = ["snoop", "snoop capture", "capture/snoop"]
summary = "The capture file written by Sun's snoop tool on Solaris: a 16-byte file header and then one record per packet, every number big-endian."
organisation = """
The file header is the identification string "snoop" followed by three zero bytes, a 4-byte version number (2) and a 4-byte datalink type saying what the first byte of every packet is: 4 is Ethernet, 0 IEEE 802.3, 2 token ring and 8 FDDI.

Each packet record starts with six 4-byte fields: the packet's original length, the included length (the bytes actually kept), the length of the whole record, the number of packets dropped since the capture began, and the time in seconds and microseconds since 1970. The included bytes follow, then padding up to the record length, usually to a multiple of four bytes, so the next record begins at record start + record length.
"""
carries = ["ethernet"]
group = "Capture files"

[[format.specs]]
document = "RFC 1761"
title = "Snoop Version 2 Packet Capture File Format"
url = "https://www.rfc-editor.org/rfc/rfc1761"
rfc = 1761
section = "3"

[[format.fields]]
name = "file header"
meaning = "The 16 bytes before the first record: identification, version and datalink type."
section = "3"

[[format.fields]]
name = "identification"
meaning = "The eight bytes \"snoop\" followed by three zero bytes, which mark the file as a snoop capture."
section = "3"

[[format.fields]]
name = "version"
meaning = "The file format's version, 2 for the format RFC 1761 describes."
section = "3"

[[format.fields]]
name = "datalink type"
meaning = "The kind of network every packet was captured from: 0 IEEE 802.3, 1 token bus, 2 token ring, 3 metro net, 4 Ethernet, 5 HDLC, 6 character synchronous, 7 IBM channel-to-channel, 8 FDDI, 9 other."
section = "3"

[[format.fields]]
name = "packets"
meaning = "The packet records, each a 24-byte header, the included bytes and padding."
section = "4"

[[format.fields]]
name = "packet *"
meaning = "One packet record: original length, included length, record length, cumulative drops, timestamp seconds and microseconds, then the packet and its padding."
section = "4"

[[format]]
id = "netmon"
name = "Network Monitor capture file"
keys = [
  "netmon",
  "Network Monitor capture",
  "capture/netmon2",
  "netmon_header",
  "netmon_filter",
  "netmon_event",
  "netmon_network_info",
]
summary = "The capture file of Microsoft Network Monitor 2.x and 3.x (usually .cap): a header, the frames, and a table of where each frame starts."
organisation = """
The 72-byte header is little-endian. It starts with the signature "GMBU", a minor and a major version in binary-coded decimal (2.0 to 2.3), the media type of the network (1 Ethernet, 2 token ring, 3 FDDI) and the time the capture started as a Windows SYSTEMTIME in the capturing machine's local time. Pairs of 4-byte offsets and lengths follow for the frame table and for optional user data, comments, process information, extended information and conversation statistics.

The frames are found only through the frame table, an array of 4-byte offsets that is usually written after the last frame. Each frame starts with the time since the capture started in microseconds (8 bytes), the length on the wire and the captured length (4 bytes each), followed by the captured bytes.

From version 2.1 each frame's own media type (2 bytes) follows its bytes, so one file can mix networks; Network Monitor also stores pseudo-frames this way, such as the capture filter (0xFFFF), network information (0xFFFB, 0xFFFD) and event tracing records (0xFFE0). Version 2.2 adds a 4-byte process index and 2.3 the frame's UTC time as a FILETIME and a time zone index.
"""
carries = ["ethernet"]
group = "Capture files"

[[format.specs]]
document = "Microsoft Network Monitor 2 SDK"
title = "CAPTUREFILE_HEADER_VALUES structure (Netmon.h)"
url = "https://learn.microsoft.com/en-us/windows/win32/netmon2/capturefile-header-values"

[[format.specs]]
document = "Wireshark wiki"
title = "File format reference"
url = "https://wiki.wireshark.org/FileFormatReference"

[[format.fields]]
name = "file header"
meaning = "The 72 bytes at the start: signature, version, media type, start time and the offsets and lengths of the frame table and the optional tables."

[[format.fields]]
name = "signature"
meaning = "The four bytes \"GMBU\" that mark a Network Monitor 2.x capture (version 1.x files start \"RTSS\")."

[[format.fields]]
name = "version"
meaning = "Minor then major version, one binary-coded decimal byte each, so 03 02 is version 2.3."

[[format.fields]]
name = "media type"
meaning = "The network the capture was made on: 1 Ethernet, 2 token ring, 3 FDDI, 4 ATM, 5 IEEE 1394, 6 802.11 with Network Monitor's own radio header. Frames of version 2.1 and later carry their own."

[[format.fields]]
name = "start time"
meaning = "When the capture started, as a SYSTEMTIME: year, month, day of the week, day, hour, minute, second and millisecond, 16 bits each, in the capturing machine's local time."

[[format.fields]]
name = "frame table"
meaning = "In the header, the offset and length in bytes of the frame table; at that offset, the table itself, one 4-byte frame offset per frame in capture order."

[[format.fields]]
name = "packets"
meaning = "The frames, each a 16-byte header (time offset in microseconds, length on the wire, captured length) and the captured bytes."

[[format.fields]]
name = "packet *"
meaning = "One frame: time since the capture started, lengths and data, then from version 2.1 its media type, from 2.2 a process index and from 2.3 its UTC time and time zone."

[[format]]
id = "erf"
name = "ERF capture records"
keys = ["erf", "ERF records", "Extensible Record Format"]
wireshark = "erf"
summary = "The Extensible Record Format written by Endace DAG capture cards: records back to back with no file header, each describing one captured frame or cell."
organisation = """
There is no file header and no magic number: a file is simply records. Each record starts with a 16-byte header: a 64-bit little-endian timestamp whose upper 32 bits are seconds since 1970 and lower 32 bits a binary fraction of a second, a type byte, a flags byte (capture interface, varying-length, truncation and error bits), then the record length, a loss counter and the length on the wire as big-endian 16-bit numbers.

The type's low seven bits say what the record holds: 2 Ethernet (and 11, 16 and 20 for coloured variants), 1 HDLC from packet-over-SONET links, 3 ATM cells, 22 and 23 bare IPv4 and IPv6, 48 padding. When the type's top bit is set, 8-byte extension headers follow, each with its own top bit saying whether another comes after it. Ethernet records then have two bytes, an offset and a pad, before the frame.

The record length includes the header and any alignment padding at the end, so the next record begins at record start + record length; the captured frame is the shorter of what remains and the wire length.
"""
carries = ["ethernet", "ipv4", "ipv6"]
group = "Capture files"

[[format.specs]]
document = "Endace ERF types"
title = "Extensible Record Format types"
url = "https://www.endace.com/erf-extensible-record-format-types.pdf"

[[format.specs]]
document = "Wireshark wiki"
title = "ERF"
url = "https://wiki.wireshark.org/ERF"

[[format.fields]]
name = "packets"
meaning = "The records, each a 16-byte header, any extension headers, the captured data and padding up to the record length."

[[format.fields]]
name = "packet *"
meaning = "One record: timestamp, type, flags, record length, loss counter and wire length, then (for Ethernet) a 2-byte pad and the frame."

# ---------------------------------------------------------------------------
# Link layer
# ---------------------------------------------------------------------------

[[format]]
id = "ethernet"
name = "Ethernet II"
keys = ["Ethernet II", "Ethernet", "eth", "Ethernet frame"]
wireshark = "eth"
summary = "The framing used on almost every wired local network and in most packet captures: a 14-byte header naming the destination and source stations and the type of what follows."
organisation = """
The header is three fields: a 6-byte destination MAC address, a 6-byte source MAC address and a 2-byte big-endian EtherType. The payload starts at byte 14. Captures normally leave out the preamble and start-of-frame delimiter, and often the 4-byte frame check sequence at the end as well.

The EtherType names the payload: 0x0800 is IPv4, 0x86DD IPv6, 0x0806 ARP, and 0x8100 or 0x88A8 mean a VLAN tag comes next, with the real EtherType after it. Values of 1500 and below are instead an IEEE 802.3 length followed by an 802.2 LLC header, often with a SNAP header naming the protocol after it.

A frame on the wire is at least 64 bytes including the check sequence, so payloads shorter than 46 bytes are padded. The IP or ARP length fields say where the real payload ends; the bytes after it appear as Padding.
"""
carries = ["vlan", "ipv4", "ipv6", "arp"]
group = "Link layer"

[[format.specs]]
document = "IEEE 802.3-2022"
title = "IEEE Standard for Ethernet"
url = "https://standards.ieee.org/ieee/802.3/10422/"

[[format.specs]]
document = "RFC 894"
title = "A Standard for the Transmission of IP Datagrams over Ethernet Networks"
url = "https://www.rfc-editor.org/rfc/rfc894"
rfc = 894

[[format.specs]]
document = "IANA IEEE 802 Numbers"
title = "EtherType registry"
url = "https://www.iana.org/assignments/ieee-802-numbers/ieee-802-numbers.xhtml"

[[format.fields]]
name = "Destination"
wireshark = "eth.dst"
meaning = "The receiving station's MAC address. If the lowest bit of the first byte is set it is a group (multicast) address; ff:ff:ff:ff:ff:ff is broadcast to every station."

[[format.fields]]
name = "Source"
wireshark = "eth.src"
meaning = "The sending station's MAC address. The first three bytes are usually the manufacturer's identifier (OUI); the second-lowest bit of the first byte marks a locally administered address, as used by virtual machines and randomised Wi-Fi addresses."

[[format.fields]]
name = "Type"
wireshark = "eth.type"
meaning = "The EtherType: what the payload is (0x0800 IPv4, 0x86DD IPv6, 0x0806 ARP, 0x8100 VLAN tag). Values of 1500 or less are an IEEE 802.3 length instead."

[[format]]
id = "vlan"
name = "IEEE 802.1Q VLAN tag"
keys = ["802.1Q VLAN", "802.1Q", "VLAN", "802.1ad QinQ", "802.1ad"]
wireshark = "vlan"
summary = "A four-byte tag inserted into an Ethernet frame to place it on a virtual LAN and give it a priority, so that one physical network can carry several separate ones."
organisation = """
The tag sits where the EtherType would be: a 2-byte tag protocol identifier (0x8100, shown as the Type of the layer before), then a 2-byte tag control word, then the frame's real EtherType. The dissector shows the control word and the following EtherType as this layer, so it is four bytes long.

The control word holds a 3-bit priority code point, a 1-bit drop-eligible indicator and a 12-bit VLAN identifier, all big-endian. Identifier 0 means the frame carries only a priority, and 4095 is reserved.

Tags can be stacked ("Q-in-Q"): a provider's outer service tag uses identifier 0x88A8 (or the older 0x9100) and the customer's inner tag 0x8100. Each tag appears as its own layer here, and the last one's EtherType names the payload.
"""
carries = ["vlan", "ipv4", "ipv6", "arp"]
group = "Link layer"
ethertypes = [0x8100, 0x88a8, 0x9100]

[[format.specs]]
document = "IEEE 802.1Q-2022"
title = "IEEE Standard for Local and Metropolitan Area Networks: Bridges and Bridged Networks"
url = "https://standards.ieee.org/ieee/802.1Q/10323/"

[[format.fields]]
name = "Priority"
wireshark = "vlan.priority"
meaning = "The priority code point, the top three bits of the tag: 0 (best effort) to 7 (highest), used by switches to choose a queue."

[[format.fields]]
name = "VLAN ID"
wireshark = "vlan.id"
meaning = "The 12-bit virtual LAN the frame belongs to, 1 to 4094. Zero means the tag only carries a priority."

[[format.fields]]
name = "Type"
wireshark = "vlan.etype"
meaning = "The EtherType of what follows the tag: another tag, or the payload (0x0800 IPv4, 0x86DD IPv6, 0x0806 ARP)."

[[format]]
id = "arp"
name = "Address Resolution Protocol"
keys = ["Address Resolution Protocol", "ARP"]
wireshark = "arp"
summary = "How a host on a local network finds the hardware (MAC) address that belongs to an IPv4 address: it broadcasts a request and the owner replies."
organisation = """
ARP travels directly in an Ethernet frame with EtherType 0x0806. An 8-byte fixed part gives the hardware type, the protocol type, the lengths of a hardware address and of a protocol address, and the operation (1 request, 2 reply). Four addresses follow: sender hardware, sender protocol, target hardware, target protocol, whose sizes come from the two length bytes.

For IPv4 over Ethernet the lengths are 6 and 4, so the packet is 28 bytes and the frame is padded to the 60-byte minimum. All multi-byte fields are big-endian.

A request is normally broadcast with the target hardware address left as zeros; the reply is sent directly back to the asker. A "gratuitous" ARP, where sender and target protocol addresses are the same, announces an address or detects a conflict.
"""
carries = []
group = "Link layer"
ethertypes = [0x0806]

[[format.specs]]
document = "RFC 826"
title = "An Ethernet Address Resolution Protocol"
url = "https://www.rfc-editor.org/rfc/rfc826"
rfc = 826

[[format.specs]]
document = "IANA ARP Parameters"
title = "Address Resolution Protocol (ARP) Parameters"
url = "https://www.iana.org/assignments/arp-parameters/arp-parameters.xhtml"

[[format.fields]]
name = "Hardware type"
wireshark = "arp.hw.type"
meaning = "The kind of link the hardware addresses belong to; 1 is Ethernet."

[[format.fields]]
name = "Protocol type"
wireshark = "arp.proto.type"
meaning = "The network protocol being resolved, as an EtherType; 0x0800 is IPv4."

[[format.fields]]
name = "Hardware size"
wireshark = "arp.hw.size"
meaning = "Bytes in each hardware address: 6 for Ethernet MAC addresses."

[[format.fields]]
name = "Protocol size"
wireshark = "arp.proto.size"
meaning = "Bytes in each protocol address: 4 for IPv4."

[[format.fields]]
name = "Opcode"
wireshark = "arp.opcode"
meaning = "The operation: 1 request, 2 reply (3 and 4 are the reverse-ARP request and reply)."

[[format.fields]]
name = "Sender hardware address"
wireshark = "arp.src.hw_mac"
meaning = "The MAC address of the station sending this packet. Receivers may cache it against the sender protocol address."

[[format.fields]]
name = "Sender protocol address"
wireshark = "arp.src.proto_ipv4"
meaning = "The IPv4 address of the sender."

[[format.fields]]
name = "Target hardware address"
wireshark = "arp.dst.hw_mac"
meaning = "In a reply, the MAC address of the station being answered. In a request it is unknown and usually all zeros."

[[format.fields]]
name = "Target protocol address"
wireshark = "arp.dst.proto_ipv4"
meaning = "The IPv4 address being asked about (in a request) or the asker's address (in a reply)."

# ---------------------------------------------------------------------------
# Network layer
# ---------------------------------------------------------------------------

[[format]]
id = "ipv4"
name = "Internet Protocol version 4"
keys = ["Internet Protocol version 4", "IPv4", "IP version 4"]
wireshark = "ip"
summary = "Carries datagrams between hosts across interconnected networks, addressing each end with a 32-bit address and fragmenting packets that are too big for a link."
organisation = """
The header is at least 20 bytes, all fields big-endian. The first byte holds the version (4) in its top four bits and the header length in 32-bit words (5 to 15, so 20 to 60 bytes) in its bottom four; anything past byte 20 is options. The transport header therefore starts at header length × 4.

The total length counts the header and the data together, so the packet ends at its first byte + total length; anything after that in the frame is link padding. The protocol byte names what the data is: 1 ICMP, 6 TCP, 17 UDP, among others listed by IANA.

A packet can be split into fragments that share an identification value. Each fragment's offset (in 8-byte units) says where its data belongs, and the "more fragments" flag is set on all but the last. Only the fragment at offset zero carries the transport header, so later fragments are shown here as plain Fragment data.
"""
carries = ["tcp", "udp", "icmp"]
group = "Internet layer"
ethertypes = [0x0800]
ip_protocols = [4]

[[format.specs]]
document = "RFC 791"
title = "Internet Protocol"
url = "https://www.rfc-editor.org/rfc/rfc791"
rfc = 791
section = "3.1"

[[format.specs]]
document = "RFC 2474"
title = "Definition of the Differentiated Services Field (DS Field) in the IPv4 and IPv6 Headers"
url = "https://www.rfc-editor.org/rfc/rfc2474"
rfc = 2474
section = "3"

[[format.specs]]
document = "RFC 3168"
title = "The Addition of Explicit Congestion Notification (ECN) to IP"
url = "https://www.rfc-editor.org/rfc/rfc3168"
rfc = 3168
section = "5"

[[format.specs]]
document = "IANA Protocol Numbers"
title = "Assigned Internet Protocol Numbers"
url = "https://www.iana.org/assignments/protocol-numbers/protocol-numbers.xhtml"

[[format.fields]]
name = "Version and header length"
meaning = "One byte: the version (4) in the top four bits and the header length in 32-bit words in the bottom four. 0x45 is the usual 20-byte header without options."

[[format.fields]]
name = "Differentiated services"
wireshark = "ip.dsfield"
meaning = "Formerly the type of service. The top six bits are the DSCP, a traffic class for queueing (RFC 2474); the bottom two are the ECN bits, which routers can set to signal congestion instead of dropping the packet (RFC 3168)."

[[format.fields]]
name = "Total length"
wireshark = "ip.len"
meaning = "Bytes in the whole packet, header and data, up to 65,535. Bytes beyond this in the frame are padding."

[[format.fields]]
name = "Identification"
wireshark = "ip.id"
meaning = "A value chosen by the sender so that the fragments of one packet can be put back together; all fragments of a packet share it."

[[format.fields]]
name = "Flags and fragment offset"
meaning = "Three flag bits (reserved, don't fragment, more fragments) and a 13-bit offset in 8-byte units giving where this fragment's data belongs in the original packet."

[[format.fields]]
name = "Time to live"
wireshark = "ip.ttl"
meaning = "Decremented by each router; the packet is discarded at zero and an ICMP time exceeded message is sent back. Common starting values are 64, 128 and 255, which hints at the sender's operating system."

[[format.fields]]
name = "Protocol"
wireshark = "ip.proto"
meaning = "What the data is: 1 ICMP, 6 TCP, 17 UDP, 47 GRE, 50 ESP and others in the IANA registry."

[[format.fields]]
name = "Header checksum"
wireshark = "ip.checksum"
meaning = "Ones' complement of the ones' complement sum of the header's 16-bit words, covering the header only. Recomputed by every router because the time to live changes."

[[format.fields]]
name = "Source address"
wireshark = "ip.src"
meaning = "The 32-bit address of the sender."

[[format.fields]]
name = "Destination address"
wireshark = "ip.dst"
meaning = "The 32-bit address of the receiver; may be a broadcast or a multicast (224.0.0.0/4) address."

[[format.fields]]
name = "Options"
meaning = "Rarely used extras between byte 20 and the end of the header, such as record route or timestamps, padded to a 32-bit boundary."

[[format]]
id = "ipv6"
name = "Internet Protocol version 6"
keys = ["Internet Protocol version 6", "IPv6", "IP version 6"]
wireshark = "ipv6"
summary = "The successor to IPv4, with 128-bit addresses, a fixed 40-byte header and optional extension headers chained after it."
organisation = """
The fixed header is always 40 bytes, big-endian: 4 bits of version (6), 8 bits of traffic class, a 20-bit flow label, the payload length, the next header, the hop limit and two 16-byte addresses. There is no header checksum, and routers never fragment; only the sender does, using a fragment header.

The payload length counts everything after the fixed header, extension headers included, so the packet ends at its first byte + 40 + payload length.

The next header byte uses the same numbers as IPv4's protocol field. It either names the upper layer (6 TCP, 17 UDP, 58 ICMPv6) or an extension header (0 hop-by-hop options, 43 routing, 44 fragment, 60 destination options), each of which carries its own next header byte, forming a chain. Value 59 means nothing follows.
"""
carries = ["ipv6-extension", "ipv6-fragment", "tcp", "udp", "icmpv6"]
group = "Internet layer"
ethertypes = [0x86dd]
ip_protocols = [41]

[[format.specs]]
document = "RFC 8200"
title = "Internet Protocol, Version 6 (IPv6) Specification"
url = "https://www.rfc-editor.org/rfc/rfc8200"
rfc = 8200
section = "3"

[[format.specs]]
document = "RFC 6437"
title = "IPv6 Flow Label Specification"
url = "https://www.rfc-editor.org/rfc/rfc6437"
rfc = 6437

[[format.specs]]
document = "RFC 2474"
title = "Definition of the Differentiated Services Field (DS Field) in the IPv4 and IPv6 Headers"
url = "https://www.rfc-editor.org/rfc/rfc2474"
rfc = 2474
section = "3"

[[format.fields]]
name = "Version, traffic class and flow label"
meaning = "The first four bytes: version 6 (4 bits), the traffic class (8 bits, DSCP and ECN as in IPv4) and the flow label (20 bits), which a sender sets to the same value for all packets of one flow so routers can keep them on one path."

[[format.fields]]
name = "Payload length"
wireshark = "ipv6.plen"
meaning = "Bytes after the 40-byte fixed header, including any extension headers. Zero is used with the jumbo payload option for packets over 65,535 bytes."

[[format.fields]]
name = "Next header"
wireshark = "ipv6.nxt"
meaning = "What follows the fixed header: an extension header (0, 43, 44, 60) or the upper-layer protocol (6 TCP, 17 UDP, 58 ICMPv6); 59 means nothing."

[[format.fields]]
name = "Hop limit"
wireshark = "ipv6.hlim"
meaning = "IPv6's time to live: decremented by each router, and the packet is discarded at zero."

[[format.fields]]
name = "Source address"
wireshark = "ipv6.src"
meaning = "The sender's 128-bit address. fe80::/10 addresses are link-local and never routed."

[[format.fields]]
name = "Destination address"
wireshark = "ipv6.dst"
meaning = "The receiver's 128-bit address; ff00::/8 addresses are multicast (IPv6 has no broadcast)."

[[format]]
id = "ipv6-extension"
name = "IPv6 extension headers"
keys = [
  "IPv6 extension headers",
  "IPv6 extension",
  "IPv6 hop-by-hop options",
  "IPv6 routing header",
  "IPv6 destination options",
]
summary = "Optional headers between the IPv6 header and the upper layer that carry options for routers or the destination, or a list of nodes to route through."
organisation = """
Each of these headers starts with two bytes: the next header (which type follows, using IP protocol numbers) and the header's length in 8-byte units not counting the first 8. So a header is (length + 1) × 8 bytes, and the next one starts right after it.

Hop-by-hop options (type 0) must come first and are examined by routers on the path, for instance the router alert and jumbo payload options. Destination options (type 60) are for the receiver. Both hold options encoded as type, length and value, padded with Pad1 and PadN to a multiple of 8 bytes. The routing header (type 43) carries a routing type and a list of addresses, used today mainly by segment routing (type 4).
"""
carries = ["ipv6-extension", "ipv6-fragment", "tcp", "udp", "icmpv6"]
group = "Internet layer"
ip_protocols = [0, 43, 60]

[[format.specs]]
document = "RFC 8200"
title = "Internet Protocol, Version 6 (IPv6) Specification"
url = "https://www.rfc-editor.org/rfc/rfc8200"
rfc = 8200
section = "4"

[[format.fields]]
name = "Next header"
meaning = "The type of the header after this one: another extension header or the upper-layer protocol."

[[format.fields]]
name = "Length"
meaning = "The size of this extension header in bytes. On the wire it is stored as the number of 8-byte units after the first 8."

[[format.fields]]
name = "Options"
meaning = "The header's options, each a type byte, a length byte and that many bytes of data. The top two bits of the type say what a node that does not know the option must do: skip it, drop the packet, or drop it and report back."
wireshark = "ipv6.opt"

[[format.fields]]
name = "Pad1"
meaning = "A single zero byte of padding, keeping the header a multiple of eight bytes."

[[format.fields]]
name = "PadN"
meaning = "Two or more bytes of padding: type 1, a length, then that many zero bytes."
wireshark = "ipv6.opt.padn"

[[format.fields]]
name = "Router alert"
meaning = "Asks every router on the path to look inside the packet, as MLD and RSVP need; the value says which protocol."
wireshark = "ipv6.opt.router_alert"

[[format.fields]]
name = "Jumbo payload"
meaning = "The real payload length for a packet over 65,535 bytes, whose IPv6 payload length is then zero."
wireshark = "ipv6.opt.jumbo"

[[format.fields]]
name = "Routing type"
meaning = "Which kind of routing header follows: 0 (deprecated for security reasons), 2 for Mobile IPv6, 3 for RPL, 4 for segment routing."
wireshark = "ipv6.routing.type"

[[format.fields]]
name = "Segments left"
meaning = "How many listed addresses are still to be visited before the final destination."
wireshark = "ipv6.routing.segleft"

[[format.fields]]
name = "Type-specific data"
meaning = "The rest of the routing header, laid out as its routing type defines: usually the list of addresses to visit."


[[format]]
id = "ipv6-fragment"
name = "IPv6 fragment header"
keys = ["IPv6 fragment header", "IPv6 fragment"]
wireshark = "ipv6.fraghdr"
summary = "The eight-byte extension header a sender adds when it splits an IPv6 packet too large for the path into fragments."
organisation = """
The header is a fixed 8 bytes: next header, a reserved byte, a 16-bit word holding the fragment offset (13 bits, in 8-byte units), two reserved bits and the "more fragments" flag, then a 32-bit identification shared by all fragments of one packet.

Only the first fragment (offset zero) holds the upper-layer header, so later fragments are shown as plain Fragment data. Routers never fragment IPv6 packets; a router that cannot forward one sends an ICMPv6 Packet Too Big message to the sender instead.
"""
carries = ["tcp", "udp", "icmpv6"]
group = "Internet layer"
ip_protocols = [44]

[[format.specs]]
document = "RFC 8200"
title = "Internet Protocol, Version 6 (IPv6) Specification"
url = "https://www.rfc-editor.org/rfc/rfc8200"
rfc = 8200
section = "4.5"

[[format.fields]]
name = "Fragment offset"
wireshark = "ipv6.fraghdr.offset"
meaning = "Where this fragment's data belongs in the original packet, shown in bytes; stored as a 13-bit count of 8-byte units."

[[format.fields]]
name = "Identification"
meaning = "A 32-bit number shared by every fragment of one original packet, so the receiver knows which fragments belong together."
wireshark = "ipv6.fraghdr.ident"

[[format.fields]]
name = "Next header"
meaning = "The protocol of the original packet's payload, the same in every fragment; only the first fragment actually holds its header."
wireshark = "ipv6.fraghdr.nxt"

[[format]]
id = "icmp"
name = "Internet Control Message Protocol"
keys = ["Internet Control Message Protocol", "ICMP", "ICMPv4"]
wireshark = "icmp"
summary = "IPv4's companion for error reports and diagnostics: routers and hosts use it to say a destination is unreachable or a packet's time ran out, and ping uses its echo messages."
organisation = """
ICMP travels inside IPv4 with protocol number 1. Every message starts with a 1-byte type, a 1-byte code refining it, and a 2-byte checksum over the whole ICMP message. The next four bytes depend on the type: an identifier and sequence number for echo request (8) and reply (0), a gateway address for redirects, the next-hop MTU for "fragmentation needed", or unused.

Error messages (destination unreachable 3, time exceeded 11, redirect 5) then quote the IPv4 header and at least the first 8 bytes of the packet that caused them, which is enough to identify the original ports. Echo messages carry arbitrary data that the reply returns unchanged.
"""
carries = ["ipv4"]
group = "Internet layer"
ip_protocols = [1]

[[format.specs]]
document = "RFC 792"
title = "Internet Control Message Protocol"
url = "https://www.rfc-editor.org/rfc/rfc792"
rfc = 792

[[format.specs]]
