[[format]]
id = "http"
name = "Hypertext Transfer Protocol (HTTP/1.x)"
keys = ["HTTP", "HTTP/1.1", "Hypertext Transfer Protocol", "protocol/http-request", "protocol/http-response"]
wireshark = "http"
summary = "The text-based request and response protocol of the web: a client sends a method and a target, and the server answers with a status code, each followed by header fields and an optional body."
organisation = """
Every message begins with a start line ending in CR LF. A request line is method, target and version separated by single spaces ("GET /index.html HTTP/1.1"); a status line is version, three-digit status code and reason ("HTTP/1.1 200 OK").

Header field lines follow, each "Name: value" ending in CR LF; names are case-insensitive. An empty line (CR LF alone) ends the head.

The body, if any, starts after the empty line. Its length comes from Transfer-Encoding: chunked (a series of hexadecimal-sized chunks ending with a zero-sized one), otherwise from Content-Length, and for responses without either, from the server closing the connection. Several messages can follow each other on one TCP connection. HTTP/2 and HTTP/3 are binary framings of the same semantics and are not decoded here; HTTPS is HTTP inside TLS.
"""
carries = []
group = "Web and remote access"
ports = ["tcp/80", "tcp/8080"]

[[format.specs]]
document = "RFC 9112"
title = "HTTP/1.1"
url = "https://www.rfc-editor.org/rfc/rfc9112"
rfc = 9112
section = "2.1"

[[format.specs]]
document = "RFC 9110"
title = "HTTP Semantics"
url = "https://www.rfc-editor.org/rfc/rfc9110"
rfc = 9110

[[format.fields]]
name = "Request line"
wireshark = "http.request.line"
meaning = "The method (GET, POST, PUT, DELETE, HEAD and so on), the request target (usually a path and query) and the protocol version."
section = "3"

[[format.fields]]
name = "Status line"
wireshark = "http.response.line"
meaning = "The protocol version, a three-digit status code (2xx success, 3xx redirection, 4xx client error, 5xx server error) and a reason phrase that carries no meaning of its own."
section = "4"

[[format.fields]]
name = "Headers"
meaning = "The header field lines between the start line and the empty line that ends the head."
section = "5"

[[format.fields]]
name = "header"
meaning = "One header field line: a case-insensitive name, a colon and a value."
section = "5"

[[format.fields]]
name = "Body"
meaning = "The message content after the empty line. Its length is set by Transfer-Encoding or Content-Length; it may be compressed according to Content-Encoding."
section = "6"

[[format.fields]]
name = "Host"
wireshark = "http.host"
meaning = "The host name (and port) the request is for, required in HTTP/1.1 so that one server address can serve many sites."

[[format.fields]]
name = "Content-Length"
wireshark = "http.content_length"
meaning = "The body's length in decimal bytes, when chunked transfer coding is not used."
section = "6.2"

[[format.fields]]
name = "Transfer-Encoding"
wireshark = "http.transfer_encoding"
meaning = "Codings applied to the body for transport; \"chunked\" sends it as length-prefixed chunks so it can be streamed without knowing its size in advance."
section = "6.1"

[[format.fields]]
name = "Content-Type"
wireshark = "http.content_type"
meaning = "The media type of the body, such as text/html; charset=utf-8 or application/json."

[[format.fields]]
name = "Connection"
wireshark = "http.connection"
meaning = "Options for this connection only, such as \"close\" to end it after the response or \"keep-alive\"."
section = "9.6"

[[format.fields]]
name = "User-Agent"
wireshark = "http.user_agent"
meaning = "The client software making the request."

[[format.fields]]
name = "Server"
wireshark = "http.server"
meaning = "The server software that produced the response."

[[format.fields]]
name = "Accept"
meaning = "Media types the client will take in the response, most wanted first or ranked by q weights, such as text/html or */*."
wireshark = "http.accept"

[[format.fields]]
name = "Accept-Encoding"
meaning = "Content codings the client can undo, such as gzip, deflate or br; the server picks one for Content-Encoding."
wireshark = "http.accept_encoding"

[[format.fields]]
name = "Accept-Language"
meaning = "Natural languages the client prefers, ranked by q weights, such as en-GB, en;q=0.8."
wireshark = "http.accept_language"

[[format.fields]]
name = "Accept-Charset"
meaning = "Character sets the client accepts; obsolete, as everything now assumes UTF-8."

[[format.fields]]
name = "Accept-Ranges"
meaning = "From the server: whether it serves parts of the resource on request; 'bytes' if it does, 'none' if not."

[[format.fields]]
name = "Date"
meaning = "When the message was sent, in the fixed form 'Tue, 06 Oct 2026 09:10:00 GMT'."
wireshark = "http.date"

[[format.fields]]
name = "Cache-Control"
meaning = "Caching rules for this message, such as no-store, no-cache, private or max-age=3600."
wireshark = "http.cache_control"

[[format.fields]]
name = "Pragma"
meaning = "The HTTP/1.0 forerunner of Cache-Control; 'no-cache' is the only value seen."

[[format.fields]]
name = "Keep-Alive"
meaning = "Hints for a persistent connection, such as timeout=5, max=100; the connection itself is kept open by Connection."

[[format.fields]]
name = "Expires"
meaning = "When a cached copy goes stale; Cache-Control's max-age takes precedence."

[[format.fields]]
name = "Last-Modified"
meaning = "When the server believes the resource last changed, for conditional requests with If-Modified-Since."
wireshark = "http.last_modified"

[[format.fields]]
name = "ETag"
meaning = "An opaque tag for this version of the resource, sent back in If-None-Match to ask whether it changed; W/ marks a weak tag."

[[format.fields]]
name = "Vary"
meaning = "Which request headers the response depends on, so a cache stores one copy per combination of them."

[[format.fields]]
name = "Referer"
meaning = "The address of the page the request came from (the misspelling is the standard's own)."
wireshark = "http.referer"

[[format.fields]]
name = "Cookie"
meaning = "Name=value pairs the client stores for this site and sends back with each request, separated by semicolons."
wireshark = "http.cookie"

[[format.fields]]
name = "Set-Cookie"
meaning = "From the server: one cookie to store, with attributes such as Expires, Path, Secure and HttpOnly."
wireshark = "http.set_cookie"

[[format.fields]]
name = "Authorization"
meaning = "The client's credentials: a scheme then its data, such as 'Basic' with base64 of user:password (readable by anyone who sees it), or 'Bearer' with a token."
wireshark = "http.authorization"

[[format.fields]]
name = "WWW-Authenticate"
meaning = "From the server with a 401 response: the authentication schemes it accepts and their parameters, such as a realm."
wireshark = "http.www_authenticate"

[[format.fields]]
name = "Location"
meaning = "Where to go instead: the target of a redirect (3xx) or the address of a newly created resource (201)."
wireshark = "http.location"

[[format.fields]]
name = "Content-Encoding"
meaning = "The coding applied to the body, such as gzip; undo it to see the content Content-Type describes."
wireshark = "http.content_encoding"

[[format.fields]]
name = "Range"
meaning = "A request for part of the resource, such as bytes=0-1023, used to resume downloads."
wireshark = "http.range"

[[format.fields]]
name = "Content-Range"
meaning = "Which part of the resource a 206 response carries and the whole size, such as bytes 0-1023/52000."
wireshark = "http.content_range"

[[format.fields]]
name = "Upgrade-Insecure-Requests"
meaning = "A browser's signal (1) that it would rather be sent to the HTTPS version of the page."

[[format.fields]]
name = "Expect"
meaning = "Usually '100-continue': the client waits for the server's go-ahead before sending a large body."

[[format.fields]]
name = "TE"
meaning = "Transfer codings the client accepts besides chunked; 'trailers' says it can take header fields after the body."

[[format.fields]]
name = "X-Powered-By"
meaning = "A non-standard banner naming the server software or framework, useful for fingerprinting."


[[format]]
id = "tls-record"
name = "Transport Layer Security record"
keys = ["tls-record", "TLS", "TLS record", "Transport Layer Security", "protocol/tls-record", "protocol/tls-client-hello"]
wireshark = "tls"
summary = "The framing of TLS, the encryption layer under HTTPS and many other protocols: every handshake message, alert and piece of application data travels in records with a five-byte header."
organisation = """
A record header is 5 bytes: a content type (20 change cipher spec, 21 alert, 22 handshake, 23 application data), a 2-byte protocol version, and a 2-byte big-endian length of the fragment that follows (at most 16,384 bytes of plaintext, a little more once encrypted). The next record starts right after the fragment, so a run of records can be walked by their lengths.

The version field is a legacy value: 0x0301 to 0x0303 for TLS 1.0 to 1.2, and TLS 1.3 also writes 0x0303 (or 0x0301 in a first ClientHello), negotiating the real version in an extension instead.

Handshake records carry messages that each start with a 1-byte type and a 3-byte length. A connection begins with a ClientHello and a ServerHello in plain text. In TLS 1.2 the certificate and key exchange messages that follow are also readable; in TLS 1.3 everything after the ServerHello is encrypted and sent as application data records, with the real content type hidden inside.
"""
carries = []
group = "Web and remote access"
ports = ["tcp/443", "tcp/465", "tcp/853", "tcp/993", "tcp/995", "tcp/8883"]

[[format.specs]]
document = "RFC 9846"
title = "The Transport Layer Security (TLS) Protocol Version 1.3"
url = "https://www.rfc-editor.org/rfc/rfc9846"
rfc = 9846
section = "5.1"

[[format.specs]]
document = "RFC 5246"
title = "The Transport Layer Security (TLS) Protocol Version 1.2"
url = "https://www.rfc-editor.org/rfc/rfc5246"
rfc = 5246
section = "6.2"

[[format.specs]]
document = "IANA TLS Parameters"
title = "Transport Layer Security (TLS) Parameters"
url = "https://www.iana.org/assignments/tls-parameters/tls-parameters.xhtml"

[[format.fields]]
name = "ClientHello"
meaning = "The client's opening message: its random value, offered cipher suites and extensions such as the server name (SNI), supported versions and key shares."
section = "4.2.2"

[[format.fields]]
name = "ServerHello"
meaning = "The server's choice of version and cipher suite, its random value and, in TLS 1.3, its key share; after it, TLS 1.3 encrypts everything."
section = "4.2.3"

[[format.fields]]
name = "NewSessionTicket"
meaning = "Sent by the server after the handshake: a ticket the client can present later to resume the session."
section = "4.7.1"

[[format.fields]]
name = "EncryptedExtensions"
meaning = "TLS 1.3: extensions the server sends once encryption has begun, such as the chosen application protocol (ALPN)."
section = "4.4.1"

[[format.fields]]
name = "Certificate"
wireshark = "tls.handshake.certificates"
meaning = "The sender's certificate chain, starting with its own certificate. Readable in TLS 1.2, encrypted in TLS 1.3."
section = "4.5.1"

[[format.fields]]
name = "CertificateRequest"
meaning = "The server asks the client to authenticate with a certificate."
section = "4.4.2"

[[format.fields]]
name = "CertificateVerify"
meaning = "A signature over the handshake so far, proving the sender holds the private key of its certificate."
section = "4.5.2"

[[format.fields]]
name = "Finished"
meaning = "A keyed hash over the whole handshake, confirming both sides saw the same messages; the first message protected by the new keys in TLS 1.2."
section = "4.5.3"

[[format.fields]]
name = "ServerKeyExchange"
meaning = "TLS 1.2 and earlier: the server's ephemeral key exchange parameters, signed with its certificate key."

[[format.fields]]
name = "ServerHelloDone"
meaning = "TLS 1.2 and earlier: the server has finished its part of the hello phase."

[[format.fields]]
name = "ClientKeyExchange"
meaning = "TLS 1.2 and earlier: the client's key exchange value (its ephemeral public key, or an RSA-encrypted premaster secret)."

[[format.fields]]
name = "ChangeCipherSpec"
wireshark = "tls.change_cipher_spec"
meaning = "A one-byte record (content type 20) announcing that the sender switches to the negotiated keys. TLS 1.3 sends it only for compatibility with middleboxes."

[[format.fields]]
name = "Alert"
wireshark = "tls.alert_message"
meaning = "A record of content type 21: a severity (warning or fatal) and a description, such as close_notify at the end of a connection. Encrypted once keys are in use."
section = "6"

[[format.fields]]
name = "ApplicationData"
wireshark = "tls.app_data"
meaning = "A record of content type 23: encrypted data. In TLS 1.3 it also hides encrypted handshake messages and alerts."
section = "5.2"

[[format.fields]]
name = "handshake"
wireshark = "tls.handshake"
meaning = "A handshake record of a type not listed by name; its body starts with a 1-byte message type and a 3-byte length."
section = "4"

[[format]]
id = "ssh-banner"
name = "SSH protocol version exchange"
keys = ["ssh-banner", "SSH banner", "SSH protocol banner", "protocol/ssh-banner"]
wireshark = "ssh"
summary = "The line of text each side of an SSH connection sends first, announcing the protocol version and the software in use, before the binary key exchange begins."
organisation = """
The identification line has the form "SSH-protoversion-softwareversion", optionally followed by a space and comments, and ends with CR LF; it is at most 255 characters including the line ending. The protocol version is "2.0", or "1.99" from a server that also accepts the old version 1 protocol. The software version, such as "OpenSSH_9.6", is free text without spaces or hyphens.

A server may send other lines of text before its identification line; only the line starting "SSH-" counts. Immediately after the exchange both sides switch to the binary packet protocol: each packet is a 4-byte length, a 1-byte padding length, the payload, random padding and, once keys are in place, a MAC. The first packets, the key exchange initialisation (message 20), are still unencrypted and list the algorithms each side supports.
"""
carries = []
group = "Web and remote access"
ports = ["tcp/22"]

[[format.specs]]
document = "RFC 4253"
title = "The Secure Shell (SSH) Transport Layer Protocol"
url = "https://www.rfc-editor.org/rfc/rfc4253"
rfc = 4253
section = "4.2"

[[format]]
id = "ntp"
name = "Network Time Protocol"
keys = ["NTP", "Network Time Protocol"]
wireshark = "ntp"
summary = "Synchronises clocks over the network: a client and server exchange timestamps, from which the client works out its clock offset and the round-trip delay."
organisation = """
NTP runs over UDP port 123. The basic packet is 48 bytes, big-endian: a byte of leap indicator (2 bits), version (3 bits) and mode (3 bits); the stratum; the poll interval and precision as signed powers of two in seconds; root delay and root dispersion as 16.16 fixed-point seconds; a 4-byte reference ID; and four 8-byte timestamps. Extension fields and a message authentication code may follow.

Timestamps are 32.32 fixed point: whole seconds since 1 January 1900 UTC and a binary fraction of a second. The 32-bit seconds field wraps in February 2036, after which the era must be inferred.

In a client/server exchange the client sends its transmit time; the server records when the request arrived and when its reply left, and copies the client's time into the origin field. With the client's own arrival time, those four timestamps give both the offset and the delay.
"""
carries = []
group = "Naming and time"
ports = ["udp/123"]

[[format.specs]]
document = "RFC 5905"
title = "Network Time Protocol Version 4: Protocol and Algorithms Specification"
url = "https://www.rfc-editor.org/rfc/rfc5905"
rfc = 5905
section = "7.3"

[[format.fields]]
name = "Flags"
wireshark = "ntp.flags"
meaning = "Leap indicator (0 none, 1 or 2 a leap second at the end of the day, 3 clock unsynchronised), version (usually 3 or 4) and mode (3 client, 4 server, 5 broadcast, 1 and 2 symmetric peers, 6 control)."

[[format.fields]]
name = "Stratum"
wireshark = "ntp.stratum"
meaning = "Distance from a reference clock: 1 is attached directly to one (GPS, atomic clock), 2 synchronises from a stratum 1 server and so on; 0 marks a kiss-o'-death packet or an unset value, 16 unsynchronised."

[[format.fields]]
name = "Poll interval"
wireshark = "ntp.ppoll"
meaning = "The longest interval between successive messages, as a power of two in seconds (6 means 64 s)."

[[format.fields]]
name = "Precision"
wireshark = "ntp.precision"
meaning = "The precision of the sender's clock, as a power of two in seconds (-20 is about a microsecond)."

[[format.fields]]
name = "Root delay"
wireshark = "ntp.rootdelay"
meaning = "The total round-trip delay to the reference clock, in seconds."

[[format.fields]]
name = "Root dispersion"
wireshark = "ntp.rootdispersion"
meaning = "The total error the sender could have relative to the reference clock, in seconds."

[[format.fields]]
name = "Reference ID"
wireshark = "ntp.refid"
meaning = "For stratum 1, four ASCII characters naming the reference source (such as GPS or PPS); for stratum 0, a kiss code such as RATE or DENY; above that, the IPv4 address of the upstream server, or a hash of its IPv6 address."

[[format.fields]]
name = "Reference timestamp"
wireshark = "ntp.reftime"
meaning = "When the sender's clock was last set or corrected."

[[format.fields]]
name = "Origin timestamp"
wireshark = "ntp.org"
meaning = "In a reply, the client's transmit time copied from the request, so the client can match the reply and compute the round trip."

[[format.fields]]
name = "Receive timestamp"
wireshark = "ntp.rec"
meaning = "When the request arrived at the server."

[[format.fields]]
name = "Transmit timestamp"
wireshark = "ntp.xmt"
meaning = "When this packet left the sender."

[[format]]
id = "mqtt"
name = "MQTT"
keys = ["MQTT", "Message Queuing Telemetry Transport"]
wireshark = "mqtt"
summary = "A lightweight publish/subscribe messaging protocol for devices and sensors: clients connect to a broker, subscribe to topics and publish messages to them."
organisation = """
MQTT runs over TCP, on port 1883 (8883 with TLS). Every control packet starts with a fixed header: one byte whose top four bits are the packet type (1 CONNECT, 3 PUBLISH, 8 SUBSCRIBE, 12 PINGREQ, 14 DISCONNECT and so on) and whose bottom four are flags, then the remaining length.

The remaining length is a variable-length integer of one to four bytes, 7 bits per byte with the lowest-order group first; a set top bit means another byte follows. It counts the variable header and payload, so the next packet starts at 1 + length bytes + remaining length.

A PUBLISH carries its quality of service (0 at most once, 1 at least once, 2 exactly once), duplicate and retain bits in the flags; its variable header is the topic name (a 2-byte length then UTF-8 text) and, for QoS 1 and 2, a 2-byte packet identifier. In MQTT 5.0 a block of properties follows before the payload. A CONNECT starts with the protocol name "MQTT" and a protocol level (4 for 3.1.1, 5 for 5.0).
"""
carries = []
group = "Messaging"
ports = ["tcp/1883"]

[[format.specs]]
document = "MQTT Version 3.1.1"
title = "MQTT Version 3.1.1, OASIS Standard"
url = "https://docs.oasis-open.org/mqtt/mqtt/v3.1.1/os/mqtt-v3.1.1-os.html"
section = "2"

[[format.specs]]
document = "MQTT Version 5.0"
title = "MQTT Version 5.0, OASIS Standard"
url = "https://docs.oasis-open.org/mqtt/mqtt/v5.0/os/mqtt-v5.0-os.html"
section = "2"

[[format.fields]]
name = "Header flags"
wireshark = "mqtt.hdrflags"
meaning = "The first byte: packet type in the top four bits and type-specific flags in the bottom four (for PUBLISH, DUP, two QoS bits and RETAIN)."
section = "2.2"

[[format.fields]]
name = "Remaining length"
wireshark = "mqtt.len"
meaning = "Bytes in the rest of the packet, as a 1 to 4 byte variable-length integer, 7 bits per byte, low-order first."
section = "2.2.3"

[[format.fields]]
name = "Topic"
wireshark = "mqtt.topic"
meaning = "The topic the message is published to, a UTF-8 string such as home/kitchen/temperature, with a 2-byte length prefix. Levels are separated by slashes."
section = "3.3.2.1"

[[format.fields]]
name = "Message identifier"
wireshark = "mqtt.msgid"
meaning = "The packet identifier, present only for QoS 1 and 2, used to match the acknowledgements to this publish."
section = "3.3.2.2"

[[format.fields]]
name = "Message"
wireshark = "mqtt.msg"
meaning = "The application payload of a publish, in any format the clients agree on; in MQTT 5.0 it is preceded by the properties."
section = "3.3.3"

[[format.fields]]
name = "Protocol name"
wireshark = "mqtt.protoname"
meaning = "In a CONNECT, \"MQTT\" (or \"MQIsdp\" for the older 3.1), with a 2-byte length prefix."
section = "3.1.2.1"

[[format.fields]]
name = "Protocol level"
wireshark = "mqtt.ver"
meaning = "In a CONNECT, the protocol revision: 3 for 3.1, 4 for 3.1.1, 5 for 5.0."
section = "3.1.2.2"

[[format.fields]]
name = "Body"
meaning = "The variable header and payload of other packet types, shown as bytes."

[[format]]
id = "modbus"
name = "Modbus/TCP"
keys = ["Modbus/TCP", "Modbus", "Modbus TCP"]
wireshark = "mbtcp"
summary = "The industrial request/response protocol for reading and writing coils and registers in controllers, carried over TCP with a small header in front of the classic Modbus message."
organisation = """
Each message (an application data unit) starts with the 7-byte MBAP header, big-endian: a transaction ID that the server copies into its response, a protocol ID that is always 0, a length counting the bytes that follow it (unit ID, function code and data), and a 1-byte unit ID. The next message on the stream starts at 6 + length.

The Modbus PDU follows: a 1-byte function code and its data, at most 253 bytes in all. Read requests (functions 1 to 4) give a 2-byte starting address and a 2-byte quantity; responses give a byte count and the values. Registers are 16-bit big-endian values; coils and discrete inputs are single bits packed into bytes.

If the server cannot carry out a request it answers with the function code plus 0x80 and a 1-byte exception code. Servers listen on TCP port 502.
"""
carries = []
group = "Industrial control"
ports = ["tcp/502"]

[[format.specs]]
document = "Modbus Application Protocol Specification V1.1b3"
title = "MODBUS Application Protocol Specification"
url = "https://www.modbus.org/file/secure/modbusprotocolspecification.pdf"

[[format.specs]]
document = "Modbus Messaging on TCP/IP Implementation Guide V1.0b"
title = "MODBUS Messaging on TCP/IP Implementation Guide"
url = "https://www.modbus.org/file/secure/messagingimplementationguide.pdf"

[[format.fields]]
name = "Transaction ID"
wireshark = "mbtcp.trans_id"
meaning = "Chosen by the client and copied into the response, so that several outstanding requests can be matched with their answers."

[[format.fields]]
name = "Protocol ID"
wireshark = "mbtcp.prot_id"
meaning = "Always 0 for Modbus."

[[format.fields]]
name = "Length"
wireshark = "mbtcp.len"
meaning = "Bytes that follow this field: the unit ID, the function code and the data."

[[format.fields]]
name = "Unit ID"
wireshark = "mbtcp.unit_id"
meaning = "The station address of a serial device behind a gateway; devices addressed directly over TCP usually ignore it (0 or 255)."

[[format.fields]]
name = "Function code"
wireshark = "modbus.func_code"
meaning = "The operation: 1 read coils, 2 read discrete inputs, 3 read holding registers, 4 read input registers, 5 and 6 write a single coil or register, 15 and 16 write several. 0x80 is added in an exception response."

[[format.fields]]
name = "Exception code"
wireshark = "modbus.exception_code"
meaning = "Why a request failed: 1 illegal function, 2 illegal data address, 3 illegal data value, 4 server device failure, 6 server busy, 11 gateway target failed to respond."

[[format.fields]]
name = "Reference number"
wireshark = "modbus.reference_num"
meaning = "The zero-based address of the first coil or register to read. Documentation often numbers registers from 1 (holding register 40001 is address 0)."

[[format.fields]]
name = "Quantity"
meaning = "How many coils or registers to read, starting at the reference number."

[[format.fields]]
name = "Data"
wireshark = "modbus.data"
meaning = "The rest of the PDU: in a response, a byte count and the values read; in a write request, the address and values."
