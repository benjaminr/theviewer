[[format]]
id = "tcp"
name = "Transmission Control Protocol"
keys = ["Transmission Control Protocol", "TCP"]
wireshark = "tcp"
summary = "A reliable, ordered byte stream between two ports: segments are numbered by byte, acknowledged and retransmitted, and the flow is paced by the receiver's window."
organisation = """
The header is at least 20 bytes, big-endian: source and destination ports, a 32-bit sequence number, a 32-bit acknowledgement number, a 4-bit data offset (the header length in 32-bit words), the flag bits, the window, the checksum and the urgent pointer. Options fill the rest of the header up to the data offset, which can make it as long as 60 bytes. The payload starts at the data offset and runs to the end of the IP packet; TCP has no length field of its own.

A connection opens with a three-way handshake (SYN, SYN+ACK, ACK) in which each side picks an initial sequence number, and closes with FIN or is aborted with RST. After that, the sequence number is the stream position of the segment's first byte, and the acknowledgement number is the next byte the sender expects to receive.

The ports identify the conversation and, by convention, the application inside: 80 HTTP, 443 HTTPS (TLS), 22 SSH, 53 DNS, 502 Modbus/TCP, 1883 MQTT. Because TCP is a stream, one application message can span several segments and one segment can hold several messages.
"""
carries = ["http", "tls-record", "ssh-banner", "dns", "modbus", "mqtt"]
group = "Transport"
ip_protocols = [6]

[[format.specs]]
document = "RFC 9293"
title = "Transmission Control Protocol (TCP)"
url = "https://www.rfc-editor.org/rfc/rfc9293"
rfc = 9293
section = "3.1"

[[format.specs]]
document = "RFC 3168"
title = "The Addition of Explicit Congestion Notification (ECN) to IP"
url = "https://www.rfc-editor.org/rfc/rfc3168"
rfc = 3168
section = "6.1"

[[format.fields]]
name = "Source port"
wireshark = "tcp.srcport"
meaning = "The sending application's port; a client usually picks a temporary (ephemeral) port above 1023."

[[format.fields]]
name = "Destination port"
wireshark = "tcp.dstport"
meaning = "The receiving application's port; for a client's segments this is the service, such as 80 for HTTP or 443 for HTTPS."

[[format.fields]]
name = "Sequence number"
wireshark = "tcp.seq"
meaning = "The stream position of this segment's first data byte. In a SYN it is the initial sequence number, and the first data byte is that number plus one."
section = "3.4"

[[format.fields]]
name = "Acknowledgement number"
wireshark = "tcp.ack"
meaning = "When the ACK flag is set, the next sequence number the sender expects from the other side: every byte before it has arrived."

[[format.fields]]
name = "Header length"
wireshark = "tcp.hdr_len"
meaning = "The data offset: header length in 32-bit words (5 to 15, so 20 to 60 bytes). The payload starts this many bytes into the segment."

[[format.fields]]
name = "Flags"
wireshark = "tcp.flags"
meaning = "Control bits: SYN opens a connection, ACK marks the acknowledgement number valid, FIN closes one direction, RST aborts, PSH asks for prompt delivery, URG marks urgent data, and ECE and CWR carry congestion signals (RFC 3168)."

[[format.fields]]
name = "Window"
wireshark = "tcp.window_size_value"
meaning = "How many more bytes the sender of this segment is ready to receive. It is multiplied by 2 to the power of the window scale option negotiated in the SYNs."

[[format.fields]]
name = "Checksum"
wireshark = "tcp.checksum"
meaning = "Ones' complement checksum over a pseudo-header (IP addresses, protocol, TCP length), the header and the data. Captures taken on the sending host often show it as wrong because the network card fills it in later."

[[format.fields]]
name = "Urgent pointer"
wireshark = "tcp.urgent_pointer"
meaning = "With the URG flag, the offset from the sequence number to the end of urgent data. Almost never used."
section = "3.8.5"

[[format.fields]]
name = "Options"
wireshark = "tcp.options"
meaning = "Kind-length-value entries such as maximum segment size, window scale, selective acknowledgement permitted and timestamps, mostly exchanged in the SYN segments."
section = "3.2"

[[format]]
id = "udp"
name = "User Datagram Protocol"
keys = ["UDP", "User Datagram Protocol"]
wireshark = "udp"
summary = "A minimal transport: each datagram travels on its own between two ports, with no connection, ordering or retransmission."
organisation = """
An eight-byte header of four 16-bit big-endian fields (source port, destination port, length and checksum) followed directly by the payload.

The length counts the header and the payload together, so it is never less than 8. Over IPv4 a checksum of zero means none was computed; over IPv6 the checksum is mandatory. The checksum covers a pseudo-header of the IP addresses, protocol and length as well as the datagram itself.

The ports name the application by convention: 53 DNS, 5353 multicast DNS, 123 NTP. Each datagram is one application message, so unlike TCP no reassembly is needed.
"""
carries = ["dns", "ntp"]
group = "Transport"
ip_protocols = [17]

[[format.specs]]
document = "RFC 768"
title = "User Datagram Protocol"
url = "https://www.rfc-editor.org/rfc/rfc768"
rfc = 768

[[format.fields]]
name = "Source port"
wireshark = "udp.srcport"
meaning = "The sender's port; replies are addressed to it. Zero when no reply is expected."

[[format.fields]]
name = "Destination port"
wireshark = "udp.dstport"
meaning = "The receiving application's port. Well-known ports below 1024 often name the protocol inside (53 for DNS, 123 for NTP)."

[[format.fields]]
name = "Length"
wireshark = "udp.length"
meaning = "Bytes in the header and payload together; at least 8."

[[format.fields]]
name = "Checksum"
wireshark = "udp.checksum"
meaning = "Ones' complement sum over a pseudo-header (addresses, protocol, length), the header and the payload. Zero over IPv4 means no checksum."

