[[format]]
id = "s7comm"
name = "Siemens S7 communication (S7comm)"
keys = ["S7comm", "S7", "S7 Communication", "Siemens S7", "S7comm-plus", "S7CommPlus"]
wireshark = "s7comm"
summary = "Siemens' proprietary protocol for programming and reading or writing data in SIMATIC S7 controllers, carried over ISO transport on TCP port 102. No official specification is published; what is known comes from reverse engineering."
group = "Industrial control"
ports = ["tcp/102"]
organisation = """
S7comm is a vendor protocol without a public specification; the layout below is what open-source tools and research have established. It travels as user data of COTP data TPDUs inside TPKT on TCP port 102, after a COTP connection whose called TSAP selects the CPU's rack and slot.

Each message starts with a 10- or 12-byte header, big-endian: protocol ID 0x32, a message type (ROSCTR: 1 job request, 2 acknowledgement, 3 acknowledgement with data, 7 user data), 2 reserved bytes, a 2-byte PDU reference that the reply repeats, a 2-byte parameter length and a 2-byte data length. Acknowledgements add an error class and error code. The parameter block follows, then the data block.

The parameter block's first byte is the function: 0xF0 setup communication (negotiating the PDU size and parallel jobs, always first), 0x04 read variable, 0x05 write variable, 0x1A to 0x1F download and upload of program blocks, 0x28 PLC control (such as a start) and 0x29 PLC stop. Read and write requests list items, each addressing a memory area (0x81 inputs, 0x82 outputs, 0x83 flags, 0x84 data blocks with a DB number), a data type, a length and a start address in bits. User data (type 7) carries diagnostics and other functions grouped by a function group and subfunction, such as reading the system status list.

Newer controllers (S7-1200 and S7-1500) use S7comm-plus, which starts with protocol ID 0x72 and adds integrity protection; its structure is different and only partly understood.
"""

[[format.specs]]
document = "RFC 1006"
title = "ISO Transport Service on top of the TCP Version: 3"
url = "https://www.rfc-editor.org/rfc/rfc1006"
rfc = 1006

