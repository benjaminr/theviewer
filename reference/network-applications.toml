[[format]]
id = "profinet"
name = "PROFINET"
keys = ["PROFINET", "PROFINET IO", "PROFINET RT", "PROFINET DCP", "PN-DCP", "PROFINET Real-Time"]
wireshark = "pn_rt"
summary = "The industrial Ethernet standard of PROFIBUS and PROFINET International, used with Siemens and many other controllers: cyclic I/O data straight on Ethernet, device discovery and naming with DCP, and connection set-up over DCE/RPC on UDP."
group = "Industrial control"
ethertypes = [0x8892]
ports = ["udp/34964"]
carries = ["dcerpc"]
organisation = """
Real-time PROFINET frames use EtherType 0x8892 directly, without IP, usually with an 802.1Q priority tag. The payload begins with a 2-byte big-endian frame ID that says what follows: values from 0x8000 to 0xFBFF are cyclic I/O data of a particular connection, 0xFC01 and 0xFE01 are high and low priority alarms, and 0xFEFC to 0xFEFF are DCP (hello, get and set, identify request and identify response). Lower values are used for clock synchronisation and isochronous traffic.

A cyclic data frame holds the I/O data of the provider, each submodule's value followed by a status byte, then at the end a 2-byte cycle counter, a data status byte and a transfer status byte. Frames are sent at a fixed interval and consumers treat missing ones as a fault.

DCP (discovery and configuration) frames carry a service ID (1 get, 2 set, 3 identify, 4 hello), a service type, a 4-byte transaction ID, a response delay, a data length and blocks of option, suboption, length and value, such as the station name, IP parameters and device vendor. Because DCP set can change a device's name or address without authentication, it is a common concern in assessments.

Connection set-up, parameterisation and record reads and writes go through the context manager: DCE/RPC over UDP port 34964.
"""

