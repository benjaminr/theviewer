[[format]]
id = "nfs"
name = "Network File System"
keys = ["NFS", "NFSv3", "NFSv4", "Network File System"]
wireshark = "nfs"
summary = "The Unix network file system: a client reads and writes files on a server's exported directories by calling ONC RPC procedures of program 100003."
group = "File sharing and remote access"
ports = ["tcp/2049", "udp/2049"]
organisation = """
NFS messages are ONC RPC calls and replies for program 100003, so on TCP each one is preceded by an RPC record mark and starts with the RPC header; the version number in that header says how to read the rest. Everything is XDR: big-endian 32-bit units, with variable-length data padded to four bytes.

In version 3 each operation is its own procedure (1 GETATTR, 3 LOOKUP, 4 ACCESS, 6 READ, 7 WRITE, 8 CREATE, 12 REMOVE, 16 READDIR, 17 READDIRPLUS, 21 COMMIT). Files are named by opaque file handles of up to 64 bytes, obtained from the separate mount protocol (program 100005) and LOOKUP, and access is usually checked with AUTH_SYS credentials, which simply state a user ID.

Version 4 has only two procedures, NULL and COMPOUND. A COMPOUND carries a tag, a minor version (0, 1 or 2) and a list of operations run in order against a current file handle (PUTFH, LOOKUP, OPEN, READ, WRITE, GETATTR, CLOSE; version 4.1 adds SEQUENCE at the head of each compound). The reply lists the result of each operation up to the first failure. Version 4 needs only port 2049 and can use Kerberos through RPCSEC_GSS.
"""

