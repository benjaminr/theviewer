[[format]]
id = "enip-cip"
name = "EtherNet/IP and CIP"
keys = ["EtherNet/IP", "ENIP", "EtherNet-IP", "CIP", "Common Industrial Protocol"]
wireshark = "enip"
summary = "The industrial Ethernet protocol of Rockwell (Allen-Bradley) and other controllers: an encapsulation layer on TCP and UDP carrying the Common Industrial Protocol, used for explicit request and response messaging and cyclic I/O."
group = "Industrial control"
ports = ["tcp/44818", "udp/44818", "udp/2222"]
organisation = """
Explicit messages travel on TCP port 44818 (and UDP for discovery) inside a 24-byte encapsulation header, little-endian: a 2-byte command, a 2-byte length of the data after the header, a 4-byte session handle, a 4-byte status, 8 bytes of sender context that the reply copies, and 4 bytes of options. Commands include 0x0004 ListServices, 0x0063 ListIdentity (a broadcast that makes devices report vendor, product name, serial number and revision), 0x0065 RegisterSession, 0x0066 UnRegisterSession, 0x006F SendRRData and 0x0070 SendUnitData.

SendRRData (unconnected) and SendUnitData (connected) carry an interface handle, a timeout and a common packet format: an item count and items, each a 2-byte type ID, a 2-byte length and data. An address item (0x0000 null, 0x00A1 connected address) is followed by a data item (0x00B2 unconnected data, 0x00B1 connected data) that holds the CIP message.

A CIP request is a service code, a path size in 16-bit words and a path of segments naming the class, instance and attribute (0x20 class, 0x24 instance, 0x30 attribute), then the service data. The reply sets the service's top bit (0x80) and gives a general status (0 success) and any additional status. Common services are 0x01 Get_Attributes_All, 0x0E Get_Attribute_Single, 0x10 Set_Attribute_Single, 0x52 Unconnected_Send, 0x54 Forward_Open and 0x4E Forward_Close; Logix controllers add 0x4C Read Tag and 0x4D Write Tag with symbolic tag names in the path. Cyclic I/O set up by Forward_Open flows over UDP port 2222.
"""

