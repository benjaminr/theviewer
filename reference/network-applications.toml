[[format]]
id = "rfb"
name = "Remote Framebuffer Protocol (VNC)"
keys = ["RFB", "VNC", "Remote Framebuffer", "Remote Framebuffer Protocol", "Virtual Network Computing"]
wireshark = "vnc"
summary = "The protocol of VNC remote desktops: the server sends rectangles of screen pixels and the client sends key and pointer events."
group = "File sharing and remote access"
ports = ["tcp/5900"]
organisation = """
The server speaks first with a 12-byte version string such as "RFB 003.008" and a newline; the client answers with the version it will use. The server then lists security types (1 none, 2 VNC authentication, plus vendor and TLS-based types). VNC authentication is a 16-byte random challenge that the client encrypts with DES using the password as key, so a captured exchange can be attacked offline. A 4-byte security result (0 OK) follows.

The client sends a 1-byte ClientInit (whether to share the desktop) and the server a ServerInit: framebuffer width and height, a 16-byte pixel format and the desktop name with a 4-byte length. All numbers are big-endian.

After that, each message starts with a 1-byte type and its layout is fixed by the type, with no general length field, so a reader must understand every message to stay in step. Client messages: 0 set pixel format, 2 set encodings, 3 framebuffer update request, 4 key event, 5 pointer event, 6 cut text. Server messages: 0 framebuffer update, 1 set colour map entries, 2 bell, 3 cut text. Key events carry X11 keysyms, so unencrypted sessions reveal typed text.

Display number n listens on port 5900 + n.
"""

