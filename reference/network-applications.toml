# Reference notes on application-layer protocols: mail, file sharing and
# remote access, directories and authentication, the web, voice and video,
# messaging, databases, industrial control and the internet of things. See
# src/reference.rs for the schema. Notes are written for this project in its
# own words; specifications are cited, not copied.
#
# Ports follow the IANA Service Name and Transport Protocol Port Number
# Registry. A port that is not registered for the protocol but is its
# universal default (Kafka 9092, NATS 4222) is noted as such in the text.
# Protocols covered elsewhere: DNS, HTTP/1.x, TLS, SSH, NTP, MQTT and
# Modbus/TCP in network.toml; DHCP, TFTP, SNMP, Syslog, QUIC, STUN, NetBIOS
# and routing in network-infrastructure.toml.

# ---------------------------------------------------------------------------
# Mail
# ---------------------------------------------------------------------------

[[format]]
id = "smtp"
name = "Simple Mail Transfer Protocol"
keys = ["SMTP", "Simple Mail Transfer Protocol", "ESMTP", "Extended SMTP", "SMTP submission"]
wireshark = "smtp"
summary = "The text protocol that moves email between mail servers and from mail clients to their outgoing server: the client names the sender and recipients, then sends the message itself."
group = "Mail"
ports = ["tcp/25", "tcp/587", "tcp/465"]
organisation = """
SMTP is a line-oriented ASCII dialogue over TCP, every line ending in CR LF. The server speaks first with a 220 greeting. The client then sends commands, each a four-letter verb and its arguments ("MAIL FROM:<alice@example.org>"), and waits for a reply after each one unless the server has offered PIPELINING. Commands and replies are matched purely by order.

Every reply begins with a three-digit code. The first digit gives the outcome (2 done, 3 send more, 4 temporary failure, 5 permanent failure) and the text after it is for people. A reply that runs over several lines puts a hyphen after the code on every line but the last ("250-SIZE", then "250 HELP").

A transaction is MAIL FROM, one RCPT TO per recipient, then DATA. After a 354 reply the client sends the message (headers, an empty line and the body in Internet Message Format) and ends it with a line holding a single full stop; any line of the message that starts with a full stop has another one added in front, which the server removes. EHLO lists the extensions the server supports, such as STARTTLS, AUTH, SIZE, 8BITMIME and CHUNKING (BDAT).

Port 25 carries relay between servers, port 587 is message submission from clients (normally upgraded with STARTTLS and authenticated), and port 465 is submission with TLS from the first byte, so nothing on it is readable without the keys.
"""

[[format.specs]]
document = "RFC 5321"
title = "Simple Mail Transfer Protocol"
url = "https://www.rfc-editor.org/rfc/rfc5321"
rfc = 5321
section = "4.1"

[[format.specs]]
document = "RFC 6409"
title = "Message Submission for Mail"
url = "https://www.rfc-editor.org/rfc/rfc6409"
rfc = 6409

[[format.specs]]
document = "RFC 8314"
title = "Cleartext Considered Obsolete: Use of Transport Layer Security (TLS) for Email Submission and Access"
url = "https://www.rfc-editor.org/rfc/rfc8314"
rfc = 8314

[[format.fields]]
name = "Command"
wireshark = "smtp.req.command"
meaning = "A verb such as EHLO, MAIL, RCPT, DATA, RSET, NOOP, QUIT, STARTTLS or AUTH, followed by its arguments. Verbs are case-insensitive."
section = "4.1"

[[format.fields]]
name = "Reply code"
wireshark = "smtp.response.code"
aliases = ["Response code"]
meaning = "Three digits: 220 service ready, 250 completed, 354 start message input, 421 closing, 450 or 451 try later, 530 authentication required, 550 mailbox unavailable, 554 transaction failed."
section = "4.2"

[[format.fields]]
name = "MAIL FROM"
aliases = ["Sender"]
meaning = "The envelope sender (the return path for bounces), which need not match the From header inside the message. An empty path <> marks a bounce."
section = "4.1.1.2"

[[format.fields]]
name = "RCPT TO"
aliases = ["Recipient"]
meaning = "One envelope recipient. Each RCPT gets its own reply, so a server can accept some recipients and refuse others."
section = "4.1.1.3"

[[format.fields]]
name = "DATA"
meaning = "Starts the message content, which ends with a line holding only a full stop. Leading full stops inside the message are doubled on the wire."
section = "4.1.1.4"

[[format.fields]]
name = "EHLO"
aliases = ["HELO"]
meaning = "The client's greeting with its host name. EHLO asks the server to list its extensions in a multi-line 250 reply; HELO is the older form without extensions."
section = "4.1.1.1"

[[format]]
id = "pop3"
name = "Post Office Protocol version 3"
keys = ["POP3", "POP", "Post Office Protocol", "Post Office Protocol version 3", "Post Office Protocol - Version 3"]
wireshark = "pop"
summary = "A simple text protocol for downloading mail from a mailbox: the client logs in, lists the messages, fetches the ones it wants and usually deletes them from the server."
group = "Mail"
ports = ["tcp/110", "tcp/995"]
organisation = """
POP3 is a line-oriented ASCII dialogue over TCP with CR LF line ends. The server greets first; the client sends one command at a time (a keyword of three or four letters and its arguments) and the server answers each with a status indicator: "+OK" for success or "-ERR" for failure, followed by free text.

Replies to RETR, TOP, LIST and UIDL without an argument run over several lines and end with a line holding a single full stop. Lines of the message that begin with a full stop have another one added in front, which the client removes.

A session moves through three states: authorisation (USER and PASS, or APOP with a digest of the timestamp in the greeting), transaction (STAT, LIST, RETR, DELE and so on) and update, entered on QUIT, when deletions are applied. Passwords cross in clear text unless the session is upgraded with STLS or runs on port 995, where TLS starts with the first byte.
"""

[[format.specs]]
document = "RFC 1939"
title = "Post Office Protocol - Version 3"
url = "https://www.rfc-editor.org/rfc/rfc1939"
rfc = 1939
section = "3"

[[format.specs]]
document = "RFC 8314"
title = "Cleartext Considered Obsolete: Use of Transport Layer Security (TLS) for Email Submission and Access"
url = "https://www.rfc-editor.org/rfc/rfc8314"
rfc = 8314

[[format.fields]]
name = "Command"
wireshark = "pop.request.command"
meaning = "USER, PASS, APOP, STAT, LIST, RETR, DELE, NOOP, RSET, TOP, UIDL, CAPA, STLS or QUIT, with arguments separated by spaces."
section = "9"

[[format.fields]]
name = "Status indicator"
wireshark = "pop.response.indicator"
aliases = ["Response"]
meaning = "\"+OK\" when the command succeeded, \"-ERR\" when it did not; the rest of the line is human-readable."
section = "3"

[[format.fields]]
name = "Greeting"
meaning = "The server's first +OK line. A server that supports APOP puts a unique timestamp in angle brackets here, which the client hashes with the password."
section = "4"

[[format.fields]]
name = "Message number"
meaning = "Messages are numbered from 1 for the session; LIST gives each one's size in bytes and UIDL a unique identifier that stays the same across sessions."
section = "5"

[[format]]
id = "imap"
name = "Internet Message Access Protocol"
keys = ["IMAP", "IMAP4", "IMAP4rev1", "IMAP4rev2", "Internet Message Access Protocol"]
wireshark = "imap"
summary = "The text protocol for working with mail kept on a server: clients open mailboxes, search, fetch parts of messages and set flags, with many commands in flight at once."
group = "Mail"
ports = ["tcp/143", "tcp/993"]
organisation = """
IMAP is a line-oriented text protocol over TCP with CR LF line ends. Each client command starts with a tag that the client chooses ("a001 SELECT INBOX"), so several commands can be outstanding and their completions told apart.

The server sends three kinds of line. Untagged responses start with "*" and carry data (mailbox sizes, FETCH results, capabilities) whenever the server has it, not only in reply to a particular command. A continuation request starts with "+" and asks the client to send more. A tagged response repeats the command's tag with OK, NO (refused) or BAD (not understood) and ends that command.

Strings that may contain any byte are sent as literals: a byte count in braces at the end of a line ("{342}"), then CR LF and exactly that many bytes. A literal written "{342+}" is sent without waiting for the server's "+". Message bodies arrive this way inside FETCH responses, so a reader has to count bytes rather than look for line ends.

Port 143 starts in clear text (STARTTLS upgrades it); port 993 is IMAP inside TLS from the first byte.
"""

[[format.specs]]
document = "RFC 9051"
title = "Internet Message Access Protocol (IMAP) - Version 4rev2"
url = "https://www.rfc-editor.org/rfc/rfc9051"
rfc = 9051
section = "2.2"

[[format.specs]]
document = "RFC 8314"
title = "Cleartext Considered Obsolete: Use of Transport Layer Security (TLS) for Email Submission and Access"
url = "https://www.rfc-editor.org/rfc/rfc8314"
rfc = 8314

[[format.fields]]
name = "Tag"
wireshark = "imap.tag"
meaning = "A short alphanumeric prefix the client puts on each command; the server's tagged completion carries the same tag."
section = "2.2.1"

[[format.fields]]
name = "Command"
wireshark = "imap.request.command"
meaning = "CAPABILITY, LOGIN, AUTHENTICATE, STARTTLS, SELECT, EXAMINE, LIST, FETCH, STORE, SEARCH, COPY, MOVE, EXPUNGE, IDLE, LOGOUT and others; UID in front makes message numbers unique identifiers."
section = "6"

[[format.fields]]
name = "Untagged response"
meaning = "A line starting \"* \": data such as \"* 23 EXISTS\", \"* 3 FETCH (FLAGS (\\Seen))\" or a status like \"* OK\", sent whenever the server has news."
section = "7"

[[format.fields]]
name = "Status response"
wireshark = "imap.response.status"
aliases = ["Completion"]
meaning = "OK, NO or BAD after the tag, optionally with a response code in square brackets such as [READ-WRITE] or [AUTHENTICATIONFAILED]."
section = "7.1"

[[format.fields]]
name = "Literal"
meaning = "A byte count in braces followed by CR LF and that many bytes of arbitrary data."
section = "4.3"

