# File sharing and remote access
# ---------------------------------------------------------------------------

[[format]]
id = "ftp"
name = "File Transfer Protocol (control connection)"
keys = ["FTP", "File Transfer Protocol", "FTP control", "FTPS"]
wireshark = "ftp"
summary = "The original internet file transfer protocol: commands and replies travel as text on a control connection, while each file or directory listing goes over a separate data connection."
group = "File sharing and remote access"
ports = ["tcp/21", "tcp/990"]
carries = ["ftp-data"]
organisation = """
The control connection is a line-oriented ASCII dialogue over TCP with CR LF line ends. The server greets with a 220 reply; the client sends commands of three or four letters with arguments (USER, PASS, CWD, TYPE, PASV, RETR, STOR, LIST, QUIT) and gets one reply for each, in order.

Replies use three-digit codes: 1yz started and more to come, 2yz done, 3yz send more, 4yz temporary failure, 5yz permanent failure. A multi-line reply starts "nnn-" and ends with a line starting "nnn " with the same code.

Every transfer opens a new data connection. In active mode the client announces an address with PORT h1,h2,h3,h4,p1,p2 (or EPRT) and the server connects to it from port 20. In passive mode the client sends PASV and the server answers "227 Entering Passive Mode (h1,h2,h3,h4,p1,p2)", or EPSV and "229 (|||port|)"; the port is p1 times 256 plus p2. Following these replies is how the data connection's port is found.

User names and passwords are sent in clear text. AUTH TLS upgrades the control connection (explicit FTPS); port 990 is FTP with TLS from the first byte (implicit FTPS).
"""

[[format.specs]]
document = "RFC 959"
title = "File Transfer Protocol"
url = "https://www.rfc-editor.org/rfc/rfc959"
rfc = 959
section = "4.1"

[[format.specs]]
document = "RFC 2428"
title = "FTP Extensions for IPv6 and NATs"
url = "https://www.rfc-editor.org/rfc/rfc2428"
rfc = 2428

[[format.specs]]
document = "RFC 4217"
title = "Securing FTP with TLS"
url = "https://www.rfc-editor.org/rfc/rfc4217"
rfc = 4217

[[format.fields]]
name = "Command"
wireshark = "ftp.request.command"
meaning = "USER, PASS, ACCT, CWD, PWD, TYPE, MODE, PORT, PASV, EPRT, EPSV, RETR, STOR, LIST, NLST, DELE, MKD, RNFR, RNTO, SIZE, FEAT, AUTH, QUIT and others, case-insensitive."
section = "4.1"

[[format.fields]]
name = "Reply code"
wireshark = "ftp.response.code"
aliases = ["Response code"]
meaning = "Three digits: 150 opening data connection, 200 OK, 220 ready, 226 transfer complete, 227 entering passive mode, 230 logged in, 331 password needed, 425 cannot open data connection, 530 not logged in, 550 file unavailable."
section = "4.2"

[[format.fields]]
name = "PORT"
aliases = ["PASV"]
meaning = "Six comma-separated decimals: four for the IPv4 address and two for the port (high byte, low byte) of the data connection."
section = "4.1.2"

[[format.fields]]
name = "TYPE"
meaning = "The representation of transferred files: A for ASCII text with CR LF line ends, I for image (binary, byte for byte)."
section = "3.1.1"

[[format]]
id = "ftp-data"
name = "FTP data connection"
keys = ["FTP-DATA", "FTP data", "FTP data connection"]
wireshark = "ftp-data"
summary = "The separate TCP connection over which FTP sends one file or directory listing, with no framing of its own."
group = "File sharing and remote access"
ports = ["tcp/20", "tcp/989"]
organisation = """
A data connection carries exactly one transfer and has no header: the bytes are the file itself, or for LIST and NLST a directory listing as lines of text. In the usual stream mode the end of the file is marked by closing the connection, so a short connection after a 150 reply and before a 226 reply holds the whole file.

Which connection belongs to which command is found on the control connection: the PORT, EPRT, 227 or 229 exchange names the address and port, and the RETR, STOR or LIST that follows says what will flow and in which direction. In ASCII type (TYPE A) text line ends are converted to CR LF on the wire; in image type (TYPE I) the bytes are unchanged, so the payload can be carved out as the original file.

Active-mode data connections come from the server's port 20; passive-mode ones go to a high port the server chose. Port 989 is the data connection of implicit FTPS, which is TLS-encrypted.
"""

[[format.specs]]
document = "RFC 959"
title = "File Transfer Protocol"
url = "https://www.rfc-editor.org/rfc/rfc959"
rfc = 959
section = "3"

[[format]]
id = "telnet"
name = "Telnet"
keys = ["Telnet", "TELNET", "Telnet Protocol"]
wireshark = "telnet"
summary = "A bidirectional terminal session over TCP: keystrokes go one way and screen output the other, with in-band commands to negotiate terminal options."
group = "File sharing and remote access"
ports = ["tcp/23"]
organisation = """
Telnet data is plain text in the network virtual terminal convention: 7-bit ASCII with CR LF line ends (a lone CR is sent as CR NUL). Everything travels unencrypted, including the login prompt, the user name and the password, which usually appear one character per segment because each keystroke is sent as it is typed.

Control sequences are embedded in the stream, each starting with the byte 0xFF (IAC, interpret as command). The byte after IAC is the command: 251 WILL, 252 WON'T, 253 DO and 254 DON'T negotiate an option named by a third byte; 250 SB begins a subnegotiation that runs until IAC 240 SE; others such as 244 interrupt process and 246 are you there stand alone. A real 0xFF data byte is sent doubled.

Common options are 0 binary transmission, 1 echo, 3 suppress go-ahead, 24 terminal type, 31 window size, 32 terminal speed, 34 line mode and 39 new environment (which can carry the user name). A session usually opens with a burst of option negotiation from both ends.
"""

[[format.specs]]
document = "RFC 854"
title = "Telnet Protocol Specification"
url = "https://www.rfc-editor.org/rfc/rfc854"
rfc = 854

[[format.specs]]
document = "RFC 855"
title = "Telnet Option Specifications"
url = "https://www.rfc-editor.org/rfc/rfc855"
rfc = 855

[[format.specs]]
document = "IANA Telnet Options"
title = "Telnet Options"
url = "https://www.iana.org/assignments/telnet-options/telnet-options.xhtml"

[[format.fields]]
name = "IAC"
meaning = "The byte 0xFF, which marks the next byte as a command rather than data. Two in a row stand for one 0xFF data byte."

[[format.fields]]
name = "Command"
wireshark = "telnet.cmd"
meaning = "The byte after IAC: 240 SE, 241 NOP, 243 break, 244 interrupt process, 246 are you there, 250 SB, 251 WILL, 252 WON'T, 253 DO, 254 DON'T."

[[format.fields]]
name = "Option"
meaning = "The option a WILL, WON'T, DO, DON'T or SB refers to, such as 1 echo, 24 terminal type or 31 negotiate about window size."

[[format]]
id = "smb"
name = "Server Message Block version 1 (CIFS)"
keys = ["SMB", "SMB1", "SMBv1", "CIFS", "Common Internet File System", "Server Message Block version 1"]
wireshark = "smb"
summary = "The original Windows file and printer sharing protocol, also used to carry named pipes for remote procedure calls; deprecated and disabled in current Windows, but still met on older and embedded systems."
group = "File sharing and remote access"
ports = ["tcp/445", "tcp/139"]
carries = ["dcerpc"]
organisation = """
Over TCP port 445 each SMB message is preceded by a 4-byte header: a zero byte and a 24-bit big-endian length of the message that follows. On port 139 the same four bytes are a NetBIOS session service header (type 0x00, session message), after a session request naming the server.

The message starts with a fixed 32-byte header: the signature bytes 0xFF "SMB", a 1-byte command, a 4-byte status (an NTSTATUS code in responses), flags, flags2, a security signature, then the tree ID, process ID, user ID and multiplex ID that identify the share, the process, the logged-on session and the request. Numbers are little-endian. A response is matched to its request by the multiplex ID, together with the process ID.

After the header come a word count and that many 16-bit parameter words, then a byte count and that many data bytes. Commands with names ending "AndX" chain a further command into the same message through an offset in their parameter words, so one message can hold, for example, a session setup and a tree connect.

The negotiate exchange lists dialect strings; a client offering "SMB 2.002" or "SMB 2.???" and a server choosing it switches to SMB2. SMB1's transaction commands were the target of the 2017 EternalBlue exploits.
"""

[[format.specs]]
document = "[MS-CIFS]"
title = "Common Internet File System (CIFS) Protocol"
url = "https://learn.microsoft.com/en-us/openspecs/windows_protocols/ms-cifs/d416ff7c-c536-406e-a951-4f04b2fd1d2b"
section = "2.2.3.1"

[[format.specs]]
document = "RFC 1002"
title = "Protocol standard for a NetBIOS service on a TCP/UDP transport: Detailed specifications"
url = "https://www.rfc-editor.org/rfc/rfc1002"
rfc = 1002

[[format.fields]]
name = "Protocol"
wireshark = "smb.server_component"
aliases = ["Signature"]
meaning = "The four bytes 0xFF 'S' 'M' 'B' that open every SMB1 message."
section = "2.2.3.1"

[[format.fields]]
name = "Command"
wireshark = "smb.cmd"
meaning = "The operation: 0x72 negotiate, 0x73 session setup AndX, 0x75 tree connect AndX, 0xA2 NT create AndX, 0x2E read AndX, 0x2F write AndX, 0x04 close, 0x25 transaction, 0x32 transaction2, 0x71 tree disconnect."
section = "2.2.3.1"

[[format.fields]]
name = "Status"
wireshark = "smb.nt_status"
meaning = "A 32-bit NTSTATUS in responses: 0 success, 0xC0000022 access denied, 0xC0000034 object name not found, 0xC000006D logon failure, 0xC0000016 more processing required (during authentication)."
section = "2.2.3.1"

[[format.fields]]
name = "Tree ID"
wireshark = "smb.tid"
aliases = ["TID"]
meaning = "Identifies the connected share, as returned by tree connect."
section = "2.2.3.1"

[[format.fields]]
name = "User ID"
wireshark = "smb.uid"
aliases = ["UID"]
meaning = "Identifies the authenticated session, as returned by session setup."
section = "2.2.3.1"

[[format.fields]]
name = "Multiplex ID"
wireshark = "smb.mid"
aliases = ["MID"]
meaning = "Chosen by the client for each request and copied into the response, so several requests can be outstanding."
section = "2.2.3.1"

[[format]]
id = "smb2"
name = "Server Message Block versions 2 and 3"
keys = ["SMB2", "SMB3", "SMB 2", "SMB 3", "SMBv2", "SMBv3", "Server Message Block version 2", "Server Message Block version 3", "Server Message Block 2", "Server Message Block 3"]
wireshark = "smb2"
summary = "The Windows file sharing protocol in use today (also spoken by Samba and most NAS devices): opening, reading and writing files on shares, plus named pipes for remote procedure calls, with signing and, from SMB 3, encryption."
group = "File sharing and remote access"
ports = ["tcp/445", "tcp/139"]
carries = ["dcerpc"]
organisation = """
On TCP port 445 every message is preceded by a 4-byte transport header: a zero byte and a 24-bit big-endian length. (Port 139 uses the NetBIOS session service, whose header has the same shape.) Several SMB2 messages may follow one transport header, chained by the Next Command offset.

Each message starts with a 64-byte header, little-endian: the bytes 0xFE "SMB", a structure size of 64, a credit charge, a status (NTSTATUS in responses) or channel sequence, a 2-byte command, credits requested or granted, flags, the next-command offset, a 64-bit message ID, then either a process ID and tree ID or, for asynchronous replies, a 64-bit async ID, a 64-bit session ID and a 16-byte signature. Requests and responses are matched by message ID; the flags' first bit marks a response.

The command-specific body follows, starting with its own 2-byte structure size. Buffers inside the body are located by offsets measured from the start of the SMB2 header.

A message that starts with 0xFD "SMB" instead is an SMB 3 transform header: the 52-byte header carries a nonce and the session ID, and what follows is encrypted. 0xFC "SMB" marks a compressed message. Negotiate selects the dialect: 0x0202, 0x0210, 0x0300, 0x0302 or 0x0311.
"""

[[format.specs]]
document = "[MS-SMB2]"
title = "Server Message Block (SMB) Protocol Versions 2 and 3"
url = "https://learn.microsoft.com/en-us/openspecs/windows_protocols/ms-smb2/5606ad47-5ee0-437a-817e-70c366052962"
section = "2.2.1"

[[format.fields]]
name = "Protocol ID"
wireshark = "smb2.protocol_id"
aliases = ["Signature"]
meaning = "0xFE 'S' 'M' 'B' for a normal SMB2 header, 0xFD 'S' 'M' 'B' for an encrypted transform header, 0xFC 'S' 'M' 'B' for a compression transform header."
section = "2.2.1"

[[format.fields]]
name = "Command"
wireshark = "smb2.cmd"
meaning = "The operation: 0 negotiate, 1 session setup, 2 logoff, 3 tree connect, 4 tree disconnect, 5 create (open), 6 close, 7 flush, 8 read, 9 write, 10 lock, 11 ioctl, 12 cancel, 13 echo, 14 query directory, 15 change notify, 16 query info, 17 set info, 18 oplock break."
section = "2.2.1"

[[format.fields]]
name = "Status"
wireshark = "smb2.nt_status"
aliases = ["NT Status"]
meaning = "In responses, an NTSTATUS code: 0 success, 0x00000103 pending, 0xC0000016 more processing required, 0xC0000022 access denied, 0xC0000034 name not found, 0xC000006D logon failure."
section = "2.2.1"

[[format.fields]]
name = "Flags"
wireshark = "smb2.flags"
meaning = "Bit 0 server to client (a response), bit 1 asynchronous, bit 2 related operations in a compound, bit 3 signed, bit 28 DFS operation."
section = "2.2.1"

[[format.fields]]
name = "Message ID"
wireshark = "smb2.msg_id"
meaning = "A 64-bit number the client gives each request; the response carries the same value."
section = "2.2.1"

[[format.fields]]
name = "Credits"
aliases = ["Credit request", "Credit response", "Credit charge"]
meaning = "Flow control: the client asks for credits and the server grants them; each request spends credits in proportion to its size."
section = "2.2.1"

[[format.fields]]
name = "Tree ID"
wireshark = "smb2.tid"
meaning = "Identifies the share connected by tree connect, such as \\\\server\\share or the IPC$ share used for named pipes."
section = "2.2.1"

[[format.fields]]
name = "Session ID"
wireshark = "smb2.sesid"
meaning = "Identifies the authenticated session established by session setup."
section = "2.2.1"

[[format.fields]]
name = "Signature"
wireshark = "smb2.signature"
meaning = "16 bytes: a keyed hash of the message when the signed flag is set, otherwise zero."
section = "2.2.1"

[[format]]
id = "onc-rpc"
name = "ONC Remote Procedure Call"
keys = ["ONC RPC", "ONC-RPC", "Sun RPC", "SunRPC", "ONC Remote Procedure Call", "RPCBIND", "Portmapper", "Portmap"]
wireshark = "rpc"
summary = "Sun's remote procedure call protocol, used by NFS and its helpers: a client calls a numbered procedure of a numbered program, with arguments and results encoded in XDR."
group = "File sharing and remote access"
ports = ["tcp/111", "udp/111"]
carries = ["nfs"]
organisation = """
Everything is encoded in XDR: big-endian 32-bit units, with strings and opaque data given a 4-byte length and padded to a multiple of four bytes. Over UDP each datagram is one message. Over TCP each message is split into record fragments, each preceded by a 4-byte record mark whose top bit means last fragment and whose other 31 bits give the fragment's length.

A message begins with a transaction ID (xid) chosen by the caller and copied into the reply, then a message type (0 call, 1 reply). A call continues with the RPC version (2), the program number, program version and procedure number, a credential and a verifier (each a flavour and up to 400 bytes of opaque data), and then the procedure's arguments.

A reply says whether the call was accepted or denied. An accepted reply carries a verifier and an accept status (0 success, 1 program unavailable, 2 version mismatch, 3 procedure unavailable, 4 garbage arguments, 5 system error), followed on success by the results. A reply has no program or procedure numbers, so it can only be decoded by finding the call with the same xid.

Programs find each other through rpcbind (the portmapper, program 100000) on port 111, which maps program and version numbers to ports.
"""

[[format.specs]]
document = "RFC 5531"
title = "RPC: Remote Procedure Call Protocol Specification Version 2"
url = "https://www.rfc-editor.org/rfc/rfc5531"
rfc = 5531
section = "9"

[[format.specs]]
document = "RFC 4506"
title = "XDR: External Data Representation Standard"
