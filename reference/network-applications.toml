[[format]]
id = "rtcp"
name = "RTP Control Protocol"
keys = ["RTCP", "RTP Control Protocol", "RTP control"]
wireshark = "rtcp"
summary = "RTP's companion: periodic reports from senders and receivers on packets sent, loss and jitter, plus names for the streams, used to monitor and adapt call quality."
group = "Voice and video"
ports = ["udp/5005"]
organisation = """
RTCP traditionally uses the odd port just above its RTP stream's port, though it is now often multiplexed on the same port as RTP and told apart by its packet type byte (200 to 204 and above, where RTP payload types would be 72 to 76 with the marker bit set). Packets are sent together as a compound packet in one datagram, starting with a sender or receiver report.

Each RTCP packet starts with a 4-byte header: version 2, a padding bit, a 5-bit count (of report blocks or items), an 8-bit packet type and a 16-bit length in 32-bit words minus one, so the next packet starts at (length + 1) times 4 bytes. All numbers are big-endian. Most types then give the sender's SSRC.

A sender report (200) carries a 64-bit NTP wall-clock time and the matching RTP timestamp, which let a receiver synchronise audio and video, and the sender's packet and byte counts. Sender and receiver reports (201) then hold report blocks about each stream received: fraction lost, cumulative packets lost, the highest sequence number seen, interarrival jitter and the timing of the last sender report, from which round-trip time can be worked out. SDES (202) carries the CNAME and other names, BYE (203) says a source is leaving, and feedback types 205 and 206 carry NACKs and picture loss indications.
"""

