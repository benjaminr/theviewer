[[format]]
id = "kerberos"
name = "Kerberos version 5"
keys = ["Kerberos", "Kerberos 5", "Kerberos V5", "KRB5", "Kerberos version 5"]
wireshark = "kerberos"
summary = "The ticket-based authentication protocol of Active Directory and many Unix realms: a client proves its identity to a key distribution centre once and receives tickets that admit it to individual services."
group = "Directory and authentication"
ports = ["tcp/88", "udp/88", "tcp/464", "udp/464"]
organisation = """
Messages are ASN.1 structures encoded with DER, each wrapped in an APPLICATION tag that names its type: 10 AS-REQ (first byte 0x6A), 11 AS-REP (0x6B), 12 TGS-REQ (0x6C), 13 TGS-REP (0x6D), 14 AP-REQ (0x6E), 15 AP-REP (0x6F), 30 KRB-ERROR (0x7E). Inside, numbered context tags hold the fields, including the protocol version 5 and the message type again.

Over UDP each datagram is one message. Over TCP each message is preceded by a 4-byte big-endian length. Requests and replies are paired by a nonce in the request body that the encrypted part of the reply returns.

An AS exchange obtains a ticket-granting ticket: the request names the client principal, the realm and the service krbtgt, and lists the encryption types the client supports (17 and 18 AES, 23 RC4-HMAC). Pre-authentication data (an encrypted timestamp) proves the password. A TGS exchange presents that ticket to obtain a ticket for a service, such as cifs/fileserver or HTTP/web; AP-REQ then hands it to the service, usually inside SMB, LDAP or HTTP authentication. Tickets and reply parts are encrypted with the keys of the service or the user, so a reply encrypted with RC4 is the material for offline password attacks.

Port 464 carries password changes (kpasswd).
"""

