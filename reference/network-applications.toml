[[format]]
id = "mysql"
name = "MySQL client/server protocol"
keys = ["MySQL", "MariaDB", "MySQL protocol", "MySQL client/server protocol"]
wireshark = "mysql"
summary = "The protocol between MySQL or MariaDB clients and servers: a handshake and login, then text SQL queries or prepared statements and their result sets."
group = "Databases"
ports = ["tcp/3306"]
organisation = """
Every packet starts with a 4-byte header: a 3-byte little-endian payload length and a 1-byte sequence ID. The sequence ID starts at 0 for each new command and goes up by one with every packet in either direction, so it shows where a packet sits in an exchange. A payload of 16 MB or more is split, each full-size piece being followed by the next.

The server speaks first with an initial handshake: protocol version 10, a null-terminated server version string, a connection ID, the first part of a random challenge, capability flags, the character set and status, and the name of the authentication plugin. The client answers with a handshake response (capabilities, maximum packet size, user name, the scrambled password and the database), or first with a short SSL request after which TLS takes over.

In the command phase the first payload byte is the command: 0x03 COM_QUERY (followed by the SQL text), 0x16 prepare, 0x17 execute, 0x02 change database, 0x0E ping, 0x01 quit. Replies start with 0x00 (OK: affected rows and last insert ID as length-encoded integers), 0xFF (error: a 2-byte code, "#", a five-character SQLSTATE and a message) or, for a result set, a column count followed by column definitions and rows, each row a series of length-encoded strings, ended by an EOF or OK packet starting 0xFE.
"""

[[format.specs]]
document = "MySQL Client/Server Protocol"
title = "MySQL Source Code Documentation: Client/Server Protocol"
url = "https://dev.mysql.com/doc/dev/mysql-server/latest/PAGE_PROTOCOL.html"

[[format.fields]]
name = "Payload length"
wireshark = "mysql.packet_length"
aliases = ["Length", "Packet length"]
meaning = "The payload's size in bytes, three bytes little-endian, not counting the 4-byte header."

[[format.fields]]
name = "Sequence ID"
wireshark = "mysql.packet_number"
aliases = ["Packet number"]
meaning = "Restarts at 0 with each command and increases by one for each packet that follows, in either direction."

[[format.fields]]
name = "Command"
wireshark = "mysql.command"
meaning = "The first byte of a command packet: 0x01 quit, 0x02 init DB, 0x03 query, 0x0E ping, 0x16 statement prepare, 0x17 statement execute, 0x19 statement close."

[[format.fields]]
name = "Error code"
wireshark = "mysql.error_code"
meaning = "In an error packet (0xFF), a 2-byte little-endian code such as 1045 access denied, 1064 SQL syntax error or 1146 table does not exist."

[[format.fields]]
name = "SQL state"
wireshark = "mysql.sqlstate"
aliases = ["SQLSTATE"]
meaning = "Five characters after a '#' in an error packet, a standard SQL error class such as 28000 or 42S02."

[[format.fields]]
name = "Capability flags"
aliases = ["Capabilities"]
meaning = "Bits each side sets for features it supports, such as 0x200 protocol 4.1, 0x800 SSL, 0x8000 secure connection, 0x80000 plugin authentication."

[[format]]
id = "postgresql"
name = "PostgreSQL frontend/backend protocol"
keys = ["PostgreSQL", "Postgres", "PGSQL", "PostgreSQL protocol", "PostgreSQL wire protocol"]
wireshark = "pgsql"
summary = "The protocol between PostgreSQL clients and servers (and many compatible databases): start-up and authentication, then simple queries or the extended parse, bind and execute cycle, with results as row messages."
group = "Databases"
ports = ["tcp/5432"]
organisation = """
After start-up, every message is a 1-byte type character followed by a 4-byte big-endian length that counts itself and the body but not the type byte. Messages follow each other on the stream with nothing in between.

The very first message has no type byte: a length, then a 4-byte code. 196608 (version 3.0) or 196610 (3.2) starts a session and is followed by null-terminated name and value pairs such as user, database and application_name. The special codes 80877103 (SSL request), 80877104 (GSS encryption request) and 80877102 (cancel request) come first instead when the client wants encryption or to cancel a query; the server answers an SSL request with a single "S" or "N" byte, and a TLS handshake follows an "S".

From the client, Q sends a simple query as SQL text; P (parse), B (bind), D (describe), E (execute) and S (sync) make up the extended protocol; p carries passwords and SASL responses; X ends the session. From the server, R is an authentication request (0 OK, 3 clear-text password, 5 MD5, 10 SASL), S a parameter status, K the backend key, T a row description, D a data row (a column count, then for each column a 4-byte length, -1 for NULL, and the value), C command complete ("SELECT 3"), E an error, N a notice and Z ready for query, whose status byte is I idle, T in a transaction or E in a failed transaction.
"""

[[format.specs]]
document = "PostgreSQL Message Formats"
title = "PostgreSQL Documentation: Frontend/Backend Protocol, Message Formats"
url = "https://www.postgresql.org/docs/current/protocol-message-formats.html"

[[format.specs]]
document = "PostgreSQL Message Flow"
title = "PostgreSQL Documentation: Frontend/Backend Protocol, Message Flow"
url = "https://www.postgresql.org/docs/current/protocol-flow.html"

[[format.fields]]
name = "Type"
wireshark = "pgsql.type"
aliases = ["Message type"]
meaning = "One ASCII character naming the message; the same letter can mean different things in each direction (S is Sync from the client, ParameterStatus from the server)."

[[format.fields]]
name = "Length"
wireshark = "pgsql.length"
