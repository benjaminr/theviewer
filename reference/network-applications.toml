[[format]]
id = "dcerpc"
name = "DCE/RPC and Microsoft RPC"
keys = ["DCE/RPC", "DCERPC", "MSRPC", "MS-RPC", "MS-RPCE", "Microsoft RPC", "DCE RPC", "DCE Remote Procedure Call"]
wireshark = "dcerpc"
summary = "The remote procedure call protocol behind most Windows management interfaces (service control, registry, directory replication, scheduled tasks), carried over TCP or over SMB named pipes."
group = "File sharing and remote access"
ports = ["tcp/135", "udp/135"]
organisation = """
The connection-oriented form, used over TCP and named pipes, starts every PDU with a 16-byte header: version 5, minor version 0, a packet type, flags (first fragment 0x01, last fragment 0x02), a 4-byte data representation label, the fragment length, the authentication trailer length and a 4-byte call ID. The data representation label's first byte says whether the rest is little-endian (0x10, the usual case) or big-endian. Requests and responses share the call ID; large calls are split into fragments.

A client first sends a bind (type 11) listing presentation contexts: each pairs an interface UUID and version, which names the service being called, with a transfer syntax (NDR or NDR64). The server's bind ack (12) accepts or rejects each. Requests (0) then carry an allocation hint, a context ID and an operation number (opnum) selecting the method; responses (2) carry the results and faults (3) a status code. Arguments are marshalled in NDR.

When authentication is used, an 8-byte security trailer and the token (NTLM, Kerberos or SPNEGO) follow the stub data, and with packet privacy the stub data itself is encrypted. The endpoint mapper on port 135 tells clients which dynamic port serves an interface; over SMB, interfaces are reached through pipes such as \\pipe\\svcctl or \\pipe\\samr on the IPC$ share.
"""

