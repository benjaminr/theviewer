[[format]]
id = "bacnet"
name = "BACnet/IP"
keys = ["BACnet", "BACnet/IP", "BVLC", "BACnet Virtual Link Control", "Building Automation and Control Networks"]
wireshark = "bvlc"
summary = "The building automation protocol for heating, ventilation, access control and lighting systems, here carried over UDP: devices discover each other and read and write the properties of objects such as sensors and set points."
group = "Industrial control"
ports = ["udp/47808"]
organisation = """
Each UDP datagram starts with a 4-byte BACnet Virtual Link Control header: type 0x81 (BACnet/IP), a function and a 2-byte big-endian length of the whole datagram. Functions include 0x0A original unicast NPDU, 0x0B original broadcast NPDU, 0x04 forwarded NPDU (which first gives the original sender's 6-byte address), 0x05 register foreign device and 0x00 result.

The network layer header (NPDU) follows: version 0x01 and a control byte whose bits say whether this is a network-layer message (bit 7), whether destination and source network addresses are present (bits 5 and 3), whether a reply is expected (bit 2) and the priority (bits 0 and 1). Optional destination and source network numbers and MAC addresses and a hop count come next.

The application layer header (APDU) begins with the PDU type in its top four bits: 0 confirmed request, 1 unconfirmed request, 2 simple acknowledgement, 3 complex acknowledgement, 4 segment acknowledgement, 5 error, 6 reject, 7 abort. Confirmed requests carry an invoke ID that the acknowledgement repeats, and a service choice such as 12 readProperty, 14 readPropertyMultiple or 15 writeProperty; unconfirmed services include 0 I-Am, 7 Who-Has and 8 Who-Is. Parameters are tagged values naming object types and instances (analog-input 1), property identifiers (85 present-value) and their data.
"""

