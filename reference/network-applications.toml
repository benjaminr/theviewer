[[format]]
id = "opc-ua"
name = "OPC UA binary protocol"
keys = ["OPC UA", "OPC-UA", "OPCUA", "OPC Unified Architecture", "UA TCP", "UACP", "OPC UA Connection Protocol"]
wireshark = "opcua"
summary = "The industrial interoperability protocol: clients browse a server's address space of nodes, read and write variables, call methods and subscribe to changes, over a secure channel on TCP."
group = "Industrial control"
ports = ["tcp/4840", "tcp/4843", "udp/4840"]
organisation = """
Every message chunk starts with an 8-byte header: a 3-character ASCII message type, a 1-byte chunk type and a 4-byte little-endian message size that includes the header. Message types are HEL (hello) and ACK (acknowledge), which agree buffer sizes and carry the endpoint URL, ERR (error), RHE (reverse hello), and OPN, MSG and CLO, which open, use and close a secure channel. The chunk type is 'F' for the final chunk of a message, 'C' for an intermediate one and 'A' to abort a message.

OPN, MSG and CLO continue with a 4-byte secure channel ID and a security header: for OPN an asymmetric one with the security policy URI (such as http://opcfoundation.org/UA/SecurityPolicy#None or #Basic256Sha256), the sender's certificate and the receiver's certificate thumbprint; for MSG and CLO a 4-byte token ID. A sequence header follows: a sequence number and a request ID, which the response repeats.

The body is a service request or response in OPC UA binary encoding, beginning with the numeric node ID of its encoding (for example 631 ReadRequest, 634 ReadResponse, 527 BrowseRequest, 446 OpenSecureChannelRequest) and then a request header with an authentication token, timestamp and request handle. With the None policy everything is readable; with Sign the body is signed, and with SignAndEncrypt everything after the security header is encrypted. All numbers are little-endian. Port 4843 is OPC UA over TLS; UDP port 4840 carries multicast discovery and PubSub.
"""

