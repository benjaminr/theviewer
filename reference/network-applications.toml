aliases = ["Token type"]
meaning = "In a response, the type of each item: 0x81 COLMETADATA, 0xD1 ROW, 0xAA ERROR, 0xAB INFO, 0xAD LOGINACK, 0xE3 ENVCHANGE, 0xFD DONE, 0xFE DONEPROC, 0xFF DONEINPROC."
