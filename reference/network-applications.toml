wireshark = "mongo.request_id"
aliases = ["requestID"]
meaning = "An identifier the sender chooses for this message."

[[format.fields]]
name = "Response to"
wireshark = "mongo.response_to"
aliases = ["responseTo"]
meaning = "In a reply, the request ID of the message being answered; 0 otherwise."

[[format.fields]]
name = "Opcode"
wireshark = "mongo.opcode"
aliases = ["opCode"]
meaning = "2013 OP_MSG, 2012 OP_COMPRESSED; legacy 1 OP_REPLY, 2004 OP_QUERY and others removed in recent servers."

[[format.fields]]
name = "Flag bits"
wireshark = "mongo.msg.flags"
aliases = ["flagBits"]
meaning = "In OP_MSG: bit 0 a CRC-32C checksum ends the message, bit 1 no reply will follow (more to come), bit 16 the client accepts several replies."

[[format.fields]]
