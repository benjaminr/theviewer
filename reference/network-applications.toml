[[format]]
id = "http2"
name = "HTTP/2"
keys = ["HTTP/2", "HTTP2", "h2", "h2c", "HTTP version 2"]
wireshark = "http2"
summary = "The binary framing of HTTP that runs many requests and responses at once over one TCP connection, as interleaved frames on numbered streams with compressed headers."
group = "Web"
carries = ["grpc"]
organisation = """
HTTP/2 nearly always runs inside TLS, chosen during the handshake by the ALPN name "h2"; cleartext HTTP/2 (h2c) is rare. The client begins with a fixed 24-byte preface, "PRI * HTTP/2.0" followed by CR LF CR LF "SM" CR LF CR LF, and both ends then send a SETTINGS frame.

Everything after that is frames. Each has a 9-byte header: a 24-bit length of the payload, an 8-bit type, an 8-bit flags field and a 31-bit stream identifier (the top bit is reserved). All numbers are big-endian. Stream 0 is the connection itself (SETTINGS, PING, GOAWAY); client-initiated streams have odd numbers, and one request with its response uses one stream.

A request or response is a HEADERS frame (continued in CONTINUATION frames if large) followed by DATA frames; the END_STREAM flag marks the last frame in each direction. Header fields are compressed with HPACK, which refers to a table built up over the connection, so headers cannot be read from a single frame taken out of context. Pseudo-headers such as :method, :path, :authority and :status stand in for the HTTP/1.1 request and status lines.
"""

[[format.specs]]
document = "RFC 9113"
title = "HTTP/2"
url = "https://www.rfc-editor.org/rfc/rfc9113"
rfc = 9113
section = "4.1"

[[format.specs]]
document = "RFC 7541"
title = "HPACK: Header Compression for HTTP/2"
url = "https://www.rfc-editor.org/rfc/rfc7541"
rfc = 7541

[[format.fields]]
name = "Length"
wireshark = "http2.length"
meaning = "The frame payload's length in bytes, not counting the 9-byte header; at most 16,384 unless SETTINGS allows more."
section = "4.1"

[[format.fields]]
name = "Type"
wireshark = "http2.type"
aliases = ["Frame type"]
meaning = "0 DATA, 1 HEADERS, 2 PRIORITY, 3 RST_STREAM, 4 SETTINGS, 5 PUSH_PROMISE, 6 PING, 7 GOAWAY, 8 WINDOW_UPDATE, 9 CONTINUATION."
section = "6"

[[format.fields]]
name = "Flags"
wireshark = "http2.flags"
meaning = "Meaning depends on the type: 0x1 END_STREAM (DATA, HEADERS) or ACK (SETTINGS, PING), 0x4 END_HEADERS, 0x8 PADDED, 0x20 PRIORITY."
section = "4.1"

[[format.fields]]
name = "Stream identifier"
wireshark = "http2.streamid"
aliases = ["Stream ID"]
meaning = "Which stream the frame belongs to; 0 for frames about the whole connection. Clients open odd-numbered streams."
section = "4.1"

[[format.fields]]
name = "Error code"
meaning = "In RST_STREAM and GOAWAY: 0 no error, 1 protocol error, 2 internal error, 3 flow control error, 7 refused stream, 8 cancel, 11 enhance your calm."
section = "7"

[[format]]
id = "http3"
name = "HTTP/3"
keys = ["HTTP/3", "HTTP3", "h3", "HTTP version 3"]
wireshark = "http3"
summary = "HTTP mapped onto QUIC: each request and response travels on its own QUIC stream as a sequence of small frames, with headers compressed by QPACK."
group = "Web"
organisation = """
HTTP/3 has no framing of its own below the QUIC stream: QUIC (on UDP, usually port 443) provides encrypted, independently ordered streams, and the ALPN name "h3" selects HTTP/3 during QUIC's handshake. Nothing of HTTP/3 is visible on the wire without the session keys.

Within a stream, each frame is a variable-length integer type, a variable-length integer length and the payload. QUIC's variable-length integers use the top two bits of the first byte to give their size (1, 2, 4 or 8 bytes). Frame types are 0x00 DATA, 0x01 HEADERS, 0x03 CANCEL_PUSH, 0x04 SETTINGS, 0x05 PUSH_PROMISE, 0x07 GOAWAY and 0x0D MAX_PUSH_ID; others are reserved or extensions.

A request uses one client-initiated bidirectional stream: HEADERS, optional DATA frames and optional trailing HEADERS, and the response comes back the same way on that stream. Each side also opens unidirectional streams whose first byte gives their type: 0x00 control (carrying SETTINGS first), 0x01 push, 0x02 QPACK encoder and 0x03 QPACK decoder.
"""

[[format.specs]]
document = "RFC 9114"
title = "HTTP/3"
url = "https://www.rfc-editor.org/rfc/rfc9114"
rfc = 9114
section = "7.1"

[[format.specs]]
document = "RFC 9204"
title = "QPACK: Field Compression for HTTP/3"
url = "https://www.rfc-editor.org/rfc/rfc9204"
rfc = 9204

[[format.fields]]
name = "Type"
wireshark = "http3.frame_type"
aliases = ["Frame type"]
meaning = "0x00 DATA, 0x01 HEADERS, 0x03 CANCEL_PUSH, 0x04 SETTINGS, 0x05 PUSH_PROMISE, 0x07 GOAWAY, 0x0D MAX_PUSH_ID, as a variable-length integer."
section = "7.2"

[[format.fields]]
name = "Length"
wireshark = "http3.frame_length"
meaning = "The payload's length in bytes, as a variable-length integer."
section = "7.1"

[[format.fields]]
name = "Stream type"
wireshark = "http3.stream_uni_type"
meaning = "The first value on a unidirectional stream: 0x00 control, 0x01 push, 0x02 QPACK encoder, 0x03 QPACK decoder."
section = "6.2"

[[format]]
id = "websocket"
name = "WebSocket"
keys = ["WebSocket", "WebSockets", "WebSocket Protocol", "ws", "wss"]
wireshark = "websocket"
summary = "A two-way message channel between a browser and a server, set up with an HTTP request and then carried as small binary frames on the same TCP connection."
group = "Web"
organisation = """
A connection starts as HTTP/1.1: the client sends a GET with "Upgrade: websocket", "Connection: Upgrade", a random Sec-WebSocket-Key and Sec-WebSocket-Version 13, and the server answers "101 Switching Protocols" with a Sec-WebSocket-Accept value derived from the key by SHA-1. From then on the connection carries frames, on whatever port the HTTP request used (80, or 443 inside TLS for wss).

Each frame begins with two bytes: FIN (last fragment of a message), three reserved bits (RSV1 marks a compressed message when permessage-deflate is in use) and a 4-bit opcode, then a MASK bit and a 7-bit payload length. A length of 126 means a 16-bit length follows, 127 a 64-bit length, both big-endian.

Every frame from client to server is masked: a 4-byte masking key follows the length, and each payload byte is XORed with key byte (index mod 4). Server frames are not masked. A message can be split over several frames, the first with its opcode and the rest with opcode 0 (continuation); control frames (close, ping, pong) may appear between them but are never fragmented.
"""

[[format.specs]]
document = "RFC 6455"
title = "The WebSocket Protocol"
url = "https://www.rfc-editor.org/rfc/rfc6455"
rfc = 6455
section = "5.2"

[[format.fields]]
name = "FIN"
wireshark = "websocket.fin"
meaning = "Set on the last frame of a message."
section = "5.2"

[[format.fields]]
name = "Opcode"
wireshark = "websocket.opcode"
meaning = "0 continuation, 1 text (UTF-8), 2 binary, 8 close, 9 ping, 10 pong."
section = "5.2"

[[format.fields]]
name = "Mask"
wireshark = "websocket.mask"
aliases = ["Masked"]
meaning = "Set when a masking key follows; always set from client to server."
section = "5.2"

[[format.fields]]
name = "Payload length"
wireshark = "websocket.payload_length"
meaning = "0 to 125 directly, or 126 followed by a 16-bit length, or 127 followed by a 64-bit length."
section = "5.2"

[[format.fields]]
name = "Masking key"
wireshark = "websocket.masking_key"
meaning = "Four bytes XORed in turn over the payload; unmasking is the same operation."
section = "5.3"

[[format.fields]]
name = "Close code"
wireshark = "websocket.payload.close.status_code"
aliases = ["Status code"]
meaning = "The first two bytes of a close frame's payload: 1000 normal, 1001 going away, 1002 protocol error, 1006 closed without a close frame (never sent), 1008 policy violation, 1011 server error."
section = "7.4"

[[format]]
id = "grpc"
name = "gRPC"
keys = ["gRPC", "gRPC over HTTP/2", "application/grpc"]
wireshark = "grpc"
summary = "A remote procedure call framework that sends Protocol Buffers messages as HTTP/2 requests and responses, used widely between microservices."
group = "Web"
organisation = """
A gRPC call is one HTTP/2 stream. The request's HEADERS frame has :method POST, a :path of "/" package and service "/" method (for example /helloworld.Greeter/SayHello), content-type application/grpc (often with +proto), "te: trailers" and optionally grpc-timeout and grpc-encoding.

The bodies in both directions are DATA frames holding length-prefixed messages: a 1-byte compressed flag, a 4-byte big-endian message length and the message itself, normally a serialised Protocol Buffers message whose schema is not on the wire. Streaming calls send many such messages on one stream, and a message may span DATA frames.

The response begins with HEADERS (:status 200 and the content type) and ends with a trailing HEADERS frame carrying grpc-status, a decimal status code, and an optional grpc-message. A failed call may consist of trailers alone. Because HTTP/2 headers are HPACK-compressed and usually inside TLS, the method name is only readable when the connection is decrypted and the header table followed from the start.
"""

[[format.specs]]
document = "gRPC over HTTP2"
title = "gRPC over HTTP2"
url = "https://github.com/grpc/grpc/blob/master/doc/PROTOCOL-HTTP2.md"

[[format.specs]]
document = "gRPC status codes"
title = "Status codes and their use in gRPC"
url = "https://github.com/grpc/grpc/blob/master/doc/statuscodes.md"

