wireshark = "amqp.performative"
meaning = "The frame's operation: open, begin, attach, flow, transfer, disposition, detach, end or close, identified by descriptor 0x10 to 0x18."
section = "2.7"

[[format]]
id = "kafka"
name = "Apache Kafka protocol"
keys = ["Kafka", "Apache Kafka", "Kafka protocol", "Kafka wire protocol"]
wireshark = "kafka"
summary = "The binary request and response protocol between Kafka clients and brokers, for producing records to topic partitions, fetching them and coordinating consumer groups."
group = "Messaging"
ports = ["tcp/9092"]
organisation = """
Every request and response is preceded by a 4-byte big-endian size. A request header follows: a 2-byte API key naming the operation, a 2-byte API version, a 4-byte correlation ID and a client ID string (a 2-byte length then the text); newer header versions append tagged fields. A response starts with the same correlation ID, which is the only way to match it to its request, since responses do not repeat the API key.

Body layouts depend on the API key and version, and newer versions use compact encodings: unsigned variable-length integers for lengths and a tagged-field section at the end of each structure. A client normally begins with ApiVersions (18) to learn which versions the broker supports.

Produce requests and fetch responses carry record batches: a 61-byte batch header (base offset, batch length, leader epoch, magic byte 2, a CRC-32C, attributes whose low three bits give the compression codec, timestamps, producer ID and the record count) followed by records whose fields are zigzag variable-length integers. The batch may be compressed with gzip, Snappy, LZ4 or Zstandard.

Port 9092 is the universal default for brokers but is not registered for Kafka with IANA; TLS listeners often use 9093.
"""

[[format.specs]]
document = "Kafka protocol guide"
title = "Kafka protocol guide"
url = "https://kafka.apache.org/protocol"

[[format.fields]]
name = "Size"
wireshark = "kafka.len"
aliases = ["Length"]
meaning = "The length of the request or response that follows, not counting these four bytes."

[[format.fields]]
name = "API key"
wireshark = "kafka.request_key"
aliases = ["request_api_key"]
meaning = "The operation: 0 Produce, 1 Fetch, 2 ListOffsets, 3 Metadata, 8 OffsetCommit, 9 OffsetFetch, 10 FindCoordinator, 11 JoinGroup, 12 Heartbeat, 14 SyncGroup, 17 SaslHandshake, 18 ApiVersions, 36 SaslAuthenticate."

[[format.fields]]
name = "API version"
wireshark = "kafka.request.version"
aliases = ["request_api_version"]
meaning = "The version of the request layout the client used; the response uses the matching version."

[[format.fields]]
name = "Correlation ID"
wireshark = "kafka.correlation_id"
aliases = ["correlation_id"]
meaning = "Chosen by the client and returned in the response."

[[format.fields]]
name = "Client ID"
wireshark = "kafka.client_id"
aliases = ["client_id"]
meaning = "A free-form name for the client application, useful in broker logs."

[[format.fields]]
name = "Error code"
wireshark = "kafka.error"
meaning = "A 2-byte code in responses: 0 none, 3 unknown topic or partition, 6 not leader or follower, 16 not coordinator, 25 unknown member ID, 27 rebalance in progress, 35 unsupported version, 58 SASL authentication failed."

[[format]]
id = "nats"
name = "NATS"
keys = ["NATS", "NATS protocol", "NATS client protocol"]
summary = "A lightweight publish/subscribe messaging system whose client protocol is a handful of text commands, with message payloads as counted bytes."
group = "Messaging"
ports = ["tcp/4222"]
organisation = """
The client protocol is text over TCP with CR LF line ends. The server speaks first with INFO and a JSON object (server ID, version, maximum payload, whether TLS or authentication is required); the client replies with CONNECT and its own JSON options, which may include a user name and password, a token or a signed nonce.

Commands are an upper-case word and space-separated arguments: SUB subject [queue group] sid, UNSUB sid [max], PUB subject [reply-to] size, and from the server MSG subject sid [reply-to] size. PUB and MSG lines are followed by exactly size bytes of payload and another CR LF, so a reader must count bytes rather than look for the next line end. HPUB and HMSG add a header block in the style of HTTP ("NATS/1.0" then header lines) and give both the header size and the total size.

Subjects are dot-separated tokens with * and > wildcards in subscriptions. The server sends PING and expects PONG to check the connection; +OK and -ERR acknowledge commands when verbose mode is on, and -ERR always reports protocol errors.

Port 4222 is the default for clients but is not registered with IANA; servers use 6222 for clustering and 8222 for HTTP monitoring.
"""

[[format.specs]]
document = "NATS Client Protocol"
title = "Client Protocol"
url = "https://docs.nats.io/reference/reference-protocols/nats-protocol"

[[format.fields]]
name = "Command"
aliases = ["Operation"]
meaning = "INFO, CONNECT, PUB, HPUB, SUB, UNSUB, MSG, HMSG, PING, PONG, +OK or -ERR."

[[format.fields]]
name = "Subject"
meaning = "The dot-separated name a message is published to, such as orders.eu.created."

[[format.fields]]
name = "sid"
aliases = ["Subscription ID"]
meaning = "The client's identifier for a subscription; MSG names the subscription that matched."

[[format.fields]]
