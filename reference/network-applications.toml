[[format]]
id = "sdp"
name = "Session Description Protocol"
keys = ["SDP", "Session Description Protocol", "application/sdp"]
wireshark = "sdp"
summary = "A text format describing a multimedia session: which media streams there are, the addresses and ports to send them to and the codecs on offer. It travels inside SIP, RTSP and WebRTC signalling."
group = "Voice and video"
organisation = """
An SDP description is UTF-8 text, one field per line in the form of a single letter, an equals sign and a value ("v=0"), with CR LF (or LF) line ends. The letters must appear in a fixed order: the session part first (v protocol version, o origin, s session name, optional i, u, e, p, c connection, b bandwidth, then one or more t timing lines and a attributes), followed by any number of media sections.

Each media section starts with an m= line giving the media type, the transport port, the protocol and a list of formats, for example "m=audio 49170 RTP/AVP 0 8 101": audio to port 49170 over RTP with payload types 0, 8 and 101. Its own c=, b= and a= lines follow and override the session's.

Attributes do most of the work: a=rtpmap maps a dynamic payload type to a codec and clock rate ("a=rtpmap:101 telephone-event/8000"), a=fmtp gives codec parameters, a=sendrecv, sendonly or recvonly set the direction, and in WebRTC a=ice-ufrag, a=fingerprint and a=candidate carry ICE and DTLS details. In offer and answer, the answer's m= lines line up one-for-one with the offer's.
"""

