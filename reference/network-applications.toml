[[format]]
id = "knxnet-ip"
name = "KNXnet/IP"
keys = ["KNXnet/IP", "KNXnetIP", "KNX/IP", "KNX IP", "EIBnet/IP"]
wireshark = "kip"
summary = "The way KNX building automation (lighting, blinds, heating) is carried over IP: tunnelling connects a tool or gateway to a KNX line, and routing multicasts KNX telegrams between IP-connected lines."
group = "Industrial control"
ports = ["udp/3671", "tcp/3671"]
organisation = """
Every frame starts with a 6-byte header, big-endian: a header length (always 0x06), a protocol version (0x10), a 2-byte service type and a 2-byte total length that includes the header. The service type's high byte gives the family: 0x02 core (0x0201 search request, 0x0202 search response, 0x0203 description request, 0x0205 connect request, 0x0206 connect response, 0x0207 connection state request, 0x0209 disconnect request), 0x03 device management, 0x04 tunnelling (0x0420 request, 0x0421 acknowledgement) and 0x05 routing (0x0530 routing indication).

Discovery and connection messages carry host protocol address information blocks: 8 bytes giving a length, a protocol code (1 UDP, 2 TCP), an IPv4 address and a port. Tunnelling messages carry a 4-byte connection header (length, channel ID, sequence counter, status) that the acknowledgement repeats.

The payload of tunnelling and routing frames is a cEMI message: a message code (0x11 data request, 0x29 data indication, 0x2E data confirmation), additional information, two control bytes, the 2-byte individual source address (area.line.device), the 2-byte destination group address (main/middle/sub) and the transport and application control fields with the data, such as a group value write. Routing uses multicast to 224.0.23.12. KNX IP Secure wraps frames in service type 0x0950.
"""

[[format.specs]]
document = "KNX Standard 03.08.02"
title = "KNX Standard, Volume 3: System Specifications, Part 8: KNXnet/IP, Chapter 2: Core"
url = "https://www.knx.org/knx-en/for-professionals/Standards/KNX-Standard/"

[[format.fields]]
name = "Header length"
wireshark = "knxip.headerlength"
meaning = "Always 0x06."

[[format.fields]]
name = "Protocol version"
wireshark = "knxip.version"
meaning = "0x10 for KNXnet/IP 1.0."

[[format.fields]]
name = "Service type"
wireshark = "knxip.service"
aliases = ["Service type identifier"]
meaning = "Which request or response this is, such as 0x0205 connect request, 0x0420 tunnelling request or 0x0530 routing indication."

[[format.fields]]
name = "Total length"
wireshark = "knxip.totallength"
meaning = "The whole frame's length including the 6-byte header."

[[format.fields]]
name = "Channel ID"
wireshark = "knxip.channel"
aliases = ["Communication channel ID"]
meaning = "The tunnelling connection, assigned by the server in its connect response."

[[format.fields]]
name = "Sequence counter"
wireshark = "knxip.seqctr"
meaning = "Counts tunnelling requests on a channel; the acknowledgement repeats it."

[[format.fields]]
