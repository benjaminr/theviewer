[[format]]
id = "radius"
name = "Remote Authentication Dial In User Service"
keys = ["RADIUS", "Remote Authentication Dial In User Service", "RADIUS Accounting"]
wireshark = "radius"
summary = "The protocol network equipment (VPN concentrators, Wi-Fi controllers, switches) uses to ask a central server whether a user may connect, and to report sessions for accounting."
group = "Directory and authentication"
ports = ["udp/1812", "udp/1813"]
organisation = """
Each UDP datagram is one packet with a 20-byte header: a 1-byte code, a 1-byte identifier, a 2-byte big-endian length (20 to 4096) covering the whole packet, and a 16-byte authenticator. Attributes fill the rest.

The identifier pairs a reply with its request. In an Access-Request the authenticator is 16 random bytes; in a reply it is an MD5 hash over the reply, the request's authenticator and the shared secret, which proves the reply came from the server. Accounting requests carry a similar hash of their own.

Attributes are type-length-value: a 1-byte type, a 1-byte length that includes these two bytes, and the value. User-Password is hidden by XORing it with MD5 of the shared secret and the request authenticator, which is weak if the secret is weak. Vendor-Specific (26) wraps a 4-byte vendor number and the vendor's own attributes; EAP-Message (79) carries EAP, and Message-Authenticator (80) is an HMAC-MD5 of the packet.

Port 1812 carries authentication and 1813 accounting; older equipment uses 1645 and 1646.
"""

