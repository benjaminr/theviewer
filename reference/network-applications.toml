[[format.fields]]
name = "Version"
wireshark = "rtp.version"
meaning = "Two bits, always 2."
section = "5.1"

[[format.fields]]
name = "Marker"
wireshark = "rtp.marker"
meaning = "Defined by the profile; for video usually the last packet of a frame, for voice the first packet after silence."
section = "5.1"

[[format.fields]]
name = "Payload type"
wireshark = "rtp.p_type"
meaning = "The media format: 0 PCMU, 3 GSM, 8 PCMA, 9 G.722, 18 G.729, 26 JPEG, 34 H.263; 96 to 127 are dynamic, defined by an a=rtpmap line in SDP."
section = "5.1"

[[format.fields]]
name = "Sequence number"
wireshark = "rtp.seq"
meaning = "Increases by one per packet from a random start; used to detect loss and restore order."
section = "5.1"

[[format.fields]]
