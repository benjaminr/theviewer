wireshark = "tds.type"
aliases = ["Packet type"]
meaning = "1 SQL batch, 2 pre-TDS7 login, 3 RPC, 4 tabular result, 6 attention, 7 bulk load, 8 federated authentication token, 14 transaction manager request, 16 TDS7 login, 17 SSPI, 18 pre-login."
section = "2.2.3.1.1"

[[format.fields]]
name = "Status"
wireshark = "tds.status"
meaning = "Bit 0x01 end of message; 0x02 ignore this event; 0x08 and 0x10 reset the connection before the request."
section = "2.2.3.1.2"

[[format.fields]]
name = "Length"
wireshark = "tds.length"
meaning = "The packet's length including the 8-byte header, big-endian."
section = "2.2.3.1.3"

[[format.fields]]
name = "SPID"
wireshark = "tds.channel"
aliases = ["Server process ID"]
meaning = "The server's session ID for the connection, filled in by the server in responses."
section = "2.2.3.1.4"

[[format.fields]]
