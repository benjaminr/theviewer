wireshark = "mongo.msg.sections.section.kind"
aliases = ["Kind"]
meaning = "0 a single BSON body document, 1 a named sequence of documents."

[[format]]
id = "redis"
name = "Redis serialisation protocol"
keys = ["Redis", "RESP", "RESP2", "RESP3", "Redis serialization protocol", "Redis serialisation protocol", "Valkey"]
wireshark = "resp"
summary = "The simple text-framed protocol of Redis and compatible stores such as Valkey: commands go as arrays of strings and replies as typed values."
group = "Databases"
ports = ["tcp/6379"]
organisation = """
Every value starts with a type byte and ends with CR LF. In RESP2: "+" a simple string ("+OK"), "-" an error ("-ERR unknown command"), ":" an integer, "$" a bulk string (a decimal length, CR LF, that many bytes and CR LF; "$-1" is null) and "*" an array (an element count followed by that many values, which may themselves be arrays).

A client sends each command as an array of bulk strings, for example "*2", "$3", "GET", "$5", "mykey", one item per line. Servers also accept inline commands, plain space-separated text ending in CR LF, which is how a typed telnet session looks. Replies come back in the order the commands were sent, which is what makes pipelining possible; there is no request identifier.

RESP3, chosen by sending HELLO 3, adds "_" null, "#" boolean, "," double, "(" big number, "!" bulk error, "=" verbatim string, "%" map, "~" set, "|" attributes and ">" push messages (used for pub/sub and client-side caching). AUTH sends the password in clear unless the connection uses TLS.
"""

[[format.specs]]
document = "Redis serialization protocol specification"
title = "Redis serialization protocol specification"
url = "https://redis.io/docs/latest/develop/reference/protocol-spec/"

[[format.fields]]
name = "Type"
aliases = ["Type byte"]
meaning = "The first byte of a value: + simple string, - error, : integer, $ bulk string, * array; RESP3 adds _ , # ( ! = % ~ | and >."

[[format.fields]]
name = "Length"
aliases = ["Count"]
meaning = "For bulk strings, the byte length of the data (-1 for null); for arrays, the number of elements."

[[format.fields]]
name = "Command"
meaning = "The first element of a request array: GET, SET, HGETALL, AUTH, CONFIG, EVAL, SUBSCRIBE and so on, case-insensitive."

[[format]]
id = "memcached"
name = "Memcached protocol"
keys = ["Memcached", "Memcache", "Memcached protocol", "Memcached binary protocol"]
wireshark = "memcache"
summary = "The protocol of the memcached cache: clients store and fetch values by key, using a text protocol (or an older binary one) over TCP or UDP."
group = "Databases"
ports = ["tcp/11211", "udp/11211"]
organisation = """
The text protocol is lines ending in CR LF. Retrieval commands name keys ("get user:42"); the server answers with a "VALUE key flags bytes [cas]" line, the data block and CR LF for each hit, then "END". Storage commands (set, add, replace, append, prepend, cas) give the key, client flags, expiry time and byte count on the command line, followed by the data block; the reply is STORED, NOT_STORED, EXISTS or NOT_FOUND. Data blocks are counted, not delimited. Newer meta commands (mg, ms, md, ma) use short flags instead.

The older binary protocol, now deprecated, uses a 24-byte header: magic 0x80 for requests and 0x81 for responses, an opcode (0x00 get, 0x01 set, 0x04 delete), key length, extras length, data type, a vbucket ID or status, total body length, an opaque value echoed in the reply and an 8-byte CAS value, all big-endian.

Over UDP each datagram begins with an 8-byte frame header (request ID, sequence number, datagram count and a reserved field) before the text. Because a tiny UDP request can produce a very large reply, open UDP memcached servers were abused for amplification attacks, and UDP is now off by default.
"""

[[format.specs]]
document = "memcached protocol.txt"
title = "Memcached protocol"
url = "https://github.com/memcached/memcached/blob/master/doc/protocol.txt"

[[format.fields]]
name = "Command"
wireshark = "memcache.command"
meaning = "get, gets, gat, set, add, replace, append, prepend, cas, delete, incr, decr, touch, stats, flush_all, version, or the meta commands mg, ms, md, ma, mn."

[[format.fields]]
name = "Key"
wireshark = "memcache.key"
meaning = "Up to 250 bytes of text without spaces or control characters."

[[format.fields]]
name = "Flags"
wireshark = "memcache.flags"
meaning = "A 32-bit number the client stores with the value and gets back unchanged; libraries use it to record how the value was serialised."

[[format.fields]]
name = "Bytes"
aliases = ["Length"]
meaning = "The length of the data block that follows the command or VALUE line."

[[format.fields]]
name = "Magic"
wireshark = "memcache.magic"
meaning = "In the binary protocol, 0x80 for a request and 0x81 for a response."

