[[format]]
id = "ldap"
name = "Lightweight Directory Access Protocol"
keys = ["LDAP", "LDAPS", "CLDAP", "Lightweight Directory Access Protocol", "Connectionless LDAP"]
wireshark = "ldap"
summary = "The protocol for querying and updating directories such as Active Directory and OpenLDAP: binding (logging in), searching for entries and modifying their attributes."
group = "Directory and authentication"
ports = ["tcp/389", "udp/389", "tcp/636", "tcp/3268", "tcp/3269"]
organisation = """
Each message is an ASN.1 structure encoded with BER, so it begins with 0x30 (a SEQUENCE) and a BER length that says how long the whole message is; messages simply follow one another on the TCP stream. Inside are a message ID chosen by the client, the operation and, optionally, controls tagged [0].

The operation is identified by its APPLICATION tag: 0x60 bind request, 0x61 bind response, 0x42 unbind, 0x63 search request, 0x64 search result entry, 0x65 search result done, 0x73 search result reference, 0x66 and 0x67 modify, 0x68 and 0x69 add, 0x4A and 0x6B delete, 0x77 and 0x78 extended request and response. Responses repeat the request's message ID; a search returns any number of entries and references and then one search-done carrying the result code.

A simple bind sends the distinguished name and the password in clear text; SASL binds carry Kerberos (GSS-SPNEGO) or other mechanisms and may sign or seal what follows. The StartTLS extended operation upgrades port 389; port 636 is LDAP inside TLS from the start, and ports 3268 and 3269 are the Active Directory global catalogue. UDP port 389 carries connectionless LDAP, which Windows clients use to locate domain controllers.
"""

