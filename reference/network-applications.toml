[[format]]
id = "rdp"
name = "Remote Desktop Protocol"
keys = ["RDP", "Remote Desktop Protocol", "MS-RDPBCGR", "Terminal Services", "MS WBT Server"]
wireshark = "rdp"
summary = "Microsoft's remote desktop protocol: screen updates flow from server to client and keyboard and mouse input the other way, almost always inside TLS once the first exchange is done."
group = "File sharing and remote access"
ports = ["tcp/3389", "udp/3389"]
organisation = """
A connection opens with TPKT and X.224 framing: a 4-byte TPKT header (version 3, a reserved byte and a 16-bit big-endian length that includes the header), then an X.224 connection request TPDU (code 0xE0). Its user data often begins with a text line "Cookie: mstshash=" and a user name, followed by an 8-byte negotiation request listing the security protocols the client can use: 0 standard RDP security, 1 TLS, 2 CredSSP (network level authentication), 8 CredSSP with early user authorisation. The server's connection confirm (0xD0) states the one it picked.

With TLS or CredSSP chosen, a TLS handshake follows immediately, and with CredSSP the user is authenticated inside it before the session starts, so after the first two packets nothing more is readable on the wire. Inside, the session continues with the MCS (T.125) connect exchange carrying GCC conference data (client screen size, keyboard layout, client name and requested virtual channels), then licensing, capability exchange and the session's data PDUs.

Later traffic uses either the slow path (TPKT, X.224 data, MCS send-data) or the fast path, whose first byte has its low two bits clear instead of a TPKT version. Virtual channels carry the clipboard, drive and printer redirection and audio. UDP port 3389 carries the optional UDP transport for graphics.
"""

