[[format]]
id = "coap"
name = "Constrained Application Protocol"
keys = ["CoAP", "CoAPS", "Constrained Application Protocol"]
wireshark = "coap"
summary = "A compact binary counterpart of HTTP for small devices: GET, POST, PUT and DELETE on resources, normally over UDP, with optional reliability and observation of changing values."
group = "Internet of things"
ports = ["udp/5683", "udp/5684", "tcp/5683", "tcp/5684"]
organisation = """
Over UDP each datagram is one message, starting with a 4-byte header: a 2-bit version (1), a 2-bit type, a 4-bit token length, an 8-bit code and a 16-bit message ID. The type says how the message is delivered: 0 confirmable (acknowledgement required, retransmitted until it arrives), 1 non-confirmable, 2 acknowledgement and 3 reset. The message ID matches an acknowledgement to its confirmable message and detects duplicates.

The code is written class.detail: 0.01 GET, 0.02 POST, 0.03 PUT and 0.04 DELETE for requests, 2.xx success (2.05 Content), 4.xx client errors (4.04 Not Found) and 5.xx server errors for responses. A token of 0 to 8 bytes follows the header and pairs a response with its request, which matters when the response comes separately from the acknowledgement.

Options come next, each encoded as a delta from the previous option's number and a length (a byte holding two 4-bit fields, with 13 and 14 announcing extended values), so options must appear in number order: 11 Uri-Path, 15 Uri-Query, 12 Content-Format, 6 Observe, 23 and 27 Block2 and Block1. If a payload follows, it is preceded by the marker byte 0xFF. Port 5684 carries CoAP over DTLS (or TLS); over TCP and WebSockets the header replaces type and message ID with a length.
"""

[[format.specs]]
document = "RFC 7252"
title = "The Constrained Application Protocol (CoAP)"
url = "https://www.rfc-editor.org/rfc/rfc7252"
rfc = 7252
section = "3"

[[format.specs]]
document = "RFC 8323"
title = "CoAP (Constrained Application Protocol) over TCP, TLS, and WebSockets"
url = "https://www.rfc-editor.org/rfc/rfc8323"
rfc = 8323

[[format.fields]]
name = "Type"
wireshark = "coap.type"
meaning = "0 confirmable, 1 non-confirmable, 2 acknowledgement, 3 reset."
section = "3"

[[format.fields]]
name = "Token length"
wireshark = "coap.token_len"
aliases = ["TKL"]
meaning = "The number of token bytes after the header, 0 to 8."
section = "3"

[[format.fields]]
name = "Code"
wireshark = "coap.code"
meaning = "Class and detail, written c.dd: 0.00 empty, 0.01 GET, 0.02 POST, 0.03 PUT, 0.04 DELETE, 2.01 Created, 2.04 Changed, 2.05 Content, 4.00 Bad Request, 4.01 Unauthorized, 4.04 Not Found, 5.00 Internal Server Error."
section = "3"

[[format.fields]]
name = "Message ID"
wireshark = "coap.mid"
meaning = "Matches acknowledgements and resets to confirmable messages and detects duplicates."
section = "3"

[[format.fields]]
name = "Token"
wireshark = "coap.token"
meaning = "Chosen by the client and echoed in the response; links a response to its request independently of the message ID."
section = "5.3.1"

[[format.fields]]
name = "Options"
aliases = ["Option"]
meaning = "Delta-encoded option numbers and values: 3 Uri-Host, 6 Observe, 7 Uri-Port, 11 Uri-Path, 12 Content-Format, 14 Max-Age, 15 Uri-Query, 17 Accept, 23 Block2, 27 Block1, 60 Size1."
section = "3.1"

[[format]]
id = "mqtt-sn"
name = "MQTT for Sensor Networks"
keys = ["MQTT-SN", "MQTT-S", "MQTT for Sensor Networks"]
wireshark = "mqttsn"
summary = "A variant of MQTT for small battery-powered devices on datagram networks such as UDP, Zigbee or LoRa: topic names are replaced by short numeric IDs and a gateway connects the devices to an ordinary MQTT broker."
group = "Internet of things"
organisation = """
Each message is one datagram starting with a length and a message type. The length is a single byte giving the whole message's size, or, for longer messages, the byte 0x01 followed by a 2-byte big-endian length. The message type is one byte: 0x00 ADVERTISE, 0x01 SEARCHGW, 0x02 GWINFO, 0x04 CONNECT, 0x05 CONNACK, 0x0A REGISTER, 0x0B REGACK, 0x0C PUBLISH, 0x0D PUBACK, 0x12 SUBSCRIBE, 0x13 SUBACK, 0x16 PINGREQ, 0x17 PINGRESP, 0x18 DISCONNECT.

Many messages carry a flags byte: DUP, two QoS bits (with 0b11 meaning QoS -1, a publish sent without connecting first), Retain, Will, CleanSession and two bits giving the topic ID type (0 normal registered ID, 1 predefined ID, 2 two-character short name).

Instead of sending a topic name with every publish, a client registers the name once with REGISTER and receives a 2-byte topic ID in REGACK; PUBLISH then carries the flags, the topic ID, a 2-byte message ID and the data. Message IDs match acknowledgements to requests.

There is no IANA port. Gateways often listen on UDP 1883 or 1884, the ports of MQTT and its neighbour, but this varies; the protocol is usually recognised by its structure.
"""

[[format.specs]]
document = "MQTT-SN v1.2"
title = "MQTT For Sensor Networks (MQTT-SN) Protocol Specification Version 1.2"
url = "https://www.oasis-open.org/committees/download.php/66091/MQTT-SN_spec_v1.2.pdf"
section = "5.2"

[[format.fields]]
name = "Length"
wireshark = "mqttsn.msg.len"
meaning = "The message length in bytes, including itself: one byte, or 0x01 followed by two bytes for messages of 256 bytes or more."
section = "5.2.1"

[[format.fields]]
name = "MsgType"
wireshark = "mqttsn.msg.type"
aliases = ["Message type"]
meaning = "The kind of message, from 0x00 ADVERTISE to 0x1D WILLMSGRESP; 0xFE wraps a message passed on by a forwarder."
section = "5.2.2"

[[format.fields]]
name = "Flags"
wireshark = "mqttsn.flags"
meaning = "DUP, QoS (two bits), Retain, Will, CleanSession and TopicIdType (two bits)."
section = "5.3.4"

[[format.fields]]
name = "TopicId"
wireshark = "mqttsn.topic.id"
aliases = ["Topic ID"]
meaning = "A 2-byte number standing for a topic name, assigned by REGACK or agreed in advance, or two characters of a short topic name."
section = "5.3.11"

[[format.fields]]
name = "MsgId"
wireshark = "mqttsn.msg.id"
aliases = ["Message ID"]
meaning = "Matches an acknowledgement (REGACK, PUBACK, SUBACK) to the message it answers."
section = "5.3.7"

