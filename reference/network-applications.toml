[[format]]
id = "mongodb"
name = "MongoDB wire protocol"
keys = ["MongoDB", "Mongo", "MongoDB wire protocol", "OP_MSG"]
wireshark = "mongo"
summary = "The protocol between MongoDB drivers and servers: commands and their replies as BSON documents inside a small binary message header."
group = "Databases"
ports = ["tcp/27017"]
organisation = """
Every message starts with a 16-byte header of little-endian 32-bit integers: the total message length (header included), a request ID, the ID of the request this one responds to (responseTo, 0 in requests) and an opcode. A reply is matched to its request by responseTo.

Current servers use OP_MSG (opcode 2013) for everything. It has 4 bytes of flag bits (bit 0 checksum present, bit 1 more to come, bit 16 exhaust allowed), then one or more sections and an optional CRC-32C checksum. A kind 0 section is a single BSON document, the command or reply, such as {find: "users", filter: {...}, $db: "app"}. A kind 1 section is a document sequence: a 4-byte size, a null-terminated identifier such as "documents" and BSON documents, used for bulk inserts and updates.

BSON documents begin with their own 4-byte little-endian length, so each can be skipped without decoding. OP_COMPRESSED (2012) wraps another message with snappy, zlib or zstd compression, naming the original opcode and size. The legacy opcodes OP_QUERY (2004) and OP_REPLY (1) still appear in the initial hello or isMaster handshake from older drivers.
"""

[[format.specs]]
document = "MongoDB Wire Protocol"
title = "MongoDB Wire Protocol"
url = "https://www.mongodb.com/docs/manual/reference/mongodb-wire-protocol/"

