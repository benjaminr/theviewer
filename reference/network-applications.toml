[[format]]
id = "xmpp"
name = "Extensible Messaging and Presence Protocol"
keys = ["XMPP", "Jabber", "Extensible Messaging and Presence Protocol"]
wireshark = "xmpp"
summary = "An instant messaging and presence protocol in which clients and servers exchange a long-lived stream of XML elements."
group = "Messaging"
ports = ["tcp/5222", "tcp/5269"]
organisation = """
An XMPP session is two XML documents, one in each direction, that grow for as long as the connection lasts. Each side opens with a <stream:stream> element naming the domain (to, from), version='1.0' and the namespace (jabber:client from clients on port 5222, jabber:server between servers on port 5269). The element is closed only when the session ends, so no complete XML document appears until then.

The server answers with <stream:features>, offering STARTTLS, SASL authentication mechanisms and resource binding. After TLS is negotiated the stream restarts and everything that follows is encrypted; after SASL succeeds it restarts again, unencrypted streams then revealing the authentication exchange in base64.

Communication is in stanzas, which are complete child elements of the stream: <message> (chat text in a <body>), <presence> (availability) and <iq> (request and response, with type get, set, result or error and an id attribute that the reply repeats). Addresses are JIDs of the form user@domain/resource. Extensions add elements in their own namespaces inside stanzas.
"""

[[format.specs]]
document = "RFC 6120"
title = "Extensible Messaging and Presence Protocol (XMPP): Core"
url = "https://www.rfc-editor.org/rfc/rfc6120"
rfc = 6120
section = "4"

[[format.fields]]
name = "Stream header"
wireshark = "xmpp.stream"
aliases = ["stream:stream"]
meaning = "The opening element of each direction's stream, with to, from, id, version and the default namespace."
section = "4.7"

[[format.fields]]
name = "Stanza"
aliases = ["message", "presence", "iq"]
meaning = "One unit of communication: message, presence or iq, with to, from, id and type attributes."
section = "8"

[[format.fields]]
name = "Stream error"
meaning = "A <stream:error> element, after which the stream is closed, such as host-unknown or not-authorized."
section = "4.9"

[[format]]
id = "irc"
name = "Internet Relay Chat"
keys = ["IRC", "Internet Relay Chat"]
wireshark = "irc"
summary = "The long-standing text chat protocol: clients join channels on a network of servers and send messages as single lines of text. Also used by some botnets for command and control."
group = "Messaging"
ports = ["tcp/194", "tcp/6665", "tcp/6666", "tcp/6667", "tcp/6668", "tcp/6669", "tcp/6697"]
organisation = """
IRC is a stream of text lines over TCP, each at most 512 bytes including the CR LF at its end. A line has an optional prefix starting with ":" that names the sender (a server, or nick!user@host), a command, and up to 15 parameters separated by spaces; the last parameter may start with ":" and then runs to the end of the line, spaces included.

Commands are words (NICK, USER, JOIN, PART, PRIVMSG, NOTICE, MODE, PING, PONG, QUIT) or, from servers, three-digit numeric replies: 001 welcome, 332 channel topic, 353 names list, 372 message of the day, 433 nickname already in use. A server sends PING periodically and the client must answer PONG with the same token.

There is no request identifier, so replies are related to requests only by order and content. A client registers with NICK and USER (after PASS if a password is needed); IRCv3 adds CAP negotiation and message tags, a prefix starting with "@". Port 6667 is the usual cleartext port, 6697 IRC over TLS.
"""

[[format.specs]]
document = "RFC 2812"
title = "Internet Relay Chat: Client Protocol"
url = "https://www.rfc-editor.org/rfc/rfc2812"
rfc = 2812
section = "2.3"

[[format.specs]]
document = "RFC 7194"
title = "Default Port for Internet Relay Chat (IRC) via TLS/SSL"
url = "https://www.rfc-editor.org/rfc/rfc7194"
rfc = 7194

[[format.fields]]
name = "Prefix"
meaning = "Optional, starting with \":\": the server or user (nick!user@host) the message comes from."
section = "2.3"

[[format.fields]]
name = "Command"
meaning = "A command word such as PRIVMSG or JOIN, or a three-digit numeric reply from a server."
section = "2.3"

[[format.fields]]
name = "Parameters"
aliases = ["Params"]
meaning = "Up to 15 space-separated parameters; the last may begin with \":\" and contain spaces."
section = "2.3.1"

[[format.fields]]
name = "PRIVMSG"
meaning = "A message to a user or a channel (a name starting with # or &), with the text as the last parameter."
section = "3.3.1"

[[format]]
id = "amqp-0-9-1"
name = "AMQP 0-9-1"
keys = ["AMQP 0-9-1", "AMQP 0.9.1", "AMQP 0-9", "Advanced Message Queuing Protocol 0-9-1"]
summary = "The message broker protocol spoken by RabbitMQ and similar brokers: clients declare exchanges and queues, publish messages to exchanges and consume them from queues."
group = "Messaging"
ports = ["tcp/5672", "tcp/5671"]
organisation = """
The client opens with an 8-byte protocol header, "AMQP" followed by the bytes 0, 0, 9, 1. Everything after it is frames: a 1-byte type, a 2-byte channel number, a 4-byte payload size, the payload and a frame-end byte 0xCE. All numbers are big-endian. Channel 0 is the connection itself; other channels are independent sessions multiplexed on one TCP connection.

Frame types are 1 method, 2 content header, 3 content body and 8 heartbeat. A method frame's payload starts with a 2-byte class ID and a 2-byte method ID, then the method's arguments (short strings with a 1-byte length, long strings and field tables with a 4-byte length). Classes are 10 connection, 20 channel, 40 exchange, 50 queue, 60 basic, 85 confirm and 90 transactions; for example 60/40 is basic.publish and 60/60 basic.deliver.

A message is a method frame (basic.publish or basic.deliver), then a content header frame giving the class, the total body size (8 bytes) and properties such as content-type, delivery-mode and correlation-id, then as many body frames as the size requires. Login happens in connection.start-ok, whose response field carries the SASL credentials (with PLAIN, the user name and password in clear). Port 5671 is AMQP inside TLS.
"""

[[format.specs]]
document = "AMQP 0-9-1 specification"
title = "AMQP: Advanced Message Queuing Protocol, Protocol Specification, Version 0-9-1"
url = "https://www.rabbitmq.com/resources/specs/amqp0-9-1.pdf"
section = "4.2.3"

[[format.fields]]
name = "Protocol header"
meaning = "The 8 bytes \"AMQP\" 0 0 9 1 sent by the client before anything else."
section = "4.2.2"

[[format.fields]]
name = "Frame type"
wireshark = "amqp.type"
aliases = ["Type"]
meaning = "1 method, 2 content header, 3 content body, 8 heartbeat."
section = "4.2.3"

[[format.fields]]
name = "Channel"
wireshark = "amqp.channel"
meaning = "The channel the frame belongs to; 0 for connection-level methods and heartbeats."
section = "4.2.3"

[[format.fields]]
name = "Size"
wireshark = "amqp.length"
aliases = ["Payload size"]
meaning = "The payload's length in bytes, not counting the 7-byte header or the frame-end byte."
section = "4.2.3"

[[format.fields]]
name = "Class ID"
wireshark = "amqp.method.class"
aliases = ["Method"]
meaning = "With the method ID, names the method: 10 connection, 20 channel, 40 exchange, 50 queue, 60 basic, 85 confirm, 90 tx."
section = "4.2.4"

[[format.fields]]
name = "Frame end"
meaning = "The byte 0xCE closing every frame; any other value means the stream is out of step."
section = "4.2.3"

[[format]]
id = "amqp-1-0"
name = "AMQP 1.0"
keys = ["AMQP 1.0", "AMQP", "Advanced Message Queuing Protocol", "Advanced Message Queuing Protocol 1.0"]
wireshark = "amqp"
summary = "The OASIS and ISO standard messaging protocol used by Azure Service Bus, ActiveMQ Artemis, Qpid and others: links between nodes carry messages with settled or unsettled delivery."
group = "Messaging"
ports = ["tcp/5672", "tcp/5671"]
organisation = """
Each layer starts with an 8-byte protocol header: "AMQP", a protocol ID (0 AMQP, 2 TLS, 3 SASL) and the version bytes 1, 0, 0. A SASL layer, if used, comes first and is followed by a second header for AMQP itself. Unlike AMQP 0-9-1, both sides send a header.

Frames have an 8-byte header: a 4-byte total size (the whole frame), a 1-byte data offset (DOFF, the header length in 4-byte words, at least 2), a 1-byte type (0 AMQP, 1 SASL) and two type-specific bytes, which for AMQP frames are the channel. All numbers are big-endian. An empty frame body is a heartbeat.

The body is a performative encoded in the AMQP type system: a described type whose descriptor is a 0x00 byte followed by a small unsigned long such as 0x53 0x10. Performatives are open (0x10), begin (0x11), attach (0x12), flow (0x13), transfer (0x14), disposition (0x15), detach (0x16), end (0x17) and close (0x18). A transfer is followed in the same frame by message sections (header, properties, application properties, data or AMQP value), themselves described types. Port 5671 is AMQP inside TLS.
"""

[[format.specs]]
document = "OASIS AMQP 1.0 Part 2"
title = "OASIS Advanced Message Queuing Protocol (AMQP) Version 1.0, Part 2: Transport"
url = "https://docs.oasis-open.org/amqp/core/v1.0/os/amqp-core-transport-v1.0-os.html"
section = "2.3"

[[format.specs]]
document = "OASIS AMQP 1.0 Part 1"
title = "OASIS Advanced Message Queuing Protocol (AMQP) Version 1.0, Part 1: Types"
url = "https://docs.oasis-open.org/amqp/core/v1.0/os/amqp-core-types-v1.0-os.html"

[[format.fields]]
name = "Protocol header"
meaning = "\"AMQP\", a protocol ID (0 AMQP, 2 TLS, 3 SASL) and the version 1.0.0."
section = "2.2"

[[format.fields]]
name = "Size"
wireshark = "amqp.length"
meaning = "The frame's total length in bytes, header included."
section = "2.3.1"

[[format.fields]]
name = "DOFF"
wireshark = "amqp.doff"
aliases = ["Data offset"]
meaning = "Where the body starts, in 4-byte words from the start of the frame; 2 when there is no extended header."
section = "2.3.1"

[[format.fields]]
name = "Type"
wireshark = "amqp.type"
meaning = "0 for an AMQP frame, 1 for a SASL frame."
section = "2.3.1"

[[format.fields]]
name = "Channel"
wireshark = "amqp.channel"
meaning = "In AMQP frames, the session channel the frame belongs to."
section = "2.3.2"

[[format.fields]]
