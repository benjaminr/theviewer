[[format]]
id = "tacacs-plus"
name = "TACACS+"
keys = ["TACACS+", "TACACS Plus", "Terminal Access Controller Access-Control System Plus"]
wireshark = "tacplus"
summary = "The protocol network devices use to authenticate administrators against a central server, authorise each command they type and record what they did."
group = "Directory and authentication"
ports = ["tcp/49"]
organisation = """
TACACS+ runs over TCP. Every packet starts with a 12-byte header: a version byte (major version 0xC in the top four bits, minor 0 or 1 below), a type (1 authentication, 2 authorisation, 3 accounting), a sequence number, flags, a 4-byte session ID and a 4-byte big-endian body length.

The sequence number is 1 in the first packet of a session and goes up by one with each packet, so the client sends odd numbers and the server even ones. The session ID ties the packets of one exchange together; with the single-connection flag (0x04) several sessions share one TCP connection.

The body is normally obfuscated: XORed with a pad built from repeated MD5 hashes of the session ID, the shared key, the version and the sequence number. Only when the unencrypted flag (0x01) is set is it readable directly. Inside, authentication START, REPLY and CONTINUE bodies carry the user name, password and prompts; authorisation and accounting bodies carry argument-value pairs such as service=shell and cmd=show running-config.
"""

[[format.specs]]
document = "RFC 8907"
title = "The Terminal Access Controller Access-Control System Plus (TACACS+) Protocol"
url = "https://www.rfc-editor.org/rfc/rfc8907"
rfc = 8907
section = "4.1"

[[format.fields]]
name = "Version"
meaning = "Major version 0xC in the top nibble; minor version 0 by default or 1 for some authentication types."
section = "4.1"

[[format.fields]]
name = "Type"
wireshark = "tacplus.type"
meaning = "1 authentication, 2 authorisation, 3 accounting."
section = "4.1"

[[format.fields]]
name = "Sequence number"
wireshark = "tacplus.seqno"
aliases = ["seq_no"]
meaning = "1 for the first packet of a session, increasing by one per packet; odd from the client, even from the server."
section = "4.1"

[[format.fields]]
name = "Flags"
wireshark = "tacplus.flags"
meaning = "0x01 body not obfuscated, 0x04 single connection mode."
section = "4.1"

[[format.fields]]
name = "Session ID"
wireshark = "tacplus.session_id"
meaning = "A random 4-byte value identifying one authentication, authorisation or accounting exchange."
section = "4.1"

[[format.fields]]
