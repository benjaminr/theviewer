[[format]]
id = "tpkt-cotp"
name = "ISO transport over TCP (TPKT and COTP)"
keys = ["TPKT", "COTP", "ISO-TSAP", "ISO on TCP", "RFC 1006", "ISO 8073", "X.224", "Connection-Oriented Transport Protocol"]
wireshark = "tpkt"
summary = "The small framing layers that carry OSI protocols over TCP: TPKT gives each packet a length, and the ISO transport protocol (COTP) connects to a named transport service access point. Used by Siemens S7, IEC 61850 MMS, ICCP and the start of RDP."
group = "Industrial control"
ports = ["tcp/102"]
carries = ["s7comm", "rdp"]
organisation = """
A TPKT header is 4 bytes: version 3, a reserved byte (0) and a 16-bit big-endian length of the whole packet including the header. One TPKT packet carries one COTP TPDU.

A COTP TPDU starts with a length indicator, the number of header bytes that follow it, then a code whose top four bits give the type: 0xE0 connection request (CR), 0xD0 connection confirm (CC), 0x80 disconnect request (DR), 0xF0 data (DT), 0x70 error. Connection requests and confirms carry 2-byte destination and source references, a class option byte (class 0 over TCP), and parameters as type, length and value: 0xC0 maximum TPDU size, 0xC1 calling TSAP and 0xC2 called TSAP.

The TSAPs name the endpoints being connected; for Siemens controllers the called TSAP encodes the connection type, rack and slot of the CPU. A data TPDU has a 2-byte header after the length indicator, 0xF0 and a byte whose top bit marks the end of the user's message (EOT); the user data, such as an S7 or MMS message, follows.
"""

