[[format]]
id = "sip"
name = "Session Initiation Protocol"
keys = ["SIP", "SIPS", "Session Initiation Protocol"]
wireshark = "sip"
summary = "The signalling protocol of internet telephony: it registers phones, sets up and tears down calls and negotiates their media, which then flows separately over RTP."
group = "Voice and video"
ports = ["udp/5060", "tcp/5060", "tcp/5061"]
carries = ["sdp"]
organisation = """
SIP is text in the style of HTTP. A request line is a method, a request URI and the version ("INVITE sip:bob@example.com SIP/2.0"); a status line is the version, a three-digit code and a reason ("SIP/2.0 180 Ringing"). Header fields follow, one per line with CR LF line ends, then an empty line and an optional body, usually an SDP offer or answer.

Over UDP each datagram is one message. Over TCP and TLS messages follow each other and Content-Length, which is then mandatory, gives the body's size. Port 5061 is SIP over TLS.

Messages are tied together by header fields rather than by the connection. Call-ID names the call (dialog) and stays the same for its life, together with the From and To tags. CSeq holds a number and a method and orders requests within a dialog. Each Via header records a hop the request passed through, and its branch parameter, starting with the magic cookie "z9hG4bK", identifies a transaction, so responses travel back along the same path.

Responses are provisional (1xx, such as 100 Trying and 180 Ringing) or final (2xx success, 3xx redirection, 4xx client error such as 401 Unauthorized and 486 Busy Here, 5xx server error, 6xx global failure). An INVITE's final response is confirmed by an ACK; BYE ends the call. Many headers have one-letter compact forms (v Via, f From, t To, i Call-ID, m Contact, l Content-Length, c Content-Type).
"""

[[format.specs]]
document = "RFC 3261"
title = "SIP: Session Initiation Protocol"
url = "https://www.rfc-editor.org/rfc/rfc3261"
rfc = 3261
section = "7"

[[format.fields]]
name = "Method"
wireshark = "sip.Method"
meaning = "INVITE, ACK, BYE, CANCEL, REGISTER and OPTIONS from the core specification; SUBSCRIBE, NOTIFY, REFER, MESSAGE, INFO, UPDATE and PRACK from extensions."
section = "7.1"

[[format.fields]]
name = "Status code"
wireshark = "sip.Status-Code"
meaning = "1xx provisional, 2xx success, 3xx redirection, 4xx client error, 5xx server error, 6xx global failure."
section = "7.2"

[[format.fields]]
name = "Call-ID"
wireshark = "sip.Call-ID"
meaning = "A globally unique identifier for the call or registration; every message of the dialog carries it."
section = "20.8"

[[format.fields]]
name = "CSeq"
wireshark = "sip.CSeq"
meaning = "A sequence number and the request method; the response repeats it, so it pairs responses with requests."
section = "20.16"

[[format.fields]]
name = "Via"
wireshark = "sip.Via"
meaning = "One per hop, with the transport, the sender's address and a branch parameter that identifies the transaction."
section = "20.42"

[[format.fields]]
name = "From"
wireshark = "sip.From"
