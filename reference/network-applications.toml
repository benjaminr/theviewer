aliases = ["Status"]
meaning = "0 OK, 1 cancelled, 2 unknown, 3 invalid argument, 4 deadline exceeded, 5 not found, 7 permission denied, 8 resource exhausted, 12 unimplemented, 13 internal, 14 unavailable, 16 unauthenticated."

[[format.fields]]
name = ":path"
aliases = ["Path", "Method"]
meaning = "The service and method being called, as /package.Service/Method."

