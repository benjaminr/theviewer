aliases = ["Reply subject"]
meaning = "An optional subject the receiver should answer on, used for request and reply."

[[format.fields]]
name = "Size"
aliases = ["Payload size"]
meaning = "The number of payload bytes after the command line."

[[format]]
id = "zmtp"
name = "ZeroMQ Message Transport Protocol"
keys = ["ZMTP", "ZeroMQ", "ZMQ", "0MQ", "ZeroMQ Message Transport Protocol"]
wireshark = "zmtp"
summary = "The wire protocol of ZeroMQ sockets: a fixed greeting, a security handshake and then a stream of length-prefixed frames making up multipart messages."
group = "Messaging"
organisation = """
ZeroMQ has no registered port; applications choose their own. Each peer begins with a 64-byte greeting: a 10-byte signature (0xFF, eight padding bytes, 0x7F), a major and minor version (3 and 0 or 1 for ZMTP 3.x), a 20-byte security mechanism name padded with zeros ("NULL", "PLAIN" or "CURVE"), an as-server byte and 31 bytes of filler. The signature is chosen so that older ZMTP 1.0 and 2.0 peers can be detected.

The security handshake follows as command frames. With NULL each side sends READY with metadata properties such as Socket-Type (REQ, REP, PUB, SUB, DEALER, ROUTER) and Identity. PLAIN sends a user name and password in clear; CURVE performs a CurveZMQ handshake, after which everything is encrypted.

Frames have a 1-byte flags field (bit 0 more frames follow, bit 1 long size, bit 2 command), then the size in 1 byte, or in 8 big-endian bytes when the long flag is set, then the body. A message is one or more frames, all but the last with the more flag set. Command frames start with a 1-byte name length and the name (READY, ERROR, SUBSCRIBE, PING and so on).
"""

[[format.specs]]
document = "ZeroMQ RFC 37/ZMTP"
title = "ZeroMQ Message Transport Protocol, version 3.1"
url = "https://rfc.zeromq.org/spec/37/"

[[format.specs]]
document = "ZeroMQ RFC 23/ZMTP"
title = "ZeroMQ Message Transport Protocol, version 3.0"
url = "https://rfc.zeromq.org/spec/23/"

[[format.fields]]
name = "Signature"
wireshark = "zmtp.signature"
meaning = "Ten bytes: 0xFF, eight bytes of padding and 0x7F."

[[format.fields]]
name = "Mechanism"
wireshark = "zmtp.mechanism"
meaning = "The security mechanism name, NULL, PLAIN or CURVE, padded with zeros to 20 bytes."

[[format.fields]]
name = "Flags"
wireshark = "zmtp.flags"
meaning = "Bit 0 MORE (another frame of the same message follows), bit 1 LONG (8-byte size), bit 2 COMMAND."

[[format.fields]]
name = "Size"
wireshark = "zmtp.length"
meaning = "The frame body's length: one byte, or eight big-endian bytes when the LONG flag is set."

