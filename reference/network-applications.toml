wireshark = "dnp3.al.iin"
aliases = ["IIN"]
meaning = "Two bytes of flags in every response: device restart, time synchronisation needed, events of class 1 to 3 available, function not supported, object unknown, parameter error and others."

[[format.fields]]
name = "Object header"
aliases = ["Group", "Variation", "Qualifier"]
meaning = "The data type as group and variation numbers, then a qualifier saying how the points are listed (a start and stop index, a count, or a list of indexes)."

[[format]]
id = "iec-104"
name = "IEC 60870-5-104"
keys = ["IEC 60870-5-104", "IEC 104", "IEC-104", "IEC104", "IEC 60870-5-104 APCI"]
wireshark = "iec60870_104"
summary = "The telecontrol protocol used by European and many other power grids to exchange measurements, status changes and commands between control centres and substations over TCP."
group = "Industrial control"
ports = ["tcp/2404"]
organisation = """
Each message (APDU) begins with a start byte 0x68 and a 1-byte length of what follows, at most 253, then four control bytes. The low bits of the first control byte give the frame format. I-format (bit 0 clear) carries data, with 15-bit send and receive sequence numbers in the control bytes. S-format (bits 01) only acknowledges received I-frames with a receive sequence number. U-format (bits 11) controls the link: STARTDT and STOPDT to start and stop data transfer, and TESTFR to test an idle connection, each as an activation and a confirmation.

An I-format frame carries an ASDU. Its first byte is the type identification: 1 single-point information, 3 double-point, 9 measured value (normalised), 13 measured value (short float), 30 single point with a time tag, 45 single command, 46 double command, 100 general interrogation, 103 clock synchronisation. The variable structure qualifier gives the number of information objects and whether they are sequential (SQ bit).

Then come the cause of transmission (6 bits plus a negative-confirmation bit and a test bit, followed by an originator address byte), the 2-byte common address of the ASDU (the station) and the information objects, each a 3-byte information object address and the elements of the type, such as a value and a quality descriptor, sometimes with a 7-byte CP56Time2a time tag. Numbers are little-endian.
"""

