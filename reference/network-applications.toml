[[format]]
id = "dnp3"
name = "Distributed Network Protocol 3"
keys = ["DNP3", "DNP 3", "DNP", "Distributed Network Protocol", "IEEE 1815"]
wireshark = "dnp3"
summary = "The SCADA protocol of North American electricity and water utilities: a control station polls outstations for measurements and events and sends them commands."
group = "Industrial control"
ports = ["tcp/20000", "udp/20000"]
organisation = """
DNP3 keeps its serial-line framing when carried over TCP or UDP. Each data link frame begins with the start bytes 0x05 0x64, a 1-byte length, a control byte (direction, primary bit and a function code), a 2-byte destination address and a 2-byte source address, both little-endian, followed by a 2-byte CRC over those 8 bytes. The length counts control, addresses and user data but not the CRCs. The user data follows in blocks of up to 16 bytes, each followed by its own 2-byte CRC, so CRCs must be removed before the rest can be read.

The first byte of user data is the transport header: FIN and FIR bits marking the last and first segment of an application message and a 6-bit sequence number. Segments are joined to form one application fragment.

The application header is a control byte (FIR, FIN, CON confirmation requested, UNS unsolicited and a 4-bit sequence number) and a function code; responses add 2 bytes of internal indications that report device state (restart, time needs synchronising, buffer overflow and so on). Object headers follow, each naming a data type by group and variation (group 1 binary inputs, 30 analogue inputs, 12 control relay output block, 60 class data), a qualifier saying how the range or count of points is given, and then the data. Numbers are little-endian. Secure Authentication adds challenge and reply objects for critical commands.
"""

[[format.specs]]
document = "IEEE 1815-2012"
title = "IEEE Standard for Electric Power Systems Communications - Distributed Network Protocol (DNP3)"
url = "https://standards.ieee.org/ieee/1815/5414/"

[[format.fields]]
name = "Start"
wireshark = "dnp3.start"
aliases = ["Start bytes"]
meaning = "The two bytes 0x05 0x64 that begin every link-layer frame."

[[format.fields]]
name = "Length"
wireshark = "dnp3.len"
meaning = "Bytes of control, destination, source and user data in the frame, not counting the start bytes, the length itself or the CRCs; 5 to 255."

[[format.fields]]
name = "Control"
wireshark = "dnp3.ctl"
aliases = ["Link control"]
meaning = "Direction bit, primary bit, frame count bits and a link function code (for example 4 unconfirmed user data, 9 request link status)."

[[format.fields]]
name = "Destination"
wireshark = "dnp3.dst"
aliases = ["Source"]
meaning = "16-bit station addresses, little-endian; 0xFFFD to 0xFFFF are broadcast."

[[format.fields]]
name = "Transport header"
wireshark = "dnp3.tr.ctl"
aliases = ["Transport control"]
meaning = "FIN (last segment), FIR (first segment) and a 6-bit sequence number."

[[format.fields]]
name = "Application control"
wireshark = "dnp3.al.ctl"
meaning = "FIR, FIN, CON (confirmation wanted), UNS (unsolicited) and a 4-bit application sequence number."

[[format.fields]]
name = "Function code"
wireshark = "dnp3.al.func"
meaning = "0 confirm, 1 read, 2 write, 3 select, 4 operate, 5 direct operate, 13 cold restart, 14 warm restart, 20 enable unsolicited, 21 disable unsolicited, 129 response, 130 unsolicited response."

[[format.fields]]
