[[format]]
id = "rtsp"
name = "Real-Time Streaming Protocol"
keys = ["RTSP", "RTSPS", "Real-Time Streaming Protocol", "Real Time Streaming Protocol"]
wireshark = "rtsp"
summary = "The control protocol for streaming media servers and IP cameras: a client describes, sets up, plays and pauses streams whose media then flows over RTP."
group = "Voice and video"
ports = ["tcp/554", "udp/554", "tcp/322"]
carries = ["sdp", "rtp", "rtcp"]
organisation = """
RTSP is text in the style of HTTP: a request line of method, URL and version ("DESCRIBE rtsp://camera/stream1 RTSP/1.0"), header lines, an empty line and an optional body; responses have a status line with codes like HTTP's. Most devices still speak version 1.0 (RFC 2326), which RFC 7826 (version 2.0) has replaced; the framing is the same.

Every request carries a CSeq header that the response repeats, which is how they are matched. A typical exchange is OPTIONS, DESCRIBE (answered with an SDP description of the streams), SETUP for each stream with a Transport header, then PLAY, and finally TEARDOWN. SETUP's response returns a Session identifier that later requests must carry. Credentials are often sent with HTTP Basic or Digest authentication.

The Transport header says where the media goes: RTP over UDP to the listed client ports, or interleaved on the RTSP TCP connection itself. Interleaved data is framed by a "$" byte (0x24), a 1-byte channel number and a 2-byte big-endian length, followed by one RTP or RTCP packet; even channels usually carry RTP and odd ones RTCP. Port 322 is RTSP over TLS.
"""

[[format.specs]]
document = "RFC 7826"
title = "Real-Time Streaming Protocol Version 2.0"
url = "https://www.rfc-editor.org/rfc/rfc7826"
rfc = 7826
section = "5"

[[format.fields]]
name = "Method"
wireshark = "rtsp.method"
meaning = "OPTIONS, DESCRIBE, SETUP, PLAY, PAUSE, TEARDOWN, GET_PARAMETER, SET_PARAMETER, REDIRECT and PLAY_NOTIFY; version 1.0 also has ANNOUNCE and RECORD."
section = "13"

[[format.fields]]
name = "CSeq"
wireshark = "rtsp.cseq"
meaning = "A sequence number on every request, repeated in its response."
section = "18.20"

[[format.fields]]
name = "Session"
wireshark = "rtsp.session"
meaning = "The session identifier the server assigned in its SETUP response, with an optional timeout."
section = "18.49"

[[format.fields]]
name = "Transport"
wireshark = "rtsp.transport"
meaning = "How media is delivered, such as RTP/AVP;unicast;client_port=5000-5001 or RTP/AVP/TCP;interleaved=0-1."
section = "18.54"

[[format.fields]]
name = "Channel"
wireshark = "rtsp.channel"
aliases = ["Interleaved channel"]
meaning = "In interleaved data, the channel number that says which stream the packet belongs to, as agreed in the Transport header."
section = "14"

