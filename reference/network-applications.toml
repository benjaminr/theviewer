[[format]]
id = "tds"
name = "Tabular Data Stream"
keys = ["TDS", "Tabular Data Stream", "MS-TDS", "Microsoft SQL Server protocol", "MSSQL"]
wireshark = "tds"
summary = "The protocol between clients and Microsoft SQL Server (and Sybase ASE): login, SQL batches and remote procedure calls in one direction, tabular results as token streams in the other."
group = "Databases"
ports = ["tcp/1433", "udp/1434"]
organisation = """
Messages are split into packets, each with an 8-byte header: a type, a status byte, a 2-byte length of the packet including the header (big-endian, unlike the rest of the protocol), a 2-byte server process ID, a 1-byte packet ID and a 1-byte window. The end-of-message bit (0x01) in the status marks a message's last packet; the packet ID counts packets within a message.

A connection opens with PRELOGIN (type 18) packets that negotiate version and encryption. When encryption is chosen the TLS handshake travels inside further PRELOGIN packets, and afterwards the TLS records flow directly; often only the login is encrypted and everything later is clear. In TDS 8.0 TLS starts first, before any TDS packet. A LOGIN7 message (type 16) then carries the client host name, user name, a lightly obfuscated password (each byte's nibbles swapped and XORed with 0xA5), application name, server name and database.

Requests are SQL batches (type 1, the query text in UTF-16LE after a headers block), RPC calls (type 3, stored procedure name or ID and parameters) and attention (type 6, cancel). Responses are type 4: a stream of tokens, each a 1-byte token type and its data, such as 0x81 column metadata, 0xD1 row, 0xAA error, 0xAB info, 0xE3 environment change and 0xFD done. Other numbers are little-endian. UDP port 1434 is the SQL Server Browser, which tells clients the ports of named instances.
"""

[[format.specs]]
document = "[MS-TDS]"
title = "Tabular Data Stream Protocol"
url = "https://learn.microsoft.com/en-us/openspecs/windows_protocols/ms-tds/b46a581a-39de-4745-b076-ec4dbb7d13ec"
section = "2.2.3.1"

