[[format]]
id = "rtp"
name = "Real-time Transport Protocol"
keys = ["RTP", "Real-time Transport Protocol", "RTP media"]
wireshark = "rtp"
summary = "The packet format that carries audio and video in calls and streams: each packet holds a slice of encoded media with a sequence number and timestamp so the receiver can reorder it and play it out at the right time."
group = "Voice and video"
ports = ["udp/5004"]
carries = ["rtcp"]
organisation = """
RTP normally runs over UDP on even-numbered ports chosen in the signalling (SDP), so it is usually recognised by its header rather than its port; 5004 is only a registered default. The fixed header is 12 bytes, big-endian: two bits of version (always 2, so the first byte is usually 0x80 to 0x9F), a padding bit, an extension bit, a 4-bit count of contributing sources, a marker bit, a 7-bit payload type, a 16-bit sequence number, a 32-bit timestamp and a 32-bit synchronisation source (SSRC) identifier.

The sequence number rises by one per packet, so gaps show loss and reordering. The timestamp counts in the media's clock (8000 per second for narrowband voice, 90,000 for video) and gives the sampling instant of the first byte of payload; video frames split across several packets share one timestamp, and the marker bit typically flags a frame's last packet. The SSRC identifies one stream; a call's two directions have different SSRCs.

Up to 15 contributing-source identifiers (4 bytes each) follow when a mixer has combined streams. If the extension bit is set, a header extension follows: a 16-bit profile value (0xBEDE for one-byte extensions), a 16-bit length in 32-bit words and the extension data. Then comes the payload, whose codec is given by the payload type: 0 PCMU, 8 PCMA, 9 G.722 and 18 G.729 are static assignments, and 96 to 127 are dynamic and mapped to codecs by SDP. SRTP keeps this header readable and encrypts only the payload.
"""

[[format.specs]]
document = "RFC 3550"
title = "RTP: A Transport Protocol for Real-Time Applications"
url = "https://www.rfc-editor.org/rfc/rfc3550"
rfc = 3550
section = "5.1"

[[format.specs]]
document = "RFC 3551"
title = "RTP Profile for Audio and Video Conferences with Minimal Control"
