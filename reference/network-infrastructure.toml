meaning = "Pairs each response with its request and orders exchanges; 0 for IKE_SA_INIT."
section = "3.1"

[[format.fields]]
name = "Length"
meaning = "Bytes in the whole IKE message, header and payloads."
section = "3.1"

[[format]]
id = "ipip"
name = "IPv4 in IP encapsulation"
keys = ["IP in IP", "IP-in-IP", "IPIP", "IPv4 in IP", "IPv4 encapsulation", "IP protocol 4"]
summary = "The simplest IP tunnel: a complete IPv4 packet carried as the payload of another IP packet, with no tunnel header of its own."
group = "Tunnels and VPNs"
ip_protocols = [4]
organisation = """
The outer IP header has protocol 4 (or next header 4 in IPv6) and the inner IPv4 header starts immediately after it; there are no tunnel fields, keys or identifiers. The outer addresses are the tunnel endpoints and the inner ones the original source and final destination.

The encapsulator copies or derives a few values: the outer time to live is set afresh, the inner one is decremented only once for the whole tunnel, and the don't-fragment bit and DSCP are usually copied out. Linux \"ipip\" tunnels, Mobile IP and some load balancers use this format. Protocol 94 (IPIP) is an older, rarely seen alternative number.
"""
carries = ["ipv4"]

[[format.specs]]
document = "RFC 2003"
title = "IP Encapsulation within IP"
url = "https://www.rfc-editor.org/rfc/rfc2003"
