id = "syslog"
name = "Syslog"
keys = ["Syslog", "syslog protocol", "BSD syslog"]
summary = "The plain-text log transport of Unix systems and network devices: each message carries a facility and severity, a timestamp, the host, the application and free text."
group = "Network management"
ports = ["udp/514", "tcp/6514", "udp/6514"]
organisation = """
Classic syslog sends one message per UDP datagram to port 514, with no acknowledgement. TLS-protected syslog uses TCP port 6514, where each message is preceded by its length in decimal digits and a space so that messages can be separated in the stream; DTLS over UDP 6514 also exists. Many systems also send plain syslog over TCP 514 with newline framing, a widespread but unregistered practice.

Every message starts with a priority in angle brackets: the facility multiplied by eight plus the severity, so <34> is facility 4 (security/authorisation) at severity 2 (critical). Severities run from 0 emergency to 7 debug; facilities include 0 kernel, 1 user, 3 daemon, 4 auth, 10 authpriv and 16 to 23 local0 to local7.

In the RFC 5424 format the priority is followed by a version number (1), then space-separated fields: an ISO 8601 timestamp, host name, application name, process ID, message ID and structured data, each written as \"-\" when absent, then the message, which may begin with a UTF-8 byte order mark. The older BSD format still sent by many devices puts a \"Mmm dd hh:mm:ss\" timestamp and a host name after the priority and then a tag such as \"sshd[1234]:\" and the text.
"""
