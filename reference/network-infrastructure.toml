[[format]]
id = "eigrp"
name = "Enhanced Interior Gateway Routing Protocol"
keys = ["EIGRP", "Enhanced Interior Gateway Routing Protocol", "IP protocol 88"]
summary = "Cisco's advanced distance-vector routing protocol, published as an informational RFC: neighbours exchange routes with composite metrics and use the DUAL algorithm to stay loop-free."
group = "Routing"
ip_protocols = [88]
organisation = """
EIGRP is IP protocol 88, multicast to 224.0.0.10 (FF02::A for IPv6) for hellos and most updates, unicast for retransmissions and replies. Every packet has a 20-byte header: version (2), opcode, checksum, 4 bytes of flags, a 4-byte sequence number, a 4-byte acknowledgement number, a 2-byte virtual router ID and the 2-byte autonomous system number.

A hello with a non-zero acknowledgement number and no TLVs is an acknowledgement. Sequence and acknowledgement numbers implement EIGRP's own reliable delivery for updates, queries and replies.

After the header comes a list of TLVs, each with a 2-byte type and 2-byte length: parameter TLVs (K values and hold time), software version, sequence, and route TLVs for internal and external IPv4 and IPv6 routes carrying the metric components (delay, bandwidth, MTU, hop count, reliability, load) and the prefix.
"""
