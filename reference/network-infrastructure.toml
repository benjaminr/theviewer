[[format]]
id = "6in4"
name = "IPv6 in IPv4 (6in4)"
keys = ["IPv6 in IPv4", "6in4", "IPv6-in-IPv4", "6to4", "ISATAP", "SIT", "IPv6 encapsulation", "IP protocol 41"]
summary = "IPv6 packets carried directly inside IPv4 with protocol number 41: configured tunnels (such as tunnel broker services), 6to4 and ISATAP all use it."
group = "Tunnels and VPNs"
ip_protocols = [41]
organisation = """
The IPv4 header has protocol 41 and the IPv6 header follows straight after it, with no intervening tunnel header. The IPv4 addresses are the tunnel endpoints; the IPv6 addresses are the real ones.

Variants differ only in how endpoints are chosen. Configured tunnels name both ends explicitly; 6to4 derives the IPv4 endpoint from an IPv6 address in 2002::/16 (the 32 bits after the prefix are the IPv4 address); ISATAP embeds the IPv4 address in the last 32 bits of the interface identifier. Protocol 41 is also the IPv6 next header value for IPv6 inside IPv6.

Because there are no ports, many NATs drop protocol 41; Teredo exists to tunnel IPv6 over UDP instead.
"""
carries = ["ipv6"]

[[format.specs]]
