title = "Encapsulating MPLS in IP or Generic Routing Encapsulation (GRE)"
url = "https://www.rfc-editor.org/rfc/rfc4023"
rfc = 4023
section = "3"

[[format.specs]]
document = "RFC 7510"
title = "Encapsulating MPLS in UDP"
url = "https://www.rfc-editor.org/rfc/rfc7510"
rfc = 7510

[[format.fields]]
name = "Label"
meaning = "20 bits: the forwarding label, meaningful only to the router that receives it. 0 to 15 are reserved (0 IPv4 explicit null, 2 IPv6 explicit null, 1 router alert, 13 GAL)."
section = "2.1"

[[format.fields]]
name = "Traffic Class"
aliases = ["TC", "EXP", "Experimental"]
meaning = "3 bits used for quality of service and congestion marking."
section = "2.1"

[[format.fields]]
name = "Bottom of Stack"
aliases = ["S", "Bottom of stack"]
meaning = "1 on the last label entry; the payload starts right after it."
section = "2.1"

[[format.fields]]
name = "TTL"
aliases = ["Time to live"]
meaning = "Decremented at each label-switching hop like the IP time to live, and usually copied from or to it at the edges of the MPLS network."
section = "2.1"

[[format]]
id = "ppp"
name = "Point-to-Point Protocol"
keys = ["PPP", "Point-to-Point Protocol", "LINKTYPE_PPP", "LINKTYPE_PPP_HDLC", "PPP in HDLC-like framing", "LCP", "Link Control Protocol", "IPCP"]
summary = "A link protocol for carrying IP and other network protocols over a point-to-point link: serial lines, DSL (inside PPPoE), L2TP and PPTP tunnels and mobile data, with its own negotiation of link options, authentication and addresses."
group = "Link layer"
organisation = """
A PPP frame is a protocol field followed by the information. The protocol field is normally 2 bytes, big-endian, though it can be compressed to 1 byte by agreement: 0x0021 IPv4, 0x0057 IPv6, 0xC021 LCP (link control), 0x8021 IPCP and 0x8057 IPV6CP (address configuration), 0xC023 PAP and 0xC223 CHAP (authentication), 0x80FD CCP (compression).

On serial links and in some captures (pcap link type 50) frames use HDLC-like framing: a 0x7E flag, the address byte 0xFF, the control byte 0x03, the protocol, the information, a 2- or 4-byte frame check sequence and a closing flag. Bytes equal to 0x7E or 0x7D inside the frame are escaped as 0x7D followed by the byte XORed with 0x20. pcap link type 9 frames may or may not include the 0xFF 0x03 prefix.

LCP and the network control protocols share one packet layout: a 1-byte code (1 Configure-Request, 2 Configure-Ack, 3 Configure-Nak, 4 Configure-Reject, 5 Terminate-Request, 6 Terminate-Ack, 9 Echo-Request, 10 Echo-Reply, and others), a 1-byte identifier, a 2-byte length and options or data. A session starts with LCP negotiation (MRU, authentication protocol, magic number), then authentication, then IPCP or IPV6CP, and only then IP traffic.
"""
carries = ["ipv4", "ipv6"]

[[format.specs]]
document = "RFC 1661"
title = "The Point-to-Point Protocol (PPP)"
url = "https://www.rfc-editor.org/rfc/rfc1661"
rfc = 1661
section = "2"

[[format.specs]]
document = "RFC 1662"
title = "PPP in HDLC-like Framing"
url = "https://www.rfc-editor.org/rfc/rfc1662"
rfc = 1662
section = "3.1"

[[format.fields]]
name = "Protocol"
meaning = "What the information is: 0x0021 IPv4, 0x0057 IPv6, 0xC021 LCP, 0x8021 IPCP, 0x8057 IPV6CP, 0xC023 PAP, 0xC223 CHAP."
section = "2"

[[format.fields]]
name = "Address"
meaning = "HDLC-like framing only: always 0xFF (all stations); may be left out when address and control field compression is agreed."

[[format.fields]]
name = "Control"
meaning = "HDLC-like framing only: always 0x03, an unnumbered information frame."

[[format.fields]]
name = "Code"
meaning = "In LCP and NCP packets: 1 Configure-Request, 2 Configure-Ack, 3 Configure-Nak, 4 Configure-Reject, 5 Terminate-Request, 6 Terminate-Ack, 7 Code-Reject, 8 Protocol-Reject, 9 Echo-Request, 10 Echo-Reply, 11 Discard-Request."
section = "5"

[[format.fields]]
name = "Identifier"
meaning = "Matches replies to requests in LCP and NCP packets."
section = "5"

[[format.fields]]
name = "Length"
meaning = "Bytes in the LCP or NCP packet including code, identifier and length."
section = "5"

[[format]]
id = "pppoe"
name = "PPP over Ethernet"
keys = ["PPPoE", "PPP over Ethernet", "PPPoE Discovery", "PPPoE Session"]
summary = "How DSL and many fibre broadband services run PPP sessions over Ethernet: a discovery exchange to find an access concentrator and get a session ID, then PPP frames tagged with that ID."
group = "Link layer"
ethertypes = [0x8863, 0x8864]
organisation = """
Two EtherTypes are used: 0x8863 for the discovery stage and 0x8864 for session data. Both start with the same 6-byte header: version and type packed in one byte (always 0x11), a code byte, a 2-byte session ID and a 2-byte length of the payload that follows.

Discovery is four packets, each named by its code: the client broadcasts PADI (0x09), concentrators answer with PADO (0x07), the client picks one and sends PADR (0x19), and the concentrator confirms with PADS (0x65), which carries the new non-zero session ID. Either side ends the session with PADT (0xA7). The discovery payload is a list of tags, each a 2-byte type, a 2-byte length and a value: Service-Name (0x0101), AC-Name (0x0102), Host-Uniq (0x0103), AC-Cookie (0x0104) and error tags.

In the session stage the code is 0 and the payload is a PPP frame without HDLC framing: a 2-byte PPP protocol field and the packet. The 8 bytes of PPPoE and PPP headers are why such links usually have an MTU of 1492.
"""
carries = ["ppp"]

[[format.specs]]
document = "RFC 2516"
title = "A Method for Transmitting PPP Over Ethernet (PPPoE)"
url = "https://www.rfc-editor.org/rfc/rfc2516"
rfc = 2516
section = "4"

[[format.fields]]
name = "Version"
aliases = ["Version and type", "Type"]
meaning = "Version and type, 4 bits each, both 1, so the first byte is 0x11."
section = "4"

[[format.fields]]
name = "Code"
meaning = "0x09 PADI, 0x07 PADO, 0x19 PADR, 0x65 PADS, 0xA7 PADT in discovery; 0x00 for session data."
section = "4"

[[format.fields]]
name = "Session ID"
meaning = "Identifies the PPP session together with the two MAC addresses; zero until PADS assigns it."
section = "4"

[[format.fields]]
name = "Length"
aliases = ["Payload length"]
meaning = "Bytes of payload after the 6-byte header; bytes beyond it in the frame are Ethernet padding."
section = "4"

[[format.fields]]
name = "Tag *"
aliases = ["Service-Name", "AC-Name", "Host-Uniq", "AC-Cookie"]
meaning = "Discovery tags: 2-byte type, 2-byte length and value. Service-Name (0x0101) and AC-Name (0x0102) are text; Host-Uniq (0x0103) and AC-Cookie (0x0104) are opaque values echoed back."
section = "5"

[[format]]
id = "wake-on-lan"
name = "Wake-on-LAN magic packet"
keys = ["Wake-on-LAN", "WoL", "Wake on LAN", "Magic Packet"]
summary = "A frame that tells a sleeping computer's network card to power the machine on: the target's MAC address repeated sixteen times after a run of 0xFF bytes."
group = "Link layer"
ethertypes = [0x0842]
ports = ["udp/9", "udp/7"]
organisation = """
The network card looks only for the pattern, not for any header: six bytes of 0xFF followed by the target MAC address written sixteen times, 102 bytes in all. The pattern can be anywhere in the frame, so the same magic packet works inside a raw Ethernet frame with EtherType 0x0842 or as the payload of a UDP broadcast.

UDP magic packets are usually sent to the subnet broadcast address on port 9 (discard) or 7 (echo), though any port works since the receiving machine is not running a network stack. A 4- or 6-byte \"SecureOn\" password may follow the sixteenth copy of the address on cards that support it.
"""
carries = []

