[[format]]
id = "dhcp"
name = "Dynamic Host Configuration Protocol"
keys = ["DHCP", "Dynamic Host Configuration Protocol", "DHCPv4", "BOOTP", "Bootstrap Protocol"]
summary = "How IPv4 hosts get an address, gateway, DNS servers and other settings when they join a network; an extension of the older BOOTP format."
group = "Addressing and naming"
ports = ["udp/67", "udp/68"]
organisation = """
Clients send from UDP port 68 to server port 67, usually as broadcasts to 255.255.255.255 from 0.0.0.0 since they have no address yet; relay agents forward them to servers on other subnets, filling in their own address. Every message has the fixed BOOTP layout: op (1 request, 2 reply), hardware type, hardware address length, hops, a 4-byte transaction ID, seconds, flags, then four 4-byte addresses (ciaddr, yiaddr, siaddr, giaddr), the 16-byte client hardware address, a 64-byte server name and a 128-byte boot file name.

That fixed part is 236 bytes. At byte 236 comes the magic cookie 99.130.83.99 (0x63825363), and the options start at byte 240. Each option is a 1-byte code, a 1-byte length and the value, except Pad (0) and End (255), which are single bytes. If option 52 says so, the server name and file fields hold more options.

Option 53 makes it DHCP rather than BOOTP and gives the message type: 1 DISCOVER, 2 OFFER, 3 REQUEST, 4 DECLINE, 5 ACK, 6 NAK, 7 RELEASE, 8 INFORM. A normal lease is DISCOVER, OFFER, REQUEST, ACK. Other common options are 1 subnet mask, 3 router, 6 DNS servers, 12 host name, 15 domain name, 50 requested address, 51 lease time, 54 server identifier, 55 parameter request list (whose order fingerprints the client's operating system), 60 vendor class, 61 client identifier and 82 relay agent information.
"""
carries = []

[[format.specs]]
document = "RFC 2131"
title = "Dynamic Host Configuration Protocol"
url = "https://www.rfc-editor.org/rfc/rfc2131"
rfc = 2131
section = "2"

[[format.specs]]
document = "RFC 2132"
title = "DHCP Options and BOOTP Vendor Extensions"
url = "https://www.rfc-editor.org/rfc/rfc2132"
rfc = 2132
section = "2"

[[format.specs]]
document = "RFC 951"
title = "Bootstrap Protocol"
url = "https://www.rfc-editor.org/rfc/rfc951"
rfc = 951

[[format.fields]]
name = "op"
aliases = ["Message type", "Op"]
meaning = "1 BOOTREQUEST (client to server), 2 BOOTREPLY (server to client)."
section = "2"

[[format.fields]]
name = "htype"
aliases = ["Hardware type"]
meaning = "Hardware address type from the ARP registry: 1 for Ethernet."
section = "2"

[[format.fields]]
name = "hlen"
aliases = ["Hardware address length"]
meaning = "Length of the hardware address, 6 for Ethernet."
section = "2"

[[format.fields]]
name = "hops"
aliases = ["Hops"]
meaning = "Set to zero by the client and increased by each relay agent."
section = "2"

[[format.fields]]
name = "xid"
aliases = ["Transaction ID"]
meaning = "Random number chosen by the client to match replies to its requests."
section = "2"

[[format.fields]]
name = "secs"
aliases = ["Seconds elapsed"]
meaning = "Seconds since the client began acquiring or renewing an address."
section = "2"

[[format.fields]]
name = "flags"
aliases = ["Flags", "Bootp flags"]
meaning = "The top bit is the broadcast flag: the client cannot receive unicast before it is configured, so the reply must be broadcast."
section = "2"

[[format.fields]]
name = "ciaddr"
aliases = ["Client IP address"]
meaning = "The client's current address, filled in only when it already has one (renewing, rebinding, INFORM)."
section = "2"

[[format.fields]]
name = "yiaddr"
aliases = ["Your (client) IP address", "Your IP address"]
meaning = "The address the server is offering or assigning to the client."
section = "2"

[[format.fields]]
name = "siaddr"
aliases = ["Next server IP address", "Server IP address"]
meaning = "The server to use in the next step of booting, such as a TFTP server for network boot."
section = "2"

[[format.fields]]
name = "giaddr"
aliases = ["Relay agent IP address", "Gateway IP address"]
meaning = "The relay agent's address when the message was relayed; servers use it to choose the subnet to assign from."
section = "2"

[[format.fields]]
name = "chaddr"
aliases = ["Client hardware address", "Client MAC address"]
meaning = "16 bytes holding the client's hardware address (the first hlen bytes count)."
section = "2"

[[format.fields]]
name = "sname"
aliases = ["Server host name"]
meaning = "64 bytes: optional server host name, or overflow options."
section = "2"

[[format.fields]]
name = "file"
aliases = ["Boot file name"]
meaning = "128 bytes: boot file name for network booting, or overflow options."
section = "2"

[[format.fields]]
name = "Magic cookie"
meaning = "0x63825363 at byte 236; marks the start of the options."
section = "3"

[[format.fields]]
name = "Option *"
aliases = ["options"]
meaning = "1-byte code, 1-byte length, value: 53 message type, 1 subnet mask, 3 router, 6 DNS servers, 12 host name, 50 requested address, 51 lease time, 54 server identifier, 55 parameter request list, 61 client identifier, 82 relay agent information; 0 pad and 255 end are single bytes."

[[format]]
id = "dhcpv6"
name = "Dynamic Host Configuration Protocol for IPv6"
keys = ["DHCPv6", "DHCP for IPv6", "Dynamic Host Configuration Protocol for IPv6"]
summary = "Assigns IPv6 addresses, delegated prefixes and configuration such as DNS servers to hosts and routers; it works alongside router advertisements rather than replacing them."
group = "Addressing and naming"
ports = ["udp/546", "udp/547"]
organisation = """
Clients send from UDP port 546 to port 547 on the link-local multicast address FF02::1:2 (all relay agents and servers); servers and relays listen on 547 and answer clients on 546. Unlike DHCPv4 the header is tiny: a 1-byte message type and a 3-byte transaction ID, followed directly by options.

Each option is a 2-byte code, a 2-byte length and the value, and options can nest (an identity association contains address or prefix options, each with lifetimes). Common options are Client Identifier (1) and Server Identifier (2), both holding a DUID that identifies the device, IA_NA (3) for addresses, IA Address (5), Option Request (6), Elapsed Time (8), Status Code (13), IA_PD (25) and IA Prefix (26) for prefix delegation, and DNS Recursive Name Server (23).

Message types are SOLICIT (1), ADVERTISE (2), REQUEST (3), CONFIRM (4), RENEW (5), REBIND (6), REPLY (7), RELEASE (8), DECLINE (9), RECONFIGURE (10) and INFORMATION-REQUEST (11); a normal exchange is SOLICIT, ADVERTISE, REQUEST, REPLY, or SOLICIT and REPLY with rapid commit. Relays wrap messages in RELAY-FORW (12) and RELAY-REPL (13), which have a hop count and 16-byte link and peer addresses before their options; the original message travels inside a Relay Message option (9).
"""
