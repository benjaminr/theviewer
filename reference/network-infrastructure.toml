RIP runs over UDP port 520 (registered as \"router\"). A message is a 4-byte header, a 1-byte command (1 request, 2 response), a 1-byte version (1 or 2) and 2 zero bytes, followed by up to 25 route entries of 20 bytes each. RIPv2 sends to the multicast address 224.0.0.9; RIPv1 uses broadcast.

Each RIPv2 entry is a 2-byte address family (2 for IP), a 2-byte route tag, the 4-byte destination address, a 4-byte subnet mask, a 4-byte next hop (0.0.0.0 meaning the sender) and a 4-byte metric from 1 to 16, where 16 means unreachable. RIPv1 entries have the same size but zeros where v2 puts the tag, mask and next hop, so routes are classful.

If the first entry's address family is 0xFFFF the entry is authentication instead: a type (2 for a clear-text password, 3 for a keyed digest) and 16 bytes of data. A request with a single entry of family 0 and metric 16 asks for the whole table.
