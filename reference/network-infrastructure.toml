IGMP is IP protocol 2. Messages are sent with a time to live of 1 and usually an IP Router Alert option, so the IPv4 header is often 24 bytes. All versions share the first 8 bytes: a type, a max response code, a 2-byte checksum over the IGMP message and a 4-byte group address.

Types are 0x11 membership query (all versions), 0x12 IGMPv1 report, 0x16 IGMPv2 report, 0x17 IGMPv2 leave group and 0x22 IGMPv3 report. Queries go to 224.0.0.1 (general) or to the group itself (group-specific); v2 reports go to the group and leaves to 224.0.0.2; v3 reports go to 224.0.0.22.

An IGMPv3 query is longer than 8 bytes: it adds a suppress flag, the querier's robustness variable and query interval, a source count and source addresses. An IGMPv3 report has a reserved field and a count of group records, each giving a record type (such as MODE_IS_INCLUDE or CHANGE_TO_EXCLUDE), a source count, the multicast address and the source list, which is how source-specific multicast is requested.
"""
