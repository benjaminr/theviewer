ports = ["udp/3478", "tcp/3478", "udp/5349", "tcp/5349"]
organisation = """
STUN and TURN servers listen on port 3478 over UDP and TCP and 5349 for TLS or DTLS, but in WebRTC the same messages are multiplexed onto the media ports, distinguished by their first byte (0 to 3 for STUN, 20 to 63 DTLS, 128 to 191 RTP). Every STUN message has a 20-byte header: a 2-byte message type whose top two bits are zero, a 2-byte length of the attributes, the 4-byte magic cookie 0x2112A442 and a 12-byte transaction ID.

The message type packs a method and a class: 0x0001 is a Binding request, 0x0101 a Binding success response and 0x0111 an error response; TURN adds Allocate (method 3), Refresh (4), Send and Data indications (6, 7), CreatePermission (8) and ChannelBind (9). Attributes follow as 2-byte type, 2-byte length and value padded to a multiple of four bytes.

Common attributes are XOR-MAPPED-ADDRESS (0x0020), the client's public address XORed with the magic cookie so NATs do not rewrite it; USERNAME (0x0006), MESSAGE-INTEGRITY (0x0008, an HMAC), ERROR-CODE (0x0009), SOFTWARE (0x8022) and FINGERPRINT (0x8028, a CRC-32). TURN ChannelData messages are not STUN messages: they begin with a 2-byte channel number from 0x4000 to 0x4FFF and a 2-byte length, followed by the relayed data.
"""
carries = []

[[format.specs]]
document = "RFC 8489"
title = "Session Traversal Utilities for NAT (STUN)"
url = "https://www.rfc-editor.org/rfc/rfc8489"
rfc = 8489
section = "5"

[[format.specs]]
document = "RFC 8656"
title = "Traversal Using Relays around NAT (TURN): Relay Extensions to Session Traversal Utilities for NAT (STUN)"
url = "https://www.rfc-editor.org/rfc/rfc8656"
rfc = 8656
section = "12.4"

[[format.fields]]
name = "Message Type"
aliases = ["Message type"]
meaning = "Method and class: 0x0001 Binding request, 0x0101 Binding success, 0x0111 Binding error; TURN 0x0003 Allocate request, 0x0103 Allocate success, 0x0016 Send indication, 0x0017 Data indication."
section = "5"

[[format.fields]]
name = "Message Length"
aliases = ["Message length", "Length"]
meaning = "Bytes of attributes after the 20-byte header; always a multiple of four."
section = "5"

[[format.fields]]
name = "Magic Cookie"
aliases = ["Magic cookie"]
meaning = "Always 0x2112A442; distinguishes STUN from other traffic on the same port."
section = "5"

[[format.fields]]
name = "Transaction ID"
meaning = "12 random bytes chosen by the client, matching responses to requests."
section = "5"

[[format.fields]]
name = "XOR-MAPPED-ADDRESS"
meaning = "The client's public address and port as the server saw them, XORed with the magic cookie (and transaction ID for IPv6)."
section = "14.2"

[[format.fields]]
name = "MESSAGE-INTEGRITY"
meaning = "HMAC-SHA1 over the message up to this attribute, keyed with the short- or long-term credential."
section = "14.5"

[[format.fields]]
name = "FINGERPRINT"
meaning = "CRC-32 of the message XORed with 0x5354554E, helping receivers tell STUN apart from other protocols on the port."
section = "14.7"

[[format.fields]]
name = "Channel Number"
aliases = ["ChannelData"]
meaning = "TURN ChannelData: a channel number 0x4000 to 0x4FFF bound with ChannelBind, then a 2-byte length and the relayed data."
