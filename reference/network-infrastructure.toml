section = "3.1"

[[format.fields]]
name = "Next Payload"
aliases = ["Next payload"]
meaning = "Type of the first payload: 33 SA, 34 KE, 35 IDi, 36 IDr, 37 CERT, 39 AUTH, 40 Nonce, 41 Notify, 46 Encrypted and Authenticated, 0 none."
section = "3.1"

[[format.fields]]
name = "Version"
aliases = ["Major version", "Minor version"]
meaning = "Major version in the high 4 bits (2 for IKEv2, 1 for IKEv1) and minor in the low 4 bits."
section = "3.1"

[[format.fields]]
name = "Exchange Type"
aliases = ["Exchange type"]
meaning = "34 IKE_SA_INIT, 35 IKE_AUTH, 36 CREATE_CHILD_SA, 37 INFORMATIONAL; IKEv1 uses 2 Main Mode, 4 Aggressive Mode, 32 Quick Mode."
section = "3.1"

[[format.fields]]
name = "Flags"
meaning = "I (sent by the original initiator), V (higher version supported) and R (this is a response)."
section = "3.1"

[[format.fields]]
