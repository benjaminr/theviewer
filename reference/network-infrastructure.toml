[[format]]
id = "teredo"
name = "Teredo"
keys = ["Teredo", "Teredo tunnelling", "Teredo tunneling"]
summary = "Tunnels IPv6 inside UDP over IPv4 so that hosts behind NATs can reach the IPv6 internet; once enabled by default on Windows, so it still turns up in captures."
group = "Tunnels and VPNs"
ports = ["udp/3544"]
organisation = """
A Teredo packet is a UDP datagram whose payload is an IPv6 packet, optionally preceded by indicators. Servers listen on UDP port 3544; data between clients and relays uses whatever ports the NAT mapped. A payload beginning with 0x6 in its first nibble is a bare IPv6 packet.

An origin indication starts with 0x0000 and carries the client's mapped port and IPv4 address, each XORed with all ones, 8 bytes in all; an authentication indicator starts with 0x0001 followed by client ID and authentication lengths, those values, an 8-byte nonce and a confirmation byte. Either or both may come before the IPv6 header.

Teredo addresses are in 2001::/32: the next 32 bits are the Teredo server's IPv4 address, then 16 bits of flags, then the client's mapped port and public IPv4 address, both inverted. Reading these back out tells you the client's public address.
"""
carries = ["ipv6"]

[[format.specs]]
document = "RFC 4380"
title = "Teredo: Tunneling IPv6 over UDP through Network Address Translations (NATs)"
url = "https://www.rfc-editor.org/rfc/rfc4380"
rfc = 4380
section = "5.1.1"

[[format.fields]]
name = "Origin indication"
meaning = "8 bytes starting 0x0000: the client's NAT-mapped port and public IPv4 address, each with all bits inverted."

[[format.fields]]
name = "Authentication indicator"
aliases = ["Authentication"]
meaning = "Starts 0x0001: client identifier length, authentication value length, those values, an 8-byte nonce and a confirmation byte."

[[format]]
id = "vxlan"
name = "Virtual eXtensible Local Area Network"
keys = ["VXLAN", "Virtual eXtensible Local Area Network", "Virtual Extensible LAN", "VXLAN-GPE"]
summary = "Carries Ethernet frames inside UDP so that virtual machines and containers on different hosts can share a layer-2 segment; the common overlay in data centres and cloud networks."
group = "Tunnels and VPNs"
ports = ["udp/4789"]
organisation = """
A VXLAN packet is an outer Ethernet, IP and UDP header to destination port 4789, then an 8-byte VXLAN header, then a complete inner Ethernet frame (without its frame check sequence). The UDP source port is usually a hash of the inner frame's addresses so that routers spread different flows across paths.

The VXLAN header is a flags byte (0x08, the I flag, meaning the network identifier is valid), 3 reserved bytes, a 24-bit VXLAN network identifier (VNI) and a final reserved byte. The VNI names the virtual segment, allowing about 16 million of them compared with 4094 VLANs.

Linux's VXLAN driver once used port 8472 by default, so older deployments may carry the same format there. VXLAN-GPE uses port 4790 and a next-protocol byte so that the inner packet need not be Ethernet.
"""
carries = ["ethernet"]

[[format.specs]]
document = "RFC 7348"
title = "Virtual eXtensible Local Area Network (VXLAN): A Framework for Overlaying Virtualized Layer 2 Networks over Layer 3 Networks"
url = "https://www.rfc-editor.org/rfc/rfc7348"
rfc = 7348
section = "5"

[[format.fields]]
name = "Flags"
meaning = "Byte 0: the I flag (0x08) must be set to say the VNI is valid; the other bits are reserved."
section = "5"

[[format.fields]]
name = "VNI"
aliases = ["VXLAN Network Identifier", "VXLAN network identifier"]
meaning = "24 bits naming the virtual layer-2 segment the inner frame belongs to."
section = "5"

[[format.fields]]
name = "Reserved"
meaning = "The three bytes after the flags and the last byte of the header, sent as zero."
section = "5"

[[format]]
id = "geneve"
name = "Generic Network Virtualization Encapsulation"
keys = ["Geneve", "GENEVE", "Generic Network Virtualization Encapsulation"]
summary = "A data-centre overlay like VXLAN but with extensible options and a protocol type for the inner packet; used by Open vSwitch/OVN, VMware NSX and AWS Gateway Load Balancer."
group = "Tunnels and VPNs"
ports = ["udp/6081"]
organisation = """
Geneve runs over UDP to destination port 6081. The fixed header is 8 bytes: a 2-bit version (0) and 6-bit option length, a flags byte (O for control packets, C when critical options are present), a 2-byte protocol type, a 24-bit virtual network identifier and a reserved byte.

The option length counts 4-byte words of options after the fixed header, so the inner packet starts at 8 + option length × 4 bytes. Each option has a 2-byte option class, a type byte whose top bit marks it critical, and a byte holding 3 reserved bits and a 5-bit length in 4-byte words, then its data.

The protocol type is an EtherType for the inner packet: 0x6558 means an Ethernet frame, the usual case, but IPv4 or IPv6 packets can be carried directly.
"""
carries = ["ethernet", "ipv4", "ipv6"]

