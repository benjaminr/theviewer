[[format]]
id = "openvpn"
name = "OpenVPN"
keys = ["OpenVPN", "OpenVPN protocol"]
summary = "A widely used TLS-based VPN: a reliable control channel carries a TLS session that derives keys, and a data channel carries the encrypted tunnel packets, over UDP or TCP."
group = "Tunnels and VPNs"
ports = ["udp/1194", "tcp/1194"]
organisation = """
OpenVPN's registered port is 1194 on UDP and TCP, though servers are often run on 443 or other ports. Over TCP each packet is preceded by a 2-byte big-endian length, since TCP has no message boundaries; over UDP each datagram is one packet.

The first byte packs a 5-bit opcode and a 3-bit key ID. Control opcodes include P_CONTROL_HARD_RESET_CLIENT_V2 (7) and P_CONTROL_HARD_RESET_SERVER_V2 (8), which start a session, P_CONTROL_V1 (4), which carries TLS records, and P_ACK_V1 (5). Control packets continue with an 8-byte session ID, an optional HMAC and replay fields when tls-auth is used, a list of acknowledged packet IDs and a message packet ID, then the payload.

Data packets are P_DATA_V1 (6) or P_DATA_V2 (9), which adds a 3-byte peer ID; the rest is encrypted with keys negotiated over the TLS control channel. With tls-crypt the control channel is encrypted as well, so even the TLS handshake is hidden.
"""
