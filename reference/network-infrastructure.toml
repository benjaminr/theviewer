Datagrams are sent from and to UDP port 138, usually as subnet broadcasts. The header is a 1-byte message type, a 1-byte flags field, a 2-byte datagram ID, the 4-byte source IPv4 address and 2-byte source port of the original sender, a 2-byte datagram length and a 2-byte packet offset, 14 bytes in all.

