[[format]]
id = "l2tp"
name = "Layer Two Tunnelling Protocol"
keys = ["L2TP", "Layer Two Tunneling Protocol", "Layer Two Tunnelling Protocol", "L2TPv2", "L2TPv3", "IP protocol 115"]
summary = "Tunnels PPP sessions (L2TPv2) or other layer-2 frames (L2TPv3) between an access concentrator and a network server; best known as the transport of L2TP/IPsec VPNs and in ISP broadband wholesale."
group = "Tunnels and VPNs"
ports = ["udp/1701"]
ip_protocols = [115]
organisation = """
L2TPv2 runs over UDP port 1701. Its header starts with a 2-byte flags and version word: T (control message), L (length present), S (sequence numbers present), O (offset present), P (priority) and the version in the low 4 bits (2; 3 for L2TPv3). Then come the optional length, a 2-byte tunnel ID, a 2-byte session ID, optional Ns and Nr sequence numbers, and an optional offset size and padding before the payload.

Data messages (T clear) carry a PPP frame starting with the address and control bytes 0xFF 0x03. Control messages (T set, which also requires L and S) carry a list of attribute-value pairs, each with mandatory and hidden bits, a 10-bit length, a vendor ID and an attribute type; the first AVP is the Message Type, such as SCCRQ (1), SCCRP (2), ICRQ (10) or HELLO (6).

L2TPv3 can also run directly over IP as protocol 115: a 4-byte session ID begins the packet, and session ID 0 marks a control message. Over UDP, L2TPv3 keeps the flags/version word. When used for VPNs, L2TP is itself inside ESP, so only port 4500 or protocol 50 is visible.
"""
carries = ["ppp", "ethernet"]

