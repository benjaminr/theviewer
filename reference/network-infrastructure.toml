[[format]]
id = "pim"
name = "Protocol Independent Multicast"
keys = ["PIM", "Protocol Independent Multicast", "PIM-SM", "PIMv2", "IP protocol 103"]
summary = "The protocol routers use to build multicast distribution trees between them, joining towards a rendezvous point or directly towards a source as receivers appear."
group = "Routing"
ip_protocols = [103]
organisation = """
PIM is IP protocol 103. Most messages are multicast to 224.0.0.13 or FF02::D (all PIM routers) with a time to live of 1; Register and Register-Stop messages are unicast between a source's designated router and the rendezvous point.

Every message starts with a 4-byte header: a 4-bit version (2), a 4-bit type, a reserved byte and a checksum over the message. Types are Hello (0), Register (1), Register-Stop (2), Join/Prune (3), Bootstrap (4), Assert (5) and Candidate-RP-Advertisement (8), among others.

Hellos carry options as 2-byte type and 2-byte length pairs (hold time, DR priority, generation ID). Join/Prune messages list groups, each with lists of sources to join and prune, using encoded addresses that carry an address family, an encoding type, flags and a mask length. A Register message wraps the first multicast data packets from a source, whole, after an 8-byte header, so they reach the rendezvous point before the tree exists.
"""
carries = ["ipv4", "ipv6"]

