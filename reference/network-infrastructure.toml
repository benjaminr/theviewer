[[format]]
id = "quic"
name = "QUIC"
keys = ["QUIC", "QUIC transport", "HTTP/3 transport", "IETF QUIC"]
summary = "An encrypted, multiplexed transport over UDP that combines the jobs of TCP and TLS 1.3; it carries HTTP/3 and most traffic to large web services."
group = "Transport"
ports = ["udp/443"]
organisation = """
QUIC runs over UDP, almost always to port 443. The first byte says which of two header forms a packet uses. If its top bit is set it is a long header, used while the connection is being set up: the first byte (with a fixed bit and a 2-bit packet type: 0 Initial, 1 0-RTT, 2 Handshake, 3 Retry, in version 1), a 4-byte version, then a destination connection ID and a source connection ID, each preceded by a 1-byte length (at most 20).

Initial packets then carry a variable-length token, and Initial, 0-RTT and Handshake packets a variable-length Length field, so several packets can be coalesced in one UDP datagram. A client's first datagram is padded to at least 1200 bytes. Version 0 marks a version negotiation packet, which lists supported versions; 0x00000001 is QUIC version 1 and 0x6B3343CF version 2.

After the handshake, packets use the short header: a first byte with the top bit clear, then the destination connection ID (its length is not encoded, so the receiver must know it) and an encrypted packet number and payload. Header protection masks the low bits of the first byte and the 1-4 byte packet number, and everything else is encrypted with keys from the TLS handshake. Initial packets are protected only with keys derived from the destination connection ID, so the TLS ClientHello inside them, with the server name, can be recovered by an analyser.
"""
carries = ["tls-record"]

