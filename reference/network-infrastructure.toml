aliases = ["Chunk type"]
meaning = "0 DATA, 1 INIT, 2 INIT ACK, 3 SACK, 4 HEARTBEAT, 5 HEARTBEAT ACK, 6 ABORT, 7 SHUTDOWN, 8 SHUTDOWN ACK, 9 ERROR, 10 COOKIE ECHO, 11 COOKIE ACK, 14 SHUTDOWN COMPLETE. The top two bits say what to do with an unknown type."
section = "3.2"

[[format.fields]]
