meaning = "Length-prefixed data such as the RSN information element (message 2) or the encrypted group key (message 3)."

[[format]]
id = "mpls"
name = "MPLS label stack"
keys = ["MPLS", "Multiprotocol Label Switching", "MPLS label stack", "MPLS label", "MPLS-in-IP", "IP protocol 137", "MPLS-in-UDP"]
summary = "Short fixed-size labels pushed in front of a packet so that routers in a provider network forward it by label rather than by IP address; the basis of MPLS VPNs and traffic engineering."
group = "Link layer"
ethertypes = [0x8847, 0x8848]
ip_protocols = [137]
ports = ["udp/6635"]
organisation = """
In Ethernet, EtherType 0x8847 announces MPLS (0x8848 is for upstream-assigned labels). The label stack follows: one or more 4-byte big-endian entries, each holding a 20-bit label, a 3-bit traffic class (formerly called EXP), a 1-bit bottom-of-stack flag and an 8-bit time to live. Entries are read until one has the bottom-of-stack bit set.

Nothing in the stack says what follows the last entry; the routers know from how the label was assigned. Analysers therefore guess from the first nibble: 4 means IPv4, 6 means IPv6, and 0 is usually a pseudowire control word in front of an Ethernet frame (as in VPLS and Ethernet-over-MPLS).

Labels 0 to 15 are reserved: 0 IPv4 explicit null, 1 router alert, 2 IPv6 explicit null, 3 implicit null (signalled but never put on the wire), 7 entropy label indicator and 13 GAL for OAM. MPLS can also be tunnelled over IP with protocol 137, inside GRE with protocol type 0x8847, or over UDP to port 6635.
"""
carries = ["ipv4", "ipv6", "ethernet"]

