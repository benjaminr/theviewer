aliases = ["Version"]
meaning = "EAPOL version: 1 (802.1X-2001), 2 (2004) or 3 (2010 and later)."

[[format.fields]]
name = "Packet type"
aliases = ["Type"]
meaning = "0 EAP packet, 1 EAPOL-Start, 2 EAPOL-Logoff, 3 EAPOL-Key, 4 encapsulated ASF alert, 5 MKA."

[[format.fields]]
name = "Packet body length"
aliases = ["Length", "Body length"]
meaning = "Bytes in the body after this 4-byte header."

[[format.fields]]
name = "Code"
aliases = ["EAP code"]
meaning = "EAP packet kind: 1 Request, 2 Response, 3 Success, 4 Failure."

[[format.fields]]
name = "Identifier"
meaning = "Matches each EAP response to its request."

[[format.fields]]
name = "EAP type"
aliases = ["Method"]
meaning = "Authentication method in requests and responses: 1 Identity, 3 Nak, 4 MD5-Challenge, 13 EAP-TLS, 21 EAP-TTLS, 25 PEAP, 43 EAP-FAST."

[[format.fields]]
name = "Key Information"
aliases = ["Key info"]
meaning = "EAPOL-Key flags: descriptor version, pairwise or group key, install, ACK, MIC present, secure, error, request, encrypted key data. Which bits are set tells the four handshake messages apart."

[[format.fields]]
