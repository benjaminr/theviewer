[[format]]
id = "snmp"
name = "Simple Network Management Protocol"
keys = ["SNMP", "Simple Network Management Protocol", "SNMPv1", "SNMPv2c", "SNMPv3", "SNMP trap"]
summary = "How management stations read and set counters and settings on routers, switches, printers and servers, and how devices send traps and notifications about events."
group = "Network management"
ports = ["udp/161", "udp/162"]
organisation = """
Agents listen on UDP port 161; traps and informs go to the manager on UDP port 162. Every message is ASN.1 encoded with BER: a SEQUENCE (0x30) containing an INTEGER version (0 for SNMPv1, 1 for SNMPv2c, 3 for SNMPv3) and then, in v1 and v2c, an OCTET STRING community string, which acts as a clear-text password (\"public\" is the infamous default), followed by the PDU.

The PDU is a context-specific constructed tag that names the operation: 0xA0 GetRequest, 0xA1 GetNextRequest, 0xA2 Response, 0xA3 SetRequest, 0xA4 the SNMPv1 Trap, 0xA5 GetBulkRequest, 0xA6 InformRequest, 0xA7 SNMPv2-Trap and 0xA8 Report. Most PDUs hold a request ID, an error status, an error index and a list of variable bindings, each a SEQUENCE of an object identifier and a value (or NULL in requests). GetBulk replaces the error fields with non-repeaters and max-repetitions.

SNMPv3 messages wrap the PDU differently: a header with message ID, maximum size, flags (authentication, privacy, reportable) and security model, then the security parameters as an OCTET STRING (user name, engine ID, boots and time, authentication and privacy parameters) and finally the scoped PDU, which is encrypted when the privacy flag is set.
"""
carries = ["der"]

