[[format]]
id = "wireguard"
name = "WireGuard"
keys = ["WireGuard", "WireGuard VPN"]
summary = "A compact VPN protocol built on the Noise framework: a one-round-trip handshake and then encrypted transport packets, all over UDP."
group = "Tunnels and VPNs"
ports = ["udp/51820"]
organisation = """
WireGuard uses UDP on a configured port; 51820 is the conventional default but not a registered one. Every message starts with a 1-byte type and 3 reserved zero bytes, followed by fields in little-endian order.

Type 1 is the handshake initiation (148 bytes): sender index, the initiator's ephemeral public key, its encrypted static key and an encrypted timestamp, then two 16-byte MACs. Type 2 is the handshake response (92 bytes): sender and receiver indexes, the responder's ephemeral key, an empty encrypted value and the MACs. Type 3 is a cookie reply (64 bytes), sent instead of a response when the responder is under load.

Type 4 is transport data: a 4-byte receiver index, an 8-byte counter used as the nonce, then the encrypted inner IP packet with a 16-byte authentication tag. The 16-byte header plus tag is the whole overhead, and a keep-alive is a transport message with nothing inside the encryption. The indexes are the only per-session identifiers on the wire.
"""
carries = []

