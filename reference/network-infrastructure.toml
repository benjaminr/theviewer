[[format]]
id = "bgp"
name = "Border Gateway Protocol"
keys = ["BGP", "BGP-4", "Border Gateway Protocol"]
summary = "The routing protocol of the internet: autonomous systems exchange reachability for address prefixes, with path attributes that drive routing policy, over long-lived TCP sessions."
group = "Routing"
ports = ["tcp/179"]
organisation = """
BGP runs over TCP port 179, so messages arrive as a byte stream and one segment may hold several messages or part of one. Each message starts with a 19-byte header: a 16-byte marker of all ones, a 2-byte length of the whole message (19 to 4096, or up to 65535 when extended messages are agreed) and a 1-byte type.

Types are OPEN (1), UPDATE (2), NOTIFICATION (3), KEEPALIVE (4) and ROUTE-REFRESH (5). OPEN carries the version (4), the sender's AS number (23456, AS_TRANS, when the real one needs 4 bytes), the hold time, the BGP identifier and optional parameters, chiefly capabilities such as multiprotocol support and 4-byte AS numbers. A KEEPALIVE is just the 19-byte header.

An UPDATE has a 2-byte length and list of withdrawn IPv4 prefixes, a 2-byte length and list of path attributes, and then the IPv4 prefixes (NLRI) being announced. Attributes are flags, a type code (1 ORIGIN, 2 AS_PATH, 3 NEXT_HOP, 4 MED, 5 LOCAL_PREF, 8 COMMUNITIES, 14 and 15 MP_REACH and MP_UNREACH_NLRI for IPv6 and VPN routes) and a 1- or 2-byte length. A NOTIFICATION gives an error code and subcode and then the session closes.
"""
