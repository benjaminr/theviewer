[[format]]
id = "ptp"
name = "Precision Time Protocol"
keys = ["PTP", "Precision Time Protocol", "IEEE 1588", "PTPv2", "gPTP"]
summary = "Synchronises clocks across a network to well under a microsecond by exchanging timestamped messages, using hardware timestamps where possible; used in telecoms, finance, broadcast and industrial networks."
group = "Time"
ethertypes = [0x88f7]
ports = ["udp/319", "udp/320"]
organisation = """
PTP runs either directly over Ethernet (EtherType 0x88F7, typically to 01:1B:19:00:00:00, or 01:80:C2:00:00:0E for peer delay and 802.1AS) or over UDP, where event messages that must be timestamped (Sync, Delay_Req, Pdelay_Req, Pdelay_Resp) go to port 319 and general messages to port 320, multicast to 224.0.1.129 or FF0X::181.

Every message starts with a 34-byte common header, big-endian: message type in the low 4 bits of the first byte (0 Sync, 1 Delay_Req, 2 Pdelay_Req, 3 Pdelay_Resp, 8 Follow_Up, 9 Delay_Resp, 0xA Pdelay_Resp_Follow_Up, 0xB Announce, 0xC Signaling, 0xD Management), the version (2), the message length, the domain number, flags, an 8-byte correction field, the 10-byte source port identity, a sequence ID and a log message interval.

The body follows. Timestamps are 10 bytes: a 48-bit count of seconds and a 32-bit count of nanoseconds, on the PTP timescale (TAI) unless the flags say otherwise. A two-step clock sends Sync with an approximate time and the precise transmit time in the following Follow_Up; the slave combines these with Delay_Req and Delay_Resp to compute offset and path delay. Announce messages carry the clock quality used to elect the grandmaster.
"""
carries = []

[[format.specs]]
document = "IEEE 1588-2019"
title = "IEEE Standard for a Precision Clock Synchronization Protocol for Networked Measurement and Control Systems"
url = "https://standards.ieee.org/standard/1588-2019.html"
section = "13.3"

[[format.specs]]
document = "IANA IEEE 802 Numbers"
title = "EtherType registry"
url = "https://www.iana.org/assignments/ieee-802-numbers/ieee-802-numbers.xhtml"

[[format.fields]]
name = "messageType"
aliases = ["Message type"]
meaning = "Low 4 bits of byte 0: 0 Sync, 1 Delay_Req, 2 Pdelay_Req, 3 Pdelay_Resp, 8 Follow_Up, 9 Delay_Resp, 0xA Pdelay_Resp_Follow_Up, 0xB Announce, 0xC Signaling, 0xD Management. The high 4 bits are the majorSdoId (transportSpecific)."

[[format.fields]]
name = "versionPTP"
aliases = ["Version"]
meaning = "PTP version in the low 4 bits, 2 for IEEE 1588-2008 and 2019; the high bits hold the minor version."

[[format.fields]]
name = "messageLength"
aliases = ["Message length"]
meaning = "Bytes in the whole PTP message including the 34-byte header."

[[format.fields]]
name = "domainNumber"
aliases = ["Domain"]
meaning = "Which PTP domain, an independent set of synchronised clocks, the message belongs to; 0 by default."

[[format.fields]]
name = "flagField"
aliases = ["Flags"]
meaning = "Two bytes of flags such as two-step, unicast, alternate master, leap second pending, UTC offset valid and PTP timescale."

[[format.fields]]
name = "correctionField"
aliases = ["Correction"]
meaning = "8 bytes: a time correction in nanoseconds multiplied by 2^16, added to by transparent clocks for the time the message spent inside them."

[[format.fields]]
name = "sourcePortIdentity"
aliases = ["Source port identity", "clockIdentity"]
meaning = "10 bytes: the sender's 8-byte clock identity (often derived from its MAC address) and a 2-byte port number."

[[format.fields]]
name = "sequenceId"
aliases = ["Sequence ID"]
meaning = "Counts messages of each type, pairing Sync with Follow_Up and Delay_Req with Delay_Resp."

[[format.fields]]
name = "logMessageInterval"
aliases = ["Log message interval"]
meaning = "Base-2 logarithm of the interval between messages of this type, in seconds; -3 means eight per second."

[[format.fields]]
name = "originTimestamp"
aliases = ["Timestamp", "preciseOriginTimestamp", "receiveTimestamp"]
meaning = "10-byte timestamp: 48-bit seconds and 32-bit nanoseconds."

