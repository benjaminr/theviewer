[[format]]
id = "sctp"
name = "Stream Control Transmission Protocol"
keys = ["SCTP", "Stream Control Transmission Protocol", "IP protocol 132"]
summary = "A reliable, message-oriented transport with multiple streams per association and multi-homing; the carrier of telecoms signalling (SIGTRAN, Diameter, S1AP, NGAP) and of WebRTC data channels."
group = "Transport"
ip_protocols = [132]
organisation = """
SCTP is IP protocol 132 (WebRTC instead runs it over DTLS over UDP). Every packet starts with a 12-byte common header: 2-byte source and destination ports, a 4-byte verification tag and a 4-byte CRC32c checksum over the whole packet.

One or more chunks follow. Each chunk has a 1-byte type, 1-byte flags and a 2-byte length that includes the 4-byte chunk header but not the padding that brings it to a multiple of four bytes; the next chunk starts at the padded length. Types include DATA (0), INIT (1), INIT ACK (2), SACK (3), HEARTBEAT (4), HEARTBEAT ACK (5), ABORT (6), SHUTDOWN (7), COOKIE ECHO (10) and COOKIE ACK (11).

An association starts with a four-way INIT, INIT ACK, COOKIE ECHO, COOKIE ACK exchange, after which every packet carries the peer's verification tag. A DATA chunk carries a transmission sequence number (TSN), a stream identifier, a stream sequence number and a payload protocol identifier (PPID) that names the upper protocol, such as 3 for M3UA, 18 for S1AP, 46 for Diameter or 60 for NGAP, before the user message. The ports also name the application (sctp/2905 M3UA, sctp/36412 S1AP, sctp/38412 NGAP).
"""
carries = []

