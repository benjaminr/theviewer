id = "nbns"
name = "NetBIOS Name Service"
keys = ["NBNS", "NetBIOS Name Service", "NetBIOS-NS", "WINS", "NetBIOS name service"]
summary = "The name registration and lookup service of NetBIOS over TCP/IP: Windows hosts broadcast or ask a WINS server to map 16-byte NetBIOS names to IPv4 addresses."
group = "Addressing and naming"
ports = ["udp/137", "tcp/137"]
organisation = """
NBNS uses UDP port 137, broadcast on the local subnet or unicast to a WINS server. Its packets borrow the DNS layout: a 12-byte header (transaction ID; a 16-bit word holding the response bit, a 4-bit opcode, flags and a result code; and four record counts) followed by questions and resource records.

The opcode says what is happening: 0 query, 5 registration, 6 release, 7 wait for acknowledgement (WACK), 8 refresh. Flags include authoritative answer, truncation, recursion desired and available, and B, set on broadcasts. Question and record types are NB (0x20) for a name-to-address mapping and NBSTAT (0x21) for a node status request, which returns every name the host has registered and its MAC address.

Names are 16 bytes: up to 15 characters padded with spaces and a final suffix byte giving the service (0x00 workstation, 0x20 file server, 0x1B domain master browser, 0x1C domain controllers, 0x1D master browser). Each byte is split into two nibbles and each nibble written as a letter from A to P, so the name travels as a 32-letter DNS-style label; \"CKAAAA...\" is the wildcard \"*\" used by node status queries.
"""
