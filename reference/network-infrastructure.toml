[[format]]
id = "gtp-u"
name = "GPRS Tunnelling Protocol, user plane"
keys = ["GTP-U", "GTPv1-U", "GPRS Tunnelling Protocol", "GPRS Tunneling Protocol User Plane", "GTP"]
summary = "Carries subscribers' IP packets between the radio network and the packet core of 3G, 4G and 5G mobile networks, each tunnel identified by a tunnel endpoint ID."
group = "Tunnels and VPNs"
ports = ["udp/2152"]
organisation = """
GTP-U runs over UDP port 2152. The mandatory header is 8 bytes: a flags byte (3-bit version, 1, the protocol type bit PT, and the E, S and PN flags), a message type, a 2-byte length and a 4-byte tunnel endpoint identifier (TEID). The length counts everything after these first 8 bytes.

If any of E, S or PN is set, 4 more bytes follow: a 2-byte sequence number, an N-PDU number and a next extension header type. Extension headers then chain: each has a length in 4-byte units and ends with the type of the next, 0 meaning none. 5G uses the PDU session container extension (type 0x85) to carry the QoS flow identifier.

Message type 255 (G-PDU) means the payload is a user's IP packet, which is where the subscriber's actual traffic appears with its own addresses. Other types are path management (echo request 1, echo response 2), error indication (26) and end marker (254).
"""
carries = ["ipv4", "ipv6"]

