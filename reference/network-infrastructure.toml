[[format]]
id = "bfd"
name = "Bidirectional Forwarding Detection"
keys = ["BFD", "Bidirectional Forwarding Detection", "BFD Control", "BFD Echo"]
summary = "A lightweight hello protocol that detects a failed forwarding path between two routers within milliseconds, so that routing protocols such as BGP and OSPF can react quickly."
group = "Routing"
ports = ["udp/3784", "udp/3785", "udp/4784"]
organisation = """
BFD control packets travel over UDP to port 3784 for single-hop sessions and 4784 for multihop ones; echo packets use port 3785 and are looped back by the neighbour's forwarding plane. Single-hop packets are sent with a time to live of 255, which the receiver checks, and from a source port between 49152 and 65535.

The control packet is 24 bytes without authentication: a byte holding a 3-bit version (1) and a 5-bit diagnostic code, a byte holding a 2-bit state and the flags P, F, C, A, D and M, a detect multiplier, a length, then 4-byte My Discriminator and Your Discriminator values and three 4-byte intervals in microseconds (desired minimum transmit, required minimum receive and required minimum echo receive).

The discriminators identify the session at each end; Your Discriminator is zero until the peer's has been learnt. The session is declared down when no packet arrives for the detect multiplier times the agreed interval, typically three times 50 to 300 milliseconds. If the A flag is set an authentication section follows.
"""
