[[format]]
id = "gre"
name = "Generic Routing Encapsulation"
keys = ["GRE", "Generic Routing Encapsulation", "Enhanced GRE", "NVGRE", "IP protocol 47"]
summary = "A simple tunnel header that wraps one network packet inside another IP packet, naming the inner protocol with an EtherType; used for site-to-site tunnels, PPTP VPNs, ERSPAN mirroring and NVGRE overlays."
group = "Tunnels and VPNs"
ip_protocols = [47]
organisation = """
GRE is IP protocol 47. The base header is 4 bytes, big-endian: a 16-bit word of flags and version, then a 16-bit protocol type that is an EtherType for the payload (0x0800 IPv4, 0x86DD IPv6, 0x6558 transparent Ethernet bridging, 0x8847 MPLS, 0x88BE and 0x22EB ERSPAN, 0x880B PPP).

Optional 4-byte fields follow in a fixed order when their flag bits are set: checksum and a reserved half-word (C bit), key (K bit) and sequence number (S bit). The payload therefore starts 4, 8, 12 or 16 bytes in. The key often identifies the tunnel or, in NVGRE, carries a 24-bit virtual subnet ID and an 8-bit flow ID.

Version 1 is the \"enhanced GRE\" of PPTP: the key bit is always set and the key field holds a 2-byte payload length and a 2-byte call ID, an acknowledgement number may follow the sequence number, and the payload is a PPP frame (protocol type 0x880B).
"""
carries = ["ipv4", "ipv6", "ethernet", "mpls", "ppp"]

[[format.specs]]
document = "RFC 2784"
title = "Generic Routing Encapsulation (GRE)"
url = "https://www.rfc-editor.org/rfc/rfc2784"
rfc = 2784
section = "2"

[[format.specs]]
document = "RFC 2890"
title = "Key and Sequence Number Extensions to GRE"
url = "https://www.rfc-editor.org/rfc/rfc2890"
rfc = 2890
section = "2"

[[format.specs]]
