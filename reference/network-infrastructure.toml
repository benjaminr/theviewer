[[format]]
id = "hsrp"
name = "Hot Standby Router Protocol"
keys = ["HSRP", "Hot Standby Router Protocol", "HSRPv2"]
summary = "Cisco's first-hop redundancy protocol, the forerunner of VRRP: routers in a standby group elect an active router that answers for a shared virtual IP and MAC address."
group = "Routing"
ports = ["udp/1985", "udp/2029"]
organisation = """
HSRP version 0 (often called version 1) runs over UDP port 1985 to 224.0.0.2 with a time to live of 1. The message is 20 bytes: version, op code, state, hello time, hold time, priority, group and a reserved byte, then 8 bytes of authentication data and the 4-byte virtual IP address. The active router answers ARP for the virtual IP with the MAC address 00-00-0C-07-AC-XX, where XX is the group number.

The op code is 0 hello, 1 coup (taking over the active role) or 2 resign. The state is one of initial (0), learn (1), listen (2), speak (4), standby (8) and active (16); hello and hold times are in seconds, 3 and 10 by default.

HSRP version 2 uses the multicast address 224.0.0.102 and a TLV format that allows group numbers up to 4095 and millisecond timers, with the virtual MAC 00-00-0C-9F-FX-XX; for IPv6 it uses UDP port 2029 and FF02::66. The default authentication data is the string \"cisco\" in clear text.
"""
