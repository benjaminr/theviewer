# Reference notes on network infrastructure: link-layer framing, tunnels,
# routing, addressing and network services. See src/reference.rs for the
# schema. Notes are written for this project in its own words; the
# specifications are cited by number, section and link, not copied.
#
# Keys include the names the dissector gives layers it does not decode
# (src/packets/dissect.rs: "IGMP", "GRE", "ESP", "AH", "OSPF", "SCTP",
# "IPv6 in IPv4", "IP protocol N", and EtherType names such as "LLDP",
# "PTP" and "PPPoE"), so those layers find their notes. Ports, EtherTypes
# and IP protocol numbers follow the IANA and IEEE registries.

# ---------------------------------------------------------------------------
# Capture link types
# ---------------------------------------------------------------------------

[[format]]
id = "linux-sll"
name = "Linux cooked capture (SLL)"
keys = ["Linux cooked capture", "Linux cooked capture v1", "SLL", "LINKTYPE_LINUX_SLL", "DLT_LINUX_SLL", "Linux cooked-mode capture"]
summary = "The pseudo link-layer header Linux writes when capturing on the \"any\" device or on interfaces without a usable link header: a fixed 16-byte record of direction, device type, sender address and protocol."
group = "Link layer"
organisation = """
pcap link type 113. Every packet begins with a 16-byte header whose multi-byte fields are big-endian: a 2-byte packet type (who the packet was addressed to, or that this host sent it), the 2-byte Linux ARPHRD_ device type, a 2-byte length of the sender's link-layer address, an 8-byte address field and a 2-byte protocol type. The payload starts at byte 16.

The address field is always eight bytes: shorter addresses (a 6-byte MAC) are followed by padding, longer ones are cut to eight. Only the first \"address length\" bytes mean anything. Note that the destination address is not recorded at all.

The protocol type is usually an EtherType (0x0800 IPv4, 0x86DD IPv6, 0x0806 ARP), so the payload is what an Ethernet frame would have carried after its type field. A few small values are special: 0x0004 means an 802.2 LLC header follows, 0x0001 a Novell 802.3 frame, and 0x000C/0x000D CAN frames. For GRE tunnel devices it is a GRE protocol type, and for netlink and radiotap devices it is ignored.
"""
carries = ["ipv4", "ipv6", "arp", "llc-snap"]

[[format.specs]]
document = "tcpdump.org LINKTYPE_LINUX_SLL"
title = "LINKTYPE_LINUX_SLL: Linux \"cooked\" capture encapsulation"
url = "https://www.tcpdump.org/linktypes/LINKTYPE_LINUX_SLL.html"

[[format.specs]]
document = "tcpdump.org link types"
title = "Link-layer header types"
url = "https://www.tcpdump.org/linktypes.html"

[[format.fields]]
name = "Packet type"
meaning = "Direction and addressing of the packet as seen by the capturing host: 0 unicast to us, 1 broadcast, 2 multicast, 3 unicast to another host (seen in promiscuous mode), 4 sent by us."

[[format.fields]]
name = "ARPHRD type"
aliases = ["ARPHRD_ type", "Device type"]
meaning = "The Linux device type of the interface (1 Ethernet, 772 loopback, 776 IPv6-in-IPv4 tunnel, 778 GRE, 803 802.11 with radiotap, 824 netlink, 65534 no header, among others). It decides how the protocol type is read."

[[format.fields]]
name = "Link-layer address length"
aliases = ["Address length"]
meaning = "How many bytes of the 8-byte address field hold the sender's address; 6 for Ethernet, 0 for devices without addresses such as tunnels."

[[format.fields]]
name = "Link-layer address"
aliases = ["Source address", "Address"]
meaning = "The sender's link-layer address, padded or truncated to eight bytes."

[[format.fields]]
name = "Protocol"
aliases = ["Protocol type"]
meaning = "Normally the EtherType of the payload; small values below 0x0600 name special payloads such as an 802.2 LLC header (0x0004) or CAN frames."

[[format]]
id = "linux-sll2"
name = "Linux cooked capture v2 (SLL2)"
keys = ["Linux cooked capture v2", "SLL2", "LINKTYPE_LINUX_SLL2", "DLT_LINUX_SLL2"]
summary = "The second Linux pseudo link-layer header, written by newer libpcap for the \"any\" device: 20 bytes that add the interface index to what SLL recorded, with the protocol type moved to the front."
group = "Link layer"
organisation = """
pcap link type 276. The 20-byte header is, in order: a 2-byte protocol type, 2 reserved bytes that must be zero, a 4-byte interface index, a 2-byte ARPHRD_ device type, a 1-byte packet type, a 1-byte link-layer address length and an 8-byte link-layer address. All multi-byte fields are big-endian and the payload starts at byte 20.

The interface index identifies which interface on the capturing machine saw the packet, which version 1 could not say. Packet type, device type and the padded sender address mean the same as in SLL, and the protocol type is read the same way: an EtherType for most devices, with the same handful of special small values.
"""
carries = ["ipv4", "ipv6", "arp", "llc-snap"]

[[format.specs]]
document = "tcpdump.org LINKTYPE_LINUX_SLL2"
title = "LINKTYPE_LINUX_SLL2: Linux \"cooked\" capture encapsulation v2"
url = "https://www.tcpdump.org/linktypes/LINKTYPE_LINUX_SLL2.html"

[[format.specs]]
document = "tcpdump.org link types"
title = "Link-layer header types"
url = "https://www.tcpdump.org/linktypes.html"

[[format.fields]]
name = "Protocol"
aliases = ["Protocol type"]
meaning = "Normally the EtherType of the payload; for some device types a special value or a GRE protocol type."

[[format.fields]]
name = "Reserved"
meaning = "Two bytes written as zero."

[[format.fields]]
name = "Interface index"
meaning = "The capturing machine's index for the interface the packet was sent or received on; meaningful only on that machine."

[[format.fields]]
name = "ARPHRD type"
aliases = ["ARPHRD_ type", "Device type"]
meaning = "The Linux device type of that interface, such as 1 for Ethernet or 772 for loopback."

[[format.fields]]
name = "Packet type"
meaning = "0 unicast to us, 1 broadcast, 2 multicast, 3 unicast to another host, 4 sent by us."

[[format.fields]]
name = "Link-layer address length"
aliases = ["Address length"]
meaning = "How many bytes of the following 8-byte field are the sender's address."

[[format.fields]]
name = "Link-layer address"
aliases = ["Source address", "Address"]
meaning = "The sender's link-layer address, padded or cut to eight bytes."

[[format]]
id = "bsd-loopback"
name = "BSD loopback encapsulation"
keys = ["BSD loopback", "Null/Loopback", "Loopback", "LINKTYPE_NULL", "LINKTYPE_LOOP", "DLT_NULL", "DLT_LOOP", "BSD null"]
summary = "The four-byte header captures from BSD and macOS loopback (lo0) and some tunnel interfaces use instead of an Ethernet header: just the address family of the packet."
group = "Link layer"
organisation = """
Each packet starts with a single 4-byte protocol family value and the network packet follows at byte 4. There is no address of any kind.

With pcap link type 0 (NULL) the value is in the byte order of the machine that made the capture, so a file from a little-endian Mac holds 02 00 00 00 for IPv4; with link type 108 (LOOP, used by OpenBSD) it is always big-endian. A reader therefore has to accept either order for type 0.

The value is the BSD AF_ constant: 2 for IPv4, and 24, 28 or 30 for IPv6 depending on which BSD wrote it (all three mean IPv6). 7 (OSI) and 23 (IPX) also appear in old captures.
"""
carries = ["ipv4", "ipv6"]

[[format.specs]]
document = "tcpdump.org LINKTYPE_NULL"
title = "LINKTYPE_NULL: BSD loopback encapsulation"
url = "https://www.tcpdump.org/linktypes/LINKTYPE_NULL.html"

[[format.specs]]
document = "tcpdump.org LINKTYPE_LOOP"
title = "LINKTYPE_LOOP: OpenBSD loopback encapsulation"
url = "https://www.tcpdump.org/linktypes/LINKTYPE_LOOP.html"

[[format.fields]]
name = "Family"
aliases = ["Protocol family", "Address family", "Protocol type"]
meaning = "4 bytes: 2 IPv4; 24, 28 or 30 IPv6. Host byte order for link type 0, big-endian for link type 108."

[[format]]
id = "ieee80211"
name = "IEEE 802.11 wireless LAN frame"
keys = ["IEEE 802.11", "802.11", "802.11 frame", "Wi-Fi", "WLAN", "IEEE 802.11 wireless LAN", "LINKTYPE_IEEE802_11", "DLT_IEEE802_11"]
summary = "The MAC frame of Wi-Fi networks, seen in monitor-mode captures (pcap link type 105, or after a radiotap header with link type 127): management frames that build the network, control frames that pace the air, and data frames that carry traffic."
group = "Link layer"
organisation = """
Unlike Ethernet, the multi-byte header fields are little-endian. Every frame starts with a 2-byte Frame Control (protocol version, a 2-bit type, a 4-bit subtype and eight flag bits) and a 2-byte Duration/ID. What follows depends on the type: control frames are short (an ACK is 10 bytes in all) while management and data frames carry three addresses, a 2-byte Sequence Control and, when both To DS and From DS are set (bridges and mesh), a fourth address. QoS data subtypes add a 2-byte QoS Control field, and the +HTC flag adds a 4-byte HT Control field. A capture may keep the 4-byte frame check sequence at the end.

Management frames (type 0: beacon, probe, authentication, association, deauthentication and others) have a few fixed fields and then a list of information elements, each a 1-byte element ID, a 1-byte length and the value: SSID (0), supported rates (1), DS parameter set or channel (3), RSN security parameters (48), vendor-specific (221).

Data frames (type 2) normally carry an 802.2 LLC/SNAP header, AA AA 03 00 00 00, followed by an EtherType and the packet, so an IPv4 packet appears eight bytes into the body. When the Protected flag is set the body is encrypted: for CCMP (WPA2) an 8-byte CCMP header comes first and an 8-byte MIC sits at the end, and nothing between can be read without the keys. The address meanings (receiver, transmitter, BSSID, source, destination) depend on the To DS and From DS flags.
"""
carries = ["llc-snap", "eapol"]

[[format.specs]]
document = "IEEE 802.11-2020"
title = "IEEE Standard for Information Technology: Wireless LAN Medium Access Control (MAC) and Physical Layer (PHY) Specifications"
url = "https://standards.ieee.org/ieee/802.11/7028/"
section = "9.2"

[[format.specs]]
document = "tcpdump.org link types"
title = "Link-layer header types"
url = "https://www.tcpdump.org/linktypes.html"

[[format.fields]]
name = "Frame Control"
aliases = ["Frame control field"]
meaning = "2 bytes: protocol version (always 0), type (0 management, 1 control, 2 data, 3 extension), subtype, and the flags To DS, From DS, More Fragments, Retry, Power Management, More Data, Protected and +HTC/Order."

[[format.fields]]
name = "Duration/ID"
aliases = ["Duration"]
meaning = "Normally how long, in microseconds, the medium will stay busy for this exchange, which other stations use to defer; in PS-Poll frames an association ID instead."

[[format.fields]]
name = "Address 1"
aliases = ["Receiver address", "RA"]
meaning = "The station that should receive the frame over the air."

[[format.fields]]
name = "Address 2"
aliases = ["Transmitter address", "TA"]
meaning = "The station that transmitted the frame over the air; absent in ACK and CTS frames."

[[format.fields]]
name = "Address 3"
meaning = "Depends on To DS/From DS: the BSSID for management frames and frames within a network, otherwise the original source or final destination behind the access point."

[[format.fields]]
name = "Sequence Control"
aliases = ["Sequence number", "Fragment number"]
meaning = "A 4-bit fragment number and a 12-bit sequence number; a retransmission repeats the same values with the Retry flag set."

[[format.fields]]
name = "Address 4"
meaning = "Present only when To DS and From DS are both set, as on wireless bridges and mesh links, so both original source and final destination can be named."

[[format.fields]]
name = "QoS Control"
meaning = "In QoS data frames: the traffic identifier (priority), the acknowledgement policy and related bits."

[[format.fields]]
name = "Information element *"
aliases = ["Tagged parameter *", "Element *"]
meaning = "In management frame bodies: a 1-byte element ID, a 1-byte length and the value, such as the SSID (0), supported rates (1), channel (3), RSN (48) or vendor-specific data (221)."

[[format.fields]]
name = "FCS"
aliases = ["Frame check sequence"]
meaning = "A CRC-32 over the whole frame, present at the end only when the capture kept it (radiotap's Flags field says so)."

[[format]]
id = "radiotap"
name = "Radiotap header"
keys = ["Radiotap", "radiotap header", "LINKTYPE_IEEE802_11_RADIOTAP", "DLT_IEEE802_11_RADIO", "802.11 plus radiotap"]
summary = "A self-describing header that wireless drivers put in front of each captured 802.11 frame to record how it was received: signal strength, channel, data rate, timestamps and more."
group = "Link layer"
organisation = """
pcap link type 127. The header starts with a 1-byte version (0), a pad byte, a 2-byte length of the whole radiotap header and a 4-byte \"present\" bitmask, all little-endian. The 802.11 frame starts at the header length, so a reader that does not understand any field can still skip straight to the frame.

Each set bit in the present word announces a field, and the fields follow in bit order: bit 0 TSFT (8-byte timer), 1 Flags, 2 Rate, 3 Channel (frequency and flags), 5 antenna signal in dBm, 6 antenna noise, 11 antenna index, 19 MCS, 20 A-MPDU status, 21 VHT, and so on. If bit 31 is set another present word follows, which is how extended and vendor namespaces are reached.

Every field is aligned to its natural size counted from the start of the radiotap header, so padding bytes may sit between fields; a parser has to know each field's size and alignment to find the next. Flags bit 0x10 says the 802.11 frame ends with a frame check sequence, and 0x40 that the check failed.
"""
carries = ["ieee80211"]

[[format.specs]]
document = "radiotap.org"
title = "Radiotap: the de facto standard for 802.11 frame injection and reception"
url = "https://www.radiotap.org/"

[[format.specs]]
document = "tcpdump.org link types"
title = "Link-layer header types"
url = "https://www.tcpdump.org/linktypes.html"

[[format.fields]]
name = "Header revision"
aliases = ["Version"]
meaning = "Always 0."

[[format.fields]]
name = "Header length"
aliases = ["Length"]
meaning = "Little-endian length of the whole radiotap header including fields and padding; the 802.11 frame begins here."

[[format.fields]]
name = "Present flags"
aliases = ["Present", "it_present"]
meaning = "32-bit little-endian bitmask of the fields that follow, in bit order. Bit 31 means another present word follows; bits 29 and 30 switch to the radiotap or a vendor namespace."

[[format.fields]]
name = "Flags"
meaning = "1 byte: short preamble, WEP, fragmentation, frame includes FCS (0x10), data padding, bad FCS (0x40), short guard interval."

[[format.fields]]
name = "Rate"
aliases = ["Data rate"]
meaning = "Legacy transmit rate in units of 500 kbit/s; higher-throughput frames use the MCS, VHT or HE fields instead."

[[format.fields]]
name = "Channel"
meaning = "2-byte centre frequency in MHz and 2 bytes of channel flags (band, modulation)."

[[format.fields]]
name = "Antenna signal"
aliases = ["dBm antenna signal", "Signal"]
meaning = "Received signal power in dBm as a signed byte, such as -45 (strong) or -85 (weak)."

[[format.fields]]
name = "TSFT"
meaning = "8-byte value of the receiver's 802.11 timing synchronisation function timer, in microseconds, when the first bit of the frame arrived."

# ---------------------------------------------------------------------------
# LAN control protocols
# ---------------------------------------------------------------------------

[[format]]
id = "llc-snap"
name = "IEEE 802.2 LLC and SNAP"
keys = ["LLC", "IEEE 802.2 LLC", "802.2 LLC", "Logical Link Control", "SNAP", "Subnetwork Access Protocol", "LLC/SNAP", "802.3 LLC"]
summary = "The small header that names the payload when a frame carries a length rather than an EtherType (IEEE 802.3 frames) and on 802.11 data frames; SNAP extends it with an organisation code and a protocol number."
group = "Link layer"
organisation = """
In an Ethernet frame a type/length value of 1500 or less is a length, and the payload then starts with an 802.2 LLC header: a 1-byte destination service access point (DSAP), a 1-byte source SAP (SSAP) and a control field that is 1 byte for unnumbered frames (0x03 means UI, unnumbered information, which is what nearly everything uses) or 2 bytes for numbered information and supervisory frames.

The SAPs say what follows: 0x42 is spanning tree, 0xFE is ISO network layer protocols such as IS-IS, 0xE0 is NetWare IPX, 0xF0 NetBIOS, and 0xAA announces SNAP. The lowest bit of the DSAP marks a group address and that of the SSAP a response.

With DSAP and SSAP 0xAA and control 0x03, a 5-byte SNAP header follows: a 3-byte organisationally unique identifier (OUI) and a 2-byte protocol ID. OUI 00-00-00 means the protocol ID is an ordinary EtherType, which is how IP travels over 802.11, token ring and FDDI (AA AA 03 00 00 00 08 00 for IPv4). Other OUIs define their own numbers, such as Cisco's 00-00-0C with 0x2000 for CDP, 0x2003 for VTP and 0x010B for PVST+.
"""
carries = ["stp", "cdp", "isis", "ipv4", "ipv6", "arp"]

[[format.specs]]
document = "ISO/IEC/IEEE 8802-2:1998"
title = "Local and metropolitan area networks, Part 2: Logical Link Control"
url = "https://standards.ieee.org/standard/8802-2-1998.html"

[[format.specs]]
document = "RFC 1042"
title = "Standard for the transmission of IP datagrams over IEEE 802 networks"
url = "https://www.rfc-editor.org/rfc/rfc1042"
rfc = 1042

[[format.specs]]
document = "IEEE 802-2014"
title = "IEEE Standard for Local and Metropolitan Area Networks: Overview and Architecture"
url = "https://standards.ieee.org/standard/802-2014.html"

[[format.fields]]
name = "DSAP"
aliases = ["Destination service access point"]
meaning = "Which protocol at the receiver the frame is for: 0x42 spanning tree, 0xAA SNAP, 0xFE OSI (IS-IS), 0xE0 IPX, 0xF0 NetBIOS. The low bit marks a group SAP."

[[format.fields]]
name = "SSAP"
aliases = ["Source service access point"]
meaning = "The sending protocol's SAP, usually equal to the DSAP; the low bit marks a response."

[[format.fields]]
name = "Control"
aliases = ["Control field"]
meaning = "Frame kind: 0x03 is an unnumbered information (UI) frame, the connectionless service almost all protocols use; I and S frames have a 2-byte control field with sequence numbers."

[[format.fields]]
name = "OUI"
aliases = ["Organization code", "Organisation code"]
meaning = "SNAP only: 3-byte organisation identifier. 00-00-00 means the protocol ID is an EtherType; 00-00-0C is Cisco."

[[format.fields]]
name = "PID"
aliases = ["Protocol ID", "Type"]
meaning = "SNAP only: 2-byte protocol number under that OUI, an EtherType when the OUI is zero."

[[format]]
id = "lldp"
name = "Link Layer Discovery Protocol"
keys = ["LLDP", "Link Layer Discovery Protocol", "802.1AB", "IEEE 802.1AB"]
summary = "A one-way advertisement each port sends to its immediate neighbour, naming the device, the port and its capabilities, so that management systems can map physical topology."
group = "Link layer"
ethertypes = [0x88cc]
organisation = """
LLDP frames use EtherType 0x88CC and are usually sent to the multicast address 01:80:C2:00:00:0E, which bridges do not forward, so a frame only ever describes the link it arrived on. They are sent periodically (every 30 seconds by default) and when something changes; there are no requests or replies.

The payload is a sequence of TLVs. Each starts with a 2-byte big-endian word whose top 7 bits are the type and bottom 9 bits the length of the value that follows, so a TLV value is at most 511 bytes. The first three TLVs must be Chassis ID (1), Port ID (2) and Time To Live (3), and an End of LLDPDU TLV (type 0, length 0) closes the list.

Optional TLVs in between include port description (4), system name (5), system description (6), system capabilities (7) and management address (8). Type 127 is organisationally specific: the value starts with a 3-byte OUI and a 1-byte subtype, used for IEEE 802.1 VLAN names, IEEE 802.3 link speed and power over Ethernet, and the LLDP-MED extensions for IP phones.
"""
carries = []

[[format.specs]]
document = "IEEE 802.1AB-2016"
title = "IEEE Standard for Local and metropolitan area networks: Station and Media Access Control Connectivity Discovery"
url = "https://standards.ieee.org/ieee/802.1AB/6047/"

[[format.specs]]
document = "IANA IEEE 802 Numbers"
title = "EtherType registry"
url = "https://www.iana.org/assignments/ieee-802-numbers/ieee-802-numbers.xhtml"

[[format.fields]]
name = "Chassis ID"
meaning = "TLV type 1: a subtype byte (4 MAC address, 5 network address, 7 locally assigned, and others) and the identifier of the sending device."

[[format.fields]]
name = "Port ID"
meaning = "TLV type 2: a subtype byte (3 MAC address, 5 interface name, 7 locally assigned, and others) and the identifier of the sending port."

[[format.fields]]
name = "Time To Live"
aliases = ["TTL"]
meaning = "TLV type 3: seconds the receiver should keep this information; 0 means forget it now (sent when a port shuts down)."

[[format.fields]]
name = "System name"
meaning = "TLV type 5: the device's administratively assigned name, usually its host name."

[[format.fields]]
name = "System capabilities"
meaning = "TLV type 7: two bitmaps, what the device can be (bridge, router, telephone, access point, station) and what is enabled."

[[format.fields]]
name = "Management address"
meaning = "TLV type 8: an address (IPv4, IPv6 or MAC) at which the device can be managed, with the interface it belongs to."

[[format.fields]]
name = "Organizationally specific"
aliases = ["Organisationally specific", "TLV type 127"]
meaning = "TLV type 127: an OUI and subtype followed by data defined by that organisation, such as 802.3 MAC/PHY settings or LLDP-MED network policy."

[[format.fields]]
name = "End of LLDPDU"
meaning = "TLV type 0 with length 0; nothing after it is part of the advertisement."

[[format]]
id = "cdp"
name = "Cisco Discovery Protocol"
keys = ["CDP", "Cisco Discovery Protocol"]
summary = "Cisco's own neighbour advertisement, older than LLDP and still on by default on most Cisco equipment: each device tells its directly connected neighbours its name, software, platform, addresses and port."
group = "Link layer"
organisation = """
CDP is carried in an LLC/SNAP frame (DSAP/SSAP 0xAA, control 0x03, Cisco OUI 00-00-0C, protocol ID 0x2000) sent to the multicast address 01:00:0C:CC:CC:CC, so it appears in an 802.3 frame whose type field is a length. Devices send it every 60 seconds by default.

The CDP header is 4 bytes: a 1-byte version (1 or 2), a 1-byte time to live in seconds (180 by default) and a 2-byte checksum computed like the IP checksum. A list of TLVs follows to the end of the frame, each with a 2-byte type, a 2-byte length that counts the 4-byte TLV header as well as the value, and the value.

Common TLVs are Device ID (1), Addresses (2), Port ID (3), Capabilities (4), Software Version (5), Platform (6), native VLAN (0x0A) and duplex (0x0B). Because the device name, software version and addresses are sent in clear to anyone on the segment, CDP frames are a quick way to identify the switch port a capture was taken on.
"""
carries = []

[[format.specs]]
document = "Cisco CDP Configuration Guide"
title = "Cisco Discovery Protocol Configuration Guide, Cisco IOS Release 15M&T"
url = "https://www.cisco.com/c/en/us/td/docs/ios-xml/ios/cdp/configuration/15-mt/cdp-15-mt-book.pdf"

[[format.fields]]
name = "Version"
meaning = "CDP version, 1 or 2; version 2 adds TLVs such as native VLAN and duplex."

[[format.fields]]
name = "TTL"
aliases = ["Time to live", "Holdtime"]
meaning = "Seconds a neighbour should keep this information, 180 by default."

[[format.fields]]
name = "Checksum"
meaning = "Ones' complement checksum over the CDP message, as for IP."

[[format.fields]]
name = "Device ID"
meaning = "TLV 1: the sender's host name (or serial number)."

[[format.fields]]
name = "Addresses"
meaning = "TLV 2: a count and a list of the sender's network-layer addresses, usually its management IPv4 address."

[[format.fields]]
name = "Port ID"
meaning = "TLV 3: the name of the sending interface, such as GigabitEthernet1/0/24."

[[format.fields]]
name = "Software Version"
aliases = ["Software version"]
meaning = "TLV 5: the device's software version banner, free text."

[[format.fields]]
name = "Platform"
meaning = "TLV 6: the hardware model, such as cisco WS-C3850-48P."

[[format]]
id = "stp"
name = "Spanning Tree Protocol"
keys = ["STP", "Spanning Tree Protocol", "RSTP", "Rapid Spanning Tree Protocol", "MSTP", "Multiple Spanning Tree Protocol", "BPDU", "Bridge Protocol Data Unit", "Spanning Tree"]
summary = "The protocol switches use to agree on a loop-free tree of active links in a bridged network by exchanging Bridge Protocol Data Units; RSTP and MSTP are its faster and per-VLAN-group successors."
group = "Link layer"
organisation = """
BPDUs travel in 802.3 frames with an LLC header (DSAP and SSAP 0x42, control 0x03) addressed to 01:80:C2:00:00:00, a group address that bridges consume rather than forward. Cisco's per-VLAN variant (PVST+) instead uses SNAP with the Cisco OUI and protocol ID 0x010B, sent to 01:00:0C:CC:CC:CD.

The BPDU starts with a 2-byte protocol identifier (0), a 1-byte version (0 STP, 2 RSTP, 3 MSTP) and a 1-byte BPDU type (0x00 configuration, 0x80 topology change notification, 0x02 RST/MST). A topology change notification ends there, at 4 bytes.

Configuration and RST BPDUs continue with flags, the 8-byte root bridge ID, the 4-byte root path cost, the 8-byte ID of the sending bridge, the 2-byte port ID and four 2-byte timers (message age, max age, hello time, forward delay) counted in 1/256 of a second, 35 bytes in all. RSTP adds a version 1 length byte (36 bytes) and MSTP appends its configuration identifier and per-instance records. Bridge IDs are a 2-byte priority (whose low 12 bits carry a VLAN or instance number in modern switches) followed by the bridge's MAC address; the lowest ID wins the root election.
"""
carries = []

