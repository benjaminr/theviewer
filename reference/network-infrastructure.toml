id = "ssdp"
name = "Simple Service Discovery Protocol"
keys = ["SSDP", "Simple Service Discovery Protocol", "UPnP discovery"]
summary = "UPnP's discovery protocol: devices announce themselves and answer searches with HTTP-style text messages multicast over UDP, pointing to an XML description of the device."
group = "Addressing and naming"
ports = ["udp/1900"]
organisation = """
SSDP messages are HTTP/1.1 requests and responses sent over UDP, one per datagram, usually multicast to 239.255.255.250 port 1900 (FF02::C and other scopes for IPv6). The request line and headers are plain text ending in CR LF, with an empty line at the end and no body.

A control point searches with an M-SEARCH request (headers MAN: \"ssdp:discover\", ST naming the search target such as ssdp:all or a device type, and MX giving the longest delay before replies); devices answer by unicast with an HTTP/1.1 200 OK response. Devices also announce themselves with NOTIFY requests whose NTS header is ssdp:alive, ssdp:byebye or ssdp:update.

The interesting headers are LOCATION, a URL to the device description XML; USN, a unique service name built from the device UUID; NT or ST, the device or service type; SERVER, which names the operating system and UPnP stack; and CACHE-CONTROL max-age. Because devices answer unsolicited searches with larger responses, SSDP is also abused for reflection attacks.
"""
