[[format]]
id = "isis"
name = "Intermediate System to Intermediate System"
keys = ["IS-IS", "ISIS", "Intermediate System to Intermediate System", "Integrated IS-IS"]
summary = "A link-state interior routing protocol from the OSI world, favoured by large service providers; it runs directly over the link layer rather than over IP."
group = "Routing"
organisation = """
IS-IS packets are not IP. On Ethernet they are 802.3 frames with an LLC header of DSAP and SSAP 0xFE and control 0x03, sent to 01:80:C2:00:00:14 (all level 1 routers), 01:80:C2:00:00:15 (all level 2 routers) or 09:00:2B:00:00:05; on point-to-point links they ride in PPP or HDLC. The first byte is the network layer protocol identifier 0x83.

An 8-byte common header follows: the 0x83 discriminator, the header length, a version/protocol ID extension (1), the system ID length (0 means 6 bytes), the PDU type, a version (1), a reserved byte and the maximum number of area addresses. PDU types are LAN hellos for levels 1 and 2 (15, 16), the point-to-point hello (17), link state PDUs for levels 1 and 2 (18, 20), and complete (24, 25) and partial (26, 27) sequence number PDUs.

Each PDU type has some fixed fields (such as the LSP ID, sequence number and remaining lifetime) and then TLVs with a 1-byte type and 1-byte length: area addresses (1), extended IS reachability (22), protocols supported (129), IP interface addresses (132), extended IP reachability (135), dynamic host name (137) and IPv6 reachability (236) are common. Router identities are system IDs, often written as three groups of four hex digits.
"""
