[[format]]
id = "ospf"
name = "Open Shortest Path First"
keys = ["OSPF", "Open Shortest Path First", "OSPFv2", "OSPFv3", "OSPFIGP"]
summary = "The most widely deployed interior routing protocol: routers flood descriptions of their links to every router in an area and each computes shortest paths from the resulting map."
group = "Routing"
ip_protocols = [89]
organisation = """
OSPF runs directly over IP as protocol 89, mostly multicast to 224.0.0.5 (all OSPF routers) and 224.0.0.6 (designated routers), or FF02::5 and FF02::6 for OSPFv3, with a time to live of 1. An OSPFv2 packet starts with a 24-byte header: version (2), type, a 2-byte packet length, the 4-byte router ID, the 4-byte area ID, a checksum, a 2-byte authentication type and 8 bytes of authentication data. OSPFv3's header is 16 bytes: version 3 and the same type, length, router and area IDs, then a checksum, an instance ID and a reserved byte, with authentication left to IPsec or a trailer.

The type says what follows: 1 Hello (network mask, intervals, priority, designated router and the list of neighbours seen), 2 Database Description (summaries of the sender's link-state database during adjacency setup), 3 Link State Request, 4 Link State Update (carrying full LSAs) and 5 Link State Acknowledgement.

LSAs all begin with a 20-byte header (age, options, type, link-state ID, advertising router, sequence number, checksum, length). Common types are router (1), network (2), summary (3 and 4), AS-external (5) and NSSA (7) LSAs; opaque LSAs (9 to 11) carry traffic engineering and segment routing data.
"""
