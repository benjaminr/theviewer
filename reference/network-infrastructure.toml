aliases = ["VRID", "Virtual router ID"]
meaning = "Which virtual router (1 to 255) the advertisement is for; also the last byte of the virtual MAC address."
section = "5.2.3"

[[format.fields]]
name = "Priority"
meaning = "Higher wins: 255 for the router that owns the address, 100 by default for backups, 0 when the active router is giving up the role."
section = "5.2.4"

[[format.fields]]
name = "IPvX Addr Count"
aliases = ["Count IP addresses", "Address count"]
meaning = "Number of virtual addresses listed after the header."
section = "5.2.5"

[[format.fields]]
name = "Max Advertise Interval"
aliases = ["Advertisement interval"]
meaning = "12 bits: interval between advertisements in centiseconds (100 is one second)."
section = "5.2.7"

[[format.fields]]
