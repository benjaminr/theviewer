[[format]]
id = "lacp"
name = "Link Aggregation Control Protocol"
keys = ["LACP", "Link Aggregation Control Protocol", "Slow Protocols", "802.3ad", "IEEE 802.1AX", "Link aggregation"]
summary = "The negotiation two devices run over each member of a bundled set of Ethernet links (a port channel or bond) to agree which links form one logical link."
group = "Link layer"
ethertypes = [0x8809]
organisation = """
LACP is one of the IEEE \"slow protocols\", which share EtherType 0x8809 and the multicast address 01:80:C2:00:00:02. The first payload byte is a subtype: 1 LACP, 2 the Marker protocol, 3 Ethernet OAM (802.3ah) and 10 ESMC (synchronous Ethernet). Slow protocol frames are padded to the Ethernet minimum and LACPDUs are exactly 110 bytes of payload.

An LACPDU has the subtype and a version byte, then a series of TLVs with 1-byte type and 1-byte length: Actor Information (type 1, length 20), Partner Information (type 2, length 20), Collector Information (type 3, length 16) and a Terminator (type 0, length 0) followed by reserved zeros.

The actor and partner blocks share one layout: system priority, system MAC address, key, port priority, port number and a state byte. Two ports can join the same aggregate only when their system and key values agree; the state bits show each side's progress from negotiating to collecting and distributing traffic, and are the first thing to check when a bond does not come up.
"""
carries = []

[[format.specs]]
document = "IEEE 802.1AX-2020"
title = "IEEE Standard for Local and Metropolitan Area Networks: Link Aggregation"
url = "https://standards.ieee.org/ieee/802.1AX/6768/"

[[format.specs]]
document = "IEEE 802.3-2022"
title = "IEEE Standard for Ethernet (Annex 57A, slow protocols)"
url = "https://standards.ieee.org/ieee/802.3/10422/"

[[format.fields]]
name = "Subtype"
aliases = ["Slow protocols subtype"]
meaning = "Which slow protocol this is: 1 LACP, 2 Marker, 3 OAM, 10 ESMC."

[[format.fields]]
name = "Version"
meaning = "LACP version, 1 (2 for the 2014 and later extensions)."

[[format.fields]]
name = "Actor System Priority"
aliases = ["System priority"]
meaning = "Priority of the sending system; with the system MAC address it forms the system ID, and the lower ID controls which links are aggregated."

[[format.fields]]
name = "Actor System"
aliases = ["System", "System ID"]
meaning = "MAC address identifying the sending system."

[[format.fields]]
name = "Actor Key"
aliases = ["Key"]
meaning = "Operational key; ports with the same key on the same system can be aggregated together."

[[format.fields]]
name = "Actor Port"
aliases = ["Port", "Port priority"]
meaning = "Port priority and port number of the sending port."

[[format.fields]]
name = "Actor State"
aliases = ["State", "Partner State"]
meaning = "Eight bits: LACP activity (active), timeout (short), aggregation, synchronisation, collecting, distributing, defaulted and expired."

[[format.fields]]
name = "Partner Information"
meaning = "What the sender has learned about the other end: the same system, key, port and state values as received from it."

[[format.fields]]
name = "Collector Max Delay"
meaning = "Tens of microseconds the receiving side may delay frames when collecting them."

[[format]]
id = "eapol"
name = "EAP over LAN (IEEE 802.1X)"
keys = ["EAPOL", "EAP over LAN", "802.1X", "IEEE 802.1X", "EAP", "Extensible Authentication Protocol", "WPA handshake", "EAPOL-Key"]
summary = "The framing for port-based network access control: a switch or Wi-Fi access point lets a device on only after it authenticates with EAP, and on Wi-Fi the same frames carry the four-way key handshake."
group = "Link layer"
ethertypes = [0x888e]
organisation = """
EAPOL frames use EtherType 0x888E and are normally sent to the PAE group address 01:80:C2:00:00:03 on wired ports, or directly between station and access point on Wi-Fi. The 4-byte header is a protocol version (1, 2 or 3), a packet type and a 2-byte big-endian body length.

Packet type 0 is an EAP packet, 1 EAPOL-Start, 2 EAPOL-Logoff, 3 EAPOL-Key and 5 MKA (MACsec key agreement). An EAP packet has its own 4-byte header (code 1 Request, 2 Response, 3 Success, 4 Failure; an identifier pairing requests with responses; a 2-byte length) and, for requests and responses, a 1-byte method type: 1 Identity, 4 MD5-Challenge, 13 EAP-TLS, 21 TTLS, 25 PEAP and so on. The authenticator relays these to a RADIUS server, so the TLS inside PEAP or EAP-TLS is visible here fragment by fragment.

EAPOL-Key frames carry the WPA/WPA2 four-way handshake: a descriptor type (2 for RSN), key information flags, key length, an 8-byte replay counter, a 32-byte nonce, IV, receive sequence counter, a MIC and a length-prefixed key data field that holds the encrypted group key in message 3. Capturing all four messages (with the passphrase) is what lets a capture be decrypted.
"""
carries = []

