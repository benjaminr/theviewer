[[format]]
id = "gtp-c"
name = "GPRS Tunnelling Protocol, control plane"
keys = ["GTP-C", "GTPv2-C", "GTPv2", "GTPv1-C", "GPRS Tunnelling Protocol Control Plane"]
summary = "The signalling mobile core nodes use to create, modify and delete subscribers' sessions and the GTP-U tunnels that carry their data; GTPv2-C in 4G, GTPv1-C in 3G."
group = "Tunnels and VPNs"
ports = ["udp/2123"]
organisation = """
GTP-C runs over UDP port 2123. A GTPv2-C header starts with a flags byte (version 2 in the top 3 bits, then P for a piggybacked message, T when a TEID is present and MP for message priority), a message type and a 2-byte length counting everything after the first 4 bytes.

With the T flag set, a 4-byte TEID comes next; a 3-byte sequence number and a spare byte follow, so the header is 12 bytes (8 without a TEID, used only for echo and a few other node-level messages). The body is a list of information elements: a 1-byte type, 2-byte length, a byte holding a 4-bit instance, then the value; grouped IEs nest further IEs.

Common message types are Create Session Request and Response (32, 33), Modify Bearer Request and Response (34, 35) and Delete Session Request and Response (36, 37). Subscriber identities (IMSI, MSISDN), the access point name and the TEIDs for GTP-U all appear as IEs, which is how user traffic is tied to a subscriber. GTPv1-C (3G) uses version 1 and the GTP-U header layout.
"""
