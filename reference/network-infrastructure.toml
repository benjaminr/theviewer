[[format]]
id = "vrrp"
name = "Virtual Router Redundancy Protocol"
keys = ["VRRP", "Virtual Router Redundancy Protocol", "VRRPv3", "VRRPv2", "IP protocol 112"]
summary = "Lets several routers share a virtual gateway address: the active router multicasts advertisements and a backup takes over the address when they stop."
group = "Routing"
ip_protocols = [112]
organisation = """
VRRP is IP protocol 112, multicast to 224.0.0.18 (or FF02::12 for IPv6) with a time to live or hop limit of 255, which receivers check so that advertisements from off the link are rejected. The active router sends from a virtual MAC address 00-00-5E-00-01-XX (00-00-5E-00-02-XX for IPv6), where XX is the virtual router ID.

A VRRPv3 advertisement is 8 bytes plus addresses: version (3) and type (1, advertisement) in one byte, the virtual router ID, the priority, a count of addresses, 4 reserved bits with a 12-bit maximum advertisement interval in centiseconds, a checksum, then the virtual IPv4 or IPv6 addresses.

Priority 255 means the router owns the virtual address and 0 means the active router is stepping down, so a backup should take over at once. VRRPv2 (IPv4 only) has version 2 in the same position, an authentication type byte in place of the reserved bits and an advertisement interval in whole seconds.
"""
