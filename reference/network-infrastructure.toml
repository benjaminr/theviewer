aliases = ["Nonce", "ANonce", "SNonce"]
meaning = "32 random bytes; messages 1 and 2 carry the access point's and station's nonces, from which the session keys are derived."

[[format.fields]]
name = "Key MIC"
aliases = ["MIC"]
meaning = "Message integrity code over the EAPOL frame, keyed with the key-confirmation key; zero in message 1."

[[format.fields]]
