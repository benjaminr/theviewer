Queries are sent to UDP port 5355 on the multicast address 224.0.0.252 (FF02::1:3 for IPv6), with a time to live of 1; responders answer by unicast. TCP port 5355 is used when a response is too big.

The message format is the DNS format: a 12-byte header (ID, flags, and counts of questions, answers, authority and additional records) followed by the sections. Three flag bits differ from DNS: C (conflict), TC (truncated) and T (tentative) take the places DNS gives to the authoritative answer, truncation and recursion bits, and the rest are zero.

A multicast query normally has one question for an A or AAAA record of a bare host name. Any host that believes it owns the name may reply, which is why unexpected replies (often from tools such as Responder) are a sign of interception.
