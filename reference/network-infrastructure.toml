id = "tftp"
name = "Trivial File Transfer Protocol"
keys = ["TFTP", "Trivial File Transfer Protocol"]
summary = "A minimal file transfer protocol over UDP with no authentication, used for network booting (PXE), loading firmware and backing up device configurations."
group = "Network management"
ports = ["udp/69"]
organisation = """
Only the first request goes to UDP port 69. The server answers from a new port of its own choosing, and the rest of the transfer runs between that port and the client's, so following a TFTP transfer means following the reply's ports rather than port 69.

Every packet starts with a 2-byte opcode: 1 read request (RRQ), 2 write request (WRQ), 3 DATA, 4 ACK, 5 ERROR and 6 option acknowledgement (OACK). Requests carry a file name and a transfer mode (\"netascii\" or \"octet\"), each ending in a zero byte, optionally followed by name/value option pairs such as blksize, tsize and timeout.

DATA packets hold a 2-byte block number, starting at 1, and up to 512 bytes of data (or the negotiated block size); a block shorter than that ends the transfer. Each block is acknowledged by an ACK with the same number before the next is sent. ERROR packets give a 2-byte error code (1 file not found, 2 access violation, and so on) and a zero-terminated message. The data is not encrypted, so a captured transfer can be reassembled in full.
"""
