section = "4.1"

[[format.specs]]
document = "RFC 7637"
title = "NVGRE: Network Virtualization Using Generic Routing Encapsulation"
url = "https://www.rfc-editor.org/rfc/rfc7637"
rfc = 7637

[[format.fields]]
name = "Flags and version"
aliases = ["Flags", "Version"]
meaning = "Bit 0 checksum present (C), bit 2 key present (K), bit 3 sequence number present (S); version in the low 3 bits, 0 for GRE and 1 for PPTP's enhanced GRE."
section = "2.1"

[[format.fields]]
name = "Protocol Type"
aliases = ["Protocol type", "Type"]
meaning = "EtherType of the payload: 0x0800 IPv4, 0x86DD IPv6, 0x6558 Ethernet frame, 0x8847 MPLS, 0x88BE ERSPAN II, 0x22EB ERSPAN III, 0x880B PPP."
section = "2.4"

[[format.fields]]
name = "Checksum"
meaning = "Present when the C bit is set: ones' complement checksum over the GRE header and payload, followed by 2 reserved bytes."
section = "2.5"

[[format.fields]]
name = "Key"
meaning = "Present when the K bit is set: 4 bytes that distinguish flows or tunnels between the same endpoints; NVGRE puts a 24-bit virtual subnet ID here, PPTP a payload length and call ID."

[[format.fields]]
name = "Sequence Number"
aliases = ["Sequence number"]
meaning = "Present when the S bit is set: increases with each packet so the receiver can detect loss and reordering."

[[format]]
id = "esp"
name = "IP Encapsulating Security Payload"
keys = ["ESP", "Encapsulating Security Payload", "IPsec ESP", "IP Encapsulating Security Payload", "UDP-encapsulated ESP", "IP protocol 50"]
summary = "The IPsec protocol that encrypts and authenticates packets; almost all IPsec VPN traffic is ESP, and everything after its 8-byte header is ciphertext."
group = "Tunnels and VPNs"
ip_protocols = [50]
ports = ["udp/4500"]
organisation = """
ESP is IP protocol 50, or the payload of UDP port 4500 when a NAT sits between the peers (NAT traversal). The visible header is 8 bytes: a 4-byte security parameters index (SPI) that, with the destination address, selects the security association, and a 4-byte sequence number that increases with every packet to prevent replay.

Everything after that is protected: the encrypted payload (often starting with a per-packet IV), padding, a 1-byte pad length and a 1-byte next header, then an integrity check value (ICV) of 12 to 16 bytes at the end. The next header field, which says whether the inner packet is IPv4 (4), IPv6 (41) or a transport protocol, is inside the encryption, so without the keys an analyser cannot see what is tunnelled.

On UDP port 4500 the same port carries IKE as well; ESP packets are told apart because their first four bytes (the SPI) are never zero, while IKE messages there start with four zero bytes. A single 0xFF byte is a NAT keep-alive.
"""
carries = ["ipv4", "ipv6", "tcp", "udp"]

[[format.specs]]
document = "RFC 4303"
title = "IP Encapsulating Security Payload (ESP)"
url = "https://www.rfc-editor.org/rfc/rfc4303"
rfc = 4303
section = "2"

[[format.specs]]
document = "RFC 3948"
title = "UDP Encapsulation of IPsec ESP Packets"
url = "https://www.rfc-editor.org/rfc/rfc3948"
rfc = 3948
section = "2.1"

[[format.fields]]
name = "SPI"
aliases = ["Security Parameters Index"]
meaning = "4 bytes chosen by the receiver to identify the security association (keys and algorithms) the packet belongs to. Each direction of a tunnel has its own SPI."
section = "2.1"

[[format.fields]]
name = "Sequence Number"
aliases = ["Sequence number"]
meaning = "Counts packets on the security association from 1, letting the receiver reject replays; gaps show loss."
section = "2.2"

[[format.fields]]
name = "Payload Data"
aliases = ["Encrypted data", "Data"]
meaning = "The encrypted inner packet, usually preceded by an initialisation vector."
section = "2.3"

[[format.fields]]
name = "Pad Length"
meaning = "Encrypted: how many padding bytes precede it."
section = "2.5"

[[format.fields]]
name = "Next Header"
meaning = "Encrypted: the protocol of the inner packet, 4 for IPv4 in tunnel mode, 41 for IPv6, 6 or 17 in transport mode."
section = "2.6"

[[format.fields]]
name = "ICV"
aliases = ["Integrity Check Value"]
meaning = "The authentication tag at the end of the packet, covering the ESP header and encrypted data."
section = "2.8"

[[format]]
id = "ah"
name = "IP Authentication Header"
keys = ["AH", "Authentication Header", "IP Authentication Header", "IPsec AH", "IP protocol 51"]
summary = "The IPsec protocol that authenticates packets, including most of the outer IP header, without encrypting them; far rarer than ESP and incompatible with NAT."
group = "Tunnels and VPNs"
ip_protocols = [51]
organisation = """
AH is IP protocol 51 and sits between the IP header and the protected payload, which stays readable. Its header is a 1-byte next header (the protocol of what follows, such as 6 for TCP or 4 for a tunnelled IPv4 packet), a 1-byte payload length, 2 reserved bytes, a 4-byte SPI, a 4-byte sequence number and the integrity check value.

The payload length is the AH length in 32-bit words minus 2, so the header occupies (payload length + 2) × 4 bytes and the next protocol starts there. With a 96-bit ICV the header is 24 bytes and the field holds 4.

The ICV covers the IP header fields that do not change in transit (addresses, protocol, length) as well as the payload, which is why any NAT that rewrites an address breaks AH.
"""
carries = ["ipv4", "ipv6", "tcp", "udp", "icmp"]

[[format.specs]]
document = "RFC 4302"
title = "IP Authentication Header"
url = "https://www.rfc-editor.org/rfc/rfc4302"
rfc = 4302
section = "2"

[[format.fields]]
name = "Next Header"
meaning = "IP protocol number of the payload after AH: 6 TCP, 17 UDP, 4 IPv4 (tunnel mode), 41 IPv6."
section = "2.1"

[[format.fields]]
name = "Payload Len"
aliases = ["Payload length", "Length"]
meaning = "Length of AH in 4-byte words minus 2; the next header begins (value + 2) × 4 bytes after the start of AH."
section = "2.2"

[[format.fields]]
name = "SPI"
aliases = ["Security Parameters Index"]
meaning = "Identifies the security association with the destination address."
section = "2.4"

[[format.fields]]
name = "Sequence Number"
aliases = ["Sequence number"]
meaning = "Increases with each packet on the association, for replay protection."
section = "2.5"

[[format.fields]]
name = "ICV"
aliases = ["Integrity Check Value", "Authentication data"]
meaning = "Variable-length authentication tag over the immutable IP header fields, AH itself (with the ICV zeroed) and the payload."
section = "2.6"

[[format]]
id = "ikev2"
name = "Internet Key Exchange version 2"
keys = ["IKEv2", "IKE", "Internet Key Exchange", "ISAKMP", "IKEv1"]
summary = "The negotiation that sets up IPsec: the peers agree algorithms, exchange Diffie-Hellman values, authenticate each other and create the ESP security associations."
group = "Tunnels and VPNs"
ports = ["udp/500", "udp/4500"]
organisation = """
IKE runs over UDP port 500, moving to port 4500 when NAT is detected (where every IKE message is preceded by a 4-byte non-ESP marker of zeros). Every message starts with a 28-byte header: an 8-byte initiator SPI, an 8-byte responder SPI (zero in the very first message), a 1-byte next payload type, a version byte (0x20 for IKEv2, 0x10 for IKEv1), an exchange type, flags, a 4-byte message ID and a 4-byte total length.

Payloads are chained: each starts with a 4-byte generic header holding the type of the next payload, a critical bit and its own length, so a reader walks the chain until next payload is 0. Common types are SA (33), KE (34), IDi/IDr (35/36), CERT (37), AUTH (39), Nonce (40), Notify (41) and Encrypted (46).

IKEv2 starts with IKE_SA_INIT (exchange type 34), whose SA, KE and nonce payloads are in the clear, followed by IKE_AUTH (35), whose payloads are all inside an Encrypted payload. Later CREATE_CHILD_SA (36) and INFORMATIONAL (37) exchanges are encrypted too. IKEv1 (ISAKMP, version 0x10) uses the same ports and a similar header but different exchanges such as Main Mode and Aggressive Mode.
"""
carries = []

