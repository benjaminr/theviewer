[[format]]
id = "mbr"
name = "Master boot record"
keys = ["MBR", "MBR partition table", "partition/mbr"]
summary = "The first sector of a PC-style disk: boot code and a table of up to four partitions."
organisation = """
The 512-byte sector holds 446 bytes of boot code (where an optional disk signature sits at offset 440), four 16-byte partition entries from offset 446, and the signature 55 AA at offset 510.

Each entry has a status byte (0x80 marks the bootable partition), a start address in the old cylinder-head-sector form, a partition type byte, an end CHS address, and then the starting LBA and sector count as 32-bit little-endian values. With 512-byte sectors that limits the table to 2 TiB.

Type 0x05 or 0x0F marks an extended partition, whose first sector holds another table (an EBR) describing one logical partition and linking to the next. Type 0xEE marks a protective MBR, which covers the whole disk so that older tools leave a GPT disk alone.
"""
carries = ["gpt", "fat", "ntfs", "ext"]
group = "Disks and filesystems"

[[format.specs]]
document = "UEFI 2.10 §5.2"
title = "UEFI Specification, chapter 5: GUID Partition Table (GPT) Disk Layout – LBA 0 Format"
url = "https://uefi.org/specs/UEFI/2.10/05_GUID_Partition_Table_Format.html"
section = "5.2.1"

[[format.fields]]
name = "boot code"
meaning = "Code the BIOS runs after loading the sector at 0x7C00. Bytes 440 to 443 often hold a disk signature that Windows uses to identify the disk."

[[format.fields]]
name = "partition table"
meaning = "Four 16-byte entries starting at offset 446; unused entries are zero."

[[format.fields]]
name = "partition *"
meaning = "One partition entry: status, CHS start, type, CHS end, starting LBA and sector count."

[[format.fields]]
name = "status"
meaning = "0x80 for the active (bootable) partition, 0x00 otherwise; any other value means the sector is probably not an MBR."

[[format.fields]]
name = "type"
meaning = "Partition type: 0x07 NTFS/exFAT, 0x0B/0x0C FAT32, 0x83 Linux, 0x82 Linux swap, 0x05/0x0F extended, 0xEE GPT protective, 0xEF EFI system."

[[format.fields]]
name = "starting LBA"
meaning = "First sector of the partition, counted from the start of the disk."

[[format.fields]]
name = "sectors"
meaning = "Length of the partition in sectors."

[[format.fields]]
name = "signature"
meaning = "The boot signature 55 AA at offset 510 that marks a valid boot sector."

[[format]]
id = "gpt"
name = "GUID Partition Table"
keys = ["GPT", "GPT partition table", "partition/gpt-header", "partition/gpt-disk"]
summary = "The modern partition table defined by UEFI: 64-bit sector addresses, GUID-typed partitions, checksums and a backup copy."
organisation = """
Sector 0 holds a protective MBR. The GPT header is in sector 1: the signature 'EFI PART', a revision, the header size (92 bytes) and its CRC-32, then the header's own LBA and the backup header's LBA, the first and last LBAs usable for partitions, the disk GUID, and the location, count and size of the partition entries with their CRC-32. Values are little-endian.

The entry array normally starts at LBA 2 and has 128 entries of 128 bytes. Each gives a partition type GUID, a unique GUID, first and last LBAs (inclusive), attribute flags, and a name of up to 36 UTF-16LE characters. An all-zero type GUID marks an unused entry.

A backup header sits in the last sector of the disk, with a copy of the entry array just before it. GUIDs are stored with their first three fields little-endian, so their bytes appear partly reversed compared with the printed form.
"""
carries = ["fat", "ntfs", "ext"]
group = "Disks and filesystems"

[[format.specs]]
document = "UEFI 2.10 §5.3"
title = "UEFI Specification, chapter 5: GUID Partition Table (GPT) Disk Layout"
url = "https://uefi.org/specs/UEFI/2.10/05_GUID_Partition_Table_Format.html"
section = "5.3"

[[format.fields]]
name = "GPT header"
meaning = "The partition table header at LBA 1 (and its backup at the last LBA)."
section = "5.3.2"

[[format.fields]]
name = "header size"
meaning = "Bytes of the header covered by its CRC; 92 in current revisions."
section = "5.3.2"

[[format.fields]]
name = "current LBA"
meaning = "The LBA of this header: 1 for the primary, the disk's last sector for the backup."
section = "5.3.2"

[[format.fields]]
name = "backup LBA"
meaning = "The LBA of the other copy of the header. On a disk image cut short, this points beyond the end."
section = "5.3.2"

[[format.fields]]
name = "first usable LBA"
meaning = "First sector a partition may use, after the primary entry array."
section = "5.3.2"

[[format.fields]]
name = "last usable LBA"
meaning = "Last sector a partition may use, before the backup entry array."
section = "5.3.2"

[[format.fields]]
name = "disk GUID"
meaning = "A unique identifier for the disk."
section = "5.3.2"

[[format.fields]]
name = "entries LBA"
meaning = "Where the partition entry array starts; 2 for the primary table."
section = "5.3.2"

[[format.fields]]
name = "entry count"
meaning = "Number of slots in the entry array, used or not; usually 128."
section = "5.3.2"

[[format.fields]]
name = "entry size"
meaning = "Bytes per entry: 128 times a power of two, and 128 in practice."
section = "5.3.2"

[[format.fields]]
name = "partition entries"
meaning = "The used entries of the partition entry array."
section = "5.3.3"

[[format.fields]]
name = "entry *"
meaning = "One partition: type and unique GUIDs, first and last LBA, attributes and name."
section = "5.3.3"

[[format.fields]]
name = "type GUID"
meaning = "What the partition holds, such as C12A7328-… EFI system, EBD0A0A2-… Microsoft basic data, 0FC63DAF-… Linux filesystem."
section = "5.3.3"

[[format.fields]]
name = "unique GUID"
meaning = "An identifier for this particular partition, used by boot loaders and /dev/disk/by-partuuid."
section = "5.3.3"

[[format.fields]]
name = "first LBA"
meaning = "First sector of the partition."
section = "5.3.3"

[[format.fields]]
name = "last LBA"
meaning = "Last sector of the partition, inclusive."
section = "5.3.3"

[[format.fields]]
name = "name"
meaning = "A human-readable partition name of up to 36 UTF-16LE code units."
section = "5.3.3"

[[format]]
id = "fat"
name = "FAT filesystem"
keys = ["FAT", "FAT boot sector", "FAT12 boot sector", "FAT16 boot sector", "FAT32 boot sector", "fs/fat12", "fs/fat16", "fs/fat32", "application/x-fat-diskimage"]
summary = "The File Allocation Table filesystem (FAT12, FAT16, FAT32), still used on memory cards, USB drives and EFI system partitions."
organisation = """
The volume begins with a boot sector holding a jump instruction, an OEM name and the BIOS parameter block: bytes per sector, sectors per cluster, reserved sectors, number of FATs, root directory entries, total sectors, media type and sectors per FAT. FAT12/16 and FAT32 then differ: FAT32 adds a 32-bit FAT size, the root directory's first cluster and the locations of the FSInfo and backup boot sectors. Both end with a volume ID, a volume label, a type string and 55 AA at offset 510. Values are little-endian.

After the reserved sectors come the FAT copies, then (for FAT12/16 only) a fixed-size root directory, then the data area divided into clusters numbered from 2. The FAT is an array with one entry per cluster, each giving the next cluster of the same file or an end-of-chain mark, so a file is a linked list of clusters.

Directories are arrays of 32-byte entries: an 8.3 name, attributes, timestamps, first cluster and size; long names are stored in extra entries placed before the short one. The FAT type is decided by the number of clusters, not by the type string.
"""
carries = []
group = "Disks and filesystems"

[[format.specs]]
document = "Microsoft FAT specification 1.03"
title = "Microsoft Extensible Firmware Initiative FAT32 File System Specification (FAT: General Overview of On-Disk Format)"
url = "https://download.microsoft.com/download/1/6/1/161ba512-40e2-4cc9-843a-923143f3456c/fatgen103.doc"

[[format.fields]]
name = "jump"
meaning = "A jump over the parameter block to the boot code: EB xx 90 or E9 xx xx."

[[format.fields]]
name = "OEM name"
meaning = "Eight characters naming the formatting tool, such as 'MSDOS5.0' or 'mkfs.fat'. Informational only."

[[format.fields]]
name = "bytes per sector"
meaning = "Sector size: 512, 1024, 2048 or 4096."

[[format.fields]]
name = "sectors per cluster"
meaning = "Allocation unit size in sectors, a power of two."

[[format.fields]]
name = "reserved sectors"
meaning = "Sectors before the first FAT, including the boot sector (usually 1 for FAT12/16, 32 for FAT32)."

[[format.fields]]
name = "FAT count"
meaning = "Number of copies of the allocation table, normally 2."

[[format.fields]]
name = "root entries"
meaning = "Entries in the fixed root directory of FAT12/16; zero on FAT32, whose root directory is an ordinary cluster chain."

[[format.fields]]
name = "total sectors"
meaning = "Sectors in the volume: the 16-bit field at offset 19 when it fits, otherwise the 32-bit field at offset 32."

[[format.fields]]
name = "volume label"
meaning = "Eleven-character label set when formatting; the root directory may hold a newer one."

[[format.fields]]
name = "filesystem type"
meaning = "Informational text such as 'FAT12   ', 'FAT16   ' or 'FAT32   '. The real type follows from the cluster count."

[[format.fields]]
name = "signature"
meaning = "55 AA at offset 510, closing the boot sector."

[[format]]
id = "ntfs"
name = "NTFS"
keys = ["NTFS boot sector", "fs/ntfs"]
summary = "The Windows NT filesystem, in which all metadata, including the file table itself, is stored as files."
organisation = """
The boot sector starts with a jump and the OEM ID 'NTFS' followed by four spaces. Its parameter block gives bytes per sector and sectors per cluster, the total sector count (64-bit), the cluster numbers of the master file table ($MFT) and its mirror, the size of file records and index blocks, and a 64-bit volume serial number. A copy of the boot sector is kept in the last sector of the volume.

The MFT is an array of file records, usually 1 KiB each and starting 'FILE'. The first records describe the filesystem itself: $MFT, $MFTMirr, $LogFile, $Volume, $AttrDef, the root directory, $Bitmap, $Boot and so on. Each record holds attributes such as standard information, file name and data.

Small attribute values are stored inside the record (resident); large ones are stored in clusters elsewhere, described by run lists of (length, offset) pairs. Directories are B-trees of file name entries. Values are little-endian, and multi-sector structures carry update sequence fix-ups to detect torn writes.
"""
carries = []
group = "Disks and filesystems"

[[format.specs]]
document = "libfsntfs NTFS format notes"
title = "New Technologies File System (NTFS) – libyal documentation"
url = "https://github.com/libyal/libfsntfs/blob/main/documentation/New%20Technologies%20File%20System%20(NTFS).asciidoc"

[[format.specs]]
document = "Microsoft Learn: NTFS overview"
title = "NTFS overview"
url = "https://learn.microsoft.com/windows-server/storage/file-server/ntfs-overview"

[[format.fields]]
name = "OEM ID"
meaning = "'NTFS' followed by four spaces, at offset 3; this is how NTFS volumes are recognised."

[[format.fields]]
name = "bytes per sector"
meaning = "Sector size, normally 512 or 4096."

[[format.fields]]
name = "sectors per cluster"
meaning = "Cluster size in sectors. Values above 0x80 are negative powers: the cluster is 2^(256 − value) bytes."

[[format.fields]]
name = "total sectors"
meaning = "Sectors in the volume, not counting the backup boot sector at the end."

[[format.fields]]
name = "MFT cluster"
meaning = "Cluster number of the start of the master file table; multiply by the cluster size for the byte offset within the volume."

[[format.fields]]
name = "MFT mirror cluster"
meaning = "Cluster number of $MFTMirr, a copy of the first MFT records used for recovery."

[[format.fields]]
name = "volume serial"
meaning = "64-bit serial number chosen at format time; Windows shows its low 32 bits."

[[format.fields]]
name = "signature"
meaning = "55 AA at offset 510, closing the boot sector."

[[format]]
id = "ext"
name = "ext2/ext3/ext4 filesystem"
keys = ["ext2", "ext3", "ext4", "ext2/3/4 superblock", "ext2 superblock", "ext3 superblock", "ext4 superblock", "fs/ext"]
summary = "The Linux extended filesystem family. ext3 adds a journal to ext2, and ext4 adds extents, larger volumes and checksums."
organisation = """
The superblock lies 1024 bytes into the volume and is 1024 bytes long. It records the inode and block counts, the block size (1024 shifted left by s_log_block_size), blocks and inodes per group, the magic 0xEF53 at offset 56, state, revision, feature flags, UUID, volume name and the last mount point. Values are little-endian.

The volume is split into block groups. A table of group descriptors follows the superblock; each descriptor locates its group's block bitmap, inode bitmap and inode table. Copies of the superblock and descriptors are kept in some groups (with sparse_super, groups 0, 1 and powers of 3, 5 and 7) for recovery.

Inodes hold a file's metadata and either block pointers (ext2/3) or an extent tree (ext4). Directories are files of variable-length entries, optionally hashed into a tree. Three feature words decide what a driver must understand: compatible, incompatible and read-only compatible; for example has_journal (compatible) marks ext3, and extents or flex_bg (incompatible) mark ext4.
"""
carries = []
group = "Disks and filesystems"

[[format.specs]]
document = "Linux ext4 data structures"
title = "ext4 Data Structures and Algorithms: Super Block (Linux kernel documentation)"
url = "https://docs.kernel.org/filesystems/ext4/super.html"

[[format.specs]]
document = "Linux ext4 documentation"
title = "ext4 Data Structures and Algorithms (Linux kernel documentation)"
url = "https://docs.kernel.org/filesystems/ext4/index.html"

[[format.fields]]
name = "inodes count"
meaning = "s_inodes_count: total inodes, which caps the number of files."

[[format.fields]]
name = "blocks count"
meaning = "s_blocks_count_lo: total blocks (ext4 with the 64-bit feature keeps the high half elsewhere)."

[[format.fields]]
name = "block size"
meaning = "Block size in bytes, computed as 1024 shifted left by s_log_block_size; usually 4096."

[[format.fields]]
name = "blocks per group"
meaning = "s_blocks_per_group: blocks in each block group, normally eight times the block size."

[[format.fields]]
name = "magic"
meaning = "s_magic, 0xEF53, at offset 56 of the superblock."

[[format.fields]]
name = "state"
meaning = "s_state: bit 0 set means cleanly unmounted; bit 1 means errors were detected."

[[format.fields]]
name = "revision"
meaning = "s_rev_level: 0 for the original format with fixed inode size, 1 for dynamic (variable inode size, feature flags)."

[[format.fields]]
name = "feature_compat"
meaning = "Compatible features, safe to ignore: 0x4 has_journal, 0x8 extended attributes, 0x20 directory indexes, and others."

[[format.fields]]
name = "feature_incompat"
meaning = "Features a driver must support to mount at all: 0x2 file type in directories, 0x40 extents, 0x80 64-bit, 0x200 flex_bg, and others."

[[format.fields]]
name = "volume name"
meaning = "s_volume_name: up to 16 bytes of label."

[[format.fields]]
name = "last mounted"
meaning = "s_last_mounted: the directory the filesystem was last mounted on, up to 64 bytes."

[[format]]
id = "squashfs"
name = "SquashFS"
keys = ["SquashFS filesystem", "fs/squashfs", "fs/squashfs-be"]
summary = "A compressed, read-only Linux filesystem, common in firmware images, live CDs and snaps."
organisation = """
A 96-byte superblock starts with the magic 'hsqs' (little-endian; 'sqsh' marks the big-endian layout of older versions). It gives the inode count, creation time, block size, fragment count, compressor (1 zlib, 2 LZMA, 3 LZO, 4 xz, 5 LZ4, 6 zstd), flags, version (4.0 today), the root inode reference, the bytes used, and the start offsets of the id, extended attribute, inode, directory, fragment and export tables.

File data is stored first, in blocks of the chosen size, each compressed on its own; small files and file tails are packed together into fragment blocks. Metadata (inodes and directories) is stored in 8 KiB blocks, each preceded by a 16-bit header whose top bit means 'stored uncompressed' and whose low bits give the length.

Inodes are referenced by the position of their metadata block and an offset within it, so the filesystem can be read without any allocation maps.
"""
carries = ["zlib", "lzma", "xz", "lz4", "zstd"]
group = "Disks and filesystems"

[[format.specs]]
document = "SquashFS binary format"
title = "SquashFS Binary Format (D. Emann)"
url = "https://dr-emann.github.io/squashfs/"

[[format.specs]]
document = "Linux SquashFS documentation"
title = "Squashfs 4.0 Filesystem (Linux kernel documentation)"
url = "https://docs.kernel.org/filesystems/squashfs.html"

