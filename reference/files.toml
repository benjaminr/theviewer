[[format]]
id = "mpeg-audio"
name = "MPEG audio (MP3, MP2, MP1)"
keys = ["media:mpeg-audio", "MPEG audio", "audio/mpeg"]
summary = "MPEG-1 and MPEG-2 audio layers I to III, of which layer III is MP3: a run of self-contained frames, each with a 4-byte header."
organisation = """
Each frame starts with an 11-bit sync of ones, then the version (MPEG-1, MPEG-2, or the unofficial MPEG-2.5), the layer, a protection bit (clear when a 16-bit CRC follows the header), the bitrate and sampling rate indices, a padding bit, a private bit, the channel mode and mode extension, and copyright, original and emphasis bits.

The frame length follows from those fields: for layer III at MPEG-1 it is 144 × bitrate ÷ sampling rate bytes, plus one when padded. Frames sit back to back, so a valid stream is a chain of headers each exactly one frame length apart.

Files often begin with an ID3v2 tag (starting 'ID3') and may end with a 128-byte ID3v1 tag starting 'TAG'. Variable-bitrate files usually carry a Xing or VBRI header in the first frame. The standards are ISO/IEC 11172-3 (MPEG-1) and 13818-3 (MPEG-2).
"""
carries = []
group = "Media streams"

[[format.fields]]
name = "First frame header"
meaning = "The 4-byte header of the first frame in the run, decoded."

[[format.fields]]
name = "Sync"
meaning = "Eleven set bits that start every frame."

[[format.fields]]
name = "Version"
meaning = "MPEG-1, MPEG-2 (lower sampling rates) or MPEG-2.5 (an unofficial extension to even lower rates)."

[[format.fields]]
name = "Layer"
meaning = "Coding layer: I, II or III (MP3)."

[[format.fields]]
name = "CRC protected"
meaning = "Whether a 16-bit CRC follows the header (the protection bit is 0 when it does)."

[[format.fields]]
name = "Bitrate"
meaning = "Bit rate from the index in the header; varies frame to frame in VBR files."

[[format.fields]]
name = "Sample rate"
meaning = "Sampling frequency, which with the bitrate sets the frame length."

[[format.fields]]
name = "Padding"
meaning = "Whether this frame has one extra byte (one extra slot) to keep the average bitrate exact."

[[format.fields]]
name = "Channel mode"
meaning = "Stereo, joint stereo, dual channel or mono."

[[format.fields]]
name = "Frame length"
meaning = "Bytes in the frame including the header, computed from bitrate, sample rate and padding."

[[format]]
id = "aac-adts"
name = "AAC in ADTS"
keys = ["media:aac-adts", "AAC", "ADTS", "audio/x-aac"]
summary = "Advanced Audio Coding frames framed with ADTS headers, the raw .aac format and the form AAC takes in MPEG transport streams."
organisation = """
Each frame starts with a 7-byte header (9 when a CRC is present): a 12-bit sync of ones, an MPEG version bit (0 MPEG-4, 1 MPEG-2), two layer bits (always 0), a protection-absent bit, the profile (audio object type minus one), the sampling frequency index, a private bit, the channel configuration, and then copyright bits.

A 13-bit frame length (including the header), an 11-bit buffer fullness and the number of raw data blocks in the frame complete the header. Frames sit back to back, so each header can be checked by jumping one frame length to the next.

ADTS is defined in ISO/IEC 13818-7 (MPEG-2 AAC) and ISO/IEC 14496-3 (MPEG-4 Audio). Inside MP4 files AAC is stored without these headers.
"""
carries = []
group = "Media streams"

[[format.fields]]
name = "First frame header"
meaning = "The ADTS header of the first frame in the run, decoded."

[[format.fields]]
name = "Sync"
meaning = "Twelve set bits (0xFFF) that start every ADTS frame."

[[format.fields]]
name = "MPEG version"
meaning = "The ID bit: 0 for MPEG-4, 1 for MPEG-2; the AAC data is the same either way."

[[format.fields]]
name = "CRC protected"
meaning = "Whether a 16-bit CRC follows the header (the protection-absent bit is 0 when it does)."

[[format.fields]]
name = "Profile"
meaning = "Audio object type minus one: 0 Main, 1 LC (low complexity, by far the most common), 2 SSR, 3 LTP."

[[format.fields]]
name = "Sample rate"
meaning = "Sampling frequency from a 4-bit index into a table (for example 3 is 48 kHz, 4 is 44.1 kHz)."

[[format.fields]]
name = "Channels"
meaning = "Channel configuration: 1 mono, 2 stereo, up to 7 for 7.1; 0 means the layout is given in the stream."

[[format.fields]]
name = "Frame length"
meaning = "Bytes in the frame including the header (13 bits)."

[[format]]
id = "h264"
name = "H.264 / AVC video"
keys = ["media:h264", "H.264 video", "H.264", "AVC"]
summary = "The widely used Advanced Video Coding standard, found here as an Annex B byte stream of NAL units."
organisation = """
In the Annex B byte stream each NAL unit is preceded by a start code, 00 00 01 or 00 00 00 01. Inside a unit, any 00 00 that would be followed by 00 to 03 has an emulation prevention byte 03 inserted, so start codes cannot appear by accident.

Each unit begins with a one-byte header: a forbidden zero bit, a 2-bit reference priority (nal_ref_idc) and a 5-bit type. The common types are 1 coded slice, 5 IDR (keyframe) slice, 6 SEI, 7 sequence parameter set (SPS), 8 picture parameter set (PPS) and 9 access unit delimiter.

The SPS describes the whole sequence: profile, constraint flags and level in its first three bytes, then Exp-Golomb coded fields such as picture size and frame numbering. Decoding starts at an IDR slice preceded by its SPS and PPS. In MP4 files the same units are stored with length prefixes instead of start codes.
"""
carries = []
group = "Media streams"

[[format.specs]]
document = "ITU-T H.264"
title = "Advanced video coding for generic audiovisual services"
url = "https://www.itu.int/rec/T-REC-H.264"

[[format.fields]]
name = "SPS"
meaning = "The sequence parameter set (NAL type 7): profile, level and picture-wide settings."

[[format.fields]]
name = "NAL header"
meaning = "One byte: forbidden zero bit, nal_ref_idc (whether other pictures refer to this one) and the 5-bit unit type."

[[format.fields]]
name = "profile_idc"
meaning = "Coding profile: 66 Baseline, 77 Main, 88 Extended, 100 High, 110 High 10, 122 High 4:2:2, 244 High 4:4:4."

[[format.fields]]
name = "constraint flags"
meaning = "constraint_set0 to 5 flags, which mark the stream as also conforming to stricter profiles."

[[format.fields]]
name = "level_idc"
meaning = "Level times ten (for example 40 is level 4.0), bounding resolution, frame rate and bit rate."

[[format]]
id = "h265"
name = "H.265 / HEVC video"
keys = ["media:h265", "H.265 video", "H.265", "HEVC"]
summary = "High Efficiency Video Coding, the successor to H.264, here as an Annex B byte stream of NAL units."
organisation = """
The byte stream uses the same start codes and emulation prevention as H.264. The NAL unit header is two bytes: a forbidden zero bit, a 6-bit unit type, a 6-bit layer id and a 3-bit temporal id plus one.

Types 0 to 31 are slices, with 16 to 23 marking random access points (IDR, CRA, BLA) where decoding can begin. Parameter sets are 32 video (VPS), 33 sequence (SPS) and 34 picture (PPS); 35 is an access unit delimiter and 39 and 40 SEI.

The SPS starts with the VPS id, the maximum number of temporal sub-layers and a nesting flag, then the profile_tier_level structure: profile space, tier flag and general_profile_idc, compatibility and constraint flags, and general_level_idc (level times 30).
"""
carries = []
group = "Media streams"

[[format.specs]]
document = "ITU-T H.265"
title = "High efficiency video coding"
url = "https://www.itu.int/rec/T-REC-H.265"

[[format.fields]]
name = "SPS"
meaning = "The sequence parameter set (NAL type 33): profile, tier, level and picture-wide settings."

[[format.fields]]
name = "NAL header"
meaning = "Two bytes: forbidden zero bit, 6-bit unit type, 6-bit layer id and 3-bit temporal id plus one."

[[format.fields]]
name = "general_profile_idc"
meaning = "Coding profile: 1 Main, 2 Main 10, 3 Main Still Picture, 4 range extensions."

[[format]]
id = "pcm"
name = "PCM audio"
keys = ["media:pcm", "PCM audio"]
summary = "Uncompressed audio samples with no header, recognised statistically as smoothly varying 16-bit values."
organisation = """
Raw PCM is a plain array of samples: for 16-bit audio, two bytes per sample in little- or big-endian order, with stereo channels interleaved left then right. Nothing in the data records the sample rate, channel count or byte order, so they must be guessed or known.

Audio is recognised by its smoothness: consecutive samples of real sound differ far less than random values, and the two channels of stereo audio tend to follow each other. The same samples sit inside WAV and AIFF files, behind a header that does describe them.
"""
carries = []
group = "Media streams"
