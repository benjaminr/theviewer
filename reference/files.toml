# Reference notes on file formats, encodings and compressed streams. See
# src/reference.rs for the schema. Notes are written for this project;
# specifications are cited.
#
# Keys cover the parser finding ids (`png`), the signature catalogue ids
# (`image/png`, `partition/mbr`, matched with or without `signature:`) and,
# for compressed streams, `stream:<codec>` and the "<codec> stream" titles the
# compression scanner and unpacker use.

# ---------------------------------------------------------------------------
# Images
# ---------------------------------------------------------------------------

[[format]]
id = "png"
name = "Portable Network Graphics"
keys = ["PNG", "PNG image", "image/png"]
summary = "A lossless raster image format: filtered rows of pixels compressed with deflate, wrapped in checksummed chunks."
organisation = """
An eight-byte signature (89 50 4E 47 0D 0A 1A 0A) is followed by a chain of chunks. Each chunk is a 4-byte big-endian data length, a 4-byte ASCII type, the data, and a CRC-32 over the type and data. The length counts the data only, so the next chunk starts 12 + length bytes on.

IHDR must come first and gives width, height, bit depth, colour type and interlace method. PLTE holds the palette for indexed images. The pixels live in one or more IDAT chunks whose contents, joined end to end, form a single zlib stream; inflated, it is a series of scanlines, each led by a filter-type byte. IEND, with no data, closes the file.

The case of each letter in a chunk type is meaningful: an upper-case first letter marks a critical chunk a decoder must understand, and a lower-case fourth letter marks one that editors may copy unchanged. Ancillary chunks carry gamma, colour profiles, text, timestamps, transparency and animation frames (APNG).
"""
carries = ["zlib"]
group = "Images"

[[format.specs]]
document = "RFC 2083"
title = "PNG (Portable Network Graphics) Specification Version 1.0"
url = "https://www.rfc-editor.org/rfc/rfc2083"
rfc = 2083
section = "3"

[[format.specs]]
document = "W3C PNG Third Edition"
title = "Portable Network Graphics (PNG) Specification (Third Edition)"
url = "https://www.w3.org/TR/png-3/"

[[format.fields]]
name = "signature"
meaning = "The fixed eight bytes 89 'PNG' CR LF 1A LF. The high-bit byte and the line endings catch transfers that strip the eighth bit or translate newlines."
section = "3"

[[format.fields]]
name = "chunks"
meaning = "Every chunk after the signature, in file order: length, type, data and CRC each."
section = "3"

[[format.fields]]
name = "IHDR"
meaning = "Image header, always first: width, height, bit depth, colour type, compression, filter and interlace methods (13 bytes of data)."
section = "4"

[[format.fields]]
name = "PLTE"
meaning = "Palette of up to 256 RGB triples; required for colour type 3 (indexed), optional as a hint otherwise."
section = "4"

[[format.fields]]
name = "IDAT"
meaning = "Image data. All IDAT chunks together form one zlib stream of filtered scanlines; a split between chunks can fall anywhere."
section = "4"

[[format.fields]]
name = "IEND"
meaning = "Image trailer with no data; marks the end of the PNG datastream."
section = "4"

[[format.fields]]
name = "tRNS"
meaning = "Transparency: alpha values for palette entries, or a single colour treated as fully transparent."
section = "4"

[[format.fields]]
name = "gAMA"
meaning = "Image gamma, stored as gamma times 100000."
section = "4"

[[format.fields]]
name = "cHRM"
meaning = "Chromaticities of the red, green and blue primaries and the white point."
section = "4"

[[format.fields]]
name = "sRGB"
meaning = "Declares the image to be in the sRGB colour space, with a rendering intent byte."

[[format.fields]]
name = "iCCP"
meaning = "An embedded ICC colour profile, named and zlib-compressed."

[[format.fields]]
name = "tEXt"
aliases = ["zTXt", "iTXt"]
meaning = "Textual metadata: a Latin-1 keyword and value (tEXt), the same with a compressed value (zTXt), or international UTF-8 text (iTXt)."
section = "4"

[[format.fields]]
name = "pHYs"
meaning = "Intended pixel size or aspect ratio: pixels per unit on each axis, with a unit byte (1 = metre)."
section = "4"

[[format.fields]]
name = "tIME"
meaning = "Time of the last image modification, in UTC."
section = "4"

[[format.fields]]
name = "bKGD"
meaning = "Suggested background colour to show the image against."
section = "4"

[[format.fields]]
name = "eXIf"
meaning = "Exif metadata, as the TIFF-structured block a camera would write."

[[format.fields]]
name = "acTL"
aliases = ["fcTL", "fdAT"]
meaning = "Animated PNG chunks: animation control (frame and loop count), per-frame control (size, offset, delay) and frame data."

[[format.fields]]
name = "width"
meaning = "Image width in pixels, a 4-byte big-endian value from 1 to 2^31 − 1."
section = "4"

[[format.fields]]
name = "height"
meaning = "Image height in pixels, a 4-byte big-endian value from 1 to 2^31 − 1."
section = "4"

[[format.fields]]
name = "bit depth"
meaning = "Bits per sample (or per palette index): 1, 2, 4, 8 or 16, restricted by colour type."
section = "4"

[[format.fields]]
name = "colour type"
aliases = ["color type"]
meaning = "Sum of flags: 1 palette used, 2 colour, 4 alpha channel. Valid values are 0 greyscale, 2 RGB, 3 indexed, 4 greyscale with alpha and 6 RGBA."
section = "4"

[[format.fields]]
name = "interlace"
meaning = "0 for rows in order, 1 for Adam7: seven passes over the image that fill in progressively finer detail."
section = "4"

[[format]]
id = "jpeg"
name = "JPEG image"
keys = ["JPEG", "JPEG image", "image/jpeg", "JFIF"]
summary = "The common lossy photographic image format: blocks of DCT coefficients, quantised and entropy coded, in a stream of marker segments."
organisation = """
A JPEG file is a sequence of markers, each a 0xFF byte followed by a code. Start of image (FF D8) and end of image (FF D9) stand alone; most other markers begin a segment whose next two bytes are a big-endian length that counts itself but not the marker.

Segments set up decoding before the image data: DQT holds quantisation tables, DHT Huffman tables, SOFn the frame (sample precision, height, width and the components with their sampling factors), and DRI the restart interval. APPn segments hold application data: JFIF in APP0, Exif (a TIFF structure) and XMP in APP1, ICC profiles in APP2, Adobe colour transform flags in APP14.

SOS starts a scan and is followed directly by entropy-coded data with no length. Inside it, a literal 0xFF is written as FF 00, and restart markers FF D0 to FF D7 may appear, so the scan ends at the first other marker. Progressive images contain several scans, each refining the last.
"""
carries = ["xml"]
group = "Images"

[[format.specs]]
document = "ITU-T T.81"
title = "Information technology – Digital compression and coding of continuous-tone still images – Requirements and guidelines"
url = "https://www.itu.int/rec/T-REC-T.81"

[[format.specs]]
document = "ITU-T T.871"
title = "JPEG File Interchange Format (JFIF)"
url = "https://www.itu.int/rec/T-REC-T.871"

[[format.specs]]
document = "JFIF 1.02"
title = "JPEG File Interchange Format, Version 1.02 (C-Cube Microsystems)"
url = "https://www.w3.org/Graphics/JPEG/jfif3.pdf"

[[format.fields]]
name = "SOI"
meaning = "Start of image, FF D8: the first two bytes of every JPEG. It has no length."

[[format.fields]]
name = "EOI"
meaning = "End of image, FF D9. Data after it is not part of the image (often an appended thumbnail, a second image or something hidden)."

[[format.fields]]
name = "SOF*"
meaning = "Start of frame. The number gives the coding process: 0 baseline, 1 extended sequential, 2 progressive, 3 lossless; 5 to 7 and 9 to 15 are hierarchical or arithmetic-coded variants. Holds precision, image size and the component list."

[[format.fields]]
name = "DQT"
meaning = "Define quantisation tables: 64 divisors per table, in zig-zag order, that set how coarsely each DCT frequency is kept. They largely decide quality and file size."

[[format.fields]]
name = "DHT"
meaning = "Define Huffman tables: code counts per length and the symbols they encode, for DC or AC coefficients."

[[format.fields]]
name = "DRI"
meaning = "Define restart interval: the number of MCUs between restart markers, which let a decoder resynchronise after damage."

[[format.fields]]
name = "SOS"
meaning = "Start of scan: which components the scan covers and their tables. The entropy-coded data follows immediately, with no length."

[[format.fields]]
name = "scan data"
meaning = "Entropy-coded image data after SOS, with 0xFF bytes stuffed as FF 00 and optional restart markers; it runs until the next real marker."

[[format.fields]]
name = "COM"
meaning = "A free-text comment."

[[format.fields]]
name = "APP*"
meaning = "Application segment. Its first bytes name its contents: 'JFIF' (APP0), 'Exif' or an XMP namespace (APP1), 'ICC_PROFILE' (APP2), 'Adobe' (APP14)."

[[format.fields]]
name = "precision"
meaning = "Bits per sample: 8 for baseline, 12 for some extended and medical images, 2 to 16 for lossless."

[[format.fields]]
name = "height"
meaning = "Number of lines. Zero means the height is given later by a DNL marker after the first scan."

[[format.fields]]
name = "width"
meaning = "Samples per line, in pixels."

[[format.fields]]
name = "components"
meaning = "Number of colour components: 1 greyscale, 3 YCbCr or RGB, 4 CMYK or YCCK."

[[format.fields]]
name = "marker *"
meaning = "A marker this parser does not name, shown by its code byte."

[[format]]
id = "gif"
name = "Graphics Interchange Format"
keys = ["GIF", "GIF image", "image/gif"]
summary = "A palette-based image format of up to 256 colours per frame, compressed with LZW, that also supports simple animation."
organisation = """
A six-byte header ('GIF87a' or 'GIF89a') is followed by the logical screen descriptor: canvas width and height as 16-bit little-endian values, a packed flags byte, a background colour index and an aspect ratio. If the flags say so, a global colour table of 2^(n+1) RGB triples comes next.

The rest is a series of blocks, each identified by its first byte. 0x2C starts an image: its position and size on the canvas, an optional local colour table, the LZW minimum code size, then the compressed pixels. 0x21 starts an extension, followed by a label byte: 0xF9 graphic control (frame delay, transparency, disposal), 0xFE comment, 0x01 plain text, 0xFF application data such as the NETSCAPE2.0 loop count. 0x3B is the trailer that ends the file.

Image data and extensions are both carried as sub-blocks: a length byte of 1 to 255 followed by that many bytes, repeated until a zero-length block. A reader can therefore skip anything it does not understand.
"""
carries = []
group = "Images"

[[format.specs]]
document = "GIF89a"
title = "Graphics Interchange Format, Version 89a (CompuServe)"
url = "https://www.w3.org/Graphics/GIF/spec-gif89a.txt"

[[format.fields]]
name = "header"
meaning = "Signature 'GIF' and version '87a' or '89a'. 89a is needed for extensions such as transparency and animation."

[[format.fields]]
name = "logical screen"
meaning = "The logical screen descriptor: canvas size, colour table flags, background colour index and pixel aspect ratio."

[[format.fields]]
name = "width"
meaning = "Canvas width in pixels, 16-bit little-endian."

[[format.fields]]
name = "height"
meaning = "Canvas height in pixels, 16-bit little-endian."

[[format.fields]]
name = "flags"
meaning = "Packed byte: bit 7 global colour table present, bits 6-4 colour resolution, bit 3 table sorted, bits 2-0 table size n (2^(n+1) entries)."

[[format.fields]]
name = "global colour table"
aliases = ["global color table"]
meaning = "RGB triples shared by every image that has no local table."

[[format.fields]]
name = "extension *"
meaning = "An extension block, named by its label: 0xF9 graphic control (delay, transparent index, disposal), 0xFE comment, 0x01 plain text, 0xFF application (such as the animation loop count)."

[[format.fields]]
name = "image *"
meaning = "One image (frame): descriptor with position and size, optional local colour table, LZW code size and the compressed pixel sub-blocks."

[[format.fields]]
name = "trailer"
meaning = "The single byte 0x3B that ends the GIF. Anything after it is extra data."

[[format]]
id = "bmp"
name = "Windows bitmap"
keys = ["BMP", "BMP image", "image/bmp", "DIB"]
summary = "The Windows device-independent bitmap: uncompressed (or simply run-length compressed) pixel rows behind a small header."
organisation = """
A 14-byte file header starts with 'BM', then the file size, two reserved words and the offset of the pixel data, all little-endian. A DIB header follows whose first four bytes give its own size, and so its version: 12 for the old OS/2 core header, 40 for BITMAPINFOHEADER, 108 for V4 and 124 for V5, which add colour masks, colour space and ICC profile details.

The DIB header holds width, signed height, colour planes (always 1), bits per pixel and the compression method. A positive height means rows are stored bottom-up; negative means top-down. Images of 8 bits per pixel or fewer have a colour table of BGRA entries after the header.

Pixel data starts at the offset in the file header. Each row is padded to a multiple of four bytes, and pixels are stored blue first. Compression may be none, RLE8 or RLE4, bit fields (masks for 16- and 32-bit pixels), or, for printers, an embedded JPEG or PNG.
"""
carries = ["png", "jpeg"]
group = "Images"

[[format.specs]]
document = "Microsoft Learn: Bitmap Storage"
title = "Bitmap Storage (Windows GDI)"
url = "https://learn.microsoft.com/windows/win32/gdi/bitmap-storage"

[[format.specs]]
document = "Microsoft Learn: BITMAPINFOHEADER"
title = "BITMAPINFOHEADER structure (wingdi.h)"
url = "https://learn.microsoft.com/windows/win32/api/wingdi/ns-wingdi-bitmapinfoheader"

[[format.specs]]
document = "Microsoft Learn: BITMAPFILEHEADER"
title = "BITMAPFILEHEADER structure (wingdi.h)"
url = "https://learn.microsoft.com/windows/win32/api/wingdi/ns-wingdi-bitmapfileheader"

[[format.fields]]
name = "file header"
meaning = "BITMAPFILEHEADER: 'BM', file size, two reserved words and the pixel data offset (14 bytes)."

[[format.fields]]
name = "file size"
meaning = "Whole file size in bytes as the writer recorded it. Some writers leave it zero or wrong, so it is a hint."

[[format.fields]]
name = "pixel data offset"
meaning = "Where the pixel rows start, counted from the start of the file; the gap before it holds the DIB header, masks and colour table."

[[format.fields]]
name = "DIB header"
meaning = "The bitmap information header. Its size field selects the version: 12 core, 40 BITMAPINFOHEADER, 52/56 with masks, 108 V4, 124 V5."

[[format.fields]]
name = "width"
meaning = "Image width in pixels, signed 32-bit (16-bit in the 12-byte core header)."

[[format.fields]]
name = "height"
meaning = "Image height in pixels. Positive means rows are stored bottom-up; negative means top-down."

[[format.fields]]
name = "bits per pixel"
meaning = "1, 4 or 8 for palette images; 16, 24 or 32 for direct colour (BGR order, with masks for 16 and 32 when compression is bit fields)."

# ---------------------------------------------------------------------------
# Archives
# ---------------------------------------------------------------------------

[[format]]
id = "zip"
name = "ZIP archive"
keys = ["ZIP", "ZIP archive", "application/zip"]
summary = "An archive of individually compressed files with a central directory at the end; also the container for JAR, APK, Office Open XML, OpenDocument and EPUB files."
organisation = """
Each member is stored as a local file header ('PK' 03 04), the file name, an extra field, then the file data. The 30-byte header gives the version needed, flags, compression method, DOS time and date, CRC-32 and the compressed and uncompressed sizes. All values are little-endian.

After the members comes the central directory: one entry ('PK' 01 02) per file repeating its metadata and adding attributes, a comment and the offset of its local header. The end of central directory record ('PK' 05 06), the last 22 bytes plus an optional comment, gives the number of entries and the size and offset of the central directory. Readers are meant to start from that record and follow its offsets, which is why ZIP data can be appended to other files (self-extracting executables) and why a damaged directory can still be recovered by walking local headers.

When bit 3 of the flags is set the sizes and CRC are zero in the local header and follow the data in a data descriptor (optionally signed 'PK' 07 08), so the data's length is only known from the central directory. Zip64 records extend the 32-bit sizes and counts. Each member's data is compressed on its own, most often with raw deflate.
"""
carries = ["deflate", "bzip2", "lzma", "xz", "zstd", "xml"]
group = "Archives"

[[format.specs]]
document = "PKWARE APPNOTE 6.3.10"
title = ".ZIP File Format Specification"
url = "https://pkware.cachefly.net/webdocs/casestudies/APPNOTE.TXT"
section = "4.3"

[[format.fields]]
name = "entries"
meaning = "The local file entries, walked from the first header: each is a header, a name, an extra field and the data."
section = "4.3.6"

[[format.fields]]
name = "method"
meaning = "Compression method: 0 stored, 8 deflate, 9 deflate64, 12 bzip2, 14 LZMA, 93 zstd, 95 xz, 99 AES encryption (the real method is in the extra field)."
section = "4.4.5"

[[format.fields]]
name = "compressed size"
meaning = "Bytes of member data as stored. Zero with flag bit 3 set means the size is in a data descriptor after the data; 0xFFFFFFFF means a Zip64 extra field holds it."
section = "4.4.8"

[[format.fields]]
name = "uncompressed size"
meaning = "Size of the member once decompressed, under the same rules as the compressed size."
section = "4.4.9"

[[format.fields]]
name = "data"
meaning = "The member's stored bytes: compressed (with the method above) and possibly encrypted."
section = "4.3.8"

[[format]]
id = "tar"
name = "tar archive"
keys = ["tar", "tar archive", "ustar", "application/x-tar", "application/x-gtar"]
summary = "The Unix tape archive: files laid end to end in 512-byte blocks, each behind a text header. Usually compressed as a whole (.tar.gz, .tar.xz)."
organisation = """
Everything is in 512-byte blocks. Each member starts with a header block holding its name (100 bytes), mode, owner ids, size and modification time as octal ASCII digits, a checksum, a type flag, a link target and, in the POSIX ustar form, the magic 'ustar' at offset 257, user and group names and a 155-byte name prefix.

The member's data follows in as many whole blocks as its size needs, with the last one padded with zeros. The next header comes straight after, so walking the archive needs only the size field. Two all-zero blocks mark the end, and archives are often padded further to a record size of 10240 bytes.

Long names and extra metadata are carried by special members placed before the file they describe: pax extended headers (type 'x' for one file, 'g' for all following) hold 'length key=value' records, and GNU tar uses type 'L' and 'K' for long names and link targets.
"""
carries = ["elf"]
group = "Archives"

[[format.specs]]
document = "POSIX.1-2017 pax"
title = "pax – portable archive interchange (IEEE Std 1003.1), ustar and pax interchange formats"
url = "https://pubs.opengroup.org/onlinepubs/9699919799/utilities/pax.html"

[[format.specs]]
document = "GNU tar manual: Basic Tar Format"
title = "GNU tar: Basic Tar Format"
url = "https://www.gnu.org/software/tar/manual/html_node/Standard.html"

[[format.fields]]
name = "entries"
meaning = "Every member walked from the first header until the zero blocks that end the archive."

[[format.fields]]
name = "header"
meaning = "The 512-byte header block. The value shows the type flag: '0' file, '1' hard link, '2' symlink, '3'/'4' devices, '5' directory, '6' FIFO, 'x'/'g' pax headers, 'L' GNU long name."

[[format.fields]]
name = "data"
meaning = "The member's contents, occupying whole 512-byte blocks; the last block is padded with zeros."

[[format]]
id = "ar"
name = "ar archive"
keys = ["ar archive", "application/x-archive"]
summary = "The simple Unix archive used for static libraries (.a) and Debian packages (.deb)."
organisation = """
The file opens with the eight bytes '!<arch>' and a newline. Each member then has a 60-byte text header: name (16 bytes), modification time (12), owner and group ids (6 each), octal mode (8), decimal size (10) and the two-byte terminator '`' newline. The member's data follows and is padded with a newline to an even length.

Long names are handled differently by each family. GNU ar ends names with '/', keeps a symbol index in a member called '/' and long names in one called '//', referring to them as '/offset'. BSD ar writes '#1/length' and puts the name at the start of the data.

A Debian package is an ar archive of three members: 'debian-binary', then compressed tar archives of control data and of the files to install.
"""
carries = ["elf", "gzip", "xz", "zstd"]
group = "Archives"

[[format.specs]]
document = "FreeBSD ar(5)"
title = "ar – format of archive files"
url = "https://man.freebsd.org/cgi/man.cgi?query=ar&sektion=5"

[[format.fields]]
name = "members"
meaning = "Every member after the global header, each with a 60-byte header and even-padded data."

[[format]]
id = "cpio"
name = "cpio archive"
keys = ["cpio archive", "application/x-cpio"]
summary = "A stream archive of headers, names and file data, used for Linux initramfs images and RPM payloads."
organisation = """
The 'newc' form found here starts each entry with the six ASCII characters '070701' (or '070702' when data checksums are present), then thirteen fields of eight hexadecimal digits: inode, mode, owner, group, link count, modification time, file size, device numbers, name size and checksum. The header is 110 bytes.

The file name follows, including its terminating NUL, padded so the data starts on a four-byte boundary; the data is padded to four bytes as well. The archive ends with an entry named 'TRAILER!!!'.

Older variants use '070707' with octal fields (odc) or a binary header beginning with the 16-bit value 070707 in octal. The Linux kernel accepts a concatenation of newc archives, some of them compressed, as its initial root filesystem.
"""
carries = ["elf"]
group = "Archives"

[[format.specs]]
document = "FreeBSD cpio(5)"
title = "cpio – format of cpio archive files"
url = "https://man.freebsd.org/cgi/man.cgi?query=cpio&sektion=5"

[[format.specs]]
document = "Linux initramfs buffer format"
title = "initramfs buffer format (Linux kernel documentation)"
url = "https://docs.kernel.org/driver-api/early-userspace/buffer-format.html"

[[format.fields]]
name = "entries"
meaning = "Every entry from the first header to the 'TRAILER!!!' entry that ends the archive."

[[format.fields]]
name = "TRAILER!!!"
meaning = "The empty entry that marks the end of a cpio archive."

# ---------------------------------------------------------------------------
# Executables
# ---------------------------------------------------------------------------

[[format]]
id = "elf"
name = "Executable and Linkable Format"
keys = ["ELF", "ELF executable", "executable/elf32", "executable/elf64", "application/x-elf", "application/x-executable", "application/x-sharedlib", "application/x-object", "application/x-coredump"]
summary = "The object file format of Linux, the BSDs and most embedded toolchains, used for executables, shared libraries, relocatable objects and core dumps."
organisation = """
The file starts with e_ident: 7F 'ELF', a class byte (1 for 32-bit, 2 for 64-bit), a data byte (1 little-endian, 2 big-endian), a version and the OS ABI. Every later multi-byte value uses that byte order, and addresses and offsets are 4 or 8 bytes wide according to the class. The rest of the 52- or 64-byte header gives the file type, machine, entry point, and the offsets, entry sizes and counts of two tables.

The program header table is the loader's view: each entry describes a segment, a range of the file (offset, file size) to map at a virtual address (with a memory size that may be larger, for zero-filled data) with given permissions. PT_LOAD entries are mapped; others name the interpreter, dynamic linking table, notes or thread-local storage.

The section header table is the linker's view: named sections such as .text, .data, .rodata, .bss and the symbol and string tables, each with a type, flags, address, file offset and size. Section names are offsets into the string table section indicated by e_shstrndx. Either table may be absent: stripped executables can drop sections, and relocatable objects have no segments.
"""
carries = ["zlib", "zstd"]
group = "Executables"

[[format.specs]]
document = "System V ABI (gABI)"
title = "System V Application Binary Interface – Object Files"
url = "https://refspecs.linuxfoundation.org/elf/gabi4+/contents.html"

[[format.specs]]
document = "TIS ELF 1.2"
title = "Tool Interface Standard (TIS) Executable and Linking Format (ELF) Specification, Version 1.2"
url = "https://refspecs.linuxfoundation.org/elf/elf.pdf"

[[format.specs]]
document = "elf(5)"
title = "elf – format of Executable and Linking Format (ELF) files (Linux manual page)"
url = "https://man7.org/linux/man-pages/man5/elf.5.html"

[[format.fields]]
name = "ELF header"
meaning = "The file header: identification, type, machine, entry point and the locations of the program and section header tables (52 bytes for 32-bit, 64 for 64-bit)."

[[format.fields]]
name = "e_ident"
meaning = "Sixteen identification bytes: 7F 'ELF', class (32/64-bit), byte order, header version, OS ABI and ABI version, then padding."

[[format.fields]]
name = "e_type"
meaning = "Object file type: 1 relocatable (.o), 2 executable, 3 shared object (also position-independent executables), 4 core dump."

[[format.fields]]
name = "e_machine"
meaning = "Target architecture, such as 3 x86, 40 ARM, 62 x86-64, 183 AArch64, 243 RISC-V."

[[format.fields]]
name = "e_entry"
meaning = "Virtual address where execution starts; zero when the file has no entry point."

[[format.fields]]
name = "e_phoff"
meaning = "File offset of the program header table, or zero if there is none."

[[format.fields]]
name = "e_shoff"
meaning = "File offset of the section header table, or zero if there is none."

[[format.fields]]
name = "e_phnum"
meaning = "Number of program header entries (segments)."

[[format.fields]]
name = "e_shnum"
meaning = "Number of section header entries. Zero with a non-zero e_shoff means the real count is in the first section header's size field."

[[format.fields]]
name = "Program headers"
meaning = "The segment table: what to map into memory, where, and with which permissions."

[[format.fields]]
name = "Section headers"
meaning = "The section table: every named section with its type, flags, address, file offset and size."

[[format.fields]]
name = "PT_*"
meaning = "A program header (segment). PT_LOAD is mapped into memory; PT_DYNAMIC locates the dynamic linking table, PT_INTERP names the program interpreter, PT_NOTE holds notes and PT_GNU_STACK sets stack permissions."

[[format.fields]]
name = ".text"
meaning = "Executable machine code."

[[format.fields]]
name = ".data"
meaning = "Initialised writable data."

[[format.fields]]
name = ".rodata"
meaning = "Read-only data such as constants and string literals."

[[format.fields]]
name = ".bss"
meaning = "Zero-initialised data. It occupies memory but no space in the file."

[[format.fields]]
name = ".symtab"
aliases = [".dynsym"]
meaning = "Symbol table: names, values and sizes of functions and variables. .dynsym holds the subset needed for dynamic linking."

[[format.fields]]
name = ".strtab"
aliases = [".dynstr", ".shstrtab"]
meaning = "String table: NUL-terminated names referred to by offset (symbol names, dynamic names, or section names for .shstrtab)."

[[format.fields]]
name = ".dynamic"
meaning = "Dynamic linking table: needed libraries, symbol and relocation table locations, and initialisation functions."

[[format.fields]]
name = "section *"
meaning = "A section without a name, such as the null section at index 0."

[[format]]
id = "pe"
name = "Portable Executable"
keys = ["PE", "Windows PE executable", "executable/pe", "application/x-msdownload;format=pe", "application/x-msdownload;format=pe32", "application/x-msdownload;format=pe64", "application/x-msdownload;format=pe-itanium", "application/x-msdownload;format=pe-armLE", "application/x-msdownload;format=pe-arm7"]
summary = "The executable format of Windows and UEFI: .exe, .dll, .sys and .efi files, including .NET assemblies."
organisation = """
The file starts with an MS-DOS header ('MZ') and a small DOS program that prints a message. The 32-bit value at offset 0x3C (e_lfanew) points to the signature 'PE' 00 00, which is followed by the 20-byte COFF file header: machine, number of sections, timestamp, size of the optional header and characteristics. Everything is little-endian.

The optional header, required for images, starts with a magic of 0x10B (PE32) or 0x20B (PE32+, 64-bit). It gives the entry point, the preferred image base, section and file alignment, the subsystem, and a table of data directories locating the import, export, resource, relocation, debug, exception, TLS and CLR (.NET) structures.

The section table follows: 40-byte entries giving each section's name, virtual address and size, and its file offset and size. Addresses inside the image are relative virtual addresses (RVAs), turned into file offsets through the section that contains them. The certificate (Authenticode) directory is the exception: it is a file offset, and its signature lives outside any section, usually at the end of the file.
"""
carries = ["bmp", "png", "der", "x509", "xml"]
group = "Executables"

[[format.specs]]
document = "Microsoft PE Format"
title = "PE Format (Microsoft Learn)"
url = "https://learn.microsoft.com/windows/win32/debug/pe-format"

[[format.fields]]
name = "DOS header"
meaning = "The 64-byte MS-DOS header starting 'MZ'. Only its magic and e_lfanew matter to Windows."

[[format.fields]]
name = "e_lfanew"
meaning = "File offset of the PE signature, stored at 0x3C in the DOS header."

[[format.fields]]
name = "PE signature"
meaning = "The four bytes 'PE' 00 00 that mark the start of the NT headers."

[[format.fields]]
name = "COFF header"
meaning = "The 20-byte file header: machine, section count, timestamp, symbol table pointer and count, optional header size and characteristics."

[[format.fields]]
name = "Machine"
meaning = "Target CPU, such as 0x14C x86, 0x8664 x64, 0x1C4 ARM Thumb-2, 0xAA64 ARM64."

[[format.fields]]
name = "NumberOfSections"
meaning = "Entries in the section table, which follows the optional header."

[[format.fields]]
name = "TimeDateStamp"
meaning = "Seconds since 1970 when the linker built the file. Reproducible builds store a hash here instead."

[[format.fields]]
name = "SizeOfOptionalHeader"
meaning = "Bytes in the optional header; the section table starts right after it."

[[format.fields]]
name = "Characteristics"
meaning = "Flags: 0x0002 executable image, 0x0020 large-address aware, 0x2000 DLL, among others."

[[format.fields]]
name = "Optional header"
meaning = "Image layout and loader settings: entry point, image base, alignments, sizes, subsystem and the data directory table."

[[format.fields]]
name = "Magic"
meaning = "0x10B for PE32 (32-bit), 0x20B for PE32+ (64-bit); decides the width of the fields that follow."

[[format.fields]]
name = "AddressOfEntryPoint"
meaning = "RVA where execution starts (the DLL entry for libraries); zero when there is none."

[[format.fields]]
name = "ImageBase"
meaning = "Preferred load address; the loader relocates the image elsewhere when ASLR or a clash demands it."

[[format.fields]]
name = "Subsystem"
meaning = "What the image runs under: 2 Windows GUI, 3 console, 1 native (drivers), 10 to 13 EFI applications and drivers."

[[format.fields]]
name = "Sections"
meaning = "The section table: name, virtual address and size, file offset and size, and flags for each section."

[[format.fields]]
name = ".text"
meaning = "Executable code."

[[format.fields]]
name = ".rdata"
meaning = "Read-only data, often including import and debug directories."

[[format.fields]]
name = ".data"
meaning = "Initialised writable data."

[[format.fields]]
name = ".rsrc"
meaning = "Resources: icons, bitmaps, dialogs, version information and the manifest, arranged as a three-level tree."

[[format.fields]]
name = ".reloc"
meaning = "Base relocations, needed when the image is loaded away from its preferred base."

[[format.fields]]
name = ".pdata"
meaning = "Exception and unwind tables for 64-bit code."

[[format.fields]]
name = ".idata"
aliases = [".edata"]
meaning = "Import (.idata) or export (.edata) tables, when the linker gives them their own section."

[[format]]
id = "macho"
name = "Mach-O"
keys = ["Mach-O", "Mach-O executable", "executable/macho-32", "executable/macho-64", "executable/macho-64-x86_64", "executable/macho-64-arm64", "application/x-mach-o", "application/x-mach-o-executable", "application/x-mach-o-object", "application/x-mach-o-dylib", "application/x-mach-o-bundle", "application/x-mach-o-core", "application/x-mach-o-dylinker", "application/x-mach-o-kext-bundle", "application/x-mach-o-dsym"]
summary = "The object file format of macOS, iOS and Apple's other systems, for executables, dynamic libraries, bundles and object files."
organisation = """
The header starts with a magic of FEEDFACE (32-bit) or FEEDFACF (64-bit) in the file's own byte order, so little-endian files begin CE FA ED FE or CF FA ED FE. It gives the CPU type and subtype, file type (object, executable, dylib, bundle, core and so on), the number and total size of load commands, and flags; the 64-bit header adds a reserved word.

Load commands follow the header back to back. Each begins with a command number and its own size, so unknown commands can be skipped. Segment commands map a range of the file to virtual memory and list the sections inside; others give the symbol table, dynamic linking information, the dylibs to load, the entry point (LC_MAIN), a UUID, the minimum OS version and the code signature.

The data follows: __TEXT (code and constants, normally including the header itself), __DATA (writable data), and __LINKEDIT, which holds symbols, strings, fix-ups and the code signature. The signature contains code-directory hashes and a CMS (DER) signature blob.
"""
carries = ["der", "x509"]
group = "Executables"

[[format.specs]]
document = "Apple mach-o/loader.h"
title = "mach-o/loader.h (XNU sources)"
url = "https://github.com/apple-oss-distributions/xnu/blob/main/EXTERNAL_HEADERS/mach-o/loader.h"

[[format.fields]]
name = "Mach header"
meaning = "The file header: magic, CPU type and subtype, file type, load command count and size, and flags (28 bytes, 32 for 64-bit)."

[[format.fields]]
name = "magic"
meaning = "0xFEEDFACE for 32-bit or 0xFEEDFACF for 64-bit, read in the file's byte order; the byte-swapped forms mean the other endianness."

[[format.fields]]
name = "cputype"
meaning = "Target CPU family (x86, ARM, PowerPC), with a 64-bit ABI flag (0x01000000) for x86_64 and arm64."

[[format.fields]]
name = "filetype"
meaning = "Kind of file: 1 object, 2 executable, 4 core, 6 dylib, 7 dynamic linker, 8 bundle, 10 debug symbols (dSYM), 11 kernel extension set."

[[format.fields]]
name = "ncmds"
meaning = "Number of load commands after the header."

[[format.fields]]
name = "sizeofcmds"
meaning = "Total bytes of all load commands; the area after the header that they occupy."

[[format.fields]]
name = "flags"
meaning = "Header flags such as MH_PIE (position-independent, for ASLR), MH_TWOLEVEL namespace and MH_NOUNDEFS."

[[format.fields]]
name = "Load commands"
meaning = "The load commands, each starting with its command number and size."

[[format.fields]]
name = "Segments"
meaning = "The segments described by segment load commands, each with the sections it contains."

[[format.fields]]
name = "Segment*"
meaning = "LC_SEGMENT or LC_SEGMENT_64: maps a file range to virtual memory with protections and lists its sections."

[[format.fields]]
name = "Symtab"
aliases = ["Dysymtab"]
meaning = "LC_SYMTAB locates the symbol and string tables in __LINKEDIT; LC_DYSYMTAB groups them for dynamic linking."

[[format.fields]]
name = "LoadDylib"
aliases = ["LoadWeakDylib", "ReexportDylib"]
meaning = "A dynamic library the image needs, by install path (weak: may be missing; re-export: its symbols are passed on)."

[[format.fields]]
name = "LoadDylinker"
meaning = "LC_LOAD_DYLINKER: path of the dynamic linker, usually /usr/lib/dyld."

[[format.fields]]
name = "Main"
meaning = "LC_MAIN: file offset of the entry point within __TEXT, and the initial stack size."

[[format.fields]]
name = "Uuid"
meaning = "LC_UUID: a 128-bit identifier that ties the binary to its debug symbols."

[[format.fields]]
name = "CodeSignature"
meaning = "LC_CODE_SIGNATURE: offset and size of the code signature blob in __LINKEDIT."

[[format.fields]]
name = "__TEXT"
meaning = "Read-and-execute segment with the code, constants and usually the Mach header itself."

[[format.fields]]
name = "__DATA"
aliases = ["__DATA_CONST"]
meaning = "Writable data segment (__DATA_CONST becomes read-only after fix-ups)."

[[format.fields]]
name = "__LINKEDIT"
meaning = "Raw data for the linker and loader: symbols, strings, fix-ups, function starts and the code signature."

[[format.fields]]
name = "__PAGEZERO"
meaning = "An inaccessible region at address zero (4 GiB on 64-bit) that turns null pointer use into a crash; it takes no file space."

[[format]]
id = "macho-fat"
name = "Mach-O universal (fat) binary"
keys = ["Mach-O universal binary", "executable/macho-fat", "application/x-mach-o-universal"]
summary = "A wrapper that holds complete Mach-O files for several CPU architectures in one file."
organisation = """
A big-endian header with the magic CAFEBABE (or CAFEBABF for 64-bit offsets) and the number of architectures is followed by one fat_arch record per slice: CPU type, subtype, file offset, size and alignment (as a power of two).

Each slice is a whole Mach-O file at its offset, normally page-aligned. The loader picks the slice best suited to the running CPU.

The magic is shared with Java class files, where the following word is a version number; a small architecture count tells the two apart.
"""
carries = ["macho"]
group = "Executables"

[[format.specs]]
document = "Apple mach-o/fat.h"
title = "mach-o/fat.h (XNU sources)"
url = "https://github.com/apple-oss-distributions/xnu/blob/main/EXTERNAL_HEADERS/mach-o/fat.h"

[[format.fields]]
name = "Fat header"
meaning = "Magic and architecture count, followed by a 20-byte record per architecture giving the slice's CPU type, offset, size and alignment."

