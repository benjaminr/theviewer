[[format]]
id = "zlib"
name = "zlib stream"
keys = ["stream:zlib", "zlib stream", "application/zlib"]
summary = "A thin wrapper around deflate data with a two-byte header and an Adler-32 checksum; used inside PNG, PDF, Git objects and many protocols."
organisation = """
The first byte (CMF) holds the compression method in its low four bits (8 for deflate) and the base-2 logarithm of the window size minus 8 in its high four. The second byte (FLG) has a preset-dictionary bit, a compression level hint, and check bits chosen so that CMF × 256 + FLG is a multiple of 31. That is why zlib data so often starts 78 01, 78 5E, 78 9C or 78 DA.

If the dictionary bit is set, a 4-byte dictionary identifier follows. Then comes the deflate data, and finally the Adler-32 checksum of the uncompressed data, big-endian.

There is no length field: the end is found by decoding the deflate blocks to the last one and reading the four bytes after it.
"""
carries = ["deflate"]
group = "Compression"

[[format.specs]]
document = "RFC 1950"
title = "ZLIB Compressed Data Format Specification version 3.3"
url = "https://www.rfc-editor.org/rfc/rfc1950"
rfc = 1950
section = "2.2"

[[format]]
id = "deflate"
name = "Deflate (raw)"
keys = ["stream:raw deflate", "stream:deflate", "raw deflate", "raw deflate stream", "deflate stream"]
summary = "LZ77 matching with Huffman coding, the compression inside zlib, gzip, ZIP and PNG; raw deflate has no header or checksum of its own."
organisation = """
A deflate stream is a series of blocks read as a bit stream, least significant bit of each byte first. Each block opens with three bits: BFINAL (set on the last block) and BTYPE, which is 00 stored, 01 compressed with fixed Huffman codes, 10 compressed with dynamic Huffman codes (the code tables are sent first), and 11 invalid.

Stored blocks skip to a byte boundary and give a 16-bit length and its complement, then the raw bytes. Compressed blocks are sequences of literal bytes and (length, distance) pairs that copy 3 to 258 bytes from up to 32 KiB back, ended by an end-of-block code.

Because nothing marks the start or records the length, raw deflate can only be found by trying to decode it; this app does so where no other format explains the bytes.
"""
carries = []
group = "Compression"

[[format.specs]]
document = "RFC 1951"
title = "DEFLATE Compressed Data Format Specification version 1.3"
url = "https://www.rfc-editor.org/rfc/rfc1951"
rfc = 1951
section = "3.2"

[[format]]
id = "gzip"
name = "gzip stream"
keys = ["stream:gzip", "gzip stream", "application/gzip"]
summary = "The gzip file format: deflate data with a header carrying a file name and timestamp, and a CRC-32 and length trailer."
organisation = """
Each member begins with 1F 8B, the method byte 08 (deflate) and a flags byte, then a 4-byte modification time, an extra-flags byte and an operating system byte. Flags announce optional fields that follow in order: an extra field with its own length, the original file name and a comment (each zero-terminated), and a CRC-16 of the header.

The deflate data comes next, and an 8-byte trailer ends the member: the CRC-32 of the uncompressed data and its length modulo 2^32, both little-endian.

A gzip file may hold several members one after another; they decompress to the concatenation of their contents. Most .tar.gz files hold one member containing a tar archive.
"""
carries = ["deflate", "tar"]
group = "Compression"

[[format.specs]]
document = "RFC 1952"
title = "GZIP file format specification version 4.3"
url = "https://www.rfc-editor.org/rfc/rfc1952"
rfc = 1952
section = "2.3"

[[format]]
id = "bzip2"
name = "bzip2 stream"
keys = ["stream:bzip2", "bzip2 stream"]
summary = "Block-sorting compression: the Burrows–Wheeler transform, move-to-front and Huffman coding over blocks of 100 to 900 kB."
organisation = """
A stream starts with 'BZh' and a digit 1 to 9 giving the block size in units of 100 kB. Each block begins with the 48-bit magic 0x314159265359 (the digits of pi) and a CRC of its data, followed by the transformed and Huffman-coded contents.

After the last block comes the 48-bit end-of-stream marker 0x177245385090 (from the square root of pi) and a CRC combining every block's. Blocks are packed as bits with no byte alignment, so the block markers can sit at any bit offset.

The format has no official specification beyond the reference implementation; independent descriptions such as Joe Tsai's document it in detail.
"""
carries = ["tar"]
group = "Compression"

[[format.specs]]
document = "bzip2 manual"
title = "bzip2 and libbzip2 manual"
url = "https://sourceware.org/bzip2/manual/manual.html"

[[format.specs]]
document = "bzip2 format (J. Tsai)"
title = "BZIP2: Format Specification"
url = "https://github.com/dsnet/compress/blob/master/doc/bzip2-format.pdf"

[[format]]
id = "xz"
name = "xz stream"
keys = ["stream:xz", "xz stream", "application/x-xz"]
summary = "A container for LZMA2 (and filter chains) with integrity checks and an index, used for .xz files and many software releases."
organisation = """
A 12-byte stream header begins with FD '7zXZ' 00, then two flag bytes choosing the check type (none, CRC-32, CRC-64 or SHA-256) and a CRC-32 of those flags.

Blocks follow. Each has a header (its size, flags, optional compressed and uncompressed sizes, and the filter chain, typically LZMA2 with an optional branch-call-jump filter for executable code), the compressed data, padding to a multiple of four bytes and the check value.

An index then lists every block's sizes, and a 12-byte stream footer ends with the magic 'YZ'. Since the footer gives the index size, a reader can locate blocks from the end. Several streams can be concatenated, with zero padding between them.
"""
carries = ["tar"]
group = "Compression"

[[format.specs]]
document = "xz file format 1.2.1"
title = "The .xz File Format"
url = "https://tukaani.org/xz/xz-file-format.txt"

[[format]]
id = "lzma"
name = "LZMA stream (.lzma)"
keys = ["stream:lzma", "lzma stream", "LZMA"]
summary = "The original LZMA format of the LZMA SDK (\"LZMA alone\"): a short header and range-coded LZ77 data with no checksum."
organisation = """
The 13-byte header has a properties byte encoding the literal context bits, literal position bits and position bits (as (pb × 5 + lp) × 9 + lc, commonly 0x5D), a 4-byte little-endian dictionary size, and an 8-byte little-endian uncompressed size, where all ones means unknown and the data ends with an end marker instead.

The compressed data follows directly as a range-coded stream. There is no magic number and no integrity check, so the app recognises LZMA only by decoding it successfully.

The same compressed data appears inside 7z archives, ZIP method 14 and many firmware images (U-Boot, SquashFS); xz uses the related LZMA2.
"""
carries = ["tar"]
group = "Compression"

[[format.specs]]
document = "LZMA SDK"
title = "LZMA SDK (lzma-specification.txt in the DOC folder)"
url = "https://www.7-zip.org/sdk.html"

[[format]]
id = "zstd"
name = "Zstandard stream"
keys = ["stream:zstd", "zstd stream", "Zstandard", "application/zstd"]
summary = "Facebook's fast modern compressor, combining LZ77 with finite-state entropy and Huffman coding."
organisation = """
A frame starts with the magic 28 B5 2F FD (0xFD2FB528 little-endian). The frame header descriptor byte says whether the frame content size is present and how wide it is, whether the window descriptor is replaced by a single segment, whether a content checksum follows, and the size of the optional dictionary ID.

Blocks follow, each with a 3-byte header: a last-block bit, a 2-bit type (raw, run-length, compressed or reserved) and the block size. Compressed blocks hold a literals section and a sequences section that copies matches from earlier output.

After the last block an optional 4-byte checksum (the low 32 bits of the XXH64 of the content) ends the frame. Frames can be concatenated, and skippable frames (magic 0x184D2A50 to 0x184D2A5F with a length) carry user metadata.
"""
carries = ["tar"]
group = "Compression"

[[format.specs]]
document = "RFC 8878"
title = "Zstandard Compression and the 'application/zstd' Media Type"
url = "https://www.rfc-editor.org/rfc/rfc8878"
rfc = 8878
section = "3.1.1"

[[format]]
id = "lz4"
name = "LZ4 frame"
keys = ["stream:lz4", "stream:LZ4 frame", "LZ4 frame", "LZ4 frame stream", "lz4 stream", "application/x-lz4"]
summary = "A very fast LZ77 compressor; the frame format wraps its blocks with a header, sizes and optional checksums."
organisation = """
A frame starts with the magic 04 22 4D 18 (0x184D2204 little-endian), then a FLG byte (version, block independence, block checksums, content size present, content checksum present, dictionary ID present) and a BD byte giving the maximum block size (64 KiB to 4 MiB). The optional 8-byte content size and 4-byte dictionary ID follow, then a one-byte header checksum taken from xxHash32.

Data blocks follow, each led by a 4-byte little-endian size whose top bit means the block is stored uncompressed, and optionally trailed by a block checksum. A zero size marks the end, after which an optional content checksum (xxHash32) ends the frame.

The blocks themselves are sequences of a token, literal bytes and a 2-byte back-reference offset. Skippable frames share zstd's range of magic numbers, and an older legacy frame uses the magic 0x184C2102.
"""
carries = ["tar"]
group = "Compression"

[[format.specs]]
document = "LZ4 Frame Format"
title = "LZ4 Frame Format Description"
url = "https://github.com/lz4/lz4/blob/dev/doc/lz4_Frame_format.md"

[[format.specs]]
document = "LZ4 Block Format"
title = "LZ4 Block Format Description"
url = "https://github.com/lz4/lz4/blob/dev/doc/lz4_Block_format.md"

# ---------------------------------------------------------------------------
# Elementary media streams
