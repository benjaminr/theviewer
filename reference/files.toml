[[format]]
id = "protobuf"
name = "Protocol Buffers wire format"
keys = ["Protocol Buffers", "protobuf message"]
summary = "Google's compact binary serialisation: a message is a run of numbered fields whose meaning comes from a separate schema."
organisation = """
A message is a sequence of records with no header or overall length. Each record starts with a tag, a varint holding the field number shifted left three bits plus a three-bit wire type. Varints store 7 bits per byte, least significant group first, with the top bit set on every byte but the last.

The wire type says how to find the value: 0 varint (integers, booleans, enums; signed sint types use ZigZag encoding), 1 fixed 64-bit little-endian, 2 length-delimited (a varint length then that many bytes), 5 fixed 32-bit. Types 3 and 4 are the deprecated group start and end.

Length-delimited values may be strings, raw bytes, packed repeated numbers or an embedded message, and the wire format does not say which, so a decoder without the schema can only guess. Fields can appear in any order and repeat. Messages are usually framed by whatever carries them (gRPC, a file length prefix).
"""
carries = []
group = "Serialisation"

[[format.specs]]
document = "Protocol Buffers encoding"
title = "Encoding (protobuf.dev programming guide)"
url = "https://protobuf.dev/programming-guides/encoding/"

[[format.fields]]
name = "field *"
meaning = "One record: field number from the tag, the wire type in brackets, and its value. Length-delimited values that decode cleanly are shown as nested messages."

[[format]]
id = "msgpack"
name = "MessagePack"
keys = ["MessagePack", "MessagePack value"]
summary = "A binary serialisation with JSON's data model (maps, arrays, strings, numbers), plus raw bytes and extension types."
organisation = """
Every value starts with a type byte, and small values fit inside it: 0x00 to 0x7F are positive integers, 0xE0 to 0xFF negative integers, 0x80 to 0x8F maps of up to 15 pairs, 0x90 to 0x9F arrays of up to 15 items, 0xA0 to 0xBF strings of up to 31 bytes. 0xC0 is nil, 0xC2 false and 0xC3 true.

Larger values use a type byte followed by a big-endian length or value: 0xCC to 0xCF unsigned and 0xD0 to 0xD3 signed integers of 1 to 8 bytes, 0xCA and 0xCB floats, 0xD9 to 0xDB strings, 0xC4 to 0xC6 binary, 0xDC/0xDD arrays and 0xDE/0xDF maps with 16- or 32-bit counts, and 0xC7 to 0xC9 and 0xD4 to 0xD8 extension types.

Containers are followed directly by their items (key then value for maps), so the total length is only known by walking the whole value. Extension type -1 is the standard timestamp.
"""
carries = []
group = "Serialisation"

[[format.specs]]
document = "MessagePack specification"
title = "MessagePack specification"
url = "https://github.com/msgpack/msgpack/blob/master/spec.md"

[[format.fields]]
name = "map"
meaning = "A map: a count of key–value pairs, each child shown as 'key = type'."

[[format.fields]]
name = "array"
meaning = "An array: a count followed by that many values."

[[format.fields]]
name = "str"
meaning = "A UTF-8 string: fixstr (length in the type byte) or str 8/16/32 with a length prefix."

[[format.fields]]
name = "bin"
meaning = "Raw bytes with an 8-, 16- or 32-bit length prefix."

[[format.fields]]
name = "uint"
aliases = ["int"]
meaning = "An integer: a fixint packed into the type byte, or 1 to 8 big-endian bytes after it."

[[format.fields]]
name = "f32"
aliases = ["f64"]
meaning = "An IEEE 754 float, big-endian."

[[format.fields]]
name = "nil"
aliases = ["bool"]
meaning = "Single-byte values: 0xC0 nil, 0xC2 false, 0xC3 true."

[[format.fields]]
name = "ext"
meaning = "An extension value: a signed type number and opaque data. Type -1 is a timestamp."

[[format]]
id = "cbor"
name = "Concise Binary Object Representation"
keys = ["CBOR", "CBOR value", "application/cbor", "serial/cbor"]
summary = "An IETF binary data format with JSON's data model plus byte strings and tags, used in COSE, CWT and WebAuthn."
organisation = """
Every item starts with an initial byte: the top three bits are the major type and the low five bits are additional information. Values below 24 are used directly; 24, 25, 26 and 27 mean the argument follows in 1, 2, 4 or 8 big-endian bytes; 31 means indefinite length.

The major types are 0 unsigned integer, 1 negative integer (−1 − n), 2 byte string, 3 UTF-8 text string, 4 array, 5 map, 6 tag and 7 simple values and floats. For strings the argument is the length in bytes, for arrays and maps the number of items or pairs, which follow directly.

A tag wraps the next item with a meaning such as date-time (0, 1), bignum (2, 3) or embedded CBOR (24). Indefinite-length strings, arrays and maps continue until the break byte 0xFF. The tag 55799, encoded D9 D9 F7, may prefix a file to mark it as CBOR.
"""
carries = []
group = "Serialisation"

[[format.specs]]
document = "RFC 8949"
title = "Concise Binary Object Representation (CBOR)"
