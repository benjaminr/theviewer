[[format]]
id = "json"
name = "JSON"
keys = ["JSON document"]
summary = "JavaScript Object Notation: a text format for objects, arrays, strings, numbers, booleans and null."
organisation = """
JSON is plain text, which must be UTF-8 when exchanged between systems. A document is one value: an object in braces of comma-separated "name": value pairs, an array in brackets, a double-quoted string with backslash escapes, a number in decimal (with optional fraction and exponent), true, false or null.

Values nest to any depth and whitespace between tokens is ignored. Nothing records a length, so the end of a document is found by matching brackets while skipping over strings.

Related formats include JSON Lines (one document per line) and many binary encodings of the same model, such as CBOR and MessagePack.
"""
carries = []
group = "Serialisation"

[[format.specs]]
document = "RFC 8259"
title = "The JavaScript Object Notation (JSON) Data Interchange Format"
url = "https://www.rfc-editor.org/rfc/rfc8259"
rfc = 8259
section = "2"

[[format]]
id = "xml"
name = "XML"
keys = ["XML document", "application/xml", "serial/xml-utf16le"]
summary = "The Extensible Markup Language: nested, named elements with attributes and text, used for documents, configuration and data exchange."
organisation = """
A document may begin with a declaration such as <?xml version="1.0" encoding="UTF-8"?>, possibly preceded by a byte order mark, and an optional document type declaration. It then has exactly one root element, which can contain other elements, text, comments, processing instructions and CDATA sections.

Elements are marked by start tags (with attributes as name="value") and matching end tags, or a single empty-element tag ending '/>'. Special characters in text are written as entity or character references such as &lt; and &#x41;.

A document is well-formed when its tags nest properly and match; validity against a schema or DTD is a separate question. Without an encoding declaration the text is UTF-8 or, with a byte order mark, UTF-16.
"""
carries = []
group = "Serialisation"

[[format.specs]]
document = "W3C XML 1.0"
title = "Extensible Markup Language (XML) 1.0 (Fifth Edition)"
url = "https://www.w3.org/TR/xml/"

[[format]]
id = "utf8-text"
name = "UTF-8 text"
keys = ["UTF-8 text", "serial/utf8-bom"]
summary = "Text in UTF-8, the dominant Unicode encoding, which leaves ASCII unchanged and uses two to four bytes for other characters."
organisation = """
Code points up to U+007F are single bytes identical to ASCII. Larger code points use a lead byte that says how many bytes follow (110xxxxx for two, 1110xxxx for three, 11110xxx for four) and continuation bytes of the form 10xxxxxx, which carry six bits each.

The structure makes UTF-8 easy to recognise and resynchronise: a continuation byte never starts a character, and bytes C0, C1 and F5 to FF never appear. Encoders must use the shortest form, and surrogate code points are not allowed.

A file may begin with the byte order mark EF BB BF, although UTF-8 has no byte order to mark.
"""
carries = []
group = "Text"

[[format.specs]]
document = "RFC 3629"
title = "UTF-8, a transformation format of ISO 10646"
url = "https://www.rfc-editor.org/rfc/rfc3629"
rfc = 3629
section = "3"

[[format]]
id = "der"
name = "ASN.1 DER"
keys = ["ASN.1 DER", "ASN.1 DER structure", "DER"]
summary = "The Distinguished Encoding Rules for ASN.1: a canonical tag-length-value encoding used by certificates, keys and cryptographic messages."
organisation = """
Every value is a TLV: an identifier octet, a length, then the contents. The identifier's top two bits give the class (universal, application, context-specific, private), bit 5 says whether the contents are primitive or constructed from further TLVs, and the low five bits give the tag number (31 means the number continues in following bytes).

A length below 128 is a single byte. Otherwise the first byte is 0x80 plus the number of length bytes that follow, big-endian. DER requires the shortest form and forbids the indefinite length (0x80) that BER allows.

Constructed values such as SEQUENCE (0x30) and SET (0x31) contain their members back to back, so a structure is a tree that can be walked by lengths alone. DER also fixes every other choice BER leaves open, such as the order of SET OF members and the encoding of booleans, so that the same value always produces the same bytes, which signatures rely on. Context-specific tags such as [0] mark optional or explicitly tagged fields defined by the schema.
"""
carries = []
group = "Certificates and keys"

[[format.specs]]
document = "ITU-T X.690"
title = "ASN.1 encoding rules: Specification of Basic Encoding Rules (BER), Canonical Encoding Rules (CER) and Distinguished Encoding Rules (DER)"
url = "https://www.itu.int/rec/T-REC-X.690"

[[format.fields]]
name = "SEQUENCE"
meaning = "Universal tag 16, constructed (0x30): an ordered list of members, each a full TLV."

[[format.fields]]
name = "SET"
meaning = "Universal tag 17, constructed (0x31): an unordered collection; DER sorts SET OF members by their encodings."

[[format.fields]]
name = "INTEGER"
meaning = "Tag 2: a two's-complement big-endian integer in as few bytes as possible (a leading zero byte keeps a positive value's top bit clear)."

[[format.fields]]
name = "BIT STRING"
meaning = "Tag 3: a first byte giving the number of unused bits in the last byte, then the bits. Public keys and signatures are carried this way."

[[format.fields]]
name = "OCTET STRING"
meaning = "Tag 4: arbitrary bytes, often wrapping another DER structure (as in certificate extensions)."

[[format.fields]]
name = "NULL"
meaning = "Tag 5 with no contents, used as an empty parameter (05 00)."

[[format.fields]]
name = "OBJECT IDENTIFIER"
meaning = "Tag 6: a dotted number naming an algorithm, attribute or extension. The first two arcs share one byte (40 × first + second); later arcs use base-128 with continuation bits."

[[format.fields]]
name = "BOOLEAN"
meaning = "Tag 1: one byte; DER requires 0xFF for true and 0x00 for false."

[[format.fields]]
name = "ENUMERATED"
meaning = "Tag 10: an integer value from a list defined by the schema."

[[format.fields]]
name = "UTF8String"
aliases = ["PrintableString", "IA5String", "T61String", "BMPString"]
meaning = "Character strings: UTF8String (tag 12), PrintableString (19, a restricted ASCII subset), T61String (20), IA5String (22, ASCII) and BMPString (30, UCS-2)."

[[format.fields]]
name = "UTCTime"
aliases = ["GeneralizedTime"]
meaning = "Times as ASCII: UTCTime (tag 23) YYMMDDHHMMSSZ with a two-digit year, GeneralizedTime (tag 24) YYYYMMDDHHMMSSZ."

[[format.fields]]
name = "[*"
meaning = "A context-specific tag such as [0] or [3]; its meaning comes from the surrounding structure's schema (in a certificate, [0] is the version and [3] the extensions)."

[[format.fields]]
name = "APPLICATION [*"
meaning = "An application-class tag, defined by the protocol that uses it (LDAP and Kerberos, for example)."

[[format]]
id = "x509"
name = "X.509 certificate"
keys = ["X.509 certificate", "crypto/der-certificate", "application/x-x509-cert;format=der"]
summary = "A public key certificate: a signed DER structure binding a subject's name and public key, used by TLS, code signing and S/MIME."
organisation = """
A certificate is a DER SEQUENCE of three parts: the to-be-signed certificate (tbsCertificate), the signature algorithm, and the signature value as a BIT STRING. The signature is computed over the exact DER bytes of tbsCertificate.

tbsCertificate is itself a SEQUENCE: an optional explicit [0] version (2 for v3), the serial number, the signature algorithm again, the issuer name, a validity SEQUENCE of notBefore and notAfter, the subject name, the subject public key info (algorithm and key bits), optional unique identifiers [1] and [2], and in v3 the extensions in [3].

Names are sequences of sets of attribute–value pairs, each attribute an OID such as commonName or organizationName. Each extension is an OID, an optional critical flag and an OCTET STRING wrapping its own DER value; subject alternative names, key usage and basic constraints are the most common. The PEM form is the same DER bytes in Base64 between '-----BEGIN CERTIFICATE-----' lines.
"""
carries = ["der"]
group = "Certificates and keys"

