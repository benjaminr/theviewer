[[format]]
id = "uimage"
name = "U-Boot legacy image (uImage)"
keys = ["U-Boot uImage", "uImage", "firmware/uimage"]
summary = "The legacy image wrapper of the U-Boot boot loader: a 64-byte header describing a kernel, ramdisk or script, followed by its (often compressed) data."
organisation = """
The header is 64 bytes of big-endian fields: the magic 27 05 19 56, a CRC-32 of the header, a timestamp, the data size, the load address, the entry point, a CRC-32 of the data, then single bytes for operating system, CPU architecture, image type and compression, and a 32-byte name.

The data follows immediately. Compression may be none, gzip, bzip2, LZMA, LZO, LZ4 or zstd; U-Boot decompresses to the load address and jumps to the entry point. Multi-file images start their data with a zero-terminated list of the component sizes.

Newer U-Boot builds prefer FIT images, which describe several components with a flattened device tree.
"""
carries = ["gzip", "bzip2", "lzma", "lz4", "zstd", "cpio", "elf"]
group = "Firmware"

[[format.specs]]
document = "U-Boot include/image.h"
title = "U-Boot image.h: legacy image header (struct legacy_img_hdr)"
url = "https://github.com/u-boot/u-boot/blob/master/include/image.h"

[[format]]
id = "cortex-m-vectors"
name = "Arm Cortex-M vector table"
keys = ["executable:cortex-m-vectors", "Cortex-M vector table"]
summary = "The table of initial stack pointer and exception handler addresses at the start of Cortex-M firmware, which the processor reads on reset."
organisation = """
The table is an array of 32-bit little-endian words. Word 0 is the initial main stack pointer, loaded on reset and usually pointing to the top of RAM. Word 1 is the reset handler, where execution starts. The next fourteen words are the system exceptions (NMI, HardFault, MemManage, BusFault, UsageFault, SVCall, DebugMonitor, PendSV, SysTick, with reserved slots between), and external interrupt handlers (IRQ 0 onwards) follow.

Handler addresses have bit 0 set to mark Thumb code, so the real address is one less. At reset the table is read from address 0 (often aliased to the start of flash); software can move it by writing VTOR, which needs a suitably aligned address. Unused handlers usually all point to the same default loop, which makes such tables easy to spot.

Because the stack pointer and reset vector reveal the RAM and flash ranges, a table found in a dump suggests the image's load address.
"""
carries = []
group = "Firmware"

[[format.specs]]
document = "Arm DDI 0403 (ARMv7-M ARM)"
title = "ARMv7-M Architecture Reference Manual"
url = "https://developer.arm.com/documentation/ddi0403/latest/"

[[format.fields]]
name = "Initial stack pointer"
meaning = "Value loaded into the main stack pointer at reset; normally the top of RAM, so it shows where RAM is."

[[format.fields]]
name = "Reset"
meaning = "Address of the reset handler, where execution starts (bit 0 set for Thumb)."

[[format.fields]]
name = "NMI"
meaning = "Non-maskable interrupt handler."

[[format.fields]]
name = "HardFault"
meaning = "Handler for faults that cannot be handled by their own handler, and for all faults on ARMv6-M."

[[format.fields]]
name = "MemManage"
aliases = ["BusFault", "UsageFault"]
meaning = "Configurable fault handlers (ARMv7-M and later): memory protection violations, bus errors, and undefined instructions or invalid state."

[[format.fields]]
name = "SVCall"
meaning = "Supervisor call handler, entered by the SVC instruction; RTOSes use it for system calls."

[[format.fields]]
name = "DebugMonitor"
meaning = "Debug monitor exception (ARMv7-M and later)."

[[format.fields]]
name = "PendSV"
meaning = "Pendable service call, typically used by an RTOS for context switches."

[[format.fields]]
name = "SysTick"
meaning = "System timer tick handler."

[[format.fields]]
name = "Reserved"
meaning = "A reserved slot. Some vendors store a checksum here (NXP LPC parts use slot 7 so that the first eight words sum to zero)."

[[format.fields]]
name = "IRQ *"
meaning = "External interrupt handler, numbered by the device's interrupt line; their number and meaning are vendor-specific."

